const known={"スター・ウォーズ／帝国の逆襲": 1891, "スター・ウォーズ／ジェダイの復讐": 1892, "E.T.": 601, "ブッシュマン": 8393};
const failures=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[\s　・\/／:：!?！？「」『』（）()\[\]【】,，.。'’‘“”"\-ー]/g,'');
function list(d){return Array.isArray(d)?d:Array.isArray(d?.results)?d.results:Array.isArray(d?.movies)?d.movies:[]}
function match(arr,item){let targets=[item.title,item.original].filter(Boolean).map(normalize);let candidates=arr.filter(x=>[x.title,x.name,x.original_title,x.originalTitle].filter(Boolean).map(normalize).some(n=>targets.some(t=>n===t||(t.length>=9&&n.length>=9&&(n.startsWith(t)||t.startsWith(n))))));let matched=candidates.filter(x=>{let y=Number(String(x.release_date||x.releaseDate||x.first_air_date||'').slice(0,4));return !y||!item.year||Math.abs(y-item.year)<=3});return matched.length===1?matched[0]:null}
async function api(url){let r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function check(item){
 let id=known[item.title],film=null,errors=[];
 if(id){try{let f=await api('/api/search?id='+id+'&type=movie');if(Number(f.id)===id)film=f;else errors.push('ID検索結果不一致')}catch(e){errors.push('ID検索 '+e.message)}}
 if(!film){for(let q of [item.original,item.title].filter(Boolean)){
 try{let f=match(list(await api('/api/search?query='+encodeURIComponent(q)+'&type=movie')),item);if(f){film=f;break}}catch(e){errors.push('作品名検索 '+e.message)}
 }}
 if(!film)return {item,reason:'作品を取得できない'+(errors.length?'（'+errors.join('、')+'）':'')};
 let fid=Number(film.id||film.tmdb_id),poster=film.poster_path||film.posterPath||film.poster_url;
 if(!fid)return {item,reason:'作品IDが取得できない'};
 if(!poster)return {item,reason:'ポスター情報が取得できない',id:fid};
 return null;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
document.getElementById('start').onclick=async()=>{
 document.getElementById('start').disabled=true;failures.length=0;
 for(let i=0;i<items.length;i++){
 let failure=await check(items[i]);if(failure)failures.push(failure);
 document.getElementById('progress').textContent=`${i+1} / ${items.length} 件検査済み。不具合候補 ${failures.length} 件`;
 await sleep(90);
 }
 document.getElementById('results').innerHTML='<h2>取得できなかった作品：'+failures.length+'件</h2><p>この一覧はAPI応答を検査した結果です。画像URL自体の読み込みエラーまでは検査していません。</p><table><tr><th>作品名</th><th>掲載部門</th><th>問題</th><th>取得ID</th></tr>'+failures.map(f=>`<tr><td>${esc(f.item.title)}</td><td>${esc(f.item.category)}</td><td>${esc(f.reason)}</td><td>${f.id||'—'}</td></tr>`).join('')+'</table>';
 document.getElementById('save').disabled=false;document.getElementById('start').disabled=false;
};
document.getElementById('save').onclick=()=>{
 let lines=['作品名\t掲載部門\t問題\t取得ID',...failures.map(f=>[f.item.title,f.item.category,f.reason,f.id||''].join('\t'))];
 let blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/tab-separated-values;charset=utf-8'});
 let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='映画の棚_取得不具合一覧.tsv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
