<header>

<h1>🎬 ドコデミレル？</h1>

<p>映画がどこで見られるか検索できます</p>

</header>


<div class="container">


  <div class="search-box">

    <div class="search-row">

      <input
        id="searchInput"
        type="text"
        placeholder="映画名を入力してください"
        autocomplete="off"

      >
        🔍 検索
      </button>

    id="message"

    class="results"

<script>

/* ========================================================
   基本設定
======================================================== */

const API_URL = "/api/search";


const searchInput =
  document.getElementById(
    "searchInput"
  );


const searchButton =
  document.getElementById(
    "searchButton"
  );


const message =
  document.getElementById(
    "message"
  );


const results =
  document.getElementById(
    "results"
  );


/* ========================================================
   メッセージ
======================================================== */

function showMessage(
  text,
  type
){

  message.textContent = text;

  message.className =
    "message " +
    (type || "");

  message.style.display =
    "block";

}


function hideMessage(){

  message.style.display =
    "none";

}


/* ========================================================
   URL安全確認
======================================================== */

function isHttpUrl(
  value
){

  if(
    typeof value !== "string"
  ){
    return false;
  }

  try{

    const url =
      new URL(value);

    return (
      url.protocol === "https:" ||
      url.protocol === "http:"
    );

  }catch{

    return false;

  }

}


/* ========================================================
   Netflix URL
========================================================
   ★重要

   Netflix URLはここで作らない。

   APIが返した netflix_url を
   そのまま使用する。
======================================================== */

function getNetflixUrl(
  movie
){

  if(
    movie &&
    isHttpUrl(
      movie.netflix_url
    )
  ){

    return movie.netflix_url;

  }


  if(
    movie &&
    movie.netflix &&
    isHttpUrl(
      movie.netflix.url
    )
  ){

    return movie.netflix.url;

  }


  /*
   * 最後の手段。
   *
   * Netflix作品IDが本当にAPIから
   * 返されている場合だけ作品ページを作る。
   */

  if(
    movie &&
    movie.netflix_title_id &&
    /^\d+$/.test(
      String(
        movie.netflix_title_id
      )
    )
  ){

    return (
      "https://www.netflix.com/jp/title/" +
      encodeURIComponent(
        movie.netflix_title_id
      )
    );

  }


  /*
   * 作品IDがない場合は検索ページ。
   */

  const title =
    movie &&
    (
      movie.title ||
      movie.original_title ||
      ""
    );

  if(title){

    return (
      "https://www.netflix.com/jp/search?q=" +
      encodeURIComponent(
        title
      )
    );

  }


  return null;

}


/* ========================================================
   Amazon URL
======================================================== */

function getAmazonUrl(
  movie,
  provider
){

  /*
   * API側から直接Amazon URLが渡された場合
   * それを最優先。
   */

  const candidates = [

    provider &&
    provider.url,

    provider &&
    provider.link,

    provider &&
    provider.watch_link,

    movie &&
    movie.amazon_url,

    movie &&
    movie.amazon_link

  ];


  for(
    let i=0;
    i<candidates.length;
    i++
  ){

    if(
      isHttpUrl(
        candidates[i]
      )
    ){

      return candidates[i];

    }

  }


  /*
   * Amazonの作品URLが取得できない場合は
   * Amazon Prime Video検索へ。
   *
   * Amazonの商品ページを推測して
   * 間違った作品へ飛ばすことはしない。
   */

  const title =
    movie &&
    (
      movie.title ||
      movie.original_title ||
      ""
    );


  if(title){

    return (
      "https://www.amazon.co.jp/s?k=" +
      encodeURIComponent(
        title
      ) +
      "&i=instant-video"
    );

  }


  return null;

}


/* ========================================================
   サービス判定
======================================================== */

function getServiceClass(
  name
){

  const n =
    String(
      name || ""
    ).toLowerCase();


  if(
    n.includes("netflix")
  ){
    return "netflix";
  }


  if(
    n.includes("amazon") ||
    n.includes("prime")
  ){
    return "amazon";
  }


  if(
    n.includes("u-next") ||
    n.includes("unext")
  ){
    return "uenext";
  }


  if(
    n.includes("hulu")
  ){
    return "hulu";
  }


  if(
    n.includes("disney")
  ){
    return "disney";
  }


  return "other";

}


/* ========================================================
   ボタンクラス
======================================================== */

function getButtonClass(
  serviceClass
){

  return (
    "watch-button " +
    serviceClass +
    "-btn"
  );

}


/* ========================================================
   サービス表示
======================================================== */

function createServiceElement(
  movie,
  provider,
  type
){

  const name =
    provider &&
    (
      provider.provider_name ||
      provider.name ||
      "配信サービス"
    );


  const serviceClass =
    getServiceClass(
      name
    );


  let url = null;


  /*
   * Netflixだけは特別処理。
   *
   * TMDBのprovider_urlは
   * Netflix全体のURLになる場合があるため、
   * APIのnetflix_urlを最優先する。
   */

  if(
    serviceClass === "netflix"
  ){

    url =
      getNetflixUrl(
        movie
      );

  }else if(
    serviceClass === "amazon"
  ){

    url =
      getAmazonUrl(
        movie,
        provider
      );

  }else{

    const candidates = [

      provider &&
      provider.url,

      provider &&
      provider.link,

      provider &&
      provider.watch_link

    ];


    for(
      let i=0;
      i<candidates.length;
      i++
    ){

      if(
        isHttpUrl(
          candidates[i]
        )
      ){

        url =
          candidates[i];

        break;

      }

    }

  }


  if(!url){

    return null;

  }


  const div =
    document.createElement(
      "div"
    );

  div.className =
    "service";


  const header =
    document.createElement(
      "div"
    );

  header.className =
    "service-header";


  const logo =
    document.createElement(
      "div"
    );

  logo.className =
    "service-logo " +
    serviceClass;


  logo.textContent =
    getServiceInitial(
      name
    );


  const nameBox =
    document.createElement(
      "div"
    );


  const nameElement =
    document.createElement(
      "div"
    );

  nameElement.className =
    "service-name";

  nameElement.textContent =
    name;


  const typeElement =
    document.createElement(
      "div"
    );

  typeElement.className =
    "service-type";

  typeElement.textContent =
    type;


  nameBox.appendChild(
    nameElement
  );

  nameBox.appendChild(
    typeElement
  );


  header.appendChild(
    logo
  );

  header.appendChild(
    nameBox
  );


  const button =
    document.createElement(
      "a"
    );

  button.className =
    getButtonClass(
      serviceClass
    );

  button.href =
    url;

  button.target =
    "_blank";

  button.rel =
    "noopener noreferrer";


  if(
    serviceClass === "netflix"
  ){

    button.textContent =
      "Netflixで見る →";

  }else if(
    serviceClass === "amazon"
  ){

    button.textContent =
      "Prime Videoで見る →";

  }else{

    button.textContent =
      name +
      "で見る →";

  }


  div.appendChild(
    header
  );

  div.appendChild(
    button
  );


  return div;

}


/* ========================================================
   サービス頭文字
======================================================== */

function getServiceInitial(
  name
){

  const n =
    String(
      name || ""
    ).toLowerCase();


  if(
    n.includes("netflix")
  ){
    return "N";
  }


  if(
    n.includes("amazon") ||
    n.includes("prime")
  ){
    return "P";
  }


  if(
    n.includes("u-next") ||
    n.includes("unext")
  ){
    return "U";
  }


  if(
    n.includes("hulu")
  ){
    return "H";
  }


  if(
    n.includes("disney")
  ){
    return "D";
  }


  return "▶";

}


/* ========================================================
   検索
======================================================== */

async function searchMovies(){

  const query =
    searchInput.value.trim();


  if(!query){

    showMessage(
      "映画名を入力してください。",
      "error"
    );

    return;

  }


  results.innerHTML =
    "";


  showMessage(
    "検索しています……",
    "loading"
  );


  try{

    const url =
      API_URL +
      "?query=" +
      encodeURIComponent(
        query
      );


    const response =
      await fetch(
        url,
        {
          method:"GET",
          headers:{
            "Accept":
              "application/json"
          }
        }
      );


    let data = null;


    try{

      data =
        await response.json();

    }catch{

      throw new Error(
        "APIから正しいJSONが返ってきませんでした。"
      );

    }


    if(
      !response.ok
    ){

      throw new Error(
        data &&
        data.error
          ? data.error
          : "サーバーエラーが発生しました。"
      );

    }


    const movies =
      Array.isArray(
        data.results
      )
        ? data.results
        : [];


    hideMessage();


    if(
      movies.length === 0
    ){

      showMessage(
        "映画が見つかりませんでした。",
        "error"
      );

      return;

    }


    for(
      let i=0;
      i<movies.length;
      i++
    ){

      const card =
        createSearchCard(
          movies[i]
        );

      results.appendChild(
        card
      );

    }

  }catch(error){

    console.error(
      "検索エラー:",
      error
    );


    showMessage(
      "❌ " +
      (
        error &&
        error.message
          ? error.message
          : "サーバーエラーが発生しました。"
      ),
      "error"
    );

  }

}


/* ========================================================
   検索結果カード
======================================================== */

function createSearchCard(
  movie
){

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "movie-card";


  const main =
    document.createElement(
      "div"
    );

  main.className =
    "movie-main";


  const poster =
    document.createElement(
      "img"
    );

  poster.className =
    "poster";


  if(
    movie.poster_path
  ){

    poster.src =
      "https://image.tmdb.org/t/p/w500" +
      movie.poster_path;

  }else{

    poster.alt =
      "ポスターなし";

  }


  poster.alt =
    movie.title || "";


  const info =
    document.createElement(
      "div"
    );

  info.className =
    "movie-info";


  const title =
    document.createElement(
      "h2"
    );

  title.className =
    "movie-title";

  title.textContent =
    movie.title || "";


  const original =
    document.createElement(
      "div"
    );

  original.className =
    "original-title";

  original.textContent =
    movie.original_title || "";


  const date =
    document.createElement(
      "div"
    );

  date.className =
    "date";

  date.textContent =
    movie.release_date
      ? "公開日： " +
        formatDate(
          movie.release_date
        )
      : "公開日：不明";


  const rating =
    document.createElement(
      "div"
    );

  rating.className =
    "rating";

  rating.textContent =
    "⭐ " +
    Number(
      movie.vote_average || 0
    ).toFixed(1);


  const overview =
    document.createElement(
      "div"
    );

  overview.className =
    "overview";

  overview.textContent =
    movie.overview ||
    "あらすじ情報はありません。";


  const button =
    document.createElement(
      "button"
    );

  button.className =
    "more-button";

  button.textContent =
    "作品詳細を見る";


  const detail =
    document.createElement(
      "div"
    );

  detail.className =
    "detail";


  button.addEventListener(
    "click",
    async function(){

      if(
        detail.classList.contains(
          "active"
        )
      ){

        detail.classList.remove(
          "active"
        );

        button.textContent =
          "作品詳細を見る";

        return;

      }


      button.disabled =
        true;

      button.textContent =
        "読み込み中……";


      try{

        const movieDetail =
          await getMovieDetail(
            movie.id
          );


        renderMovieDetail(
          detail,
          movieDetail
        );


        detail.classList.add(
          "active"
        );


        button.textContent =
          "詳細を閉じる";


      }catch(error){

        console.error(
          error
        );


        detail.innerHTML =
          '<div class="message error" style="display:block">' +
          escapeHtml(
            error.message ||
            "作品情報を取得できませんでした。"
          ) +
          "</div>";


        detail.classList.add(
          "active"
        );


        button.textContent =
          "詳細を閉じる";

      }finally{

        button.disabled =
          false;

      }

    }
  );


  info.appendChild(
    title
  );

  info.appendChild(
    original
  );

  info.appendChild(
    date
  );

  info.appendChild(
    rating
  );

  info.appendChild(
    overview
  );

  info.appendChild(
    button
  );

  main.appendChild(
    poster
  );

  main.appendChild(
    info
  );

  card.appendChild(
    main
  );

  card.appendChild(
    detail
  );


  return card;

}


/* ========================================================
   詳細取得
======================================================== */

async function getMovieDetail(
  id
){

  const response =
    await fetch(
      API_URL +
      "?id=" +
      encodeURIComponent(
        id
      ),
      {
        method:"GET",
        headers:{
          "Accept":
            "application/json"
        }
      }
    );


  let data = null;


  try{

    data =
      await response.json();

  }catch{

    throw new Error(
      "作品詳細APIから正しいJSONが返ってきませんでした。"
    );

  }


  if(
    !response.ok
  ){

    throw new Error(
      data &&
      data.error
        ? data.error
        : "作品情報を取得できませんでした。"
    );

  }


  return data;

}


/* ========================================================
   作品詳細表示
======================================================== */

function renderMovieDetail(
  container,
  movie
){

  container.innerHTML =
    "";


  /*
   * 配信サービス
   */

  const streamingSection =
    document.createElement(
      "div"
    );

  streamingSection.className =
    "section";


  const streamingTitle =
    document.createElement(
      "h3"
    );

  streamingTitle.textContent =
    "📺 この作品はどこで見られる？";


  const streamingBox =
    document.createElement(
      "div"
    );

  streamingBox.className =
    "streaming";


  /*
   * Netflix
   *
   * TMDBのprovider情報とは別に、
   * APIが返したNetflix URLを使用する。
   */

  const netflixExists =
    movie &&
    (
      movie.netflix_url ||
      (
        movie.netflix &&
        movie.netflix.url
      )
    );


  if(netflixExists){

    const netflixProvider = {

      provider_name:
        "Netflix"

    };


    const element =
      createServiceElement(
        movie,
        netflixProvider,
        "見放題"
      );


    if(element){

      streamingBox.appendChild(
        element
      );

    }

  }


  /*
   * TMDBから取得した通常の配信サービス
   */

  const providers =
    Array.isArray(
      movie.streaming
    )
      ? movie.streaming
      : [];


  for(
    let i=0;
    i<providers.length;
    i++
  ){

    const provider =
      providers[i];


    const name =
      provider &&
      (
        provider.provider_name ||
        provider.name ||
        ""
      );


    /*
     * Netflixは上で表示済み。
     */

    if(
      String(
        name
      ).toLowerCase()
        .includes(
          "netflix"
        )
    ){

      continue;

    }


    const element =
      createServiceElement(
        movie,
        provider,
        "見放題"
      );


    if(element){

      streamingBox.appendChild(
        element
      );

    }

  }


  if(
    streamingBox.children.length === 0
  ){

    const noData =
      document.createElement(
        "div"
      );

    noData.className =

/* ========================================================
   レンタル・購入
======================================================== */

function addProviderSection(
  container,
  movie,
  providers,
  title,
  type
){

  if(
    !Array.isArray(
      providers
    ) ||
    providers.length === 0
  ){

    return;

  }


  const section =
    document.createElement(
      "div"
    );

  section.className =
    "section";


  const heading =
    document.createElement(
      "h3"
    );

  heading.textContent =
    title;


  const box =
    document.createElement(
      "div"
    );

  box.className =
    "streaming";


  for(
    let i=0;
    i<providers.length;
    i++
  ){

    const element =
      createServiceElement(
        movie,
        providers[i],
        type
      );


    if(element){

      box.appendChild(
        element
      );

    }

  }


  if(
    box.children.length === 0
  ){

    return;

  }


  section.appendChild(
    heading
  );

  section.appendChild(
    box
  );

  container.appendChild(
    section
  );

}


/* ========================================================
   日付
======================================================== */

function formatDate(
  date
){

  if(
    !date
  ){

    return "";

  }


  const parts =
    String(
      date
    ).split("-");


  if(
    parts.length !== 3
  ){

    return date;

  }


  return (
    parts[0] +
    "年" +
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}


/* ========================================================
   HTMLエスケープ
======================================================== */

function escapeHtml(
  value
){

  return String(
    value || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}
