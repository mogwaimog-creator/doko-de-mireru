<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドコデミレル？</title>

<style>
body{
  margin:0;
  font-family:Arial,"Noto Sans JP",sans-serif;
  background:#f5f7fb;
  color:#222;
}

header{
  background:#111827;
  color:white;
  text-align:center;
  padding:25px 15px;
}

.container{
  max-width:800px;
  margin:40px auto;
  padding:20px;
}

.box{
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.search{
  display:flex;
  gap:10px;
}

input{
  flex:1;
  padding:15px;
  font-size:17px;
  border:1px solid #ccc;
  border-radius:8px;
}

button{
  padding:15px 25px;
  background:#2563eb;
  color:white;
  border:0;
  border-radius:8px;
  font-size:17px;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

#result{
  margin-top:30px;
}

.card{
  background:#f3f4f6;
  padding:20px;
  border-radius:12px;
}

.poster{
  width:180px;
  border-radius:10px;
}

.service{
  padding:12px;
  margin:8px 0;
  background:white;
  border-radius:8px;
}

.series-item{
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  transition:background .2s;
}

.series-item:hover{
  background:#e5e7eb;
}

.series-poster{
  width:70px;
  border-radius:6px;
}

.detail-button{
  margin-left:auto;
  color:#2563eb;
  font-weight:bold;
}

@media(max-width:600px){

  .search{
    flex-direction:column;
  }

  button{
    width:100%;
  }

  .poster{
    width:140px;
  }

}
</style>
</head>

<body>

<header>
<h1>🎬 ドコデミレル？</h1>
<p>映画がどこで観られるか検索</p>
</header>

<div class="container">

<div class="box">

<h2>映画を検索</h2>

<div class="search">

<input
  id="movie"
  type="text"
  placeholder="例：トップガン"
>

<button id="searchButton">🔍 検索</button>

</div>

<div id="result"></div>

</div>

</div>

<script>

/* =========================
   検索ボタン
========================= */

document
  .getElementById("searchButton")
  .addEventListener("click", searchMovie);


/* Enterキーでも検索 */

document
  .getElementById("movie")
  .addEventListener("keydown", function(event){

    if(event.key === "Enter"){
      searchMovie();
    }

  });


/* =========================
   映画検索
========================= */

async function searchMovie(){

  const movie =
    document.getElementById("movie").value.trim();

  const result =
    document.getElementById("result");

  if(!movie){

    result.innerHTML =
      "<div class='card'>" +
      "映画名を入力してください。" +
      "</div>";

    return;
  }

  result.innerHTML =
    "<div class='card'>🔍 検索しています……</div>";

  try{

    const response =
      await fetch(
        "/api/search?query=" +
        encodeURIComponent(movie)
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error || "検索できませんでした"
      );

    }

    displayMovie(data);

  }catch(error){

    result.innerHTML =
      "<div class='card'>" +
      "❌ " +
      escapeHtml(error.message) +
      "</div>";

  }

}


/* =========================
   映画詳細表示
========================= */

function displayMovie(data){

  const result =
    document.getElementById("result");

  let html = "<div class='card'>";

  html +=
    "<h2>🎬 " +
    escapeHtml(data.title) +
    "</h2>";

  if(data.poster_path){

    html +=
      "<img class='poster' src='" +
      "https://image.tmdb.org/t/p/w500" +
      data.poster_path +
      "'>";

  }

  if(data.release_date){

    html +=
      "<p>公開日：" +
      escapeHtml(data.release_date) +
      "</p>";

  }

  if(data.overview){

    html +=
      "<p>" +
      escapeHtml(data.overview) +
      "</p>";

  }


  /* 見放題 */

  html += "<h3>🟢 見放題</h3>";

  if(data.streaming && data.streaming.length){

    data.streaming.forEach(function(service){

      html += createServiceButton(
        service,
        data.title,
        "streaming"
      );

    });

  }else{

    html +=
      "<div class='service'>" +
      "見放題の情報はありません" +
      "</div>";

  }


  /* レンタル */

  html += "<h3>🟡 レンタル</h3>";

  if(data.rental && data.rental.length){

    data.rental.forEach(function(service){

      html += createServiceButton(
        service,
        data.title,
        "rental"
      );

    });

  }else{

    html +=
      "<div class='service'>" +
      "レンタル情報はありません" +
      "</div>";

  }


  /* 購入 */

  html += "<h3>🔵 購入</h3>";

  if(data.purchase && data.purchase.length){

    data.purchase.forEach(function(service){

      html += createServiceButton(
        service,
        data.title,
        "purchase"
      );

    });

  }else{

    html +=
      "<div class='service'>" +
      "購入情報はありません" +
      "</div>";

  }


  if(data.link){

    html +=
      "<p>" +
      "<a href='" +
      data.link +
      "' target='_blank'>" +
      "配信情報の詳細を見る →" +
      "</a>" +
      "</p>";

  }

  html += "</div>";


  /* =========================
     シリーズ作品
  ========================= */

  if(
    data.series &&
    data.series.movies &&
    data.series.movies.length
  ){

    html +=
      "<h3>🎞️ シリーズ作品</h3>";

    html +=
      "<div class='series'>";

    if(data.series.name){

      html +=
        "<h4>" +
        escapeHtml(data.series.name) +
        "</h4>";

    }


    data.series.movies.forEach(function(movie){

      html +=
        "<div class='service series-item' " +
        "data-id='" +
        movie.id +
        "'>";

      if(movie.poster_path){

        html +=
          "<img class='series-poster' " +
          "src='https://image.tmdb.org/t/p/w200" +
          movie.poster_path +
          "'>";

      }

      html +=
        "<strong>" +
        escapeHtml(movie.title) +
        "</strong>";


      if(movie.release_date){

        html +=
          " (" +
          escapeHtml(
            movie.release_date.substring(0,4)
          ) +
          ")";

      }


      html +=
        "<span class='detail-button'>" +
        "▶ 詳細" +
        "</span>";

      html += "</div>";

    });

    html += "</div>";

  }


  result.innerHTML = html;


  /* =========================
     ここが重要
     シリーズ作品にクリック処理を追加
  ========================= */

  document
    .querySelectorAll(".series-item")
    .forEach(function(item){

      item.addEventListener(
        "click",
        function(){

          const id =
            this.dataset.id;

          searchMovieById(id);

        }
      );

    });

}


/* =========================
   IDから作品を検索
========================= */

async function searchMovieById(id){

  const result =
    document.getElementById("result");

  result.innerHTML =
    "<div class='card'>" +
    "🔍 作品情報を読み込んでいます……" +
    "</div>";

  try{

    const response =
      await fetch(
        "/api/search?id=" +
        encodeURIComponent(id)
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "作品が見つかりませんでした"
      );

    }

    displayMovie(data);

  }catch(error){

    result.innerHTML =
      "<div class='card'>" +
      "❌ " +
      escapeHtml(error.message) +
      "</div>";

  }

}


/* =========================
   配信サービスURL
========================= */

function getServiceUrl(name,title){

  const service =
    name.toLowerCase();

  if(service.includes("netflix")){

    return "https://www.netflix.com/jp/search?q=" +
      encodeURIComponent(title);

  }

  if(
    service.includes("prime") ||
    service.includes("amazon")
  ){

    return "https://www.amazon.co.jp/s?k=" +
      encodeURIComponent(title);

  }

  if(service.includes("u-next")){

    return "https://video.unext.jp/search?query=" +
      encodeURIComponent(title);

  }

  if(service.includes("hulu")){

    return "https://www.hulu.jp/search?q=" +
      encodeURIComponent(title);

  }

  if(service.includes("disney")){

    return "https://www.disneyplus.com/ja-jp/search/" +
      encodeURIComponent(title);

  }

  return "#";

}


/* =========================
   配信ボタン
========================= */

function createServiceButton(
  service,
  title,
  type
){

  let emoji = "🟢";
  let background = "#2563eb";
  let text = "見る";

  if(type === "rental"){

    emoji = "🟡";
    background = "#f59e0b";
    text = "レンタル";

  }

  if(type === "purchase"){

    emoji = "🔵";
    background = "#2563eb";
    text = "購入";

  }

  const url =
    getServiceUrl(
      service.provider_name,
      title
    );

  return (
    "<a href='" +
    url +
    "' target='_blank' " +
    "style='display:inline-block;" +
    "padding:12px 18px;" +
    "margin:6px 6px 6px 0;" +
    "background:" +
    background +
    ";" +
    "color:white;" +
    "text-decoration:none;" +
    "border-radius:8px;" +
    "font-weight:bold;'>" +

    emoji +
    " " +
    escapeHtml(service.provider_name) +
    " ▶ " +
    text +

    "</a>"
  );

}


/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent =
    text || "";

  return div.innerHTML;

}

</script>

</body>
</html>
