<script>

/* =========================================================
   DOM
========================================================= */

const queryInput =
  document.getElementById(
    "query"
  );

const searchButton =
  document.getElementById(
    "searchButton"
  );

const status =
  document.getElementById(
    "status"
  );

const results =
  document.getElementById(
    "results"
  );


/* =========================================================
   映画検索
========================================================= */

async function searchMovies(){

  const query =
    queryInput.value.trim();


  sessionStorage.setItem(
    "dokoDeMireruLastQuery",
    query
  );


  /* -------------------------------------------------------
     空欄チェック
  ------------------------------------------------------- */

  if(!query){

    status.innerHTML =
      '<div class="error">' +
      '映画名を入力してください。' +
      '</div>';

    results.innerHTML =
      "";

    return;

  }


  /* -------------------------------------------------------
   検索中
------------------------------------------------------- */

searchButton.disabled =
  true;


/* -------------------------------------------------------
   検索結果見出し
------------------------------------------------------- */

const searchResultsHeading =
  document.getElementById(
    "searchResultsHeading"
  );

if(searchResultsHeading){

  searchResultsHeading.textContent =
    '🔍「' + query + '」の検索結果';

  searchResultsHeading.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

}


/* -------------------------------------------------------
   検索中
------------------------------------------------------- */

status.innerHTML =
  '<div class="status">' +
  '🔍 検索しています...' +
  '</div>';

results.innerHTML =
  "";


  try{


    /* -----------------------------------------------------
       API
    ----------------------------------------------------- */

    const apiUrl =
      "/api/search?query=" +
      encodeURIComponent(
        query
      );


    const response =
      await fetch(
        apiUrl
      );


    const text =
      await response.text();


    console.log(
      "API response:",
      text
    );


    let data;


    try{

      data =
        JSON.parse(
          text
        );

    }catch(error){

      throw new Error(
        "サーバーから正しいデータを取得できませんでした。"
      );

    }


    /* -----------------------------------------------------
       APIエラー
    ----------------------------------------------------- */

    if(!response.ok){

      throw new Error(
        data.error ||
        "検索に失敗しました。"
      );

    }


    /* -----------------------------------------------------
       結果
    ----------------------------------------------------- */

    const movies =
      Array.isArray(
        data.results
      )
        ? data.results
        : [];


    status.innerHTML =
      "";


    /* -----------------------------------------------------
       0件
    ----------------------------------------------------- */

    if(!movies.length){

  searchResultsHeading.textContent =
    '🔍「' + query + '」の検索結果（0件）';

  results.innerHTML =
    `
    <div class="empty">

      <div style="font-size:32px; margin-bottom:10px;">
        🎬
      </div>

      <div style="font-weight:bold; font-size:17px; margin-bottom:8px;">
        映画が見つかりませんでした。
      </div>

      <div>
        別の作品名で検索してみてください。
      </div>

    </div>
    `;

  return;

}


    /* -----------------------------------------------------
       年代順

       古い作品
       ↓
       新しい作品
    ----------------------------------------------------- */

    movies.sort(
      function(a,b){

        const dateA =
          a.release_date ||
          "9999-99-99";


        const dateB =
          b.release_date ||
          "9999-99-99";


        return dateA.localeCompare(
          dateB
        );

      }
    );


    /* -----------------------------------------------------
       表示
    ----------------------------------------------------- */

    /* -----------------------------------------------------
   検索結果件数
----------------------------------------------------- */

searchResultsHeading.textContent =
  '🔍「' + query + '」の検索結果（' +
  movies.length +
  '件）';


/* -----------------------------------------------------
   表示
----------------------------------------------------- */

results.innerHTML =
  movies
    .map(
      createMovieCard
    )
    .join("");


  }catch(error){

    console.error(
      "Search error:",
      error
    );


    status.innerHTML =
      `
      <div class="error">

        ❌

        ${escapeHtml(
          error.message ||
          "サーバーエラーが発生しました。"
        )}

      </div>
      `;


  }finally{

    searchButton.disabled =
      false;

  }

}


/* =========================================================
   映画カード
========================================================= */

function createMovieCard(movie){

  /* -------------------------------------------------------
     ポスター
  ------------------------------------------------------- */

  const poster =
    movie.poster_path
      ? "https://image.tmdb.org/t/p/w500" +
        movie.poster_path
      : "";



/* -------------------------------------------------------
   公開日・上映時間
------------------------------------------------------- */

const release =
  movie.release_date
    ? formatYear(
        movie.release_date
      )
    : "公開年不明";

const runtime =
  movie.runtime
    ? formatRuntime(
        movie.runtime
      )
    : "";


  /* -------------------------------------------------------
     評価
  ------------------------------------------------------- */

  const rating =
    Number(
      movie.vote_average || 0
    ).toFixed(1);


  /* -------------------------------------------------------
     TMDB ID
  ------------------------------------------------------- */

  const movieId =
    String(
      movie.id || ""
    ).trim();


  /* -------------------------------------------------------
     詳細ページ
  ------------------------------------------------------- */

  const detailUrl =
    "./detail.html?id=" +
    encodeURIComponent(
      movieId
    );


  return `

    <article class="movie-card">


      ${
        poster

        ?

        `
        <img
          class="movie-poster"
          src="${poster}"
          alt="${escapeHtml(
            movie.title || ""
          )}のポスター"
          loading="lazy"
        >
        `

        :

        `
        <div
          class="movie-poster"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            color:#6b7280;
          "
          role="img"
          aria-label="ポスター画像なし"
        >
          NO IMAGE
        </div>
        `

      }


      <div class="movie-info">


        <!-- 作品名 -->

        <h2 class="movie-title">

          ${escapeHtml(
            movie.title || ""
          )}

        </h2>


        <!-- 原題 -->

        ${
          movie.original_title

          ?

          `
          <div class="original-title">

            ${escapeHtml(
              movie.original_title
            )}

          </div>
          `

          :

          ""
        }


        <!-- 作品タイプ -->

<div class="meta">

  🎬 作品タイプ：
  ${escapeHtml(
    movie.media_type || "映画"
  )}

</div>


<!-- 公開年 -->

<div class="meta">

  📅 公開年：
  ${escapeHtml(
    release
  )}

</div>


<!-- 評価 -->

<div class="meta">

  ⭐ TMDB評価：
  ${rating}

</div>


<!-- 上映時間 -->

${
  movie.runtime
    ? `
      <div class="meta">

        ⏱ 上映時間：
        ${formatRuntime(movie.runtime)}

      </div>
      `
    : ""
}
        <!-- 詳細 -->

        ${
          movieId

          ?

          `
          <a
            class="detail-button"
            href="${detailUrl}"
            aria-label="${escapeHtml(
              movie.title || "作品"
            )}の詳細を見る"
          >
            作品詳細を見る →
          </a>
          `

          :

          `
          <div class="error">

            作品IDを取得できませんでした。

          </div>
          `

        }


      </div>


    </article>

  `;

}


/* =========================================================
   公開年
========================================================= */

function formatYear(date){

  if(!date){

    return "";

  }


  const year =
    String(date).substring(
      0,
      4
    );


  return year + "年";

}

function formatYear(date){

  if(!date){

    return "";

  }

  const year =
    String(date).substring(
      0,
      4
    );

  return year + "年";

}


/* =========================================================
   上映時間
========================================================= */

function formatRuntime(minutes){

  const value =
    Number(minutes || 0);

  if(!value){

    return "";

  }

  const hours =
    Math.floor(
      value / 60
    );

  const mins =
    value % 60;

  if(hours > 0){

    return (
      hours +
      "時間" +
      (
        mins > 0
          ? mins + "分"
          : ""
      )
    );

  }

  return (
    mins +
    "分"
  );

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   Enter
========================================================= */

queryInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      searchMovies();

    }

  }
);


/* =========================================================
   検索ボタン
========================================================= */

searchButton.addEventListener(
  "click",
  searchMovies
);

/* =========================================================
   人気作品 自動取得
========================================================= */

async function loadPopularMovies(){

  const popularMovies =
    document.getElementById(
      "popularMovies"
    );

  if(!popularMovies){
    return;
  }

  try{

    const response =
      await fetch(
        "/api/search?popular=1"
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !Array.isArray(data.results) ||
      !data.results.length
    ){

      throw new Error(
        "人気作品を取得できませんでした。"
      );

    }


    popularMovies.innerHTML =
      data.results
        .map(
          createPopularMovieCard
        )
        .join("");


  }catch(error){

    console.error(
      "Popular movies error:",
      error
    );

    popularMovies.innerHTML =
      `
      <div class="empty">
        人気作品を取得できませんでした。
      </div>
      `;

  }

}     

/* =========================================================
   人気作品カード
========================================================= */

function createPopularMovieCard(movie){

  const poster =
    movie.poster_path
      ? "https://image.tmdb.org/t/p/w500" +
        movie.poster_path
      : "";

  const movieId =
    String(
      movie.id || ""
    ).trim();

  const detailUrl =
    "./detail.html?id=" +
    encodeURIComponent(
      movieId
    );


  const title =
    movie.title ||
    movie.original_title ||
    "作品名不明";


  let statusText =
    "";

  let statusClass =
    "";


  /* -------------------------------------------------------
     公開日判定
  ------------------------------------------------------- */

  if(movie.release_date){

    const releaseDate =
      new Date(
        movie.release_date +
        "T00:00:00"
      );

    const today =
      new Date();

    today.setHours(
      0,0,0,0
    );


    if(
      releaseDate > today
    ){

      const year =
        releaseDate.getFullYear();

      const month =
        releaseDate.getMonth() + 1;

      const day =
        releaseDate.getDate();


      statusText =
        "🔵 " +
        year +
        "年" +
        month +
        "月" +
        day +
        "日 公開予定";

      statusClass =
        "status-coming";

    }else{

      statusText =
        "🔴 公開中";

      statusClass =
        "status-now";

    }

  }else{

    statusText =
      "🟡 公開日不明";

    statusClass =
      "status-planned";

  }


  return `

    <a
      class="popular-card"
      href="${detailUrl}"
    >

      ${
        poster

        ?

        `
        <img
          class="popular-poster"
          src="${poster}"
          alt="${escapeHtml(
            title
          )}のポスター"
          loading="lazy"
        >
        `

        :

        `
        <div
          class="popular-poster no-image"
        >
          NO IMAGE
        </div>
        `
      }


      <div class="popular-card-info">

        <div class="popular-card-title">

          ${escapeHtml(
            title
          )}

        </div>


        <div
          class="popular-card-status ${statusClass}"
        >

          ${escapeHtml(
            statusText
          )}

        </div>


        <div class="popular-card-link">

          作品詳細を見る →

        </div>

      </div>

    </a>

  `;

}

   詳細画面から戻ってきた場合
========================================================= */

const savedQuery =
  sessionStorage.getItem(
    "dokoDeMireruLastQuery"
  );


if(savedQuery){

  queryInput.value =
    savedQuery;

  searchMovies();

}

loadPopularMovies();     
     
</script>
