<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ドコデミレル？</title>


<style>

/* =========================
   基本
========================= */

*{
  box-sizing:border-box;
}

body{

  margin:0;

  font-family:
    Arial,
    "Noto Sans JP",
    sans-serif;

  background:#f3f5f9;

  color:#222;

}


/* =========================
   ヘッダー
========================= */

header{

  background:
    linear-gradient(
      135deg,
      #111827,
      #1e3a8a
    );

  color:white;

  text-align:center;

  padding:32px 15px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.15);

}

header h1{

  margin:0;

  font-size:32px;

  letter-spacing:1px;

}

header p{

  margin:8px 0 0;

  opacity:.85;

}


/* =========================
   メイン
========================= */

.container{

  max-width:950px;

  margin:35px auto;

  padding:0 20px;

}


/* =========================
   メインボックス
========================= */

.box{

  background:white;

  padding:30px;

  border-radius:18px;

  box-shadow:
    0 5px 25px
    rgba(0,0,0,.08);

}


/* =========================
   検索
========================= */

.search{

  display:flex;

  gap:10px;

}

input{

  flex:1;

  padding:16px;

  font-size:17px;

  border:
    1px solid #d1d5db;

  border-radius:10px;

  outline:none;

}

input:focus{

  border-color:#2563eb;

  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.12);

}

.search-button{

  padding:
    15px 28px;

  background:#2563eb;

  color:white;

  border:0;

  border-radius:10px;

  font-size:17px;

  font-weight:bold;

  cursor:pointer;

}

.search-button:hover{

  background:#1d4ed8;

}


/* =========================
   結果
========================= */

#result{

  margin-top:30px;

}


/* =========================
   検索結果タイトル
========================= */

.result-title{

  margin:
    0 0 20px;

  font-size:24px;

}


/* =========================
   映画カード
========================= */

.movie-card{

  display:flex;

  gap:22px;

  background:white;

  padding:18px;

  margin-bottom:18px;

  border-radius:16px;

  border:
    1px solid #e5e7eb;

  box-shadow:
    0 3px 15px
    rgba(0,0,0,.06);

  transition:
    transform .2s,
    box-shadow .2s;

}

.movie-card:hover{

  transform:
    translateY(-2px);

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.12);

}


/* =========================
   ポスター
========================= */

.movie-poster{

  width:145px;

  height:215px;

  object-fit:cover;

  border-radius:10px;

  background:#e5e7eb;

  flex-shrink:0;

}

.no-poster{

  width:145px;

  height:215px;

  border-radius:10px;

  background:#e5e7eb;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  color:#777;

  flex-shrink:0;

}


/* =========================
   映画情報
========================= */

.movie-info{

  flex:1;

}

.movie-title{

  font-size:22px;

  font-weight:bold;

  margin:
    0 0 5px;

}

.movie-original{

  color:#777;

  font-size:14px;

  margin-bottom:10px;

}

.movie-year{

  display:inline-block;

  background:#eef2ff;

  color:#3730a3;

  padding:
    5px 9px;

  border-radius:6px;

  font-size:14px;

  margin-bottom:10px;

}

.movie-rating{

  display:inline-block;

  margin-left:6px;

  padding:
    5px 9px;

  border-radius:6px;

  background:#fff7ed;

  color:#c2410c;

  font-size:14px;

  font-weight:bold;

}

.movie-overview{

  color:#555;

  line-height:1.6;

  font-size:14px;

  margin:
    8px 0 15px;

}


/* =========================
   詳細ボタン
========================= */

.detail-button{

  display:inline-block;

  padding:
    10px 16px;

  background:#2563eb;

  color:white;

  text-decoration:none;

  border-radius:8px;

  font-weight:bold;

  cursor:pointer;

}

.detail-button:hover{

  background:#1d4ed8;

}


/* =========================
   詳細カード
========================= */

.detail-card{

  background:white;

  padding:30px;

  border-radius:18px;

  box-shadow:
    0 5px 25px
    rgba(0,0,0,.08);

}


/* =========================
   詳細ヘッダー
========================= */

.detail-header{

  display:flex;

  gap:30px;

  margin-bottom:30px;

}

.detail-poster{

  width:240px;

  max-width:40%;

  height:auto;

  object-fit:cover;

  border-radius:12px;

  box-shadow:
    0 5px 18px
    rgba(0,0,0,.15);

}

.detail-info{

  flex:1;

}

.detail-title{

  font-size:30px;

  margin:
    0 0 8px;

}

.detail-original{

  color:#777;

  margin-bottom:15px;

}

.detail-meta{

  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-bottom:15px;

}

.meta-item{

  background:#f3f4f6;

  padding:
    7px 10px;

  border-radius:7px;

  font-size:14px;

}

.rating-box{

  display:inline-block;

  background:#fff7ed;

  color:#c2410c;

  padding:
    8px 12px;

  border-radius:8px;

  font-weight:bold;

  margin-bottom:15px;

}


/* =========================
   詳細セクション
========================= */

.detail-section{

  margin-top:28px;

  padding-top:20px;

  border-top:
    1px solid #e5e7eb;

}

.detail-section h3{

  margin:
    0 0 15px;

  font-size:20px;

}

.overview{

  color:#444;

  line-height:1.8;

}


/* =========================
   配信サービス
========================= */

.service-group{

  margin-bottom:25px;

}

.service-title{

  font-size:18px;

  margin:
    0 0 10px;

}

.service-buttons{

  display:flex;

  flex-wrap:wrap;

  gap:8px;

}

.service-button{

  display:inline-block;

  padding:
    11px 16px;

  color:white;

  text-decoration:none;

  border-radius:8px;

  font-weight:bold;

  transition:
    transform .15s,
    opacity .15s;

}

.service-button:hover{

  transform:
    translateY(-1px);

  opacity:.9;

}


/* =========================
   配信なし
========================= */

.no-service{

  color:#777;

  font-size:14px;

  background:#f9fafb;

  padding:12px;

  border-radius:8px;

}


/* =========================
   TMDBリンク
========================= */

.tmdb-link{

  display:inline-block;

  margin-top:8px;

  color:#2563eb;

  font-weight:bold;

  text-decoration:none;

}

.tmdb-link:hover{

  text-decoration:underline;

}


/* =========================
   シリーズ
========================= */

.series-list{

  display:flex;

  flex-direction:column;

  gap:10px;

}

.series-item{

  display:flex;

  align-items:center;

  gap:14px;

  background:#f8fafc;

  padding:12px;

  border:
    1px solid #e5e7eb;

  border-radius:10px;

  cursor:pointer;

  transition:
    background .15s,
    transform .15s;

}

.series-item:hover{

  background:#eef2ff;

  transform:
    translateX(3px);

}

.series-poster{

  width:60px;

  height:85px;

  object-fit:cover;

  border-radius:6px;

  background:#e5e7eb;

}

.series-info{

  flex:1;

}

.series-title{

  font-weight:bold;

  font-size:16px;

}

.series-year{

  color:#777;

  font-size:14px;

  margin-top:5px;

}


/* =========================
   戻る
========================= */

.back-button{

  display:inline-block;

  margin-bottom:20px;

  padding:
    10px 15px;

  background:#6b7280;

  color:white;

  border-radius:8px;

  cursor:pointer;

  font-weight:bold;

}

.back-button:hover{

  background:#4b5563;

}


/* =========================
   ローディング
========================= */

.loading{

  text-align:center;

  padding:35px;

  color:#666;

}


/* =========================
   エラー
========================= */

.error{

  background:#fee2e2;

  color:#991b1b;

  padding:18px;

  border-radius:10px;

}


/* =========================
   スマホ
========================= */

@media(max-width:600px){

  .container{

    margin:
      20px auto;

    padding:
      0 12px;

  }

  .box{

    padding:18px;

  }

  .search{

    flex-direction:column;

  }

  .search-button{

    width:100%;

  }

  .movie-card{

    gap:14px;

    padding:12px;

  }

  .movie-poster,
  .no-poster{

    width:95px;

    height:140px;

  }

  .movie-title{

    font-size:18px;

  }

  .movie-overview{

    display:none;

  }

  .movie-rating{

    margin-left:0;

    margin-top:5px;

  }

  .detail-card{

    padding:18px;

  }

  .detail-header{

    flex-direction:column;

    gap:18px;

  }

  .detail-poster{

    width:200px;

    max-width:100%;

    margin:0 auto;

  }

  .detail-title{

    font-size:25px;

  }

  .service-buttons{

    flex-direction:column;

  }

  .service-button{

    text-align:center;

  }

}


/* =========================
   小さなスマホ
========================= */

@media(max-width:400px){

  .movie-card{

    flex-direction:column;

  }

  .movie-poster,
  .no-poster{

    width:120px;

    height:175px;

  }

}

</style>

</head>


<body>


<header>

<h1>🎬 ドコデミレル？</h1>

<p>
映画がどこで観られるか検索
</p>

</header>


<div class="container">

<div class="box">

<h2>🎬 映画を検索</h2>


<div class="search">

<input
  id="movie"
  type="text"
  placeholder="例：トップガン"
  onkeydown="
    if(event.key==='Enter'){
      searchMovie();
    }
  "
>

<button
  class="search-button"
  onclick="searchMovie()"
>
🔍 検索
</button>

</div>


<div id="result"></div>


</div>

</div>


<script>

/* =========================
   最後の検索語
========================= */

let lastSearchQuery = "";


/* =========================
   映画検索
========================= */

async function searchMovie(){

  const movieInput =
    document.getElementById("movie");


  const movie =
    movieInput.value.trim();


  const result =
    document.getElementById("result");


  if(!movie){

    result.innerHTML =
      "<div class='error'>" +
      "映画名を入力してください。" +
      "</div>";

    return;

  }


  lastSearchQuery = movie;


  result.innerHTML =
    "<div class='loading'>" +
    "🔍 映画を検索しています……" +
    "</div>";


  try{

    const response =
      await fetch(
        "/api/search?query=" +
        encodeURIComponent(movie)
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "検索できませんでした"
      );

    }


    if(
      !data.results ||
      !data.results.length
    ){

      result.innerHTML =
        "<div class='error'>" +
        "映画が見つかりませんでした。" +
        "</div>";

      return;

    }


    let html = "";


    html +=
      "<h2 class='result-title'>" +
      "🔎 「" +
      escapeHtml(movie) +
      "」の検索結果 " +
      data.results.length +
      "件" +
      "</h2>";


    data.results.forEach(
      function(movie){

        html +=
          createMovieCard(movie);

      }
    );


    result.innerHTML =
      html;

  }

  catch(error){

    result.innerHTML =
      "<div class='error'>" +
      "❌ " +
      escapeHtml(error.message) +
      "</div>";

  }

}


/* =========================
   映画カード
========================= */

function createMovieCard(movie){

  let html =
    "<div class='movie-card'>";


  /* ポスター */

  if(movie.poster_path){

    html +=

      "<img " +
      "class='movie-poster' " +
      "src='" +
      "https://image.tmdb.org/t/p/w500" +
      movie.poster_path +
      "' " +
      "alt='" +
      escapeHtml(movie.title) +
      "'>";

  }

  else{

    html +=

      "<div class='no-poster'>" +
      "🎬<br>画像なし" +
      "</div>";

  }


  html +=
    "<div class='movie-info'>";


  /* タイトル */

  html +=

    "<h3 class='movie-title'>" +
    escapeHtml(movie.title) +
    "</h3>";


  /* 原題 */

  if(movie.original_title){

    html +=

      "<div class='movie-original'>" +
      escapeHtml(movie.original_title) +
      "</div>";

  }


  /* 年 */

  if(movie.release_date){

    html +=

      "<span class='movie-year'>" +
      "📅 " +
      escapeHtml(
        movie.release_date.substring(0,4)
      ) +
      "年" +
      "</span>";

  }


  /* 評価 */

  if(
    movie.vote_average !== undefined &&
    movie.vote_average !== null &&
    Number(movie.vote_average) > 0
  ){

    html +=

      "<span class='movie-rating'>" +
      "⭐ " +
      Number(movie.vote_average).toFixed(1) +
      " / 10" +
      "</span>";

  }


  /* あらすじ */

  if(movie.overview){

    html +=

      "<p class='movie-overview'>" +
      escapeHtml(movie.overview) +
      "</p>";

  }


  /* 詳細 */

  html +=

    "<span " +
    "class='detail-button' " +
    "onclick='searchMovieById(" +
    movie.id +
    ")'>" +
    "▶ 詳細を見る" +
    "</span>";


  html +=
    "</div>";


  html +=
    "</div>";


  return html;

}


/* =========================
   詳細画面
========================= */

async function searchMovieById(movieId){

  const result =
    document.getElementById("result");


  result.innerHTML =
    "<div class='loading'>" +
    "🔍 作品情報を読み込んでいます……" +
    "</div>";


  try{

    const response =
      await fetch(
        "/api/search?id=" +
        encodeURIComponent(movieId)
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "作品情報を取得できませんでした"
      );

    }


    let html =
      "<div class='detail-card'>";


    /* 戻る */

    html +=

      "<div " +
      "class='back-button' " +
      "onclick='backToSearchResults()'>" +
      "← 検索結果に戻る" +
      "</div>";


    /* =========================
       詳細ヘッダー
    ========================= */

    html +=
      "<div class='detail-header'>";


    /* ポスター */

    if(data.poster_path){

      html +=

        "<img " +
        "class='detail-poster' " +
        "src='" +
        "https://image.tmdb.org/t/p/w500" +
        data.poster_path +
        "' " +
        "alt='" +
        escapeHtml(data.title) +
        "'>";

    }


    html +=
      "<div class='detail-info'>";


    /* タイトル */

    html +=

      "<h2 class='detail-title'>" +
      "🎬 " +
      escapeHtml(data.title) +
      "</h2>";


    /* 原題 */

    if(data.original_title){

      html +=

        "<div class='detail-original'>" +
        escapeHtml(data.original_title) +
        "</div>";

    }


    /* メタ情報 */

    html +=
      "<div class='detail-meta'>";


    if(data.release_date){

      html +=

        "<span class='meta-item'>" +
        "📅 " +
        escapeHtml(data.release_date) +
        "</span>";

    }


    if(
      data.genres &&
      data.genres.length
    ){

      html +=

        "<span class='meta-item'>" +
        "🎭 " +
        data.genres
          .map(function(genre){

            return escapeHtml(
              genre.name
            );

          })
          .join(" / ") +
        "</span>";

    }


    html +=
      "</div>";


    /* 評価 */

    if(
      data.vote_average !== undefined &&
      data.vote_average !== null &&
      Number(data.vote_average) > 0
    ){

      html +=

        "<div class='rating-box'>" +
        "⭐ TMDB評価 " +
        Number(data.vote_average).toFixed(1) +
        " / 10" +
        "</div>";

    }


    /* 監督 */

    if(data.director){

      html +=

        "<p>" +
        "🎬 監督：<strong>" +
        escapeHtml(data.director.name) +
        "</strong>" +
        "</p>";

    }


    /* 出演者 */

    if(
      data.cast &&
      data.cast.length
    ){

      html +=

        "<p>" +
        "👤 出演：" +
        data.cast
          .slice(0,6)
          .map(function(person){

            return escapeHtml(
              person.name
            );

          })
          .join("、") +
        "</p>";

    }


    html +=
      "</div>";


    html +=
      "</div>";


    /* =========================
       あらすじ
    ========================= */

    if(data.overview){

      html +=

        "<div class='detail-section'>" +

        "<h3>📝 あらすじ</h3>" +

        "<p class='overview'>" +

        escapeHtml(data.overview) +

        "</p>" +

        "</div>";

    }


    /* =========================
       配信情報
    ========================= */

    html +=

      "<div class='detail-section'>" +

      "<h3>📺 配信情報</h3>";


    /* 見放題 */

    html +=
      "<div class='service-group'>";


    html +=
      "<h4 class='service-title'>" +
      "🟢 見放題" +
      "</h4>";


    html +=
      createServiceButtons(
        data.streaming,
        data.title,
        "streaming"
      );


    html +=
      "</div>";


    /* レンタル */

    html +=
      "<div class='service-group'>";


    html +=
      "<h4 class='service-title'>" +
      "🟡 レンタル" +
      "</h4>";


    html +=
      createServiceButtons(
        data.rental,
        data.title,
        "rental"
      );


    html +=
      "</div>";


    /* 購入 */

    html +=
      "<div class='service-group'>";


    html +=
      "<h4 class='service-title'>" +
      "🔵 購入" +
      "</h4>";


    html +=
      createServiceButtons(
        data.purchase,
        data.title,
        "purchase"
      );


    html +=
      "</div>";


    /* TMDBリンク */

    if(data.link){

      html +=

        "<a " +
        "class='tmdb-link' " +
        "href='" +
        escapeAttribute(data.link) +
        "' " +
        "target='_blank' " +
        "rel='noopener noreferrer'>" +
        "配信情報の詳細を見る →" +
        "</a>";

    }


    html +=
      "</div>";


    /* =========================
       シリーズ
    ========================= */

    if(
      data.series &&
      data.series.movies &&
      data.series.movies.length
    ){

      html +=

        "<div class='detail-section'>" +

        "<h3>🎞️ シリーズ作品</h3>";


      if(data.series.name){

        html +=

          "<p><strong>" +
          escapeHtml(data.series.name) +
          "</strong></p>";

      }


      html +=
        "<div class='series-list'>";


      data.series.movies.forEach(
        function(movie){

          /*
           * Untitled作品を非表示
           */

          if(
            !movie.title ||
            movie.title
              .toLowerCase()
              .includes("untitled")
          ){

            return;

          }


          html +=

            "<div " +
            "class='series-item' " +
            "onclick='searchMovieById(" +
            movie.id +
            ")'>";


          if(movie.poster_path){

            html +=

              "<img " +
              "class='series-poster' " +
              "src='" +
              "https://image.tmdb.org/t/p/w200" +
              movie.poster_path +
              "' " +
              "alt='" +
              escapeHtml(movie.title) +
              "'>";

          }

          else{

            html +=

              "<div class='series-poster'>" +
              "</div>";

          }


          html +=

            "<div class='series-info'>";


          html +=

            "<div class='series-title'>" +
            escapeHtml(movie.title) +
            "</div>";


          if(movie.release_date){

            html +=

              "<div class='series-year'>" +
              movie.release_date.substring(0,4) +
              "年" +
              "</div>";

          }


          html +=
            "</div>";


          html +=
            "</div>";

        }
      );


      html +=
        "</div>";


      html +=
        "</div>";

    }


    html +=
      "</div>";


    result.innerHTML =
      html;


  }

  catch(error){

    result.innerHTML =

      "<div class='error'>" +

      "❌ " +

      escapeHtml(
        error.message
      ) +

      "</div>";

  }

}


/* =========================
   検索結果へ戻る
========================= */

function backToSearchResults(){

  if(lastSearchQuery){

    document
      .getElementById("movie")
      .value =
      lastSearchQuery;


    searchMovie();

  }

  else{

    document
      .getElementById("result")
      .innerHTML = "";

  }

}


/* =========================
   配信サービス
========================= */

function createServiceButtons(
  services,
  title,
  type
){

  if(
    !services ||
    !services.length
  ){

    return (

      "<div class='no-service'>" +

      "この種類の配信情報はありません" +

      "</div>"

    );

  }


  let html =
    "<div class='service-buttons'>";


  /*
   * 同じサービスを重複表示しない
   */

  const used = {};


  services.forEach(
    function(service){

      const providerName =
        service.provider_name ||
        "配信サービス";


      const key =
        providerName.toLowerCase();


      if(used[key]){

        return;

      }


      used[key] = true;


      const url =
        getServiceUrl(
          providerName,
          title
        );


      let background =
        "#2563eb";


      if(type === "rental"){

        background =
          "#f59e0b";

      }

      else if(type === "purchase"){

        background =
          "#7c3aed";

      }


      html +=

        "<a " +

        "class='service-button' " +

        "href='" +
        escapeAttribute(url) +
        "' " +

        "target='_blank' " +

        "rel='noopener noreferrer' " +

        "style='background:" +
        background +
        "'>" +

        escapeHtml(providerName) +

        " ▶" +

        "</a>";

    }
  );


  html +=
    "</div>";


  return html;

}


/* =========================
   配信サービスURL
========================= */

function getServiceUrl(
  providerName,
  title
){

  const name =
    providerName
      .toLowerCase();


  /* Netflix */

  if(
    name.includes("netflix")
  ){

    return (

      "https://www.netflix.com/jp/search?q=" +

      encodeURIComponent(title)

    );

  }


  /* Amazon */

  if(
    name.includes("prime") ||
    name.includes("amazon")
  ){

    return (

      "https://www.amazon.co.jp/s?k=" +

      encodeURIComponent(title)

    );

  }


  /* U-NEXT */

  if(
    name.includes("u-next")
  ){

    return (

      "https://video.unext.jp/search?query=" +

      encodeURIComponent(title)

    );

  }


  /* Hulu */

  if(
    name.includes("hulu")
  ){

    return (

      "https://www.hulu.jp/search?q=" +

      encodeURIComponent(title)

    );

  }


  /* Disney+ */

  if(
    name.includes("disney")
  ){

    return (

      "https://www.disneyplus.com/ja-jp/search/" +

      encodeURIComponent(title)

    );

  }


  /* Apple TV */

  if(
    name.includes("apple")
  ){

    return (

      "https://tv.apple.com/jp/search?term=" +

      encodeURIComponent(title)

    );

  }


  /* Google Play */

  if(
    name.includes("google play") ||
    name.includes("google")
  ){

    return (

      "https://play.google.com/store/search?q=" +

      encodeURIComponent(title) +

      "&c=movies&hl=ja"

    );

  }


  /* FOD */

  if(
    name.includes("fod")
  ){

    return (

      "https://fod.fujitv.co.jp/search/?keyword=" +

      encodeURIComponent(title)

    );

  }


  /*
   * 未対応サービス
   *
   * とりあえずGoogle検索
   */

  return (

    "https://www.google.com/search?q=" +

    encodeURIComponent(
      providerName +
      " " +
      title
    )

  );

}


/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(text){

  if(
    text === null ||
    text === undefined
  ){

    return "";

  }


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(text);


  return div.innerHTML;

}


/* =========================
   属性用エスケープ
========================= */

function escapeAttribute(text){

  if(
    text === null ||
    text === undefined
  ){

    return "";

  }


  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}
