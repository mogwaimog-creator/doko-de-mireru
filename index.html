<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドコデミレル？</title>

<style>
body{
  margin:0;
  font-family:Arial,"Noto Sans JP",sans-serif;
  background:#f5f7fb;
  color:#222;
}
header{
  background:#111827;
  color:white;
  text-align:center;
  padding:25px 15px;
}
.container{
  max-width:800px;
  margin:40px auto;
  padding:20px;
}
.box{
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}
.search{
  display:flex;
  gap:10px;
}
input{
  flex:1;
  padding:15px;
  font-size:17px;
  border:1px solid #ccc;
  border-radius:8px;
}
button{
  padding:15px 25px;
  background:#2563eb;
  color:white;
  border:0;
  border-radius:8px;
  font-size:17px;
  cursor:pointer;
}
#result{
  margin-top:30px;
}
.card{
  background:#f3f4f6;
  padding:20px;
  border-radius:12px;
}
.poster{
  width:180px;
  border-radius:10px;
}
.service{
  padding:12px;
  margin:8px 0;
  background:white;
  border-radius:8px;
}
@media(max-width:600px){
  .search{
    flex-direction:column;
  }
  button{
    width:100%;
  }
}
</style>
</head>

<body>

<header>
<h1>🎬 ドコデミレル？</h1>
<p>映画がどこで観られるか検索</p>
</header>

<div class="container">

<div class="box">

<h2>映画を検索</h2>

<div class="search">

<input
  id="movie"
  type="text"
  placeholder="例：トップガン"
>

<button onclick="searchMovie()">🔍 検索</button>

</div>

<div id="result"></div>

</div>

</div>

<script>

async function searchMovie(){

  const movie =
    document.getElementById("movie").value.trim();

  const result =
    document.getElementById("result");

  if(!movie){
    result.innerHTML =
      "<div class='card'>映画名を入力してください。</div>";
    return;
  }

  result.innerHTML =
    "<div class='card'>🔍 検索しています……</div>";

  try{

    const response =
      await fetch(
        "/api/search?query=" +
        encodeURIComponent(movie)
      );

    const data =
      await response.json();

    if(!response.ok){
      throw new Error(
        data.error || "検索できませんでした"
      );
    }

    let html =
      "<div class='card'>";

    html +=
      "<h2>🎬 " +
      escapeHtml(data.title) +
      "</h2>";

    if(data.poster_path){

      html +=
        "<img class='poster' src='" +
        "https://image.tmdb.org/t/p/w500" +
        data.poster_path +
        "'>";

    }

    if(data.release_date){

      html +=
        "<p>公開日：" +
        escapeHtml(data.release_date) +
        "</p>";

    }

    if(data.overview){

      html +=
        "<p>" +
        escapeHtml(data.overview) +
        "</p>";

    }

    html += "<h3>🟢 見放題</h3>";

    if(data.streaming && data.streaming.length){

  data.streaming.forEach(function(service){

    html +=
      "<a href='" +
      (data.link || "#") +
      "' target='_blank' " +
      "style='display:inline-block; " +
      "padding:12px 18px; " +
      "margin:6px 6px 6px 0; " +
      "background:#2563eb; " +
      "color:white; " +
      "text-decoration:none; " +
      "border-radius:8px; " +
      "font-weight:bold;'>" +
      "🟢 " +
      escapeHtml(service.provider_name) +
      " ▶ 見る</a>";

  });

}else{

  html +=
    "<div class='service'>" +
    "見放題の情報はありません" +
    "</div>";

}

    html += "<h3>🟡 レンタル</h3>";

    if(data.rental && data.rental.length){

  data.rental.forEach(function(service){

    html +=
      "<a href='" +
      (data.link || "#") +
      "' target='_blank' " +
      "style='display:inline-block; " +
      "padding:12px 18px; " +
      "margin:6px 6px 6px 0; " +
      "background:#f59e0b; " +
      "color:white; " +
      "text-decoration:none; " +
      "border-radius:8px; " +
      "font-weight:bold;'>" +
      "🟡 " +
      escapeHtml(service.provider_name) +
      " ▶ レンタル</a>";

  });

}

    html += "<h3>🔵 購入</h3>";

    if(data.purchase && data.purchase.length){

      data.purchase.forEach(function(service){

        html +=
          "<div class='service'>🔵 " +
          escapeHtml(service.provider_name) +
          "</div>";

      });

    }

    if(data.link){

      html +=
        "<p><a href='" +
        data.link +
        "' target='_blank'>" +
        "配信情報の詳細を見る →" +
        "</a></p>";

    }

    html += "</div>";
        // シリーズ作品を表示
    if (data.series && data.series.movies && data.series.movies.length) {

      html += "<h3>🎞️ シリーズ作品</h3>";

      html += "<div class='series'>";

      if (data.series.name) {
        html +=
          "<h4>" +
          escapeHtml(data.series.name) +
          "</h4>";
      }

           data.series.movies.forEach(function(movie) {

        html +=
          "<div class='service' " +
          "style='cursor:pointer;' " +
          "onclick=\"searchMovieById(" +
          movie.id +
          ")\">";

        if (movie.poster_path) {
          html +=
            "<img src='https://image.tmdb.org/t/p/w200" +
            movie.poster_path +
            "' style='width:70px; vertical-align:middle; margin-right:10px; border-radius:6px;'>";
        }

        html +=
          "<strong>" +
          escapeHtml(movie.title) +
          "</strong>";

        if (movie.release_date) {
          html +=
            " (" +
            escapeHtml(movie.release_date.substring(0, 4)) +
            ")";
        }

        html +=
          "<span style='margin-left:10px;'>▶ 詳細</span>";

        html += "</div>";

      });

      html += "</div>";
    }

    result.innerHTML = html;

  }catch(error){

    result.innerHTML =
      "<div class='card'>" +
      "❌ " +
      escapeHtml(error.message) +
      "</div>";

  }

}
async function searchMovieById(movieId){

  const result =
    document.getElementById("result");

  result.innerHTML =
    "<div class='card'>🔍 作品情報を読み込んでいます……</div>";

  try{

    const response =
      await fetch(
        "/api/search?id=" +
        encodeURIComponent(movieId)
      );

    const data =
      await response.json();

    if(!response.ok){
      throw new Error(
        data.error || "検索できませんでした"
      );
    }

    let html =
      "<div class='card'>";

    html +=
      "<h2>🎬 " +
      escapeHtml(data.title) +
      "</h2>";

    if(data.poster_path){

      html +=
        "<img class='poster' src='" +
        "https://image.tmdb.org/t/p/w500" +
        data.poster_path +
        "'>";

    }

    if(data.release_date){

      html +=
        "<p>公開日：" +
        escapeHtml(data.release_date) +
        "</p>";

    }

    if(data.overview){

      html +=
        "<p>" +
        escapeHtml(data.overview) +
        "</p>";

    }

    html += "<h3>🟢 見放題</h3>";

    if(data.streaming && data.streaming.length){

      data.streaming.forEach(function(service){

        html +=
          "<div class='service'>🟢 " +
          escapeHtml(service.provider_name) +
          "</div>";

      });

    }else{

      html +=
        "<div class='service'>" +
        "見放題の情報はありません" +
        "</div>";

    }

    html += "<h3>🟡 レンタル</h3>";

    if(data.rental && data.rental.length){

      data.rental.forEach(function(service){

        html +=
          "<div class='service'>🟡 " +
          escapeHtml(service.provider_name) +
          "</div>";

      });

    }

    html += "<h3>🔵 購入</h3>";

    if(data.purchase && data.purchase.length){

  data.purchase.forEach(function(service){

    html +=
      "<a href='" +
      (data.link || "#") +
      "' target='_blank' " +
      "style='display:inline-block; " +
      "padding:12px 18px; " +
      "margin:6px 6px 6px 0; " +
      "background:#2563eb; " +
      "color:white; " +
      "text-decoration:none; " +
      "border-radius:8px; " +
      "font-weight:bold;'>" +
      "🔵 " +
      escapeHtml(service.provider_name) +
      " ▶ 購入</a>";

  });

}
    if(data.link){

      html +=
        "<p><a href='" +
        data.link +
        "' target='_blank'>" +
        "配信情報の詳細を見る →" +
        "</a></p>";

    }

        html += "</div>";

    // シリーズ作品を表示
    if (
      data.series &&
      data.series.movies &&
      data.series.movies.length
    ) {

      html += "<h3>🎞️ シリーズ作品</h3>";

      html += "<div class='series'>";

      if (data.series.name) {
        html +=
          "<h4>" +
          escapeHtml(data.series.name) +
          "</h4>";
      }

      data.series.movies.forEach(function(movie) {

        html +=
          "<div class='service' " +
          "style='cursor:pointer;' " +
          "onclick=\"searchMovieById(" +
          movie.id +
          ")\">";

        if (movie.poster_path) {
          html +=
            "<img src='https://image.tmdb.org/t/p/w200" +
            movie.poster_path +
            "' " +
            "style='width:70px; vertical-align:middle; " +
            "margin-right:10px; border-radius:6px;'>";
        }

        html +=
          "<strong>" +
          escapeHtml(movie.title) +
          "</strong>";

        if (movie.release_date) {
          html +=
            " (" +
            escapeHtml(movie.release_date.substring(0, 4)) +
            ")";
        }

        html +=
          "<span style='margin-left:10px;'>▶ 詳細</span>";

        html += "</div>";

      });

      html += "</div>";
    }

    result.innerHTML = html;

  }catch(error){

    result.innerHTML =
      "<div class='card'>" +
      "❌ " +
      escapeHtml(error.message) +
      "</div>";

  }

}
function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
</html>
