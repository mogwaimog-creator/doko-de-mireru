<body>

<header>

<h1 id="siteTitle">ドコデミレル？</h1>

<p>映画がどの動画配信サービスで見られるか検索</p>

</header>


<div class="container">

  <div class="search-box">

    <input
      id="searchInput"
      type="text"
      placeholder="映画名を入力してください"
      autocomplete="off"
    >

    <button
      id="searchButton"
      type="button"
    >
      検索
    </button>

  </div>


  <div
    id="message"
    class="message"
  >
    映画名を入力して検索してください。
  </div>


  <div
    id="results"
    class="results"
  ></div>

</div>


<script>

/* ========================================================
   API
======================================================== */

const API_URL = "/api/search";


/* ========================================================
   DOM
======================================================== */

const searchInput =
  document.getElementById("searchInput");

const searchButton =
  document.getElementById("searchButton");

const resultsElement =
  document.getElementById("results");

const messageElement =
  document.getElementById("message");

const siteTitle =
  document.getElementById("siteTitle");


/* ========================================================
   現在の検索結果を保存
======================================================== */

let lastSearchResults = [];


/* ========================================================
   トップへ戻る
======================================================== */

siteTitle.addEventListener(
  "click",
  function(){

    showSearchPage();

  }
);


/* ========================================================
   検索
======================================================== */

searchButton.addEventListener(
  "click",
  searchMovies
);


searchInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      searchMovies();

    }

  }
);


/* ========================================================
   映画検索
======================================================== */

async function searchMovies(){

  const query =
    searchInput.value.trim();


  if(!query){

    messageElement.textContent =
      "映画名を入力してください。";

    resultsElement.innerHTML = "";

    return;

  }


  resultsElement.innerHTML = "";

  messageElement.innerHTML =
    '<div class="loading">検索しています…</div>';


  try{

    const response =
      await fetch(
        API_URL +
        "?query=" +
        encodeURIComponent(query)
      );


    if(!response.ok){

      throw new Error(
        "検索に失敗しました。"
      );

    }


    const data =
      await response.json();


    const movies =
      Array.isArray(data.results)
        ? data.results
        : [];


    lastSearchResults =
      movies;


    if(!movies.length){

      messageElement.textContent =
        "作品が見つかりませんでした。";

      return;

    }


    messageElement.textContent =
      movies.length +
      "作品が見つかりました。";


    for(
      let i = 0;
      i < movies.length;
      i++
    ){

      await displaySearchMovie(
        movies[i]
      );

    }

  }catch(error){

    console.error(error);

    messageElement.innerHTML =
      '<div class="error">' +
      '検索中にエラーが発生しました。' +
      '</div>';

  }

}


/* ========================================================
   検索結果カード
======================================================== */

async function displaySearchMovie(movie){

  const card =
    document.createElement("div");

  card.className =
    "movie-card";


  const movieMain =
    document.createElement("div");

  movieMain.className =
    "movie-main";


  /* ポスター */

  const poster =
    movie.poster_path
      ? "https://image.tmdb.org/t/p/w500" +
        movie.poster_path
      : "";


  if(poster){

    const img =
      document.createElement("img");

    img.className =
      "poster";

    img.src =
      poster;

    img.alt =
      movie.title || "";

    img.loading =
      "lazy";

    movieMain.appendChild(img);

  }else{

    const noPoster =
      createNoPoster();

    movieMain.appendChild(
      noPoster
    );

  }


  /* 映画情報 */

  const info =
    document.createElement("div");

  info.className =
    "movie-info";


  const title =
    document.createElement("h2");

  title.className =
    "movie-title";

  title.textContent =
    movie.title || "作品名不明";

  info.appendChild(title);


  if(movie.original_title){

    const original =
      document.createElement("div");

    original.className =
      "original-title";

    original.textContent =
      movie.original_title;

    info.appendChild(original);

  }


  if(movie.release_date){

    const release =
      document.createElement("div");

    release.className =
      "release";

    release.textContent =
      "公開日：" +
      movie.release_date;

    info.appendChild(release);

  }


  if(
    movie.vote_average !== undefined &&
    movie.vote_average !== null
  ){

    const rating =
      document.createElement("div");

    rating.className =
      "rating";

    rating.textContent =
      "★ " +
      Number(movie.vote_average)
        .toFixed(1);

    info.appendChild(rating);

  }


  if(movie.overview){

    const overview =
      document.createElement("div");

    overview.className =
      "overview";

    overview.textContent =
      movie.overview;

    info.appendChild(overview);

  }


  /* 詳細ボタン */

  const detailButton =
    document.createElement("button");

  detailButton.className =
    "detail-button";

  detailButton.type =
    "button";

  detailButton.textContent =
    "詳細を見る";


  detailButton.addEventListener(
    "click",
    function(){

      openMovieDetail(
        movie.id,
        true
      );

    }
  );


  info.appendChild(
    detailButton
  );


  movieMain.appendChild(
    info
  );


  card.appendChild(
    movieMain
  );


  resultsElement.appendChild(
    card
  );

}


/* ========================================================
   詳細画面
======================================================== */

async function openMovieDetail(
  movieId,
  saveHistory
){

  if(!movieId){

    return;

  }


  resultsElement.innerHTML = "";

  messageElement.innerHTML =
    '<div class="loading">作品情報を読み込んでいます…</div>';


  try{

    const response =
      await fetch(
        API_URL +
        "?id=" +
        encodeURIComponent(movieId)
      );


    if(!response.ok){

      throw new Error(
        "作品情報の取得に失敗しました。"
      );

    }


    const detail =
      await response.json();


    if(saveHistory){

      history.pushState(
        {
          page:"detail",
          movieId:movieId
        },
        "",
        "#movie-" +
        movieId
      );

    }


    messageElement.textContent =
      "";


    renderDetailPage(
      detail
    );


  }catch(error){

    console.error(error);

    messageElement.innerHTML =
      '<div class="error">' +
      '作品情報を取得できませんでした。' +
      '</div>';

  }

}


/* ========================================================
   詳細画面表示
======================================================== */

function renderDetailPage(detail){

  resultsElement.innerHTML = "";


  const page =
    document.createElement("div");

  page.className =
    "detail-page";


  /* 戻る */

  const back =
    document.createElement("button");

  back.className =
    "back-button";

  back.type =
    "button";

  back.textContent =
    "← 検索結果に戻る";


  back.addEventListener(
    "click",
    function(){

      showSearchPage();

    }
  );


  page.appendChild(
    back
  );


  /* メイン */

  const main =
    document.createElement("div");

  main.className =
    "detail-main";


  /* ポスター */

  const poster =
    detail.poster_path
      ? "https://image.tmdb.org/t/p/w500" +
        detail.poster_path
      : "";


  if(poster){

    const img =
      document.createElement("img");

    img.className =
      "detail-poster";

    img.src =
      poster;

    img.alt =
      detail.title || "";

    main.appendChild(img);

  }else{

    const noPoster =
      createNoPoster();

    noPoster.className =
      "detail-poster";

    noPoster.style.display =
      "flex";

    noPoster.style.alignItems =
      "center";

    noPoster.style.justifyContent =
      "center";

    main.appendChild(
      noPoster
    );

  }


  /* 情報 */

  const info =
    document.createElement("div");

  info.className =
    "detail-info";


  const title =
    document.createElement("h2");

  title.className =
    "detail-page-title";

  title.textContent =
    detail.title ||
    "作品名不明";

  info.appendChild(title);


  if(detail.original_title){

    const original =
      document.createElement("div");

    original.className =
      "detail-page-original";

    original.textContent =
      detail.original_title;

    info.appendChild(original);

  }


  if(detail.release_date){

    const release =
      document.createElement("div");

    release.className =
      "release";

    release.textContent =
      "公開日：" +
      detail.release_date;

    info.appendChild(release);

  }


  if(
    detail.vote_average !== undefined &&
    detail.vote_average !== null
  ){

    const rating =
      document.createElement("div");

    rating.className =
      "rating";

    rating.textContent =
      "★ " +
      Number(detail.vote_average)
        .toFixed(1);

    info.appendChild(rating);

  }


  if(detail.overview){

    const overview =
      document.createElement("div");

    overview.className =
      "overview";

    overview.textContent =
      detail.overview;

    info.appendChild(overview);

  }


  main.appendChild(
    info
  );

  page.appendChild(
    main
  );


  /* ======================================================
     配信サービス
  ====================================================== */

  const streamingSection =
    document.createElement("div");

  streamingSection.className =
    "detail-page-section";


  const streamingTitle =
    document.createElement("h3");

  streamingTitle.textContent =
    "配信サービス";


  streamingSection.appendChild(
    streamingTitle
  );


  const providers =
    document.createElement("div");

  providers.className =
    "providers";


  addProviders(
    providers,
    detail.streaming
  );


  addProviders(
    providers,
    detail.rental
  );


  addProviders(
    providers,
    detail.purchase
  );


  if(providers.children.length){

    streamingSection.appendChild(
      providers
    );

  }else{

    const none =
      document.createElement("div");

    none.className =
      "empty";

    none.textContent =
      "日本で利用できる配信情報が見つかりませんでした。";

    streamingSection.appendChild(
      none
    );

  }


  /* Netflix */

  if(
    detail.netflix ||
    detail.netflix_url ||
    detail.netflix_title_id ||
    detail.netflix_id
  ){

    createNetflixButton(
      streamingSection,
      detail
    );

  }


  /* 詳細配信情報 */

  if(detail.link){

    const more =
      document.createElement("div");

    more.className =
      "more-info";


    const link =
      document.createElement("a");

    link.href =
      detail.link;

    link.target =
      "_blank";

    link.rel =
      "noopener noreferrer";

    link.textContent =
      "配信情報を詳しく見る";


    more.appendChild(
      link
    );

    streamingSection.appendChild(
      more
    );

  }


  page.appendChild(
    streamingSection
  );


  /* ======================================================
     監督
  ====================================================== */

  if(detail.director){

    const directorSection =
      document.createElement("div");

    directorSection.className =
      "detail-page-section";


    const heading =
      document.createElement("h3");

    heading.textContent =
      "監督";


    directorSection.appendChild(
      heading
    );


    const person =
      document.createElement("div");

    person.className =
      "person";


    person.textContent =
      detail.director.name ||
      "";


    directorSection.appendChild(
      person
    );


    page.appendChild(
      directorSection
    );

  }


  /* ======================================================
     出演者
  ====================================================== */

  if(
    Array.isArray(detail.cast) &&
    detail.cast.length
  ){

    const castSection =
      document.createElement("div");

    castSection.className =
      "detail-page-section";


    const heading =
      document.createElement("h3");

    heading.textContent =
      "出演者";


    castSection.appendChild(
      heading
    );


    const people =
      document.createElement("div");

    people.className =
      "person-list";


    detail.cast.forEach(
      function(personData){

        const person =
          document.createElement("div");

        person.className =
          "person";

        person.textContent =
          personData.name || "";

        people.appendChild(
          person
        );

      }
    );


    castSection.appendChild(
      people
    );


    page.appendChild(
      castSection
    );

  }


  /* ======================================================
     シリーズ作品
  ====================================================== */

  if(
    detail.series &&
    Array.isArray(
      detail.series.movies
    ) &&
    detail.series.movies.length
  ){

    const seriesSection =
      document.createElement("div");

    seriesSection.className =
      "detail-page-section";


    const heading =
      document.createElement("h3");

    heading.textContent =
      detail.series.name ||
      "シリーズ作品";


    seriesSection.appendChild(

    );

    description.className =

    description.style.marginBottom =

      "シリーズ作品を選択すると詳細画面を開けます。";


    seriesSection.appendChild(
      description
    );


    const seriesList =
      document.createElement("div");

    seriesList.className =
      "series-list";


    detail.series.movies
      .sort(
        function(a,b){

          return String(
            a.release_date || ""
          ).localeCompare(
            String(
              b.release_date || ""
            )
          );

        }
      )
      .forEach(
        function(seriesMovie){

          const item =
            document.createElement("div");

          item.className =
            "series-item";


          const image =
            document.createElement("img");

          image.className =
            "series-poster";


          if(seriesMovie.poster_path){

            image.src =
              "https://image.tmdb.org/t/p/w500" +
              seriesMovie.poster_path;

          }else{

            image.style.display =
              "none";

          }


          image.alt =
            seriesMovie.title || "";


          image.loading =
            "lazy";


          item.appendChild(
            image
          );


          const title =
            document.createElement("div");

          title.className =
            "series-title";

          title.textContent =
            seriesMovie.title ||
            "作品名不明";


          item.appendChild(

          );


          if(seriesMovie.release_date){

            const date =
              document.createElement("div");

            date.className =
              "series-date";

            date.textContent =
              seriesMovie.release_date;


            item.appendChild(
              date
            );

          }

            "click",
            function(){

              openMovieDetail(
                seriesMovie.id,
                true
              );

              window.scrollTo({
                top:0,
                behavior:"smooth"
              });

  });

}

function addProviders(
  container,
  providerList
){

  if(
    !Array.isArray(providerList)
  ){

    return;

  }


  for(
    let i = 0;
    i < providerList.length;
    i++
  ){

    const provider =
      providerList[i];


    if(!provider){

      continue;

    }


    const item =
      document.createElement("div");

    item.className =
      "provider";


    if(provider.logo_path){

      const img =
        document.createElement("img");

      img.src =
        "https://image.tmdb.org/t/p/w92" +
        provider.logo_path;

      img.alt =
        provider.provider_name || "";

      img.loading =
        "lazy";

      item.appendChild(
        img
      );

    }


    const name =
      document.createElement("span");

    name.className =
      "provider-name";

    name.textContent =
      provider.provider_name ||
      "配信サービス";


    item.appendChild(
      name
    );


    container.appendChild(
      item
    );

  }

}

function createNetflixButton(

){

    document.createElement("div");

  area.className =
    "netflix-area";


  let netflixUrl =
    null;


  let hasTitleId =
    false;


  /* ======================================================
     ① netflix.title_id
  ====================================================== */

  if(
    detail.netflix &&
    detail.netflix.title_id &&
    /^\d+$/.test(

        detail.netflix.title_id
      )
    )
  ){

    netflixUrl =
      "https://www.netflix.com/title/" +
      String(
        detail.netflix.title_id
      );

    hasTitleId =
      true;

  }


  /* ======================================================
     ② netflix_title_id
  ====================================================== */

  if(
    !netflixUrl &&
    detail.netflix_title_id &&
    /^\d+$/.test(
      String(
        detail.netflix_title_id
      )
    )
  ){

    netflixUrl =
      "https://www.netflix.com/title/" +
      String(
        detail.netflix_title_id
      );

    hasTitleId =
      true;

  }


  /* ======================================================
     ③ netflix_id
  ====================================================== */

  if(
    !netflixUrl &&
    detail.netflix_id &&
    /^\d+$/.test(
      String(
        detail.netflix_id
      )
    )
  ){

    netflixUrl =
      "https://www.netflix.com/title/" +
      String(
        detail.netflix_id
      );

    hasTitleId =
      true;

  }


  /* ======================================================
     ④ netflix_url
  ====================================================== */

  if(
    !netflixUrl &&
    detail.netflix_url
  ){

    const id =
      extractNetflixId(
        detail.netflix_url
      );


    if(id){

      netflixUrl =
        "https://www.netflix.com/title/" +
        id;

      hasTitleId =
        true;

    }

  }


  /* ======================================================
     ⑤ netflix.url
  ====================================================== */

  if(
    !netflixUrl &&
    detail.netflix &&
    detail.netflix.url
  ){

    const id =
      extractNetflixId(
        detail.netflix.url
      );


    if(id){

      netflixUrl =
        "https://www.netflix.com/title/" +
        id;

      hasTitleId =
        true;

    }

  }


  /* ======================================================
     ⑥ IDがない場合はNetflix検索
  ====================================================== */

  if(!netflixUrl){

    const title =
      detail.title ||
      detail.original_title ||

    netflixUrl =
      "https://www.netflix.com/search?q=" +
      encodeURIComponent(

      );

  }


  /* ======================================================
     ボタン
  ====================================================== */

  const button =

  button.className =
    "netflix-button";

  button.href =

  button.rel =

  if(hasTitleId){

    button.textContent =

    button.textContent =
      "Netflixで作品を検索";

  }


  area.appendChild(
    button
  );


  /* ======================================================
     説明
  ====================================================== */

  const note =
    document.createElement("div");

  note.className =
    "netflix-note";


  if(hasTitleId){

    note.textContent =
      "Netflixの作品ページを直接開きます。";

  }else{

    note.textContent =
      "Netflix作品IDを取得できないため、作品名で検索します。";

  }


  area.appendChild(
    note
  );


  container.appendChild(
    area
  );

}


/* ========================================================
   Netflix URLから作品ID取得
======================================================== */

function extractNetflixId(
  url
){

  if(
    typeof url !== "string" ||
    !url
  ){

    return null;

  }


  const patterns = [

    /netflix\.com\/(?:jp\/)?title\/(\d+)/i,

    /netflix\.com\/(?:[^/]+\/)?title\/(\d+)/i,

    /netflix\.com\/(?:jp\/)?watch\/(\d+)/i,

    /netflix\.com\/(?:[^/]+\/)?watch\/(\d+)/i

  ];


  for(
    let i = 0;
    i < patterns.length;
    i++
  ){

    const match =
      url.match(
        patterns[i]
      );


    if(match){

      return match[1];

    }

  }


  return null;

}
