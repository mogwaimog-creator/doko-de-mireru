<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ドコデミレル？｜映画配信検索</title>

<style>

/* =========================
   全体
========================= */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    Arial,
    "Noto Sans JP",
    sans-serif;
  background:#f4f6fa;
  color:#1f2937;
}

header{
  background:#111827;
  color:white;
  text-align:center;
  padding:30px 15px;
}

header h1{
  margin:0;
  font-size:32px;
}

header p{
  margin:8px 0 0;
  color:#d1d5db;
}


/* =========================
   メイン
========================= */

.container{
  max-width:900px;
  margin:35px auto;
  padding:0 20px;
}

.box{
  background:white;
  padding:30px;
  border-radius:18px;
  box-shadow:
    0 5px 25px rgba(0,0,0,.08);
}


/* =========================
   検索
========================= */

.search-title{
  text-align:center;
  margin-top:0;
}

.search{
  display:flex;
  gap:10px;
  margin-top:20px;
}

input{
  flex:1;
  padding:16px;
  font-size:17px;
  border:2px solid #e5e7eb;
  border-radius:10px;
  outline:none;
}

input:focus{
  border-color:#2563eb;
}

.search-button{
  padding:15px 25px;
  background:#2563eb;
  color:white;
  border:0;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.search-button:hover{
  background:#1d4ed8;
}


/* =========================
   結果
========================= */

#result{
  margin-top:30px;
}

.card{
  background:#fff;
  padding:25px;
  border-radius:16px;
  border:1px solid #e5e7eb;
  box-shadow:
    0 4px 15px rgba(0,0,0,.05);
}


/* =========================
   映画情報
========================= */

.movie-info{
  display:flex;
  gap:25px;
  align-items:flex-start;
}

.poster{
  width:210px;
  border-radius:12px;
  box-shadow:
    0 5px 15px rgba(0,0,0,.15);
}

.movie-text{
  flex:1;
}

.movie-title{
  margin-top:0;
  font-size:28px;
  margin-bottom:10px;
}

.release{
  color:#6b7280;
  font-size:15px;
  margin-bottom:15px;
}

.overview{
  line-height:1.8;
}


/* =========================
   セクション
========================= */

.section-title{
  margin-top:30px;
  padding-bottom:10px;
  border-bottom:2px solid #e5e7eb;
  font-size:20px;
}


/* =========================
   配信サービス
========================= */

.service-grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(230px,1fr));
  gap:12px;
}

.service-card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:15px;
  transition:.2s;
}

.service-card:hover{
  transform:translateY(-2px);
  box-shadow:
    0 5px 15px rgba(0,0,0,.08);
}

.service-name{
  font-size:17px;
  font-weight:bold;
  margin-bottom:10px;
}

.watch-button{
  display:block;
  text-align:center;
  padding:10px;
  border-radius:8px;
  color:white;
  text-decoration:none;
  font-weight:bold;
}


/* =========================
   色
========================= */

.streaming .watch-button{
  background:#16a34a;
}

.rental .watch-button{
  background:#f59e0b;
}

.purchase .watch-button{
  background:#2563eb;
}


/* =========================
   情報なし
========================= */

.no-info{
  background:#f9fafb;
  border:1px dashed #d1d5db;
  padding:15px;
  border-radius:10px;
  color:#6b7280;
}


/* =========================
   シリーズ
========================= */

.series{
  margin-top:10px;
}

.series-name{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.series-item{
  display:flex;
  align-items:center;
  gap:15px;
  background:white;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
  cursor:pointer;
  transition:.2s;
}

.series-item:hover{
  background:#eff6ff;
  border-color:#93c5fd;
  transform:translateX(3px);
}

.series-number{
  font-size:20px;
  font-weight:bold;
  color:#2563eb;
  width:30px;
  text-align:center;
}

.series-poster{
  width:55px;
  height:80px;
  object-fit:cover;
  border-radius:7px;
}

.series-info{
  flex:1;
}

.series-title{
  font-weight:bold;
  font-size:16px;
}

.series-year{
  color:#6b7280;
  font-size:14px;
  margin-top:5px;
}

.detail-button{
  color:#2563eb;
  font-weight:bold;
  white-space:nowrap;
}


/* =========================
   TMDB
========================= */

.tmdb-link{
  margin-top:20px;
}

.tmdb-link a{
  color:#2563eb;
  text-decoration:none;
}

.tmdb-link a:hover{
  text-decoration:underline;
}


/* =========================
   スマホ
========================= */

@media(max-width:650px){

  header h1{
    font-size:26px;
  }

  .container{
    margin:20px auto;
    padding:0 12px;
  }

  .box{
    padding:20px;
  }

  .search{
    flex-direction:column;
  }

  .search-button{
    width:100%;
  }

  .movie-info{
    flex-direction:column;
    align-items:center;
  }

  .poster{
    width:170px;
  }

  .movie-text{
    width:100%;
  }

  .movie-title{
    font-size:24px;
    text-align:center;
  }

  .series-item{
    gap:8px;
  }

  .series-poster{
    width:45px;
    height:65px;
  }

  .detail-button{
    font-size:13px;
  }

}

</style>

</head>


<body>


<header>

<h1>🎬 ドコデミレル？</h1>

<p>映画がどこで観られるか検索</p>

</header>


<div class="container">

<div class="box">

<h2 class="search-title">
映画を検索
</h2>

<div class="search">

<input
  id="movie"
  type="text"
  placeholder="例：トップガン"
>

<button
  id="searchButton"
  class="search-button">
🔍 検索
</button>

</div>

<div id="result"></div>

</div>

</div>


<script>


/* =========================
   検索ボタン
========================= */

document
  .getElementById("searchButton")
  .addEventListener(
    "click",
    searchMovie
  );


/* =========================
   Enter検索
========================= */

document
  .getElementById("movie")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){
        searchMovie();
      }

    }
  );


/* =========================
   映画検索
========================= */

async function searchMovie(){

  const movie =
    document
      .getElementById("movie")
      .value
      .trim();

  const result =
    document.getElementById("result");


  if(!movie){

    result.innerHTML =
      "<div class='card'>" +
      "映画名を入力してください。" +
      "</div>";

    return;

  }


  result.innerHTML =
    "<div class='card'>" +
    "🔍 検索しています……" +
    "</div>";


  try{

    const response =
      await fetch(
        "/api/search?query=" +
        encodeURIComponent(movie)
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "検索できませんでした"
      );

    }


    displayMovie(data);

  }

  catch(error){

    result.innerHTML =
      "<div class='card'>" +
      "❌ " +
      escapeHtml(
        error.message
      ) +
      "</div>";

  }

}


/* =========================
   映画詳細
========================= */

function displayMovie(data){

  const result =
    document.getElementById("result");


  let html =
    "<div class='card'>";


  /* 映画情報 */

  html +=
    "<div class='movie-info'>";


  if(data.poster_path){

    html +=
      "<img " +
      "class='poster' " +
      "src='https://image.tmdb.org/t/p/w500" +
      data.poster_path +
      "'>";

  }


  html +=
    "<div class='movie-text'>";


  html +=
    "<h2 class='movie-title'>" +
    "🎬 " +
    escapeHtml(data.title) +
    "</h2>";


  if(data.release_date){

    html +=
      "<div class='release'>" +
      "📅 " +
      escapeHtml(
        data.release_date
      ) +
      "</div>";

  }


  if(data.overview){

    html +=
      "<div class='overview'>" +
      escapeHtml(data.overview) +
      "</div>";

  }


  html +=
    "</div>";

  html +=
    "</div>";


  /* =========================
     見放題
  ========================= */

  html +=
    "<h3 class='section-title'>" +
    "🟢 見放題" +
    "</h3>";


  if(
    data.streaming &&
    data.streaming.length
  ){

    html +=
      "<div class='service-grid'>";


    data.streaming.forEach(
      function(service){

        html +=
          createServiceCard(
            service,
            data.title,
            "streaming"
          );

      }
    );


    html +=
      "</div>";

  }

  else{

    html +=
      "<div class='no-info'>" +
      "見放題の情報はありません" +
      "</div>";

  }


  /* =========================
     レンタル
  ========================= */

  html +=
    "<h3 class='section-title'>" +
    "🟡 レンタル" +
    "</h3>";


  if(
    data.rental &&
    data.rental.length
  ){

    html +=
      "<div class='service-grid'>";


    data.rental.forEach(
      function(service){

        html +=
          createServiceCard(
            service,
            data.title,
            "rental"
          );

      }
    );


    html +=
      "</div>";

  }

  else{

    html +=
      "<div class='no-info'>" +
      "レンタル情報はありません" +
      "</div>";

  }


  /* =========================
     購入
  ========================= */

  html +=
    "<h3 class='section-title'>" +
    "🔵 購入" +
    "</h3>";


  if(
    data.purchase &&
    data.purchase.length
  ){

    html +=
      "<div class='service-grid'>";


    data.purchase.forEach(
      function(service){

        html +=
          createServiceCard(
            service,
            data.title,
            "purchase"
          );

      }
    );


    html +=
      "</div>";

  }

  else{

    html +=
      "<div class='no-info'>" +
      "購入情報はありません" +
      "</div>";

  }


  /* =========================
     TMDB
  ========================= */

  if(data.link){

    html +=
      "<div class='tmdb-link'>" +
      "<a href='" +
      data.link +
      "' target='_blank'>" +
      "配信情報の詳細を見る →" +
      "</a>" +
      "</div>";

  }


  html +=
    "</div>";


  /* =========================
     シリーズ
  ========================= */

  if(
    data.series &&
    data.series.movies &&
    data.series.movies.length
  ){

    html +=
      "<div class='card' " +
      "style='margin-top:20px;'>";


    html +=
      "<h3 class='section-title'>" +
      "🎞️ シリーズ作品" +
      "</h3>";


    if(data.series.name){

      html +=
        "<div class='series-name'>" +
        escapeHtml(
          data.series.name
        ) +
        "</div>";

    }


    data.series.movies.forEach(
      function(movie,index){

        html +=
          "<div " +
          "class='series-item' " +
          "data-id='" +
          movie.id +
          "'>";


        html +=
          "<div class='series-number'>" +
          (index + 1) +
          "</div>";


        if(movie.poster_path){

          html +=
            "<img " +
            "class='series-poster' " +
            "src='https://image.tmdb.org/t/p/w200" +
            movie.poster_path +
            "'>";

        }


        html +=
          "<div class='series-info'>";


        html +=
          "<div class='series-title'>" +
          escapeHtml(
            movie.title
          ) +
          "</div>";


        if(movie.release_date){

          html +=
            "<div class='series-year'>" +
            escapeHtml(
              movie.release_date
                .substring(0,4)
            ) +
            "年" +
            "</div>";

        }


        html +=
          "</div>";


        html +=
          "<div class='detail-button'>" +
          "▶ 詳細" +
          "</div>";


        html +=
          "</div>";

      }
    );


    html +=
      "</div>";

  }


  result.innerHTML =
    html;


  /* =========================
     シリーズクリック
  ========================= */

  document
    .querySelectorAll(
      ".series-item"
    )
    .forEach(
      function(item){

        item.addEventListener(
          "click",
          function(){

            const id =
              this.dataset.id;

            searchMovieById(id);

          }
        );

      }
    );

}


/* =========================
   シリーズ作品検索
========================= */

async function searchMovieById(id){

  const result =
    document.getElementById("result");


  result.innerHTML =
    "<div class='card'>" +
    "🔍 作品情報を読み込んでいます……" +
    "</div>";


  try{

    const response =
      await fetch(
        "/api/search?id=" +
        encodeURIComponent(id)
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "作品が見つかりませんでした"
      );

    }


    displayMovie(data);

  }

  catch(error){

    result.innerHTML =
      "<div class='card'>" +
      "❌ " +
      escapeHtml(
        error.message
      ) +
      "</div>";

  }

}


/* =========================
   配信サービスURL
========================= */

function getServiceUrl(
  name,
  title
){

  const service =
    name.toLowerCase();


  if(
    service.includes("netflix")
  ){

    return (
      "https://www.netflix.com/jp/search?q=" +
      encodeURIComponent(title)
    );

  }


  if(
    service.includes("prime") ||
    service.includes("amazon")
  ){

    return (
      "https://www.amazon.co.jp/s?k=" +
      encodeURIComponent(title)
    );

  }


  if(
    service.includes("u-next")
  ){

    return (
      "https://video.unext.jp/search?query=" +
      encodeURIComponent(title)
    );

  }


  if(
    service.includes("hulu")
  ){

    return (
      "https://www.hulu.jp/search?q=" +
      encodeURIComponent(title)
    );

  }


  if(
    service.includes("disney")
  ){

    return (
      "https://www.disneyplus.com/ja-jp/search/" +
      encodeURIComponent(title)
    );

  }


  return "#";

}


/* =========================
   配信サービスカード
========================= */

function createServiceCard(
  service,
  title,
  type
){

  let label =
    "見る";


  if(type === "rental"){
    label = "レンタル";
  }


  if(type === "purchase"){
    label = "購入";
  }


  const url =
    getServiceUrl(
      service.provider_name,
      title
    );


  return (
    "<div class='service-card " +
    type +
    "'>" +

    "<div class='service-name'>" +
    escapeHtml(
      service.provider_name
    ) +
    "</div>" +

    "<a " +
    "class='watch-button' " +
    "href='" +
    url +
    "' " +
    "target='_blank'>" +

    "▶ " +
    label +

    "</a>" +

    "</div>"
  );

}


/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(text){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text || "";

  return div.innerHTML;

}

</script>

</body>
</html>
