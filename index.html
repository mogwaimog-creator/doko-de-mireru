<body>


<header>

<h1 onclick="goHome()">
🎬 ドコデミレル？
</h1>

<p>
映画がどこで観られるか検索
</p>

</header>


<div class="container">

<div class="box">

<h2>🎬 映画を検索</h2>


<div class="search">

<input
  id="movie"
  type="text"
  placeholder="例：トップガン"
  autocomplete="off"
>

<button
  class="search-button"
  id="searchButton"
>
🔍 検索
</button>

</div>


<div id="result"></div>

</div>

</div>


<script>


/* =========================================================
   グローバル
========================================================= */

let lastSearchQuery = "";

let isSearching = false;


/* =========================================================
   ページ読み込み
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    const input =
      document.getElementById("movie");

    const button =
      document.getElementById("searchButton");


    input.addEventListener(
      "keydown",
      function(event){

        if(event.key === "Enter"){

          event.preventDefault();

          searchMovie();

        }

      }
    );


    button.addEventListener(
      "click",
      function(){

        searchMovie();

      }
    );


    const params =
      new URLSearchParams(
        window.location.search
      );


    const movieId =
      params.get("id");


    if(movieId){

      searchMovieById(
        movieId,
        false
      );

    }

  }
);


/* =========================================================
   ホーム
========================================================= */

function goHome(){

  window.location.href =
    window.location.pathname;

}


/* =========================================================
   映画検索
========================================================= */

async function searchMovie(){

  if(isSearching){

    return;

  }


  const movieInput =
    document.getElementById("movie");

  const result =
    document.getElementById("result");

  const button =
    document.getElementById("searchButton");


  const movie =
    movieInput.value.trim();


  if(!movie){

    result.innerHTML =
      "<div class='error'>" +
      "映画名を入力してください。" +
      "</div>";

    return;

  }


  lastSearchQuery =
    movie;


  window.history.pushState(
    {
      page:"search"
    },
    "",
    window.location.pathname
  );


  isSearching = true;

  button.disabled = true;


  result.innerHTML =
    "<div class='loading'>" +
    "🔍 映画を検索しています……" +
    "</div>";


  try{

    const response =
      await fetch(
        "/api/search?query=" +
        encodeURIComponent(movie),
        {
          method:"GET",
          headers:{
            "Accept":
              "application/json"
          },
          cache:"no-store"
        }
      );


    const text =
      await response.text();


    let data = null;


    try{

      data =
        JSON.parse(text);

    }catch(parseError){

      console.error(
        "JSON解析エラー:",
        parseError,
        text
      );

      throw new Error(
        "サーバーから正しいデータを受け取れませんでした。"
      );

    }


    if(!response.ok){

      throw new Error(
        getApiErrorMessage(
          data,
          response.status
        )
      );

    }


    if(
      !data ||
      !Array.isArray(data.results)
    ){

      throw new Error(
        "検索結果の形式が正しくありません。"
      );

    }


    if(data.results.length === 0){

      result.innerHTML =
        "<div class='error'>" +
        "「" +
        escapeHtml(movie) +
        "」に一致する映画が見つかりませんでした。" +
        "</div>";

      return;

    }


    let results =
      data.results.filter(
        function(item){

          return (
            item &&
            item.id &&
            item.title
          );

        }
      );


    /* =====================================================
       古い映画 → 新しい映画
    ===================================================== */

    results.sort(
      function(a,b){

        const dateA =
          isValidDate(
            a.release_date
          )
            ? a.release_date
            : "9999-99-99";


        const dateB =
          isValidDate(
            b.release_date
          )
            ? b.release_date
            : "9999-99-99";


        return dateA.localeCompare(
          dateB
        );

      }
    );


    let html =
      "<h2 class='result-title'>" +
      "🔎 「" +
      escapeHtml(movie) +
      "」の検索結果 " +
      results.length +
      "件" +
      "</h2>";


    results.forEach(
      function(item){

        html +=
          createMovieCard(item);

      }
    );


    result.innerHTML =
      html;


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });


  }catch(error){

    console.error(
      "検索エラー:",
      error
    );


    result.innerHTML =
      "<div class='error'>" +
      "❌ " +
      escapeHtml(
        getSafeErrorMessage(error)
      ) +
      "</div>";

  }finally{

    isSearching = false;

    button.disabled = false;

  }

}


/* =========================================================
   検索結果カード
========================================================= */

function createMovieCard(movie){

  let html =
    "<div class='movie-card'>";


  if(movie.poster_path){

    html +=
      "<img " +
      "class='movie-poster' " +
      "src='https://image.tmdb.org/t/p/w500" +
      escapeAttribute(
        movie.poster_path
      ) +
      "' " +
      "alt='" +
      escapeAttribute(
        movie.title || ""
      ) +
      "' " +
      "loading='lazy'>";

  }else{

    html +=
      "<div class='no-poster'>" +
      "🎬<br>画像なし" +
      "</div>";

  }


  html +=
    "<div class='movie-info'>";


  html +=
    "<h3 class='movie-title'>" +
    escapeHtml(
      movie.title ||
      "タイトル不明"
    ) +
    "</h3>";


  if(movie.original_title){

    html +=
      "<div class='movie-original'>" +
      escapeHtml(
        movie.original_title
      ) +
      "</div>";

  }


  if(movie.release_date){

    html +=
      "<span class='movie-year'>" +
      "📅 " +
      escapeHtml(
        String(
          movie.release_date
        ).substring(0,4)
      ) +
      "年" +
      "</span>";

  }


  if(
    movie.vote_average !== undefined &&
    movie.vote_average !== null &&
    Number(movie.vote_average) > 0
  ){

    html +=
      "<span class='movie-rating'>" +
      "⭐ " +
      Number(
        movie.vote_average
      ).toFixed(1) +
      " / 10" +
      "</span>";

  }


  if(movie.overview){

    html +=
      "<p class='movie-overview'>" +
      escapeHtml(
        movie.overview
      ) +
      "</p>";

  }


  html +=
    "<a " +
    "class='detail-button' " +
    "href='?id=" +
    encodeURIComponent(
      movie.id
    ) +
    "'>" +
    "▶ 詳細を見る" +
    "</a>";


  html +=
    "</div>";


  html +=
    "</div>";


  return html;

}


/* =========================================================
   詳細ページ
========================================================= */

async function searchMovieById(
  movieId,
  updateUrl = true
){

  const result =
    document.getElementById("result");


  if(!movieId){

    result.innerHTML =
      "<div class='error'>" +
      "作品IDがありません。" +
      "</div>";

    return;

  }


  if(updateUrl){

    window.history.pushState(
      {
        page:"detail",
        id:String(movieId)
      },
      "",
      window.location.pathname +
      "?id=" +
      encodeURIComponent(movieId)
    );

  }


  result.innerHTML =
    "<div class='loading'>" +
    "🔍 作品情報を読み込んでいます……" +
    "</div>";


  try{

    const response =
      await fetch(
        "/api/search?id=" +
        encodeURIComponent(movieId),
        {
          method:"GET",
          headers:{
            "Accept":
              "application/json"
          },
          cache:"no-store"
        }
      );


    const text =
      await response.text();


    let data = null;


    try{

      data =
        JSON.parse(text);

    }catch(parseError){

      console.error(
        "詳細JSON解析エラー:",
        parseError,
        text
      );

      throw new Error(
        "サーバーから正しい作品情報を受け取れませんでした。"
      );

    }


    if(!response.ok){

      throw new Error(
        getApiErrorMessage(
          data,
          response.status
        )
      );

    }


    if(!data){

      throw new Error(
        "作品情報がありません。"
      );

    }


    renderDetailPage(data);


  }catch(error){

    console.error(
      "詳細取得エラー:",
      error
    );


    result.innerHTML =
      "<div class='error'>" +
      "❌ " +
      escapeHtml(
        getSafeErrorMessage(error)
      ) +
      "</div>";

  }

}


/* =========================================================
   詳細ページ表示
========================================================= */

function renderDetailPage(data){

  const result =
    document.getElementById("result");


  let html =
    "<div class='detail-card'>";


  html +=
    "<div " +
    "class='back-button' " +
    "onclick='backToSearchResults()'>" +
    "← 検索結果に戻る" +
    "</div>";


  html +=
    "<div class='detail-header'>";


  if(data.poster_path){

    html +=
      "<img " +
      "class='detail-poster' " +
      "src='https://image.tmdb.org/t/p/w500" +
      escapeAttribute(
        data.poster_path
      ) +
      "' " +
      "alt='" +
      escapeAttribute(
        data.title || ""
      ) +
      "'>";

  }


  html +=
    "<div class='detail-info'>";


  html +=
    "<h2 class='detail-title'>" +
    "🎬 " +
    escapeHtml(
      data.title ||
      "タイトル不明"
    ) +
    "</h2>";


  if(data.original_title){

    html +=
      "<div class='detail-original'>" +
      escapeHtml(
        data.original_title
      ) +
      "</div>";

  }


  html +=
    "<div class='detail-meta'>";


  if(data.release_date){

    html +=
      "<span class='meta-item'>" +
      "📅 " +
      escapeHtml(
        data.release_date
      ) +
      "</span>";

  }


  if(
    Array.isArray(data.genres) &&
    data.genres.length
  ){

    html +=
      "<span class='meta-item'>" +
      "🎭 " +
      data.genres
        .map(
          function(genre){

            return escapeHtml(
              genre.name || ""
            );

          }
        )
        .join(" / ") +
      "</span>";

  }


  html +=
    "</div>";


  if(
    data.vote_average !== undefined &&
    data.vote_average !== null &&
    Number(data.vote_average) > 0
  ){

    html +=
      "<div class='rating-box'>" +
      "⭐ TMDB評価 " +
      Number(
        data.vote_average
      ).toFixed(1) +
      " / 10" +
      "</div>";

  }


  if(data.director){

    html +=
      "<p>" +
      "🎬 監督：<strong>" +
      escapeHtml(
        data.director.name ||
        ""
      ) +
      "</strong>" +
      "</p>";

  }


  if(
    Array.isArray(data.cast) &&
    data.cast.length
  ){

    html +=
      "<p>" +
      "👤 出演：" +
      data.cast
        .slice(0,8)
        .map(
          function(person){

            return escapeHtml(
              person.name ||
              ""
            );

          }
        )
        .join("、") +
      "</p>";

  }


  html +=
    createLanguageBox(
      data.language
    );


  html +=
    "</div>";


  html +=
    "</div>";

function getLanguageName(code){

  const languages = {

    ja:"日本語",
    en:"英語",
    fr:"フランス語",
    de:"ドイツ語",
    es:"スペイン語",
    it:"イタリア語",
    ko:"韓国語",
    zh:"中国語",
    hi:"ヒンディー語",
    pt:"ポルトガル語",
    ru:"ロシア語"

  };


  return (
    languages[code] ||
    code
  );

}


function formatLanguageValue(value){

  if(Array.isArray(value)){

    return value.join(
      " / "
    );

  }


  return String(value);

}


/* =========================================================
   配信サービスカード
========================================================= */

function createServiceCards(
  services,
  title,
  type,
  movieData
){

  if(
    !Array.isArray(services) ||
    services.length === 0
  ){

    return (
      "<div class='no-service'>" +
      "この種類の配信情報はありません" +
      "</div>"
    );

  }


  let html =
    "<div class='service-grid'>";


  const used = {};


  services.forEach(
    function(service){

      if(!service){

        return;

      }


      const providerName =
        service.provider_name ||
        service.name ||
        service.providerName ||
        service.clearName ||
        "";


      const cleanProviderName =
        String(
          providerName
        ).trim();


      if(!cleanProviderName){

        return;

      }


      const key =
        normalizeProviderName(
          cleanProviderName
        );


      if(used[key]){

        return;

      }


      used[key] = true;


      const serviceInfo =
        getServiceInfo(
          cleanProviderName
        );


      const url =
        getServiceUrl(
          cleanProviderName,
          title,
          service,
          movieData
        );


      if(!url){

        return;

      }


      let statusText =
        "見放題";

      let statusClass =
        "status-streaming";

      let buttonText =
        cleanProviderName +
        "で見る →";

      let buttonBackground =
        "#2563eb";


      if(type === "rental"){

        statusText =
          "レンタル";

        statusClass =
          "status-rental";

        buttonText =
          cleanProviderName +
          "でレンタル →";

        buttonBackground =
          "#f59e0b";

      }


      if(type === "purchase"){

        statusText =
          "購入";

        statusClass =
          "status-purchase";

        buttonText =
          cleanProviderName +
          "で購入 →";

        buttonBackground =
          "#7c3aed";

      }


      html +=
        "<div class='service-card'>";


      html +=
        "<div class='service-logo-row'>" +

        "<div " +
        "class='service-logo' " +
        "style='background:" +
        escapeAttribute(
          serviceInfo.background
        ) +
        "'>" +

        escapeHtml(
          serviceInfo.logo
        ) +

        "</div>" +

        "<div class='service-name'>" +

        escapeHtml(
          cleanProviderName
        ) +

        "</div>" +

        "</div>";


      html +=
        "<div class='service-status " +
        statusClass +
        "'>" +

        escapeHtml(
          statusText
        ) +

        "</div>";


      html +=
        "<a " +
        "class='service-watch-button' " +
        "href='" +
        escapeAttribute(url) +
        "' " +
        "target='_blank' " +
        "rel='noopener noreferrer' " +
        "style='background:" +
        buttonBackground +
        "'>" +

        escapeHtml(
          buttonText
        ) +

        "</a>";


      html +=
        "</div>";

    }
  );


  html +=
    "</div>";


  if(
    !html.includes(
      "service-card"
    )
  ){

    return (
      "<div class='no-service'>" +
      "配信サービス情報を取得できませんでした" +
      "</div>"
    );

  }


  return html;

}


/* =========================================================
   配信URL
========================================================= */

function getServiceUrl(
  providerName,
  title,
  service,
  movieData
){

  const name =
    String(
      providerName || ""
    ).toLowerCase();


  /* =====================================================
     Netflix
  ===================================================== */

  if(
    name.includes("netflix")
  ){

    /*
     * Netflix作品IDは推測しない。
     *
     * APIから実際のNetflix URLが返ってきた場合だけ
     * 作品ページへ移動する。
     */

    const netflixUrl =
      findNetflixUrlFromData(
        service,
        movieData
      );


    if(netflixUrl){

      return netflixUrl;

    }


    /*
     * 作品URLが取得できない場合は
     * Netflix内検索。
     */

    return createNetflixSearchUrl(
      title
    );

  }


  /* =====================================================
     Amazon Prime Video
  ===================================================== */

  if(
    name.includes("prime") ||
    name.includes("amazon")
  ){

    const direct =
      getDirectServiceUrl(
        service
      );


    if(direct){

      return direct;

    }


    return (
      "https://www.amazon.co.jp/s?k=" +
      encodeURIComponent(title) +
      "&i=instant-video"
    );

  }


  /* =====================================================
     U-NEXT
  ===================================================== */

  if(
    name.includes("u-next") ||
    name.includes("unext")
  ){

    const direct =
      getDirectServiceUrl(
        service
      );


    if(direct){

      return direct;

    }


    return (
      "https://video.unext.jp/search?query=" +
      encodeURIComponent(title)
    );

  }


  /* =====================================================
     Hulu
  ===================================================== */

  if(
    name.includes("hulu")
  ){

    const direct =
      getDirectServiceUrl(
        service
      );


    if(direct){

      return direct;

    }


    return (
      "https://www.hulu.jp/search?q=" +
      encodeURIComponent(title)
    );

  }


  /* =====================================================
     Disney+
  ===================================================== */

  if(
    name.includes("disney")
  ){

    const direct =
      getDirectServiceUrl(
        service
      );


    if(direct){

      return direct;

    }


    return (
      "https://www.disneyplus.com/ja-jp/search/" +
      encodeURIComponent(title)
    );

  }


  /* =====================================================
     Apple TV
  ===================================================== */

  if(
    name.includes("apple")
  ){

    const direct =
      getDirectServiceUrl(
        service
      );


    if(direct){

      return direct;

    }


    return (
      "https://tv.apple.com/jp/search?term=" +
      encodeURIComponent(title)
    );

  }


  /* =====================================================
     FOD
  ===================================================== */

  if(
    name.includes("fod")
  ){

    const direct =
      getDirectServiceUrl(
        service
      );


    if(direct){

      return direct;

    }


    return (
      "https://fod.fujitv.co.jp/search/?keyword=" +
      encodeURIComponent(title)
    );

  }


  /* =====================================================
     Google Play
  ===================================================== */

  if(
    name.includes("google")
  ){

    const direct =
      getDirectServiceUrl(
        service
      );


    if(direct){

      return direct;

    }


    return (
      "https://play.google.com/store/search?q=" +
      encodeURIComponent(title) +
      "&c=movies&hl=ja"
    );

  }


  /* =====================================================
     その他
  ===================================================== */

  const direct =
    getDirectServiceUrl(
      service
    );


  if(direct){

    return direct;

  }


  return (
    "https://www.google.com/search?q=" +
    encodeURIComponent(
      providerName +
      " " +
      title
    )
  );

}


/* =========================================================
   Netflix URL取得
========================================================= */

function findNetflixUrlFromData(
  service,
  movieData
){

  const candidates = [

    service &&
    service.provider_url,

    service &&
    service.watch_link,

    service &&
    service.netflix_url,

    service &&
    service.url,

    service &&
    service.link,

    movieData &&
    movieData.netflix_url,

    movieData &&
    movieData.netflix_link,

    movieData &&
    movieData.netflix &&
    movieData.netflix.url

  ];


  for(
    let i=0;
    i<candidates.length;
    i++
  ){

    const normalized =
      normalizeNetflixUrl(
        candidates[i]
      );


    if(normalized){

      /*
       * Netflix検索URLは作品ページではないので、
       * 「直接作品URL」としては採用しない。
       */

      if(
        /\/search\?/i.test(
          normalized
        )
      ){

        continue;

      }


      return normalized;

    }

  }


  return null;

}


/* =========================================================
   Netflix検索URL
========================================================= */

function createNetflixSearchUrl(
  title
){

  const cleanTitle =
    String(
      title || ""
    ).trim();


  if(!cleanTitle){

    return "https://www.netflix.com/jp/";

  }


  return (
    "https://www.netflix.com/jp/search?q=" +
    encodeURIComponent(
      cleanTitle
    )
  );

}


/* =========================================================
   Netflix URL → ID
========================================================= */

function extractNetflixTitleId(
  url
){

  if(
    typeof url !== "string" ||
    !url
  ){

    return null;

  }


  const patterns = [

    /netflix\.com\/(?:[^/]+\/)?title\/(\d+)/i,

    /netflix\.com\/(?:[^/]+\/)?watch\/(\d+)/i,

    /netflix\.com\/title\/(\d+)/i,

    /netflix\.com\/watch\/(\d+)/i

  ];


  for(
    let i=0;
    i<patterns.length;
    i++
  ){

    const match =
      url.match(
        patterns[i]
      );


    if(match){

      return match[1];

    }

  }


  return null;

}


/* =========================================================
   Netflix URL 正規化
========================================================= */

function normalizeNetflixUrl(
  url
){

  if(
    typeof url !== "string" ||
    !url.trim()
  ){

    return null;

  }


  const clean =
    url.trim();


  const id =
    extractNetflixTitleId(
      clean
    );


  if(id){

    return (
      "https://www.netflix.com/jp/title/" +
      encodeURIComponent(id)
    );

  }


  if(
    /^https?:\/\/(?:www\.)?netflix\.com\//i
      .test(clean)
  ){

    return clean;

  }


  return null;

}


/* =========================================================
   その他サービスURL
========================================================= */

function getDirectServiceUrl(
  service
){

  if(!service){

    return null;

  }


  const candidates = [

    service.provider_url,

    service.watch_link,

    service.url,

    service.link

  ];


  for(
    let i=0;
    i<candidates.length;
    i++
  ){

    if(
      isUsableUrl(
        candidates[i]
      )
    ){

      return candidates[i].trim();

    }

  }


  return null;

}


/* =========================================================
   サービス名正規化
========================================================= */

function normalizeProviderName(
  name
){

  return String(
    name || ""
  )
    .toLowerCase()
    .replace(
      /\s+/g,
      ""
    )
    .replace(
      /[+＋]/g,
      ""
    );

}

/* =========================================================
   URL判定
========================================================= */

function isUsableUrl(
  url
){

  return (
    typeof url === "string" &&
    /^https?:\/\//i.test(
      url.trim()
    )
  );

}


/* =========================================================
   日付判定
========================================================= */

function isValidDate(
  date
){

  return (
    typeof date === "string" &&
    /^\d{4}-\d{2}-\d{2}$/.test(
      date
    )
  );

}


/* =========================================================
   APIエラー
========================================================= */

function getApiErrorMessage(
  data,
  status
){

  if(
    data &&
    typeof data.error === "string"
  ){

    return data.error;

  }


  if(
    data &&
    data.error &&
    typeof data.error.message === "string"
  ){

    return data.error.message;

  }


  if(status === 404){

    return "作品情報が見つかりませんでした。";

  }


  if(status === 500){

    return "サーバーでエラーが発生しました。Vercelの設定とTMDB APIキーを確認してください。";

  }


  return (
    "検索できませんでした。" +
    "（HTTP " +
    status +
    "）"
  );

}


/* =========================================================
   安全なエラーメッセージ
========================================================= */

function getSafeErrorMessage(
  error
){

  if(
    error instanceof Error &&
    error.message
  ){

    return error.message;

  }


  if(
    typeof error === "string"
  ){

    return error;

  }


  if(
    error &&
    typeof error.message === "string"
  ){

    return error.message;

  }


  if(
    error &&
    typeof error.error === "string"
  ){

    return error.error;

  }


  /*
   * [object Object] を絶対に表示しない。
   */

  return (
    "検索中にエラーが発生しました。"
  );

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHtml(
  text
){

  if(
    text === null ||
    text === undefined
  ){

    return "";

  }


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(text);


  return div.innerHTML;

}


/* =========================================================
   属性エスケープ
========================================================= */

function escapeAttribute(
  text
){

  if(
    text === null ||
    text === undefined
  ){

    return "";

  }


  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#39;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    );

}
