<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ドコデミレル？</title>

<style>

/* =========================
   基本
========================= */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    Arial,
    "Noto Sans JP",
    sans-serif;
  background:#f3f5f9;
  color:#222;
}


/* =========================
   ヘッダー
========================= */

header{
  background:
    linear-gradient(
      135deg,
      #111827,
      #1e3a8a
    );
  color:white;
  text-align:center;
  padding:32px 15px;
  box-shadow:
    0 3px 12px
    rgba(0,0,0,.15);
}

header h1{
  margin:0;
  font-size:32px;
  letter-spacing:1px;
}

header p{
  margin:8px 0 0;
  opacity:.85;
}


/* =========================
   メイン
========================= */

.container{
  max-width:950px;
  margin:35px auto;
  padding:0 20px;
}


/* =========================
   ボックス
========================= */

.box{
  background:white;
  padding:30px;
  border-radius:18px;
  box-shadow:
    0 5px 25px
    rgba(0,0,0,.08);
}


/* =========================
   検索
========================= */

.search{
  display:flex;
  gap:10px;
}

input{
  flex:1;
  padding:16px;
  font-size:17px;
  border:
    1px solid #d1d5db;
  border-radius:10px;
  outline:none;
}

input:focus{
  border-color:#2563eb;
  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.12);
}

.search-button{
  padding:
    15px 28px;
  background:#2563eb;
  color:white;
  border:0;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.search-button:hover{
  background:#1d4ed8;
}


/* =========================
   結果
========================= */

#result{
  margin-top:30px;
}

.result-title{
  margin:
    0 0 20px;
  font-size:24px;
}


/* =========================
   映画カード
========================= */

.movie-card{
  display:flex;
  gap:22px;
  background:white;
  padding:18px;
  margin-bottom:18px;
  border-radius:16px;
  border:
    1px solid #e5e7eb;
  box-shadow:
    0 3px 15px
    rgba(0,0,0,.06);
  transition:
    transform .2s,
    box-shadow .2s;
}

.movie-card:hover{
  transform:
    translateY(-2px);
  box-shadow:
    0 8px 25px
    rgba(0,0,0,.12);
}


/* =========================
   ポスター
========================= */

.movie-poster{
  width:145px;
  height:215px;
  object-fit:cover;
  border-radius:10px;
  background:#e5e7eb;
  flex-shrink:0;
}

.no-poster{
  width:145px;
  height:215px;
  border-radius:10px;
  background:#e5e7eb;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#777;
  flex-shrink:0;
}


/* =========================
   映画情報
========================= */

.movie-info{
  flex:1;
}

.movie-title{
  font-size:22px;
  font-weight:bold;
  margin:
    0 0 5px;
}

.movie-original{
  color:#777;
  font-size:14px;
  margin-bottom:10px;
}

.movie-year{
  display:inline-block;
  background:#eef2ff;
  color:#3730a3;
  padding:
    5px 9px;
  border-radius:6px;
  font-size:14px;
  margin-bottom:10px;
}

.movie-rating{
  display:inline-block;
  margin-left:6px;
  padding:
    5px 9px;
  border-radius:6px;
  background:#fff7ed;
  color:#c2410c;
  font-size:14px;
  font-weight:bold;
}

.movie-overview{
  color:#555;
  line-height:1.6;
  font-size:14px;
  margin:
    8px 0 15px;
}


/* =========================
   詳細ボタン
========================= */

.detail-button{
  display:inline-block;
  padding:
    10px 16px;
  background:#2563eb;
  color:white;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  border:0;
}

.detail-button:hover{
  background:#1d4ed8;
}


/* =========================
   詳細カード
========================= */

.detail-card{
  background:white;
  padding:30px;
  border-radius:18px;
  box-shadow:
    0 5px 25px
    rgba(0,0,0,.08);
}


/* =========================
   詳細ヘッダー
========================= */

.detail-header{
  display:flex;
  gap:30px;
  margin-bottom:30px;
}

.detail-poster{
  width:240px;
  max-width:40%;
  height:auto;
  object-fit:cover;
  border-radius:12px;
  box-shadow:
    0 5px 18px
    rgba(0,0,0,.15);
}

.detail-info{
  flex:1;
}

.detail-title{
  font-size:30px;
  margin:
    0 0 8px;
}

.detail-original{
  color:#777;
  margin-bottom:15px;
}

.detail-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}

.meta-item{
  background:#f3f4f6;
  padding:
    7px 10px;
  border-radius:7px;
  font-size:14px;
}

.rating-box{
  display:inline-block;
  background:#fff7ed;
  color:#c2410c;
  padding:
    8px 12px;
  border-radius:8px;
  font-weight:bold;
  margin-bottom:15px;
}


/* =========================
   詳細セクション
========================= */

.detail-section{
  margin-top:28px;
  padding-top:20px;
  border-top:
    1px solid #e5e7eb;
}

.detail-section h3{
  margin:
    0 0 15px;
  font-size:20px;
}

.overview{
  color:#444;
  line-height:1.8;
}


/* =========================
   配信サービス
========================= */

.service-group{
  margin-bottom:30px;
}

.service-title{
  font-size:20px;
  margin:
    0 0 15px;
}

.service-grid{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);
  gap:14px;
}


/* =========================
   サービスカード
========================= */

.service-card{
  background:white;
  border:
    1px solid #e5e7eb;
  border-radius:14px;
  padding:16px;
  box-shadow:
    0 3px 12px
    rgba(0,0,0,.06);
  transition:
    transform .18s,
    box-shadow .18s;
}

.service-card:hover{
  transform:
    translateY(-3px);
  box-shadow:
    0 8px 22px
    rgba(0,0,0,.12);
}


/* =========================
   ロゴ
========================= */

.service-logo-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.service-logo{
  width:46px;
  height:46px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:21px;
  font-weight:bold;
  flex-shrink:0;
}

.service-name{
  font-size:17px;
  font-weight:bold;
  line-height:1.3;
}


/* =========================
   サービス状態
========================= */

.service-status{
  display:inline-block;
  padding:
    5px 8px;
  border-radius:6px;
  font-size:12px;
  font-weight:bold;
  margin-bottom:12px;
}

.status-streaming{
  background:#dcfce7;
  color:#166534;
}

.status-rental{
  background:#fef3c7;
  color:#92400e;
}

.status-purchase{
  background:#ede9fe;
  color:#5b21b6;
}


/* =========================
   字幕・吹き替え
========================= */

.language-box{
  margin-top:12px;
  padding:12px;
  background:#f8fafc;
  border-radius:9px;
  border:1px solid #e5e7eb;
  font-size:13px;
  line-height:1.7;
}

.language-label{
  display:inline-block;
  padding:4px 7px;
  margin:3px 4px 3px 0;
  border-radius:5px;
  font-weight:bold;
}

.subtitle-yes{
  background:#dbeafe;
  color:#1e40af;
}

.dubbing-yes{
  background:#fce7f3;
  color:#9d174d;
}

.language-unknown{
  background:#f3f4f6;
  color:#6b7280;
}


/* =========================
   見るボタン
========================= */

.service-watch-button{
  display:block;
  width:100%;
  padding:
    11px 10px;
  color:white;
  text-align:center;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
  font-size:14px;
  transition:
    transform .15s,
    opacity .15s;
}

.service-watch-button:hover{
  transform:
    translateY(-1px);
  opacity:.9;
}


/* =========================
   配信なし
========================= */

.no-service{
  color:#777;
  font-size:14px;
  background:#f9fafb;
  padding:14px;
  border-radius:8px;
}


/* =========================
   TMDBリンク
========================= */

.tmdb-link{
  display:inline-block;
  margin-top:8px;
  color:#2563eb;
  font-weight:bold;
  text-decoration:none;
}

.tmdb-link:hover{
  text-decoration:underline;
}


/* =========================
   シリーズ
========================= */

.series-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.series-item{
  display:flex;
  align-items:center;
  gap:14px;
  background:#f8fafc;
  padding:12px;
  border:
    1px solid #e5e7eb;
  border-radius:10px;
  cursor:pointer;
  transition:
    background .15s,
    transform .15s;
}

.series-item:hover{
  background:#eef2ff;
  transform:
    translateX(3px);
}

.series-poster{
  width:60px;
  height:85px;
  object-fit:cover;
  border-radius:6px;
  background:#e5e7eb;
}

.series-info{
  flex:1;
}

.series-title{
  font-weight:bold;
  font-size:16px;
}

.series-year{
  color:#777;
  font-size:14px;
  margin-top:5px;
}


/* =========================
   戻る
========================= */

.back-button{
  display:inline-block;
  margin-bottom:20px;
  padding:
    10px 15px;
  background:#6b7280;
  color:white;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  border:0;
}

.back-button:hover{
  background:#4b5563;
}


/* =========================
   ローディング
========================= */

.loading{
  text-align:center;
  padding:35px;
  color:#666;
}


/* =========================
   エラー
========================= */

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:18px;
  border-radius:10px;
}


/* =========================
   スマホ
========================= */

@media(max-width:700px){

  .container{
    margin:
      20px auto;
    padding:
      0 12px;
  }

  .box{
    padding:18px;
  }

  .search{
    flex-direction:column;
  }

  .search-button{
    width:100%;
  }

  .movie-card{
    gap:14px;
    padding:12px;
  }

  .movie-poster,
  .no-poster{
    width:95px;
    height:140px;
  }

  .movie-title{
    font-size:18px;
  }

  .movie-overview{
    display:none;
  }

  .movie-rating{
    margin-left:0;
    margin-top:5px;
  }

  .detail-card{
    padding:18px;
  }

  .detail-header{
    flex-direction:column;
    gap:18px;
  }

  .detail-poster{
    width:200px;
    max-width:100%;
    margin:0 auto;
  }

  .detail-title{
    font-size:25px;
  }

  .service-grid{
    grid-template-columns:1fr;
  }

}


/* =========================
   小さなスマホ
========================= */

@media(max-width:400px){

  .movie-card{
    flex-direction:column;
  }

  .movie-poster,
  .no-poster{
    width:120px;
    height:175px;
  }

}

</style>

</head>


<body>

<header>

<h1>🎬 ドコデミレル？</h1>

<p>
映画がどこで観られるか検索
</p>

</header>


<div class="container">

<div class="box">

<h2>🎬 映画を検索</h2>

<div class="search">

<input
  id="movie"
  type="text"
  placeholder="例：トップガン"
>

<button
  class="search-button"
  id="searchButton"
>
🔍 検索
</button>

</div>

<div id="result"></div>

</div>

</div>


<script>

/* =========================================================
   状態
========================================================= */

let lastSearchQuery = "";

let lastSearchResults = [];


/* =========================================================
   初期設定
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    const input =
      document.getElementById("movie");

    const button =
      document.getElementById("searchButton");


    button.addEventListener(
      "click",
      searchMovie
    );


    input.addEventListener(
      "keydown",
      function(event){

        if(event.key === "Enter"){

          event.preventDefault();

          searchMovie();

        }

      }
    );

  }
);


/* =========================================================
   映画検索
========================================================= */

async function searchMovie(){

  const movieInput =
    document.getElementById("movie");

  const result =
    document.getElementById("result");

  const movie =
    movieInput.value.trim();


  if(!movie){

    result.innerHTML =
      "<div class='error'>" +
      "映画名を入力してください。" +
      "</div>";

    return;

  }


  lastSearchQuery = movie;


  result.innerHTML =
    "<div class='loading'>" +
    "🔍 映画を検索しています……" +
    "</div>";


  try{

    const response =
      await fetch(
        "/api/search?query=" +
        encodeURIComponent(movie)
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "検索できませんでした"
      );

    }


    if(
      !data.results ||
      !Array.isArray(data.results) ||
      data.results.length === 0
    ){

      result.innerHTML =
        "<div class='error'>" +
        "映画が見つかりませんでした。" +
        "</div>";

      return;

    }


    lastSearchResults =
      data.results;


    showSearchResults(
      movie,
      data.results
    );

  }

  catch(error){

    console.error(
      error
    );

    result.innerHTML =
      "<div class='error'>" +
      "❌ " +
      escapeHtml(
        error.message ||
        "検索中にエラーが発生しました"
      ) +
      "</div>";

  }

}


/* =========================================================
   検索結果表示
========================================================= */

function showSearchResults(
  query,
  movies
){

  const result =
    document.getElementById("result");


  let html = "";


  html +=
    "<h2 class='result-title'>" +
    "🔎 「" +
    escapeHtml(query) +
    "」の検索結果 " +
    movies.length +
    "件" +
    "</h2>";


  movies.forEach(
    function(movie){

      html +=
        createMovieCard(movie);

    }
  );


  result.innerHTML =
    html;

}


/* =========================================================
   映画カード
========================================================= */

function createMovieCard(movie){

  let html =
    "<div class='movie-card'>";


  if(movie.poster_path){

    html +=

      "<img " +
      "class='movie-poster' " +
      "src='" +
      "https://image.tmdb.org/t/p/w500" +
      escapeAttribute(movie.poster_path) +
      "' " +
      "alt='" +
      escapeAttribute(movie.title) +
      "'>";

  }

  else{

    html +=

      "<div class='no-poster'>" +
      "🎬<br>画像なし" +
      "</div>";

  }


  html +=
    "<div class='movie-info'>";


  html +=

    "<h3 class='movie-title'>" +
    escapeHtml(movie.title) +
    "</h3>";


  if(movie.original_title){

    html +=

      "<div class='movie-original'>" +
      escapeHtml(
        movie.original_title
      ) +
      "</div>";

  }


  if(movie.release_date){

    html +=

      "<span class='movie-year'>" +
      "📅 " +
      escapeHtml(
        movie.release_date.substring(0,4)
      ) +
      "年" +
      "</span>";

  }


  if(
    movie.vote_average !== undefined &&
    movie.vote_average !== null &&
    Number(movie.vote_average) > 0
  ){

    html +=

      "<span class='movie-rating'>" +
      "⭐ " +
      Number(
        movie.vote_average
      ).toFixed(1) +
      " / 10" +
      "</span>";

  }


  if(movie.overview){

    html +=

      "<p class='movie-overview'>" +
      escapeHtml(
        movie.overview
      ) +
      "</p>";

  }


  html +=

    "<button " +
    "class='detail-button' " +
    "type='button' " +
    "onclick='searchMovieById(" +
    Number(movie.id) +
    ")'>" +
    "▶ 詳細を見る" +
    "</button>";


  html +=
    "</div>";


  html +=
    "</div>";


  return html;

}


/* =========================================================
   作品詳細
========================================================= */

async function searchMovieById(
  movieId
){

  const result =
    document.getElementById("result");


  result.innerHTML =
    "<div class='loading'>" +
    "🔍 作品情報を読み込んでいます……" +
    "</div>";


  try{

    const response =
      await fetch(
        "/api/search?id=" +
        encodeURIComponent(movieId)
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "作品情報を取得できませんでした"
      );

    }


    showMovieDetail(data);

  }

  catch(error){

    console.error(
      error
    );


    result.innerHTML =

      "<div class='error'>" +

      "❌ " +

      escapeHtml(
        error.message ||
        "作品情報を取得できませんでした"
      ) +

      "<br><br>" +

      "<button " +
      "class='back-button' " +
      "onclick='backToSearchResults()'>" +
      "← 検索結果に戻る" +
      "</button>" +

      "</div>";

  }

}


/* =========================================================
   詳細表示
========================================================= */

function showMovieDetail(
  data
){

  const result =
    document.getElementById("result");


  let html =
    "<div class='detail-card'>";


  html +=

    "<button " +
    "class='back-button' " +
    "type='button' " +
    "onclick='backToSearchResults()'>" +
    "← 検索結果に戻る" +
    "</button>";


  /* =========================
     詳細ヘッダー
  ========================= */

  html +=
    "<div class='detail-header'>";


  if(data.poster_path){

    html +=

      "<img " +
      "class='detail-poster' " +
      "src='" +
      "https://image.tmdb.org/t/p/w500" +
      escapeAttribute(
        data.poster_path
      ) +
      "' " +
      "alt='" +
      escapeAttribute(
        data.title
      ) +
      "'>";

  }


  html +=
    "<div class='detail-info'>";


  html +=

    "<h2 class='detail-title'>" +
    "🎬 " +
    escapeHtml(
      data.title
    ) +
    "</h2>";


  if(data.original_title){

    html +=

      "<div class='detail-original'>" +
      escapeHtml(
        data.original_title
      ) +
      "</div>";

  }


  html +=
    "<div class='detail-meta'>";


  if(data.release_date){

    html +=

      "<span class='meta-item'>" +
      "📅 " +
      escapeHtml(
        data.release_date
      ) +
      "</span>";

  }


  if(
    data.genres &&
    Array.isArray(data.genres) &&
    data.genres.length
  ){

    html +=

      "<span class='meta-item'>" +
      "🎭 " +

      data.genres
        .map(
          function(genre){

            return escapeHtml(
              genre.name
            );

          }
        )
        .join(" / ") +

      "</span>";

  }


  html +=
    "</div>";


  if(
    data.vote_average !== undefined &&
    data.vote_average !== null &&
    Number(data.vote_average) > 0
  ){

    html +=

      "<div class='rating-box'>" +
      "⭐ TMDB評価 " +
      Number(
        data.vote_average
      ).toFixed(1) +
      " / 10" +
      "</div>";

  }


  if(data.director){

    html +=

      "<p>" +
      "🎬 監督：<strong>" +
      escapeHtml(
        data.director.name
      ) +
      "</strong>" +
      "</p>";

  }


  if(
    data.cast &&
    Array.isArray(data.cast) &&
    data.cast.length
  ){

    html +=

      "<p>" +
      "👤 出演：" +

      data.cast
        .slice(0,6)
        .map(
          function(person){

            return escapeHtml(
              person.name
            );

          }
        )
        .join("、") +

      "</p>";

  }


  html +=
    "</div>";


  html +=
    "</div>";


  /* =========================
     あらすじ
  ========================= */

  if(data.overview){

    html +=

      "<div class='detail-section'>" +

      "<h3>📝 あらすじ</h3>" +

      "<p class='overview'>" +

      escapeHtml(
        data.overview
      ) +

      "</p>" +

      "</div>";

  }


  /* =========================
     配信情報
  ========================= */

  html +=

    "<div class='detail-section'>" +

    "<h3>📺 この作品はどこで見られる？</h3>";


  /* 見放題 */

  html +=

    "<div class='service-group'>" +

    "<h4 class='service-title'>" +
    "🟢 見放題" +
    "</h4>" +

    createServiceCards(
      data.streaming,
      data.title,
      "streaming",
      data
    ) +

    "</div>";


  /* レンタル */

  html +=

    "<div class='service-group'>" +

    "<h4 class='service-title'>" +
    "🟡 レンタル" +
    "</h4>" +

    createServiceCards(
      data.rental,
      data.title,
      "rental",
      data
    ) +

    "</div>";


  /* 購入 */

  html +=

    "<div class='service-group'>" +

    "<h4 class='service-title'>" +
    "🔵 購入" +
    "</h4>" +

    createServiceCards(
      data.purchase,
      data.title,
      "purchase",
      data
    ) +

    "</div>";


  if(data.link){

    html +=

      "<a " +
      "class='tmdb-link' " +
      "href='" +
      escapeAttribute(data.link) +
      "' " +
      "target='_blank' " +
      "rel='noopener noreferrer'>" +
      "配信情報の詳細を見る →" +
      "</a>";

  }


  html +=
    "</div>";


  /* =========================
     シリーズ
  ========================= */

  if(
    data.series &&
    data.series.movies &&
    Array.isArray(data.series.movies) &&
    data.series.movies.length
  ){

    html +=

      "<div class='detail-section'>" +

      "<h3>🎞️ シリーズ作品</h3>";


    if(data.series.name){

      html +=

        "<p><strong>" +
        escapeHtml(
          data.series.name
        ) +
        "</strong></p>";

    }


    html +=
      "<div class='series-list'>";


    data.series.movies.forEach(
      function(movie){

        if(
          !movie.title ||
          movie.title
            .toLowerCase()
            .includes("untitled")
        ){

          return;

        }


        html +=

          "<div " +
          "class='series-item' " +
          "onclick='searchMovieById(" +
          Number(movie.id) +
          ")'>";


        if(movie.poster_path){

          html +=

            "<img " +
            "class='series-poster' " +
            "src='" +
            "https://image.tmdb.org/t/p/w200" +
            escapeAttribute(
              movie.poster_path
            ) +
            "' " +
            "alt='" +
            escapeAttribute(
              movie.title
            ) +
            "'>";

        }

        else{

          html +=

            "<div class='series-poster'>" +
            "</div>";

        }


        html +=

          "<div class='series-info'>" +

          "<div class='series-title'>" +
          escapeHtml(
            movie.title
          ) +
          "</div>";


        if(movie.release_date){

          html +=

            "<div class='series-year'>" +
            escapeHtml(
              movie.release_date.substring(
                0,
                4
              )
            ) +
            "年" +
            "</div>";

        }


        html +=
          "</div>";


        html +=
          "</div>";

      }
    );


    html +=
      "</div>";


    html +=
      "</div>";

  }


  html +=
    "</div>";


  result.innerHTML =
    html;

}


/* =========================================================
   検索結果へ戻る
========================================================= */

function backToSearchResults(){

  const result =
    document.getElementById("result");


  /*
   * 以前の検索結果を保存している場合は、
   * APIをもう一度呼ばずにそのまま復元する。
   *
   * これにより
   * 「戻る」を押したらトップページに戻る
   * 問題を防ぐ。
   */

  if(
    lastSearchResults &&
    Array.isArray(lastSearchResults) &&
    lastSearchResults.length
  ){

    showSearchResults(
      lastSearchQuery,
      lastSearchResults
    );

    return;

  }


  /*
   * 保存されていない場合だけ
   * 検索をやり直す。
   */

  if(lastSearchQuery){

    document
      .getElementById("movie")
      .value =
      lastSearchQuery;

    searchMovie();

    return;

  }


  result.innerHTML = "";

}


/* =========================================================
   サービスカード
========================================================= */

function createServiceCards(
  services,
  title,
  type,
  movieData
){

  if(
    !services ||
    !Array.isArray(services) ||
    !services.length
  ){

    return (

      "<div class='no-service'>" +

      "この種類の配信情報はありません" +

      "</div>"

    );

  }


  let html =
    "<div class='service-grid'>";


  const used = {};


  services.forEach(
    function(service){

      if(!service){

        return;

      }


      const providerName =
        service.provider_name ||
        "配信サービス";


      const key =
        providerName
          .toLowerCase();


      if(used[key]){

        return;

      }


      used[key] = true;


      const serviceInfo =
        getServiceInfo(
          providerName
        );


      /*
       * URL決定
       */

      let url =
        getServiceUrl(
          providerName,
          title,
          service,
          movieData
        );


      /*
       * APIから作品URLが返ってきた場合
       * それを優先する。
       *
       * Netflixだけは
       * /title/数字 の作品URLのみ使用。
       */

      if(
        service.watch_link &&
        isUsableServiceUrl(
          providerName,
          service.watch_link
        )
      ){

        url =
          service.watch_link;

      }


      if(
        service.provider_url &&
        isUsableServiceUrl(
          providerName,
          service.provider_url
        )
      ){

        url =
          service.provider_url;

      }


      /* =========================
         状態
      ========================= */

      let statusText =
        "見放題";

      let statusClass =
        "status-streaming";

      let buttonText =
        providerName +
        "で見る →";

      let buttonBackground =
        "#2563eb";


      if(type === "rental"){

        statusText =
          "レンタル";

        statusClass =
          "status-rental";

        buttonText =
          providerName +
          "でレンタル →";

        buttonBackground =
          "#f59e0b";

      }


      else if(type === "purchase"){

        statusText =
          "購入";

        statusClass =
          "status-purchase";

        buttonText =
          providerName +
          "で購入 →";

        buttonBackground =
          "#7c3aed";

      }


      html +=

        "<div class='service-card'>";


      /* ロゴ */

      html +=

        "<div class='service-logo-row'>" +

        "<div " +
        "class='service-logo' " +
        "style='background:" +
        serviceInfo.background +
        "'>" +

        escapeHtml(
          serviceInfo.logo
        ) +

        "</div>" +

        "<div class='service-name'>" +

        escapeHtml(
          providerName
        ) +

        "</div>" +

        "</div>";


      /* 状態 */

      html +=

        "<div " +
        "class='service-status " +
        statusClass +
        "'>" +

        escapeHtml(
          statusText
        ) +

        "</div>";


      /* 字幕・吹き替え */

      html +=
        createLanguageInfo(
          service,
          movieData
        );


      /* ボタン */

      html +=

        "<a " +

        "class='service-watch-button' " +

        "href='" +

        escapeAttribute(url) +

        "' " +

        "target='_blank' " +

        "rel='noopener noreferrer' " +

        "style='background:" +
        buttonBackground +
        "'>" +

        escapeHtml(
          buttonText
        ) +

        "</a>";


      html +=
        "</div>";

    }
  );


  html +=
    "</div>";


  return html;

}


/* =========================================================
   字幕・吹き替え表示
========================================================= */

function createLanguageInfo(
  service,
  movieData
){

  /*
   * APIが将来的に
   * subtitle / dubbing を返した場合に対応。
   */

  const subtitle =
    getLanguageValue(
      service,
      movieData,
      [
        "subtitle",
        "subtitles",
        "has_subtitle",
        "has_subtitles"
      ]
    );


  const dubbing =
    getLanguageValue(
      service,
      movieData,
      [
        "dubbing",
        "dub",
        "has_dubbing",
        "has_dub"
      ]
    );


  /*
   * 情報がない場合
   */

  if(
    subtitle === null &&
    dubbing === null
  ){

    return "";

  }


  let html =
    "<div class='language-box'>";


  if(subtitle === true){

    html +=
      "<span class='language-label subtitle-yes'>" +
      "字幕あり" +
      "</span>";

  }

  else if(subtitle === false){

    html +=
      "<span class='language-label language-unknown'>" +
      "字幕情報なし" +
      "</span>";

  }


  if(dubbing === true){

    html +=
      "<span class='language-label dubbing-yes'>" +
      "吹き替えあり" +
      "</span>";

  }

  else if(dubbing === false){

    html +=
      "<span class='language-label language-unknown'>" +
      "吹き替え情報なし" +
      "</span>";

  }


  html +=
    "</div>";


  return html;

}


/* =========================================================
   字幕・吹き替え値取得
========================================================= */

function getLanguageValue(
  service,
  movieData,
  keys
){

  const objects = [
    service,
    movieData
  ];


  for(
    let i = 0;
    i < objects.length;
    i++
  ){

    const obj =
      objects[i];


    if(!obj){

      continue;

    }


    for(
      let j = 0;
      j < keys.length;
      j++
    ){

      const key =
        keys[j];


      if(
        obj[key] !== undefined &&
        obj[key] !== null
      ){

        const value =
          obj[key];


        if(
          value === true ||
          value === false
        ){

          return value;

        }


        if(
          String(value)
            .toLowerCase() === "true"
        ){

          return true;

        }


        if(
          String(value)
            .toLowerCase() === "false"
        ){

          return false;

        }

      }

    }

  }


  return null;

}


/* =========================================================
   サービスURL判定
========================================================= */

function isUsableServiceUrl(
  providerName,
  url
){

  if(
    !url ||
    typeof url !== "string"
  ){

    return false;

  }


  const name =
    providerName
      .toLowerCase();


  /*
   * Netflix
   *
   * トップページ・検索ページは使わず、
   * 作品ページだけを許可。
   */

  if(
    name.includes("netflix")
  ){

    return (

      url.includes(
        "netflix.com"
      ) &&

      /\/title\/\d+/.test(
        url
      )

    );

  }


  return (
    /^https?:\/\//i.test(
      url
    )
  );

}


/* =========================================================
   Netflix作品ID取得
========================================================= */

function getNetflixTitleId(
  service,
  movieData
){

  const candidates = [

    service &&
    service.netflix_title_id,

    service &&
    service.netflix_id,

    service &&
    service.title_id,

    service &&
    service.netflixTitleId,

    service &&
    service.netflixTitleID,

    movieData &&
    movieData.netflix_title_id,

    movieData &&
    movieData.netflix_id,

    movieData &&
    movieData.netflixTitleId,

    movieData &&
    movieData.netflixTitleID

  ];


  for(
    let i = 0;
    i < candidates.length;
    i++
  ){

    const value =
      candidates[i];


    if(
      value !== undefined &&
      value !== null &&
      /^\d+$/.test(
        String(value)
      )
    ){

      return String(value);

    }

  }


  const urls = [

    service &&
    service.watch_link,

    service &&
    service.provider_url,

    service &&
    service.netflix_url,

    movieData &&
    movieData.netflix_url,

    movieData &&
    movieData.netflix_link

  ];


  for(
    let i = 0;
    i < urls.length;
    i++
  ){

    const url =
      urls[i];


    if(
      typeof url !== "string"
    ){

      continue;

    }


    const match =
      url.match(
        /netflix\.com\/(?:[^/]+\/)?title\/(\d+)/i
      );


    if(match){

      return match[1];

    }

  }


  return null;

}


/* =========================================================
   配信サービスURL
========================================================= */

function getServiceUrl(
  providerName,
  title,
  service,
  movieData
){

  const name =
    providerName
      .toLowerCase();


  /* =========================
     Netflix
  ========================= */

  if(
    name.includes("netflix")
  ){

    const netflixId =
      getNetflixTitleId(
        service,
        movieData
      );


    if(netflixId){

      return (

        "https://www.netflix.com/jp/title/" +

        encodeURIComponent(
          netflixId
        )

      );

    }


    if(
      service &&
      typeof service.watch_link === "string" &&
      /netflix\.com\/.*\/title\/\d+/i
        .test(
          service.watch_link
        )
    ){

      return service.watch_link;

    }


    if(
      service &&
      typeof service.provider_url === "string" &&
      /netflix\.com\/.*\/title\/\d+/i
        .test(
          service.provider_url
        )
    ){

      return service.provider_url;

    }


    /*
     * 作品IDが取得できない場合のみ
     * Netflixトップへ。
     *
     * 誤った作品ページを開くより安全。
     */

    return (
      "https://www.netflix.com/jp/"
    );

  }


  /* =========================
     Amazon Prime
  ========================= */

  if(
    name.includes("prime") ||
    name.includes("amazon")
  ){

    return (

      "https://www.amazon.co.jp/s?k=" +

      encodeURIComponent(title)

    );

  }


  /* =========================
     U-NEXT
  ========================= */

  if(
    name.includes("u-next")
  ){

    return (

      "https://video.unext.jp/search?query=" +

      encodeURIComponent(title)

    );

  }


  /* =========================
     Hulu
  ========================= */

  if(
    name.includes("hulu")
  ){

    return (

      "https://www.hulu.jp/search?q=" +

      encodeURIComponent(title)

    );

  }


  /* =========================
     Disney+
  ========================= */

  if(
    name.includes("disney")
  ){

    return (

      "https://www.disneyplus.com/ja-jp/search/" +

      encodeURIComponent(title)

    );

  }


  /* =========================
     Apple TV
  ========================= */

  if(
    name.includes("apple")
  ){

    return (

      "https://tv.apple.com/jp/search?term=" +

      encodeURIComponent(title)

    );

  }


  /* =========================
     Google Play
  ========================= */

  if(
    name.includes("google play") ||
    name.includes("google")
  ){

    return (

      "https://play.google.com/store/search?q=" +

      encodeURIComponent(title) +

      "&c=movies&hl=ja"

    );

  }


  /* =========================
     FOD
  ========================= */

  if(
    name.includes("fod")
  ){

    return (

      "https://fod.fujitv.co.jp/search/?keyword=" +

      encodeURIComponent(title)

    );

  }


  /* =========================
     その他
  ========================= */

  return (

    "https://www.google.com/search?q=" +

    encodeURIComponent(
      providerName +
      " " +
      title
    )

  );

}

/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHtml(
  text
){

  if(
    text === null ||
    text === undefined
  ){

    return "";

  }


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(text);


  return div.innerHTML;

}


/* =========================================================
   属性エスケープ
========================================================= */

function escapeAttribute(
  text
){

  if(
    text === null ||
    text === undefined
  ){

    return "";

  }


  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#39;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    );

}
