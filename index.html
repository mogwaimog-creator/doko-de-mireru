<style>

<body>


<header>

  <h1>🎬 ドコデミレル？</h1>

  <p>
    映画がどこで見られるか検索できます
  </p>

</header>


<main class="container">


<section class="search-box">

  <div class="search-row">

    <input
      id="query"
      type="text"
      placeholder="映画名を入力してください"
      autocomplete="off"
    >

    <button
      id="searchButton"
      type="button"
    >
      🔍 検索
    </button>

  </div>

</section>


<div id="status"></div>

<div
  id="results"
  class="results"
></div>


</main>


<footer>
  © ドコデミレル？
</footer>


<script>

/* =========================
   要素
========================= */

const queryInput =
  document.getElementById("query");

const searchButton =
  document.getElementById("searchButton");

const status =
  document.getElementById("status");

const results =
  document.getElementById("results");


/* =========================
   映画検索
========================= */

async function searchMovies(){

  const query =
    queryInput.value.trim();


  if(!query){

    status.innerHTML =
      '<div class="error">' +
      '映画名を入力してください。' +
      '</div>';

    results.innerHTML = "";

    return;
  }


  searchButton.disabled = true;


  status.innerHTML =
    '<div class="status">' +
    '🔍 検索しています...' +
    '</div>';

  results.innerHTML = "";


  try{

    const response =
      await fetch(
        "/api/search?query=" +
        encodeURIComponent(query)
      );


    const text =
      await response.text();


    let data;


    try{

      data =
        JSON.parse(text);

    }catch(error){

      console.error(
        "JSON parse error:",
        text
      );

      throw new Error(
        "サーバーから正しいデータを取得できませんでした。"
      );

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        "検索に失敗しました。"
      );

    }


    const movies =
      Array.isArray(data.results)
        ? data.results
        : [];


    status.innerHTML = "";


    if(!movies.length){

      results.innerHTML =
        '<div class="empty">' +
        '映画が見つかりませんでした。' +
        '</div>';

      return;
    }


    results.innerHTML =
      movies
        .map(createMovieCard)
        .join("");


  }catch(error){

    console.error(
      "Search error:",
      error
    );


    status.innerHTML =
      '<div class="error">' +
      '❌ ' +
      escapeHtml(
        error.message ||
        "サーバーエラーが発生しました。"
      ) +
      '</div>';


  }finally{

    searchButton.disabled = false;

  }

}


/* =========================
   映画カード
========================= */

function createMovieCard(movie){

  const poster =
    movie.poster_path
      ? "https://image.tmdb.org/t/p/w500" +
        movie.poster_path
      : "";


  const release =
    movie.release_date
      ? formatDate(movie.release_date)
      : "公開日不明";


  const rating =
    Number(movie.vote_average || 0)
      .toFixed(1);


  /*
   * 詳細画面へ移動
   */

  const detailUrl =
    "detail.html?id=" +
    encodeURIComponent(movie.id);


  return `

    <article class="movie-card">

      ${
        poster
        ?
        `
        <img
          class="movie-poster"
          src="${poster}"
          alt="${escapeHtml(movie.title || "")}"
          loading="lazy"
        >
        `
        :
        `
        <div
          class="movie-poster"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            color:#6b7280;
          "
        >
          NO IMAGE
        </div>
        `
      }


      <div class="movie-info">

        <h2 class="movie-title">
          ${escapeHtml(movie.title || "")}
        </h2>


        ${
          movie.original_title
          ?
          `
          <div class="original-title">
            ${escapeHtml(movie.original_title)}
          </div>
          `
          :
          ""
        }


        <div class="meta">
          公開日：
          ${escapeHtml(release)}
        </div>


        <div class="meta">
          ⭐
          ${rating}
        </div>


        ${
          movie.overview
          ?
          `
          <div class="overview">
            ${escapeHtml(movie.overview)}
          </div>
          `
          :
          ""
        }


        <a
          class="detail-button"
          href="${detailUrl}"
        >
          作品詳細を見る →
        </a>

      </div>

    </article>

  `;

}


/* =========================
   日付
========================= */

function formatDate(date){

  const parts =
    String(date).split("-");


  if(parts.length !== 3){

    return date;

  }


  return (
    Number(parts[0]) +
    "年" +
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}


/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   Enter
========================= */

queryInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      searchMovies();

    }

  }
);


/* =========================
   検索ボタン
========================= */

searchButton.addEventListener(
  "click",
  searchMovies
);

</script>


</body>
