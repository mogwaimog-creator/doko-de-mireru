<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ドコデミレル？</title>


<style>

/* =========================
   全体
========================= */

*{
  box-sizing:border-box;
}

body{

  margin:0;

  font-family:
    Arial,
    "Noto Sans JP",
    sans-serif;

  background:#f3f5f9;

  color:#222;

}


/* =========================
   ヘッダー
========================= */

header{

  background:
    linear-gradient(
      135deg,
      #111827,
      #1e3a8a
    );

  color:white;

  text-align:center;

  padding:32px 15px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.15);

}

header h1{

  margin:0;

  font-size:32px;

  letter-spacing:1px;

}

header p{

  margin:
    8px 0 0;

  opacity:.85;

}


/* =========================
   メイン
========================= */

.container{

  max-width:900px;

  margin:35px auto;

  padding:
    0 20px;

}


/* =========================
   検索ボックス
========================= */

.box{

  background:white;

  padding:30px;

  border-radius:18px;

  box-shadow:
    0 5px 25px
    rgba(0,0,0,.08);

}


/* =========================
   検索
========================= */

.search{

  display:flex;

  gap:10px;

}

input{

  flex:1;

  padding:16px;

  font-size:17px;

  border:
    1px solid #d1d5db;

  border-radius:10px;

  outline:none;

}

input:focus{

  border-color:#2563eb;

  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.12);

}

button{

  padding:
    15px 28px;

  background:#2563eb;

  color:white;

  border:0;

  border-radius:10px;

  font-size:17px;

  font-weight:bold;

  cursor:pointer;

}

button:hover{

  background:#1d4ed8;

}


/* =========================
   結果
========================= */

#result{

  margin-top:30px;

}


/* =========================
   検索結果タイトル
========================= */

.result-title{

  margin:
    0 0 18px;

  font-size:24px;

}


/* =========================
   映画カード
========================= */

.movie-card{

  display:flex;

  gap:22px;

  background:white;

  padding:18px;

  margin-bottom:16px;

  border-radius:16px;

  box-shadow:
    0 3px 15px
    rgba(0,0,0,.07);

  transition:
    transform .2s,
    box-shadow .2s;

}

.movie-card:hover{

  transform:
    translateY(-2px);

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.12);

}


/* =========================
   ポスター
========================= */

.movie-poster{

  width:140px;

  height:205px;

  object-fit:cover;

  border-radius:10px;

  background:#e5e7eb;

  flex-shrink:0;

}


/* ポスターなし */

.no-poster{

  width:140px;

  height:205px;

  border-radius:10px;

  background:#e5e7eb;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#777;

  flex-shrink:0;

}


/* =========================
   映画情報
========================= */

.movie-info{

  flex:1;

}

.movie-title{

  font-size:22px;

  font-weight:bold;

  margin:
    0 0 6px;

}

.movie-original{

  color:#777;

  font-size:14px;

  margin-bottom:10px;

}

.movie-year{

  display:inline-block;

  background:#eef2ff;

  color:#3730a3;

  padding:
    5px 9px;

  border-radius:6px;

  font-size:14px;

  margin-bottom:10px;

}

.movie-overview{

  color:#555;

  line-height:1.6;

  font-size:14px;

  margin:
    8px 0 15px;

}


/* =========================
   詳細ボタン
========================= */

.detail-button{

  display:inline-block;

  padding:
    10px 16px;

  background:#2563eb;

  color:white;

  text-decoration:none;

  border-radius:8px;

  font-weight:bold;

  cursor:pointer;

}

.detail-button:hover{

  background:#1d4ed8;

}


/* =========================
   詳細画面
========================= */

.detail-card{

  background:white;

  padding:25px;

  border-radius:16px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.08);

}

.detail-poster{

  width:220px;

  max-width:100%;

  border-radius:12px;

  margin-bottom:15px;

}


/* =========================
   配信ボタン
========================= */

.service-button{

  display:inline-block;

  padding:
    11px 16px;

  margin:
    5px 5px 5px 0;

  color:white;

  text-decoration:none;

  border-radius:8px;

  font-weight:bold;

}


/* =========================
   シリーズ
========================= */

.series-item{

  display:flex;

  align-items:center;

  gap:12px;

  background:#f3f4f6;

  padding:10px;

  margin:
    8px 0;

  border-radius:10px;

  cursor:pointer;

}

.series-item:hover{

  background:#e5e7eb;

}

.series-poster{

  width:55px;

  height:80px;

  object-fit:cover;

  border-radius:6px;

}


/* =========================
   戻る
========================= */

.back-button{

  display:inline-block;

  margin-bottom:20px;

  padding:
    10px 15px;

  background:#6b7280;

  color:white;

  border-radius:8px;

  cursor:pointer;

}


/* =========================
   スマホ
========================= */

@media(max-width:600px){

  .container{

    margin:
      20px auto;

    padding:
      0 12px;

  }

  .box{

    padding:18px;

  }

  .search{

    flex-direction:column;

  }

  button{

    width:100%;

  }

  .movie-card{

    gap:14px;

    padding:12px;

  }

  .movie-poster,
  .no-poster{

    width:95px;

    height:140px;

  }

  .movie-title{

    font-size:18px;

  }

  .movie-overview{

    display:none;

  }

}


/* =========================
   ローディング
========================= */

.loading{

  text-align:center;

  padding:30px;

  color:#666;

}


/* =========================
   エラー
========================= */

.error{

  background:#fee2e2;

  color:#991b1b;

  padding:18px;

  border-radius:10px;

}

</style>

</head>


<body>


<header>

<h1>🎬 ドコデミレル？</h1>

<p>
映画がどこで観られるか検索
</p>

</header>


<div class="container">

<div class="box">


<h2>🎬 映画を検索</h2>


<div class="search">

<input
  id="movie"
  type="text"
  placeholder="例：トップガン"
  onkeydown="
    if(event.key==='Enter'){
      searchMovie();
    }
  "
>

<button
  onclick="searchMovie()"
>
🔍 検索
</button>

</div>


<div id="result"></div>


</div>

</div>


<script>


/* =========================
   映画検索
========================= */

async function searchMovie(){

  const movie =
    document
      .getElementById("movie")
      .value
      .trim();


  const result =
    document
      .getElementById("result");


  if(!movie){

    result.innerHTML =
      "<div class='error'>" +
      "映画名を入力してください。" +
      "</div>";

    return;

  }


  result.innerHTML =
    "<div class='loading'>" +
    "🔍 映画を検索しています……" +
    "</div>";


  try{

    const response =
      await fetch(
        "/api/search?query=" +
        encodeURIComponent(movie)
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "検索できませんでした"
      );

    }


    if(
      !data.results ||
      !data.results.length
    ){

      result.innerHTML =
        "<div class='error'>" +
        "映画が見つかりませんでした。" +
        "</div>";

      return;

    }


    let html = "";


    html +=
      "<h2 class='result-title'>" +
      "🔎 「" +
      escapeHtml(movie) +
      "」の検索結果 " +
      data.results.length +
      "件" +
      "</h2>";


    data.results.forEach(
      function(movie){

        html +=
          createMovieCard(movie);

      }
    );


    result.innerHTML =
      html;


  }

  catch(error){

    result.innerHTML =
      "<div class='error'>" +
      "❌ " +
      escapeHtml(error.message) +
      "</div>";

  }

}


/* =========================
   映画カード作成
========================= */

function createMovieCard(movie){

  let html =
    "<div class='movie-card'>";


  /* ポスター */

  if(movie.poster_path){

    html +=

      "<img " +

      "class='movie-poster' " +

      "src='" +

      "https://image.tmdb.org/t/p/w500" +

      movie.poster_path +

      "' " +

      "alt='" +

      escapeHtml(movie.title) +

      "'>";

  }

  else{

    html +=

      "<div class='no-poster'>" +

      "🎬<br>画像なし" +

      "</div>";

  }


  html +=
    "<div class='movie-info'>";


  /* タイトル */

  html +=

    "<h3 class='movie-title'>" +

    escapeHtml(movie.title) +

    "</h3>";


  /* 原題 */

  if(movie.original_title){

    html +=

      "<div class='movie-original'>" +

      escapeHtml(
        movie.original_title
      ) +

      "</div>";

  }


  /* 公開年 */

  if(movie.release_date){

    html +=

      "<span class='movie-year'>" +

      "📅 " +

      escapeHtml(
        movie.release_date.substring(
          0,
          4
        )
      ) +

      "年" +

      "</span>";

  }


  /* あらすじ */

  if(movie.overview){

    html +=

      "<p class='movie-overview'>" +

      escapeHtml(
        movie.overview
      ) +

      "</p>";

  }


  /* 詳細 */

  html +=

    "<span " +

    "class='detail-button' " +

    "onclick='searchMovieById(" +

    movie.id +

    ")'>" +

    "▶ 詳細を見る" +

    "</span>";


  html +=
    "</div>";

  html +=
    "</div>";


  return html;

}


/* =========================
   詳細検索
========================= */

async function searchMovieById(movieId){

  const result =
    document
      .getElementById("result");


  result.innerHTML =
    "<div class='loading'>" +
    "🔍 作品情報を読み込んでいます……" +
    "</div>";


  try{

    const response =
      await fetch(
        "/api/search?id=" +
        encodeURIComponent(movieId)
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "検索できませんでした"
      );

    }


    let html =
      "<div class='detail-card'>";


    /* 戻る */

    html +=

      "<div " +

      "class='back-button' " +

      "onclick='searchMovie()'>" +

      "← 検索結果に戻る" +

      "</div>";


    /* タイトル */

    html +=

      "<h2>🎬 " +

      escapeHtml(data.title) +

      "</h2>";


    /* ポスター */

    if(data.poster_path){

      html +=

        "<img " +

        "class='detail-poster' " +

        "src='" +

        "https://image.tmdb.org/t/p/w500" +

        data.poster_path +

        "'>";

    }


    /* 公開日 */

    if(data.release_date){

      html +=

        "<p>📅 公開日：" +

        escapeHtml(
          data.release_date
        ) +

        "</p>";

    }


    /* あらすじ */

    if(data.overview){

      html +=

        "<p>" +

        escapeHtml(
          data.overview
        ) +

        "</p>";

    }


    /* 見放題 */

    html +=
      "<h3>🟢 見放題</h3>";


    if(
      data.streaming &&
      data.streaming.length
    ){

      data.streaming.forEach(
        function(service){

          html +=
            createServiceButton(
              service,
              data.title,
              "streaming"
            );

        }
      );

    }

    else{

      html +=
        "<p>見放題の情報はありません</p>";

    }


    /* レンタル */

    html +=
      "<h3>🟡 レンタル</h3>";


    if(
      data.rental &&
      data.rental.length
    ){

      data.rental.forEach(
        function(service){

          html +=
            createServiceButton(
              service,
              data.title,
              "rental"
            );

        }
      );

    }

    else{

      html +=
        "<p>レンタル情報はありません</p>";

    }


    /* 購入 */

    html +=
      "<h3>🔵 購入</h3>";


    if(
      data.purchase &&
      data.purchase.length
    ){

      data.purchase.forEach(
        function(service){

          html +=
            createServiceButton(
              service,
              data.title,
              "purchase"
            );

        }
      );

    }

    else{

      html +=
        "<p>購入情報はありません</p>";

    }


    /* 詳細リンク */

    if(data.link){

      html +=

        "<p>" +

        "<a " +

        "href='" +

        data.link +

        "' " +

        "target='_blank'>" +

        "配信情報の詳細を見る →" +

        "</a>" +

        "</p>";

    }


    /* =========================
       シリーズ
    ========================= */

    if(
      data.series &&
      data.series.movies &&
      data.series.movies.length
    ){

      html +=
        "<h3>🎞️ シリーズ作品</h3>";


      if(data.series.name){

        html +=

          "<h4>" +

          escapeHtml(
            data.series.name
          ) +

          "</h4>";

      }


      data.series.movies.forEach(
        function(movie){

          html +=

            "<div " +

            "class='series-item' " +

            "onclick='searchMovieById(" +

            movie.id +

            ")'>";


          if(movie.poster_path){

            html +=

              "<img " +

              "class='series-poster' " +

              "src='" +

              "https://image.tmdb.org/t/p/w200" +

              movie.poster_path +

              "'>";

          }


          html +=

            "<div>" +

            "<strong>" +

            escapeHtml(
              movie.title
            ) +

            "</strong>";


          if(movie.release_date){

            html +=

              "<div>" +

              movie.release_date.substring(
                0,
                4
              ) +

              "年" +

              "</div>";

          }


          html +=
            "</div>";


          html +=
            "</div>";

        }
      );

    }


    html +=
      "</div>";


    result.innerHTML =
      html;


  }

  catch(error){

    result.innerHTML =

      "<div class='error'>" +

      "❌ " +

      escapeHtml(
        error.message
      ) +

      "</div>";

  }

}


/* =========================
   配信サービスボタン
========================= */

function createServiceButton(
  service,
  title,
  type
){

  let url =
    "#";


  const name =
    service.provider_name
      .toLowerCase();


  if(name.includes("netflix")){

    url =
      "https://www.netflix.com/jp/search?q=" +
      encodeURIComponent(title);

  }

  else if(
    name.includes("prime") ||
    name.includes("amazon")
  ){

    url =
      "https://www.amazon.co.jp/s?k=" +
      encodeURIComponent(title);

  }

  else if(
    name.includes("u-next")
  ){

    url =
      "https://video.unext.jp/search?query=" +
      encodeURIComponent(title);

  }

  else if(
    name.includes("hulu")
  ){

    url =
      "https://www.hulu.jp/search?q=" +
      encodeURIComponent(title);

  }

  else if(
    name.includes("disney")
  ){

    url =
      "https://www.disneyplus.com/ja-jp/search/" +
      encodeURIComponent(title);

  }


  let background =
    "#2563eb";


  if(type === "rental"){

    background =
      "#f59e0b";

  }


  return

    "<a " +

    "class='service-button' " +

    "href='" +

    url +

    "' " +

    "target='_blank' " +

    "style='background:" +

    background +

    "'>" +

    escapeHtml(
      service.provider_name
    ) +

    " ▶" +

    "</a>";

}


/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(text){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}

</script>


</body>

</html>
