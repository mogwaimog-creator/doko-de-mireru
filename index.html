<body>


<header>

  <h1>🎬 ドコデミレル？</h1>

  <p>
    映画がどこで見られるか検索できます
  </p>

</header>


<main class="container">


  <!-- =====================
       検索
  ====================== -->

  <section class="search-box">

    <div class="search-row">

      <input
        id="query"
        type="text"
        placeholder="映画名を入力してください"
        autocomplete="off"
      >

      <button
        id="searchButton"
        type="button"
      >
        🔍 検索
      </button>

    </div>

  </section>


  <div id="status"></div>


  <div
    id="results"
    class="results"
  ></div>


</main>


<footer>
  © ドコデミレル？
</footer>


<!-- =========================
     詳細モーダル
========================= -->

<div
  id="detailModal"
  class="detail-modal"
>

  <div class="detail-window">

    <div class="detail-header">

      <div
        id="detailHeaderTitle"
        class="detail-header-title"
      >
        作品詳細
      </div>

      <button
        id="detailClose"
        class="detail-close"
        type="button"
        aria-label="閉じる"
      >
        ×
      </button>

    </div>


    <div
      id="detailContent"
      class="detail-content"
    >
    </div>

  </div>

</div>


<script>

/* ========================================================
   要素
======================================================== */

const queryInput =
  document.getElementById("query");

const searchButton =
  document.getElementById("searchButton");

const status =
  document.getElementById("status");

const results =
  document.getElementById("results");

const detailModal =
  document.getElementById("detailModal");

const detailContent =
  document.getElementById("detailContent");

const detailClose =
  document.getElementById("detailClose");

const detailHeaderTitle =
  document.getElementById("detailHeaderTitle");


/* ========================================================
   検索
======================================================== */

async function searchMovies(){

  const query =
    queryInput.value.trim();


  if(!query){

    status.innerHTML =
      '<div class="error">' +
      '映画名を入力してください。' +
      '</div>';

    results.innerHTML = "";

    return;
  }


  searchButton.disabled = true;


  status.innerHTML =
    '<div class="status">' +
    '🔍 検索しています...' +
    '</div>';


  results.innerHTML = "";


  try{

    const response =
      await fetch(
        "/api/search?query=" +
        encodeURIComponent(query)
      );


    const text =
      await response.text();


    let data;


    try{

      data =
        JSON.parse(text);

    }catch(error){

      console.error(
        "JSON parse error:",
        text
      );

      throw new Error(
        "サーバーから正しいデータを取得できませんでした。"
      );

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        "検索に失敗しました。"
      );

    }


    const movies =
      Array.isArray(data.results)
        ? data.results
        : [];


    status.innerHTML = "";


    if(!movies.length){

      results.innerHTML =
        '<div class="empty">' +
        '映画が見つかりませんでした。' +
        '</div>';

      return;
    }


    results.innerHTML =
      movies
        .map(createMovieCard)
        .join("");


  }catch(error){

    console.error(
      "Search error:",
      error
    );


    status.innerHTML =
      '<div class="error">' +
      '❌ ' +
      escapeHtml(
        error.message ||
        "サーバーエラーが発生しました。"
      ) +
      '</div>';


  }finally{

    searchButton.disabled = false;

  }

}


/* ========================================================
   映画カード
======================================================== */

function createMovieCard(movie){

  const poster =
    movie.poster_path
      ? "https://image.tmdb.org/t/p/w500" +
        movie.poster_path
      : "";


  const release =
    movie.release_date
      ? formatDate(movie.release_date)
      : "公開日不明";


  const rating =
    Number(movie.vote_average || 0)
      .toFixed(1);


  return `

    <article class="movie-card">

      ${
        poster
        ?
        `
        <img
          class="movie-poster"
          src="${poster}"
          alt="${escapeHtml(movie.title || "")}"
          loading="lazy"
        >
        `
        :
        `
        <div
          class="movie-poster"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            color:#6b7280;
          "
        >
          NO IMAGE
        </div>
        `
      }


      <div class="movie-info">

        <h2 class="movie-title">
          ${escapeHtml(movie.title || "")}
        </h2>


        ${
          movie.original_title
          ?
          `
          <div class="original-title">
            ${escapeHtml(movie.original_title)}
          </div>
          `
          :
          ""
        }


        <div class="meta">
          公開日：${escapeHtml(release)}
        </div>


        <div class="meta">
          ⭐ ${rating}
        </div>


        ${
          movie.overview
          ?
          `
          <div class="overview">
            ${escapeHtml(movie.overview)}
          </div>
          `
          :
          ""
        }


        <button
          class="detail-button"
          type="button"
          onclick="openDetail(${movie.id})"
        >
          作品詳細を見る
        </button>

      </div>

    </article>

  `;

}


/* ========================================================
   詳細を開く
======================================================== */

async function openDetail(id){

  detailModal.classList.add("open");

  document.body.classList.add("modal-open");


  detailHeaderTitle.textContent =
    "作品詳細";


  detailContent.innerHTML =
    `
    <div class="detail-loading">
      🔍 作品情報を読み込んでいます...
    </div>
    `;


  try{

    const response =
      await fetch(
        "/api/search?id=" +
        encodeURIComponent(id)
      );


    const text =
      await response.text();


    let data;


    try{

      data =
        JSON.parse(text);

    }catch(error){

      throw new Error(
        "作品情報を取得できませんでした。"
      );

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        "作品情報を取得できませんでした。"
      );

    }


    window.currentMovieTitle =
      data.title ||
      data.original_title ||
      "";


    detailHeaderTitle.textContent =
      data.title ||
      data.original_title ||
      "作品詳細";


    detailContent.innerHTML =
      createDetail(data);


    /*
     * 新しい作品の詳細を表示したら、
     * 詳細画面の一番上へ戻す
     */

    const detailWindow =
      document.querySelector(
        ".detail-window"
      );

    if(detailWindow){

      detailWindow.scrollTop = 0;

    }


  }catch(error){

    console.error(
      "Detail error:",
      error
    );


    detailContent.innerHTML =
      '<div class="error">' +
      '❌ ' +
      escapeHtml(
        error.message ||
        "作品情報を取得できませんでした。"
      ) +
      '</div>';

  }

}


/* ========================================================
   詳細を閉じる
======================================================== */

function closeDetail(){

  detailModal.classList.remove("open");

  document.body.classList.remove("modal-open");

  detailContent.innerHTML = "";

}


/* ========================================================
   詳細HTML
======================================================== */

function createDetail(movie){

  let html = "";


  /* =========================
     配信
  ========================== */

  html +=
    '<h3>📺 この作品はどこで見られる？</h3>';


  html +=
    '<div class="streaming-section">';


  html += createProviderGroup(
    "🟢 見放題",
    movie.streaming || [],
    movie
  );


  html += createProviderGroup(
    "🎞️ レンタル",
    movie.rental || [],
    movie
  );


  html += createProviderGroup(
    "💰 購入",
    movie.purchase || [],
    movie
  );


  const hasProviders =
    (
      Array.isArray(movie.streaming) &&
      movie.streaming.length
    ) ||
    (
      Array.isArray(movie.rental) &&
      movie.rental.length
    ) ||
    (
      Array.isArray(movie.purchase) &&
      movie.purchase.length
    );


  if(!hasProviders){

    html +=
      '<div class="empty">' +
      '現在、配信情報を取得できませんでした。' +
      '</div>';

  }


  html +=
    '</div>';


  /* =========================
     監督
  ========================== */

  if(movie.director){

    html +=
      '<h3>🎬 監督</h3>';


    html +=
      '<div class="person">' +
      escapeHtml(
        movie.director.name || ""
      ) +
      '</div>';

  }


  /* =========================
     出演者
  ========================== */

  if(
    Array.isArray(movie.cast) &&
    movie.cast.length
  ){

    html +=
      '<h3>👥 出演者</h3>';


    html +=
      '<div class="people">';


    movie.cast.forEach(
      function(person){

        html +=
          '<div class="person">' +
          escapeHtml(
            person.name || ""
          ) +
          '</div>';

      }
    );


    html +=
      '</div>';

  }


  /* =========================
     シリーズ
  ========================== */

  if(
    movie.series &&
    Array.isArray(movie.series.movies) &&
    movie.series.movies.length
  ){

    html +=
      '<h3>🎞️ シリーズ</h3>';


    html +=
      '<div class="series-name">' +
      escapeHtml(
        movie.series.name || ""
      ) +
      '</div>';


    html +=
      '<div class="series">';


    movie.series.movies.forEach(
      function(item){

        const poster =
          item.poster_path
            ? "https://image.tmdb.org/t/p/w300" +
              item.poster_path
            : "";


        /*
         * ここが今回の重要な変更です。
         *
         * シリーズ作品をクリックすると
         * その作品の詳細画面を開きます。
         */

        html += `

          <div
            class="series-item"
            onclick="openDetail(${item.id})"
            title="この作品の詳細を見る"
          >

            ${
              poster
              ?
              `
              <img
                src="${poster}"
                alt="${escapeHtml(item.title || "")}"
                loading="lazy"
              >
              `
              :
              `
              <div
                style="
                  width:100%;
                  aspect-ratio:2/3;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  color:#6b7280;
                  background:#e5e7eb;
                  border-radius:7px;
                "
              >
                NO IMAGE
              </div>
              `
            }

            <div class="series-item-title">
              ${escapeHtml(item.title || "")}
            </div>

          </div>

        `;

      }
    );


    html +=
      '</div>';

  }


  return html;

}


/* ========================================================
   配信サービス表示
======================================================== */

function createProviderGroup(
  title,
  providers,
  movie
){

  if(
    !Array.isArray(providers) ||
    !providers.length
  ){

    return "";

  }


  let html =
    '<div class="provider-group">';


  html +=
    '<div class="provider-group-title">' +
    title +
    '</div>';


  html +=
    '<div class="provider-list">';


  providers.forEach(
    function(provider){

      if(!provider){
        return;
      }


      const name =
        provider.provider_name ||
        provider.name ||
        "";


      const logo =
        provider.logo_path
          ? "https://image.tmdb.org/t/p/w92" +
            provider.logo_path
          : "";


      const link =
        getProviderLink(
          name,
          provider,
          movie
        );


      let buttonClass =
        "watch-button";


      const lowerName =
        name.toLowerCase();


      if(
        lowerName.includes("netflix")
      ){

        buttonClass +=
          " netflix";

      }


      if(
        lowerName.includes("amazon") ||
        lowerName.includes("prime")
      ){

        buttonClass +=
          " amazon";

      }


      html += `

        <div class="provider">

          <div class="provider-top">

            ${
              logo
              ?
              `
              <img
                class="provider-logo"
                src="${logo}"
                alt=""
              >
              `
              :
              ""
            }

            <div class="provider-name">
              ${escapeHtml(name)}
            </div>

          </div>


          <div class="provider-type">
            ${escapeHtml(
              getProviderType(title)
            )}
          </div>


          ${
            link
            ?
            `
            <a
              class="${buttonClass}"
              href="${escapeHtml(link)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${escapeHtml(
                getButtonText(name)
              )}
            </a>
            `
            :
            ""
          }

        </div>

      `;

    }
  );


  html +=
    '</div></div>';


  return html;

}


/* ========================================================
   配信種別
======================================================== */

function getProviderType(title){

  if(
    title.includes("見放題")
  ){

    return "見放題";

  }


  if(
    title.includes("レンタル")
  ){

    return "レンタル";

  }


  if(
    title.includes("購入")
  ){

    return "購入";

  }


  return "";

}


/* ========================================================
   ボタン
======================================================== */

function getButtonText(name){

  const lower =
    String(name || "")
      .toLowerCase();


  if(
    lower.includes("netflix")
  ){

    return "Netflixで見る →";

  }


  if(
    lower.includes("amazon") ||
    lower.includes("prime")
  ){

    return "Prime Videoで見る →";

  }


  return name + "で見る →";

}


/* ========================================================
   配信リンク
======================================================== */

function getProviderLink(
  name,
  provider,
  movie
){

  const lower =
    String(name || "")
      .toLowerCase();


  /* =========================
     Netflix
  ========================== */

  if(
    lower.includes("netflix")
  ){

    const urls = [

      provider.provider_url,

      provider.watch_link,

      provider.netflix_url,

      provider.url,

      provider.link,

      movie.netflix_url

    ];


    for(
      let i = 0;
      i < urls.length;
      i++
    ){

      const normalized =
        normalizeNetflixUrl(
          urls[i]
        );


      if(normalized){

        return normalized;

      }

    }


    /*
     * Netflix作品IDが取得できない場合だけ
     * Netflix検索ページへ。
     */

    return createNetflixSearchUrl(
      movie.title ||
      movie.original_title ||
      window.currentMovieTitle ||
      ""
    );

  }


  /* =========================
     Amazon Prime Video
  ========================== */

  if(
    lower.includes("amazon") ||
    lower.includes("prime")
  ){

    const urls = [

      provider.provider_url,

      provider.watch_link,

      provider.url,

      provider.link

    ];


    for(
      let i = 0;
      i < urls.length;
      i++
    ){

      const url =
        urls[i];


      if(
        typeof url === "string" &&
        /^https?:\/\//i.test(url)
      ){

        return url;

      }

    }


    /*
     * 本編URLが取得できない場合のみ
     * Amazon Prime Video検索へ。
     */

    return createAmazonSearchUrl(
      movie.title ||
      movie.original_title ||
      window.currentMovieTitle ||
      ""
    );

  }


  /* =========================
     その他
  ========================== */

  const urls = [

    provider.provider_url,

    provider.watch_link,

    provider.url,

    provider.link

  ];


  for(
    let i = 0;
    i < urls.length;
    i++
  ){

    if(
      typeof urls[i] === "string" &&
      /^https?:\/\//i.test(urls[i])
    ){

      return urls[i];

    }

  }


  return null;

}


/* ========================================================
   Netflix URL
======================================================== */

function normalizeNetflixUrl(url){

  if(
    typeof url !== "string" ||
    !url.trim()
  ){

    return null;

  }


  const clean =
    url.trim();


  /*
   * /title/数字
   */

  const titleMatch =
    clean.match(
      /netflix\.com\/(?:[^/]+\/)?title\/(\d+)/i
    );


  if(titleMatch){

    return (
      "https://www.netflix.com/jp/title/" +
      encodeURIComponent(
        titleMatch[1]
      )
    );

  }


  /*
   * /watch/数字
   */

  const watchMatch =
    clean.match(
      /netflix\.com\/(?:[^/]+\/)?watch\/(\d+)/i
    );


  if(watchMatch){

    return (
      "https://www.netflix.com/jp/title/" +
      encodeURIComponent(
        watchMatch[1]
      )
    );

  }


  /*
   * NetflixのURLなら使用
   */

  if(
    /^https?:\/\/(?:www\.)?netflix\.com\//i
      .test(clean)
  ){

    return clean;

  }


  return null;

}


/* ========================================================
   Netflix検索
======================================================== */

function createNetflixSearchUrl(title){

  const clean =
    String(title || "")
      .trim();


  if(!clean){

    return "https://www.netflix.com/jp/";

  }


  return (
    "https://www.netflix.com/jp/search?q=" +
    encodeURIComponent(clean)
  );

}


/* ========================================================
   Amazon検索
======================================================== */

function createAmazonSearchUrl(title){

  const clean =
    String(title || "")
      .trim();


  return (
    "https://www.amazon.co.jp/s?k=" +
    encodeURIComponent(clean) +
    "&i=instant-video"
  );

}


/* ========================================================
   日付
======================================================== */

function formatDate(date){

  const parts =
    String(date).split("-");


  if(parts.length !== 3){

    return date;

  }


  return (
    Number(parts[0]) +
    "年" +
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}


/* ========================================================
   HTMLエスケープ
======================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
