.service-watch-button{

.series-list{

.series-item{

.series-item:hover{

.series-poster{

<body>

<header>

<h1 onclick="goHome()">
🎬 ドコデミレル？
</h1>

<p>
映画がどこで観られるか検索
</p>

</header>

<div class="container">

<div class="box">

<h2>🎬 映画を検索</h2>

<div class="search">

<input
id="movie"
type="text"
placeholder="例：トップガン"

>

<button
class="search-button"
id="searchButton"

>

🔍 検索 </button>

</div>

<div id="result"></div>

</div>

</div>

<script>

let lastSearchQuery = "";


/* =========================================================
   ページ読み込み
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    const input =
      document.getElementById("movie");

    const button =
      document.getElementById("searchButton");


    input.addEventListener(
      "keydown",
      function(event){

        if(event.key === "Enter"){

          event.preventDefault();

          searchMovie();

        }

      }
    );


    button.addEventListener(
      "click",
      function(){

        searchMovie();

      }
    );


    const params =
      new URLSearchParams(
        window.location.search
      );

    const movieId =
      params.get("id");


    if(movieId){

      searchMovieById(
        movieId,
        false
      );

    }

  }
);


/* =========================================================
   ホーム
========================================================= */

function goHome(){

  window.location.href =
    window.location.pathname;

}


/* =========================================================
   映画検索
========================================================= */

async function searchMovie(){

  const movieInput =
    document.getElementById("movie");

  const result =
    document.getElementById("result");

  const movie =
    movieInput.value.trim();


  if(!movie){

    result.innerHTML =
      "<div class='error'>" +
      "映画名を入力してください。" +
      "</div>";

    return;

  }


  lastSearchQuery =
    movie;


  window.history.pushState(
    {
      page:"search"
    },
    "",
    window.location.pathname
  );


  result.innerHTML =
    "<div class='loading'>" +
    "🔍 映画を検索しています……" +
    "</div>";


  try{

    const response =
      await fetch(
        "/api/search?query=" +
        encodeURIComponent(movie),
        {
          method:"GET",
          headers:{
            "Accept":
              "application/json"
          }
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        getApiErrorMessage(
          data,
          "検索できませんでした"
        )
      );

    }


    if(
      !data ||
      !Array.isArray(data.results) ||
      data.results.length === 0
    ){

      result.innerHTML =
        "<div class='error'>" +
        "映画が見つかりませんでした。" +
        "</div>";

      return;

    }


    data.results.sort(
      function(a,b){

        const dateA =
          a.release_date &&
          /^\d{4}-\d{2}-\d{2}$/.test(
            a.release_date
          )
            ? a.release_date
            : "9999-99-99";

        const dateB =
          b.release_date &&
          /^\d{4}-\d{2}-\d{2}$/.test(
            b.release_date
          )
            ? b.release_date
            : "9999-99-99";

        return dateA.localeCompare(dateB);

      }
    );


    let html = "";

    html +=
      "<h2 class='result-title'>" +
      "🔎 「" +
      escapeHtml(movie) +
      "」の検索結果 " +
      data.results.length +
      "件" +
      "</h2>";


    data.results.forEach(
      function(item){

        html +=
          createMovieCard(item);

      }
    );


    result.innerHTML =
      html;


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });


  }catch(error){

    console.error(
      "検索エラー:",
      error
    );


    result.innerHTML =
      "<div class='error'>" +
      "❌ " +
      escapeHtml(
        getErrorMessage(
          error
        )
      ) +
      "</div>";

  }

}


/* =========================================================
   APIエラー処理
========================================================= */

function getApiErrorMessage(
  data,
  fallback
){

  if(
    data &&
    typeof data.error === "string"
  ){

    return data.error;

  }

  if(
    data &&
    data.error &&
    typeof data.error.message === "string"
  ){

    return data.error.message;

  }

  return fallback;

}


/* =========================================================
   エラー処理
========================================================= */

function getErrorMessage(
  error
){

  if(
    error instanceof Error &&
    error.message
  ){

    return error.message;

  }

  if(
    typeof error === "string"
  ){

    return error;

  }

  if(
    error &&
    typeof error === "object"
  ){

    if(
      typeof error.message === "string"
    ){

      return error.message;

    }

    if(
      typeof error.error === "string"
    ){

      return error.error;

    }

    try{

      return JSON.stringify(error);

    }catch(e){

      return "検索中にエラーが発生しました";

    }

  }

  return "検索中にエラーが発生しました";

}


/* =========================================================
   映画カード
========================================================= */

function createMovieCard(movie){

  let html =
    "<div class='movie-card'>";


  if(movie.poster_path){

    html +=
      "<img " +
      "class='movie-poster' " +
      "src='https://image.tmdb.org/t/p/w500" +
      escapeAttribute(
        movie.poster_path
      ) +
      "' " +
      "alt='" +
      escapeAttribute(
        movie.title ||
        ""
      ) +
      "'>";

  }else{

    html +=
      "<div class='no-poster'>" +
      "🎬<br>画像なし" +
      "</div>";

  }


  html +=
    "<div class='movie-info'>";


  html +=
    "<h3 class='movie-title'>" +
    escapeHtml(
      movie.title ||
      "タイトル不明"
    ) +
    "</h3>";


  if(movie.original_title){

    html +=
      "<div class='movie-original'>" +
      escapeHtml(
        movie.original_title
      ) +
      "</div>";

  }


  if(movie.release_date){

    html +=
      "<span class='movie-year'>" +
      "📅 " +
      escapeHtml(
        String(
          movie.release_date
        ).substring(0,4)
      ) +
      "年" +
      "</span>";

  }


  if(
    movie.vote_average !== undefined &&
    movie.vote_average !== null &&
    Number(movie.vote_average) > 0
  ){

    html +=
      "<span class='movie-rating'>" +
      "⭐ " +
      Number(
        movie.vote_average
      ).toFixed(1) +
      " / 10" +
      "</span>";

  }


  if(movie.overview){

    html +=
      "<p class='movie-overview'>" +
      escapeHtml(
        movie.overview
      ) +
      "</p>";

  }


  html +=
    "<a " +
    "class='detail-button' " +
    "href='?id=" +
    encodeURIComponent(
      movie.id
    ) +
    "'>" +
    "▶ 詳細を見る" +
    "</a>";


  html +=
    "</div>";


  html +=
    "</div>";


  return html;

}


/* =========================================================
   詳細ページ
========================================================= */

async function searchMovieById(
  movieId,
  updateUrl = true
){

  const result =
    document.getElementById("result");


  if(!movieId){

    result.innerHTML =
      "<div class='error'>" +
      "作品IDがありません。" +
      "</div>";

    return;

  }


  if(updateUrl){

    window.history.pushState(
      {
        page:"detail",
        id:String(movieId)
      },
      "",
      window.location.pathname +
      "?id=" +
      encodeURIComponent(movieId)
    );

  }


  result.innerHTML =
    "<div class='loading'>" +
    "🔍 作品情報を読み込んでいます……" +
    "</div>";


  try{

    const response =
      await fetch(
        "/api/search?id=" +
        encodeURIComponent(movieId),
        {
          method:"GET",
          headers:{
            "Accept":
              "application/json"
          }
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        getApiErrorMessage(
          data,
          "作品情報を取得できませんでした"
        )
      );

    }


    renderDetailPage(data);


  }catch(error){

    console.error(
      "詳細取得エラー:",
      error
    );


    result.innerHTML =
      "<div class='error'>" +
      "❌ " +
      escapeHtml(
        getErrorMessage(error)
      ) +
      "</div>";

  }

}


/* =========================================================
   詳細ページ表示
========================================================= */

function renderDetailPage(data){

  const result =
    document.getElementById("result");


  let html =
    "<div class='detail-card'>";


  html +=
    "<div " +
    "class='back-button' " +
    "onclick='backToSearchResults()'>" +
    "← 検索結果に戻る" +
    "</div>";


  html +=
    "<div class='detail-header'>";


  if(data.poster_path){

    html +=
      "<img " +
      "class='detail-poster' " +
      "src='https://image.tmdb.org/t/p/w500" +
      escapeAttribute(
        data.poster_path
      ) +
      "' " +
      "alt='" +
      escapeAttribute(
        data.title ||
        ""
      ) +
      "'>";

  }


  html +=
    "<div class='detail-info'>";


  html +=
    "<h2 class='detail-title'>" +
    "🎬 " +
    escapeHtml(
      data.title ||
      "タイトル不明"
    ) +
    "</h2>";


  if(data.original_title){

    html +=
      "<div class='detail-original'>" +
      escapeHtml(
        data.original_title
      ) +
      "</div>";

  }


  html +=
    "<div class='detail-meta'>";


  if(data.release_date){

    html +=
      "<span class='meta-item'>" +
      "📅 " +
      escapeHtml(
        data.release_date
      ) +
      "</span>";

  }


  if(
    Array.isArray(data.genres) &&
    data.genres.length
  ){

    html +=
      "<span class='meta-item'>" +
      "🎭 " +
      data.genres
        .map(
          function(genre){

            return escapeHtml(
              genre.name || ""
            );

          }
        )
        .join(" / ") +
      "</span>";

  }


  html +=
    "</div>";


  if(
    data.vote_average !== undefined &&
    data.vote_average !== null &&
    Number(data.vote_average) > 0
  ){

    html +=
      "<div class='rating-box'>" +
      "⭐ TMDB評価 " +
      Number(
        data.vote_average
      ).toFixed(1) +
      " / 10" +
      "</div>";

  }


  if(data.director){

    html +=
      "<p>" +
      "🎬 監督：<strong>" +
      escapeHtml(
        data.director.name ||
        ""
      ) +
      "</strong>" +
      "</p>";

  }


  if(
    Array.isArray(data.cast) &&
    data.cast.length
  ){

    html +=
      "<p>" +
      "👤 出演：" +
      data.cast
        .slice(0,8)
        .map(
          function(person){

            return escapeHtml(
              person.name ||
              ""
            );

          }
        )
        .join("、") +
      "</p>";

  }


  html +=
    createLanguageBox(
      data.language
    );


  html +=
    "</div>";


  html +=
    "</div>";


  if(data.overview){

    html +=
      "<div class='detail-section'>" +

      "<h3>📝 あらすじ</h3>" +

      "<p class='overview'>" +

      escapeHtml(
        data.overview
      ) +

      "</p>" +

      "</div>";

  }


  /* =====================================================
     配信情報
  ===================================================== */

  html +=
    "<div class='detail-section'>" +

    "<h3>📺 この作品はどこで見られる？</h3>";


  html +=
    "<div class='service-group'>" +

    "<h4 class='service-title'>" +
    "🟢 見放題" +

  html +=
    "<div class='service-group'>" +

    "<h4 class='service-title'>" +

    "</h4>" +

    createServiceCards(
      data.rental,
      data.title,
      "rental",
      data
    ) +

    "</div>";


  html +=
    "<div class='service-group'>" +

    "<h4 class='service-title'>" +
    "🔵 購入" +
    "</h4>" +

    createServiceCards(
      data.purchase,
      data.title,
      "purchase",
      data
    ) +

    "</div>";


  if(data.link){

    html +=
      "<a " +
      "class='tmdb-link' " +
      "href='" +
      escapeAttribute(
        data.link
      ) +
      "' " +
      "target='_blank' " +
      "rel='noopener noreferrer'>" +
      "配信情報の詳細を見る →" +
      "</a>";

  }


  html +=
    "</div>";


  /* =====================================================
     シリーズ
  ===================================================== */

  if(
    data.series &&
    Array.isArray(
      data.series.movies
    ) &&
    data.series.movies.length
  ){

    html +=
      "<div class='detail-section'>" +

      "<h3>🎞️ シリーズ作品</h3>";


    if(data.series.name){

      html +=
        "<p><strong>" +
        escapeHtml(
          data.series.name
        ) +
        "</strong></p>";

    }


    html +=
      "<div class='series-list'>";


    const sortedSeries =
      [...data.series.movies]
        .sort(
          function(a,b){

            const dateA =
              a.release_date ||
              "9999-99-99";

            const dateB =
              b.release_date ||
              "9999-99-99";

            return dateA.localeCompare(
              dateB
            );

          }
        );


    sortedSeries.forEach(
      function(seriesMovie){

        if(
          !seriesMovie ||
          !seriesMovie.id ||
          !seriesMovie.title
        ){

          return;

        }


        html +=
          "<a " +
          "class='series-item' " +
          "href='?id=" +
          encodeURIComponent(
            seriesMovie.id
          ) +
          "'>";


        if(seriesMovie.poster_path){

          html +=
            "<img " +
            "class='series-poster' " +
            "src='https://image.tmdb.org/t/p/w200" +
            escapeAttribute(
              seriesMovie.poster_path
            ) +
            "' " +
            "alt='" +
            escapeAttribute(
              seriesMovie.title
            ) +
            "'>";

        }else{

          html +=
            "<div class='series-poster'></div>";

        }


        html +=
          "<div class='series-info'>";


        html +=
          "<div class='series-title'>" +
          escapeHtml(
            seriesMovie.title
          ) +
          "</div>";


        if(seriesMovie.release_date){

          html +=
            "<div class='series-year'>" +
            escapeHtml(
              String(
                seriesMovie.release_date
              ).substring(0,4)
            ) +
            "年" +
            "</div>";

        }


        html +=
          "</div>";


        html +=
          "</a>";

      }
    );


    html +=
      "</div>" +
      "</div>";

  }


  html +=
    "</div>";


  result.innerHTML =
    html;


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

/* =========================================================
   字幕・吹き替え
========================================================= */

function createLanguageBox(
  language
){

  if(!language){

    return "";

  }


  const original =
    language.original_language ||
    null;


  const subtitle =
    language.subtitle ||
    null;


  const dubbing =
    language.dubbing ||
    null;


  if(
    !original &&
    !subtitle &&
    !dubbing
  ){

    return "";

  }


  let html =
    "<div class='language-box'>";


  html +=
    "<div class='language-title'>" +
    "🗣️ 字幕・吹き替え" +
    "</div>";


  if(original){

    html +=
      "<span class='language-item'>" +
      "原語：" +
      escapeHtml(
        getLanguageName(original)
      ) +
      "</span>";

  }


  if(subtitle){

    html +=
      "<span class='language-item'>" +
      "字幕：" +
      escapeHtml(
        formatLanguageValue(
          subtitle
        )
      ) +
      "</span>";

  }


  if(dubbing){

    html +=
      "<span class='language-item'>" +
      "吹き替え：" +
      escapeHtml(
        formatLanguageValue(
          dubbing
        )
      ) +
      "</span>";

  }


  html +=
    "</div>";


  return html;

}


function getLanguageName(code){

  const languages = {

    ja:"日本語",
    en:"英語",
    fr:"フランス語",
    de:"ドイツ語",
    es:"スペイン語",
    it:"イタリア語",
    ko:"韓国語",
    zh:"中国語",
    hi:"ヒンディー語",
    pt:"ポルトガル語",
    ru:"ロシア語"

  };


  return (
    languages[code] ||
    code
  );

}


function formatLanguageValue(value){

  if(Array.isArray(value)){

    return value.join(
      " / "
    );

  }


  return String(value);

}


/* =========================================================
   配信サービスカード
========================================================= */

function createServiceCards(
  services,
  title,
  type,
  movieData
){

  if(
    !Array.isArray(services) ||
    services.length === 0
  ){

    return (
      "<div class='no-service'>" +
      "この種類の配信情報はありません" +
      "</div>"
    );

  }


  let html =
    "<div class='service-grid'>";


  const used = {};


  services.forEach(
    function(service){

      if(!service){

        return;

      }


      const providerName =
        service.provider_name ||
        service.name ||
        service.providerName ||
        service.clearName ||
        "";


      if(!providerName){

        return;

      }


      const cleanProviderName =
        String(
          providerName
        ).trim();


      if(!cleanProviderName){

        return;

      }


      const key =
        cleanProviderName
          .toLowerCase();


      if(used[key]){

        return;

      }


      used[key] = true;


      const serviceInfo =
        getServiceInfo(
          cleanProviderName
        );


      const serviceResult =
        getServiceUrl(
          cleanProviderName,
          title,
          service,
          movieData
        );


      if(
        !serviceResult ||
        !serviceResult.url
      ){

        return;

      }


      let statusText =
        "見放題";

      let statusClass =
        "status-streaming";

      let buttonText =
        cleanProviderName +
        "で見る →";

      let buttonBackground =
        "#2563eb";


      if(type === "rental"){

        statusText =
          "レンタル";

        statusClass =
          "status-rental";

        buttonText =
          cleanProviderName +
          "でレンタル →";

        buttonBackground =
          "#f59e0b";

      }


      if(type === "purchase"){

        statusText =
          "購入";

        statusClass =
          "status-purchase";

        buttonText =
          cleanProviderName +
          "で購入 →";

        buttonBackground =
          "#7c3aed";

      }


      html +=
        "<div class='service-card'>";


      html +=
        "<div class='service-logo-row'>" +

        "<div " +
        "class='service-logo' " +
        "style='background:" +
        escapeAttribute(
          serviceInfo.background
        ) +
        "'>" +

        escapeHtml(
          serviceInfo.logo
        ) +

        "</div>" +

        "<div class='service-name'>" +

        escapeHtml(
          cleanProviderName
        ) +

        "</div>" +

        "</div>";


      html +=
        "<div class='service-status " +
        statusClass +
        "'>" +

        escapeHtml(
          statusText
        ) +

        "</div>";


      html +=
        "<a " +
        "class='service-watch-button' " +
        "href='" +
        escapeAttribute(
          serviceResult.url
        ) +
        "' " +
        "target='_blank' " +
        "rel='noopener noreferrer' " +
        "style='background:" +
        buttonBackground +
        "'>" +

        escapeHtml(
          buttonText
        ) +

        "</a>";


      if(
        serviceResult.note
      ){

        html +=
          "<div class='netflix-note'>" +
          escapeHtml(
            serviceResult.note
          ) +
          "</div>";

      }


      html +=
        "</div>";

    }
  );


  html +=
    "</div>";


  if(
    !html.includes(
      "service-card"
    )
  ){

    return (
      "<div class='no-service'>" +
      "配信サービス情報を取得できませんでした" +
      "</div>"
    );

  }


  return html;

}


/* =========================================================
   配信URL
========================================================= */

function getServiceUrl(
  providerName,
  title,
  service,
  movieData
){

  const name =
    String(
      providerName || ""
    ).toLowerCase();


  /* =====================================================
     Netflix
  ===================================================== */

  if(
    name.includes("netflix")
  ){

    const netflixId =
      getNetflixTitleId(
        service,
        movieData
      );


    /*
     * Netflix作品IDが取得できた場合
     * ↓
     * 直接作品ページ
     */

    if(netflixId){

      return {

        url:
          "https://www.netflix.com/jp/title/" +
          encodeURIComponent(
            netflixId
          ),

        note:
          "Netflix作品ページを開きます。"

      };

    }


    /*
     * Netflix作品URLが返ってきた場合
     */

    const netflixUrls = [

      service &&
      service.netflix_url,

      service &&
      service.provider_url,

      service &&
      service.watch_link,

      service &&
      service.url,

      service &&
      service.link,

      movieData &&
      movieData.netflix_url,

      movieData &&
      movieData.netflix_link,

      movieData &&
      movieData.netflixUrl,

      movieData &&
      movieData.netflix &&
      movieData.netflix.url,

      movieData &&
      movieData.netflix &&
      movieData.netflix.link

    ];


    for(
      let i = 0;
      i < netflixUrls.length;
      i++
    ){

      const validNetflixUrl =
        normalizeNetflixUrl(
          netflixUrls[i]
        );


      if(validNetflixUrl){

        return {

          url:
            validNetflixUrl,

          note:
            "Netflixの作品ページを開きます。"

        };

      }

    }


    /*
     * 最後の手段
     *
     * Netflixトップページではなく、
     * Netflix検索ページを使用
     */

    return {

      url:
        createNetflixSearchUrl(
          title
        ),

      note:
        "Netflix作品IDを取得できなかったため、Netflix内で作品名を検索します。"

    };

  }


  /* =====================================================
     Amazon Prime Video
  ===================================================== */

  if(
    name.includes("prime") ||
    name.includes("amazon")
  ){

    const url =
      getProviderUrl(
        service
      );


    if(url){

      return {
        url:url
      };

    }


    return {

      url:
        "https://www.amazon.co.jp/s?k=" +
        encodeURIComponent(title) +
        "&i=instant-video"

    };

  }


  /* =====================================================
     U-NEXT
  ===================================================== */

  if(
    name.includes("u-next")
  ){

    const url =
      getProviderUrl(
        service
      );


    if(url){

      return {
        url:url
      };

    }


    return {

      url:
        "https://video.unext.jp/search?query=" +
        encodeURIComponent(title)

    };

  }


  /* =====================================================
     Hulu
  ===================================================== */

  if(
    name.includes("hulu")
  ){

    const url =
      getProviderUrl(
        service
      );


    if(url){

      return {
        url:url
      };

    }


    return {

      url:
        "https://www.hulu.jp/search?q=" +
        encodeURIComponent(title)

    };

  }


  /* =====================================================
     Disney+
  ===================================================== */

  if(
    name.includes("disney")
  ){

    const url =
      getProviderUrl(
        service
      );


    if(url){

      return {
        url:url
      };

    }


    return {

      url:
        "https://www.disneyplus.com/ja-jp/search/" +
        encodeURIComponent(title)

    };

  }


  /* =====================================================
     Apple TV
  ===================================================== */

  if(
    name.includes("apple")
  ){

    const url =
      getProviderUrl(
        service
      );


    if(url){

      return {
        url:url
      };

    }


    return {

      url:
        "https://tv.apple.com/jp/search?term=" +
        encodeURIComponent(title)

    };

  }


  /* =====================================================
     FOD
  ===================================================== */

  if(
    name.includes("fod")
  ){

    const url =
      getProviderUrl(
        service
      );


    if(url){

      return {
        url:url
      };

    }


    return {

      url:
        "https://fod.fujitv.co.jp/search/?keyword=" +
        encodeURIComponent(title)

    };

  }


  /* =====================================================
     Google Play
  ===================================================== */

  if(
    name.includes("google")
  ){

    const url =
      getProviderUrl(
        service
      );


    if(url){

      return {
        url:url
      };

    }


    return {

      url:
        "https://play.google.com/store/search?q=" +
        encodeURIComponent(title) +
        "&c=movies&hl=ja"

    };

  }


  /* =====================================================
     その他
  ===================================================== */

  const providerUrl =
    getProviderUrl(
      service
    );


  if(providerUrl){

    return {

      url:
        providerUrl

    };

  }


  return {

    url:
      "https://www.google.com/search?q=" +
      encodeURIComponent(
        providerName +
        " " +
        title
      )

  };

}


/* =========================================================
   サービスからURL取得
========================================================= */

function getProviderUrl(
  service
){

  if(!service){

    return null;

  }


  const candidates = [

    service.provider_url,

    service.watch_link,

    service.url,

    service.link

  ];


  for(
    let i = 0;
    i < candidates.length;
    i++
  ){

    if(
      isUsableUrl(
        candidates[i]
      )
    ){

      return candidates[i];

    }

  }


  return null;

}


/* =========================================================
   Netflix作品ID取得
========================================================= */

function getNetflixTitleId(
  service,
  movieData
){

  const candidates = [

    service &&
    service.netflix_title_id,

    service &&
    service.netflix_id,

    service &&
    service.title_id,

    service &&
    service.netflixTitleId,

    service &&
    service.netflixTitleID,

    service &&
    service.netflixId,

    movieData &&
    movieData.netflix_title_id,

    movieData &&
    movieData.netflix_id,

    movieData &&
    movieData.title_id,

    movieData &&
    movieData.netflixTitleId,

    movieData &&
    movieData.netflixTitleID,

    movieData &&
    movieData.netflixId,

    movieData &&
    movieData.netflix &&
    movieData.netflix.title_id,

    movieData &&
    movieData.netflix &&
    movieData.netflix.netflix_title_id,

    movieData &&
    movieData.netflix &&
    movieData.netflix.netflix_id

  ];


  for(
    let i = 0;
    i < candidates.length;
    i++
  ){

    const value =
      candidates[i];


    if(
      value !== undefined &&
      value !== null &&
      /^\d+$/.test(
        String(value).trim()
      )
    ){

      return String(value).trim();

    }

  }


  const urls = [

    service &&
    service.netflix_url,

    service &&
    service.provider_url,

    service &&
    service.watch_link,

    service &&
    service.url,

    service &&
    service.link,

    movieData &&
    movieData.netflix_url,

    movieData &&
    movieData.netflix_link,

    movieData &&
    movieData.netflixUrl,

    movieData &&
    movieData.netflix &&
    movieData.netflix.url,

    movieData &&
    movieData.netflix &&
    movieData.netflix.link

  ];


  for(
    let i = 0;
    i < urls.length;
    i++
  ){

    const id =
      extractNetflixTitleId(
        urls[i]
      );


    if(id){

      return id;

    }

  }


  return null;

}


/* =========================================================
   Netflix URL → ID
========================================================= */

function extractNetflixTitleId(
  url
){

  if(
    typeof url !== "string" ||
    !url
  ){

    return null;

  }


  const patterns = [

    /netflix\.com\/(?:[^/]+\/)?title\/(\d+)/i,

    /netflix\.com\/(?:[^/]+\/)?watch\/(\d+)/i,

    /netflix\.com\/title\/(\d+)/i,

    /netflix\.com\/watch\/(\d+)/i

  ];


  for(
    let i = 0;
    i < patterns.length;
    i++
  ){

    const match =
      url.match(
        patterns[i]
      );


    if(match){

      return match[1];

    }

  }


  return null;

}


/* =========================================================
   Netflix検索URL
========================================================= */

function createNetflixSearchUrl(
  title
){

  const cleanTitle =
    String(
      title || ""
    ).trim();


  /*
   * 空の検索は禁止
   */

  if(!cleanTitle){

    return "https://www.netflix.com/jp/";

  }


  /*
   * Netflixの検索ページ
   *
   * トップページではなく
   * 作品名付き検索URLを生成
   */

  return (
    "https://www.netflix.com/jp/search?q=" +
    encodeURIComponent(
      cleanTitle
    )
  );

}


/* =========================================================
   Netflix URL 正規化
========================================================= */

function normalizeNetflixUrl(
  url
){

  if(
    typeof url !== "string" ||
    !url
  ){

    return null;

  }


  const cleanUrl =
    url.trim();


  const id =
    extractNetflixTitleId(
      cleanUrl
    );


  if(id){

    return (
      "https://www.netflix.com/jp/title/" +
      encodeURIComponent(id)
    );

  }


  /*
   * Netflixのトップページは使用しない
   */

  if(
    /^https?:\/\/(?:www\.)?netflix\.com\/(?:jp\/)?$/i
      .test(cleanUrl)
  ){

    return null;

  }


  /*
   * Netflix検索ページは使用可能
   */

  if(
    /^https?:\/\/(?:www\.)?netflix\.com\/(?:jp\/)?search/i
      .test(cleanUrl)
  ){

    return cleanUrl;

  }


  /*
   * その他Netflix URL
   */

  if(
    /^https?:\/\/(?:www\.)?netflix\.com\//i
      .test(cleanUrl)
  ){

    return cleanUrl;

  }


  return null;

}


/* =========================================================
   URL判定
========================================================= */

function isUsableUrl(
  url
){

  return (
    typeof url === "string" &&
    /^https?:\/\//i.test(
      url.trim()
    )
  );

}

/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHtml(
  text
){

  if(
    text === null ||
    text === undefined
  ){

    return "";

  }


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(text);


  return div.innerHTML;

}


/* =========================================================
   属性エスケープ
========================================================= */

function escapeAttribute(
  text
){

  if(
    text === null ||
    text === undefined
  ){

    return "";

  }


  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#39;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    );

}
