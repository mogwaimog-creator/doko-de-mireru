<script>

/* =========================================================
   DOM
========================================================= */

const queryInput =
  document.getElementById(
    "query"
  );

const searchButton =
  document.getElementById(
    "searchButton"
  );

const status =
  document.getElementById(
    "status"
  );

const results =
  document.getElementById(
    "results"
  );

let currentPage = 1;
let currentQuery = "";
let isLoadingMore = false;

/* =========================================================
   映画検索
========================================================= */

async function searchMovies(){

  const query =
    queryInput.value.trim();

  currentPage = 1;
currentQuery = query;   


  sessionStorage.setItem(
    "dokoDeMireruLastQuery",
    query
  );


  /* -------------------------------------------------------
     空欄チェック
  ------------------------------------------------------- */

  if(!query){

    status.innerHTML =
      '<div class="error">' +
      '映画名を入力してください。' +
      '</div>';

    results.innerHTML =
      "";

    return;

  }


  /* -------------------------------------------------------
   検索中
------------------------------------------------------- */

searchButton.disabled =
  true;


/* -------------------------------------------------------
   検索結果見出し
------------------------------------------------------- */

const searchResultsHeading =
  document.getElementById(
    "searchResultsHeading"
  );

if(searchResultsHeading){

  searchResultsHeading.textContent =
    '🔍「' + query + '」の検索結果';

  searchResultsHeading.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

}


/* -------------------------------------------------------
   検索中
------------------------------------------------------- */

status.innerHTML =
  '<div class="status">' +
  '🔍 検索しています...' +
  '</div>';

results.innerHTML =
  "";


  try{


    /* -----------------------------------------------------
       API
    ----------------------------------------------------- */

    const apiUrl =
  "/api/search?query=" +
  encodeURIComponent(query) +
  "&page=" +
  currentPage;

    const response =
      await fetch(
        apiUrl
      );


    const text =
      await response.text();


    console.log(
      "API response:",
      text
    );


    let data;


    try{

      data =
        JSON.parse(
          text
        );

    }catch(error){

      throw new Error(
        "サーバーから正しいデータを取得できませんでした。"
      );

    }


    /* -----------------------------------------------------
       APIエラー
    ----------------------------------------------------- */

    if(!response.ok){

      throw new Error(
        data.error ||
        "検索に失敗しました。"
      );

    }


    /* -----------------------------------------------------
       結果
    ----------------------------------------------------- */

    const movies =
      Array.isArray(
        data.results
      )
        ? data.results
        : [];


    status.innerHTML =
      "";


    /* -----------------------------------------------------
       0件
    ----------------------------------------------------- */

    if(!movies.length){

  searchResultsHeading.textContent =
    '🔍「' + query + '」の検索結果（0件）';

  results.innerHTML =
    `
    <div class="empty">

      <div style="font-size:32px; margin-bottom:10px;">
        🎬
      </div>

      <div style="font-weight:bold; font-size:17px; margin-bottom:8px;">
        映画が見つかりませんでした。
      </div>

      <div>
        別の作品名で検索してみてください。
      </div>

    </div>
    `;

  return;

}


 /* -----------------------------------------------------
   検索結果の並び順

   ① タイトル完全一致
   ② タイトルに検索語を含む
   ③ TMDB評価の高い順
----------------------------------------------------- */

movies.sort(
  function(a, b){

    const normalizeTitle = function(title){

      return String(title || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "");

    };


    const titleA =
      normalizeTitle(a.title);

    const titleB =
      normalizeTitle(b.title);

    const q =
      normalizeTitle(query);


    /* ① タイトル完全一致 */

    const exactA =
      titleA === q;

    const exactB =
      titleB === q;


    if(exactA && !exactB){
      return -1;
    }

    if(exactB && !exactA){
      return 1;
    }


    /* ② タイトルに検索語を含む */

    const containsA =
      titleA.includes(q);

    const containsB =
      titleB.includes(q);


    if(containsA && !containsB){
      return -1;
    }

    if(containsB && !containsA){
      return 1;
    }


    /* ③ TMDB評価の高い順 */

    return (
      Number(b.vote_average || 0) -
      Number(a.vote_average || 0)
    );

  }
);


    /* -----------------------------------------------------
       表示
    ----------------------------------------------------- */

    /* -----------------------------------------------------
   検索結果件数
----------------------------------------------------- */

searchResultsHeading.textContent =
  '🔍「' + query + '」の検索結果（' +
  movies.length +
  '件）';


/* -----------------------------------------------------
   表示
----------------------------------------------------- */

results.innerHTML =
  movies
    .map(
      createMovieCard
    )
    .join("");

if (data.hasMore) {

  results.insertAdjacentHTML(
    "beforeend",
    `
    <div class="load-more-wrapper">
      <button
        id="loadMoreButton"
        type="button"
        class="load-more-button"
        onclick="loadMoreMovies()"
      >
        さらに20件表示
      </button>
    </div>
    `
  );

}
       

  }catch(error){

    console.error(
      "Search error:",
      error
    );


    status.innerHTML =
      `
      <div class="error">

        ❌

        ${escapeHtml(
          error.message ||
          "サーバーエラーが発生しました。"
        )}

      </div>
      `;


  }finally{

    searchButton.disabled =
      false;

  }

}

// =========================================================
// さらに20件表示
// =========================================================

async function loadMoreMovies() {

  const button =
    document.getElementById(
      "loadMoreButton"
    );


  if (!button) {
    return;
  }


  // =======================================================
  // 次のページ
  // =======================================================

  currentPage++;


  button.disabled = true;

  button.textContent =
    "読み込み中…";


  try {

    const apiUrl =
      "/api/search?query=" +
      encodeURIComponent(
        currentQuery
      ) +
      "&page=" +
      currentPage;


    const response =
      await fetch(
        apiUrl
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !Array.isArray(
        data.results
      )
    ) {

      throw new Error(
        data.error ||
        "追加の検索結果を取得できませんでした。"
      );

    }


    // =====================================================
    // ボタンを一旦削除
    // =====================================================

    const wrapper =
      button.closest(
        ".load-more-wrapper"
      );


    if (wrapper) {
      wrapper.remove();
    }


    // =====================================================
    // 追加作品を下に追加
    // =====================================================

    results.insertAdjacentHTML(
      "beforeend",
      data.results
        .map(
          createMovieCard
        )
        .join("")
    );


    // =====================================================
    // 件数更新
    // =====================================================

    const currentCount =
      results.querySelectorAll(
        ".movie-card"
      ).length;


    searchResultsHeading.textContent =
      '🔍「' +
      currentQuery +
      '」の検索結果（' +
      currentCount +
      '件）';


    // =====================================================
    // まだ次がある場合
    // =====================================================

    if (data.hasMore) {

      results.insertAdjacentHTML(
        "beforeend",
        `
        <div class="load-more-wrapper">
          <button
            id="loadMoreButton"
            type="button"
            class="load-more-button"
            onclick="loadMoreMovies()"
          >
            さらに20件表示
          </button>
        </div>
        `
      );

    }


  } catch(error) {

    console.error(
      "Load more error:",
      error
    );


    currentPage--;


    button.disabled = false;

    button.textContent =
      "さらに20件表示";


    status.innerHTML =
      `
      <div class="error">

        ${escapeHtml(
          error.message ||
          "追加の検索結果を取得できませんでした。"
        )}

      </div>
      `;


    // =====================================================
    // エラー時はボタンを戻す
    // =====================================================

    if (
      !document.getElementById(
        "loadMoreButton"
      )
    ) {

      results.insertAdjacentHTML(
        "beforeend",
        `
        <div class="load-more-wrapper">
          <button
            id="loadMoreButton"
            type="button"
            class="load-more-button"
            onclick="loadMoreMovies()"
          >
            さらに20件表示
          </button>
        </div>
        `
      );

    }

  }

}     

/* =========================================================

function createMovieCard(movie){

     ポスター
  ------------------------------------------------------- */

     評価
  ------------------------------------------------------- */

    Number(
      movie.vote_average || 0
    ).toFixed(1);


  /* -------------------------------------------------------
     TMDB ID
  ------------------------------------------------------- */

    String(
      movie.id || ""
    ).trim();


  /* -------------------------------------------------------
     詳細ページ
  ------------------------------------------------------- */

  const detailUrl =
    "./detail.html?id=" +
    encodeURIComponent(movieId);


  /* -------------------------------------------------------
     作品タイプ
  ------------------------------------------------------- */

  const mediaType =
    movie.media_type ||
    "映画";


  /* -------------------------------------------------------
     あらすじ
  ------------------------------------------------------- */

  const overview =
  String(
    movie.overview || ""
  ).trim();


/* -------------------------------------------------------
   検索結果用の短いあらすじ
------------------------------------------------------- */

/*
  個別に用意した短いあらすじ
  → 登録されている作品はこちらを優先
*/

const shortOverviewMap = {

  "インターステラー":
    "人類の存続をかけ、未知の領域へと旅立つ宇宙飛行士たちの壮大なSFアドベンチャー。"

};


/* -------------------------------------------------------
   短いあらすじ作成
------------------------------------------------------- */

const createShortOverview =
  function(text){

    const source =
      String(text || "").trim();

    if(!source){
      return "";
    }


    /*
      まず文章を句点などで区切る
    */

    const sentences =
      source
        .split(/(?<=[。！？])/)
        .map(
          function(sentence){
            return sentence.trim();
          }
        )
        .filter(
          function(sentence){
            return sentence.length > 0;
          }
        );


    /*
      最初の文章が短ければそのまま使用
    */

    if(
      sentences.length > 0 &&
      sentences[0].length <= 70
    ){

      return sentences[0];

    }


    /*
      最初の文章が長い場合、
      途中で切らずに複数の文章から
      70文字程度にまとめる
    */

    let result = "";


    for(
      let i = 0;
      i < sentences.length;
      i++
    ){

      const candidate =
        result
          ? result + sentences[i]
          : sentences[i];


      if(candidate.length > 75){
        break;
      }


      result = candidate;

    }


    /*
      文章が長すぎる場合は
      最後の文字を無理に切らない
    */

    if(result){
      return result;
    }


    /*
      どうしても短くできない場合のみ
      70文字程度で表示
    */

    return source.slice(0, 70) + "…";

  };


/* -------------------------------------------------------
   短いあらすじ取得
------------------------------------------------------- */

const shortOverview =
  shortOverviewMap[movie.title] ||
  createShortOverview(overview);


  /* -------------------------------------------------------
     配信サービス名
  ------------------------------------------------------- */

  const simplifyProviderName =
    function(name){

      name =
        String(name || "");


      if(name.includes("Netflix")){
        return "Netflix";
      }


      if(
        name.includes("Amazon Prime Video") ||
        name.includes("Anime Times Amazon Channel") ||
        name.includes("dAnime Amazon Channel")
      ){
        return "Prime Video";
      }


      if(name.includes("Hulu")){
        return "Hulu";
      }


      if(name.includes("U-NEXT")){
        return "U-NEXT";
      }


      if(name.includes("Disney")){
        return "Disney+";
      }


      return name;

    };


  /* -------------------------------------------------------
     配信サービス取得
  ------------------------------------------------------- */

  const getProviders =
    function(providers){

      const list = [];


      (
        Array.isArray(providers)
          ? providers
          : []
      )
      .forEach(
        function(provider){

          const simpleName =
            simplifyProviderName(
              provider.provider_name || ""
            );


          if(
            simpleName &&
            !list.some(
              function(item){

                return item.name === simpleName;

              }
            )
          ){

            list.push({

              name:
                simpleName,

              logo_path:
                provider.logo_path || ""

            });

          }

        }
      );


      return list;

    };


  /* -------------------------------------------------------
     配信ロゴ表示
  ------------------------------------------------------- */

  const renderProviders =
    function(providers){

      return providers
        .map(
          function(provider){

            const logo =
              provider.logo_path
                ? "https://image.tmdb.org/t/p/w92" +
                  provider.logo_path
                : "";


            return `
            <div class="provider-item">
                ${
                  logo

                    ?

                    `
                    <img
                      class="provider-logo"
                      src="${logo}"
                      alt="${escapeHtml(provider.name)}のロゴ"
                      loading="lazy"
                    >
                    `

                    :

                    `
                    <div class="provider-logo-fallback">
                      ${escapeHtml(provider.name)}
                    </div>
                    `
                }

                <span>
                  ${escapeHtml(provider.name)}
                </span>

              </div>
            `;

          }
        )
        .join("");

    };


  /* -------------------------------------------------------
     配信情報
  ------------------------------------------------------- */

  const streamingProviders =
    getProviders(
      movie.streaming
    );


  const rentalProviders =
    getProviders(

      (
        Array.isArray(movie.rental)
          ? movie.rental
          : []
      )
      .concat(

        Array.isArray(movie.purchase)
          ? movie.purchase
          : []

      )

    );


  /* -------------------------------------------------------
     配信パネル
  ------------------------------------------------------- */

  let availabilityHtml = "";


  if(
    streamingProviders.length > 0
  ){

    availabilityHtml = `

      <aside
        class="availability-panel streaming"
        aria-label="配信情報"
      >

        <h3
          class="
            availability-heading
            availability-streaming
          "
        >
          🟢 配信中
        </h3>


        <div class="provider-list">

          ${renderProviders(
            streamingProviders
          )}

        </div>

      </aside>

    `;

  }

  else if(
    rentalProviders.length > 0
  ){

    availabilityHtml = `

      <aside
        class="availability-panel rental"
        aria-label="レンタル・購入情報"
      >

        <h3
          class="
            availability-heading
            availability-rental
          "
        >
          🟠 レンタル・購入で視聴できます
        </h3>


        <div class="provider-list">

          ${renderProviders(
            rentalProviders
          )}

        </div>

      </aside>

    `;

  }

  else{

    availabilityHtml = `

      <aside
        class="availability-panel none"
        aria-label="配信情報なし"
      >

        <div
          class="availability-empty-icon"
        >
          ⚪
        </div>


        <p
          class="
            availability-heading
            availability-none
          "
        >
          現在、配信情報はありません
        </p>


        <p
          class="
            availability-note
            availability-none
          "
        >
          配信サービスが確認できませんでした
        </p>

      </aside>

    `;

  }


  /* -------------------------------------------------------
     あらすじHTML
  ------------------------------------------------------- */

  /* -------------------------------------------------------
   短いあらすじHTML
------------------------------------------------------- */

const overviewHtml =
  shortOverview

    ?

    `
    <p class="movie-overview">
      ${escapeHtml(shortOverview)}
    </p>
    `

    :

    "";


  /* -------------------------------------------------------
     カード
  ------------------------------------------------------- */

  return `

    <article class="movie-card">


      <!-- =================================================
           ポスター
      ================================================== -->

      ${
        poster

          ?

          `
          <img
            class="movie-poster"
            src="${poster}"
            alt="${escapeHtml(
              movie.title || ""
            )}のポスター"
            loading="lazy"
          >
          `

          :

          `
          <div
            class="movie-poster"
            style="
              display:flex;
              align-items:center;
              justify-content:center;
              color:#6b7280;
            "
            role="img"
            aria-label="ポスター画像なし"
          >
            NO IMAGE
          </div>
          `
      }


      <!-- =================================================
           作品情報
      ================================================== -->

      <div class="movie-info">


        <!-- 作品名 -->

        <h2 class="movie-title">

          ${escapeHtml(
            movie.title || ""
          )}

        </h2>


        <!-- 原題 -->

        ${
          movie.original_title

            ?

            `
            <div class="original-title">

              ${escapeHtml(
                movie.original_title
              )}

            </div>
            `

            :

            ""
        }


        <!-- =================================================
             メタ情報
        ================================================== -->

        <div class="movie-meta-row">


          <span class="movie-meta-item">
            🎬 ${escapeHtml(mediaType)}
          </span>


          <span class="movie-meta-item">
            📅 ${escapeHtml(release)}
          </span>


          <span class="movie-meta-item">
            ⭐ TMDB評価：${rating}
          </span>


          ${
            runtime

              ?

              `
              <span class="movie-meta-item">
                🕐 ${escapeHtml(runtime)}
              </span>
              `

              :

              ""
          }


        </div>


        <!-- =================================================
             あらすじ
        ================================================== -->

        ${overviewHtml}


        <!-- =================================================
             詳細ボタン
        ================================================== -->

        ${
          movieId

            ?

            `
            <a
              class="detail-button"
              href="${detailUrl}"
              aria-label="${escapeHtml(
                movie.title || "作品"
              )}の詳細を見る"
            >
              作品詳細を見る →
            </a>
            `

            :

            `
            <div class="error">
              作品IDを取得できませんでした。
            </div>
            `
        }


      </div>


      <!-- =================================================
           配信状況
      ================================================== -->

      ${availabilityHtml}


    </article>

  `;

}


/* =========================================================
   公開年
========================================================= */

function formatYear(date){

  if(!date){

    return "";

  }


  const year =
    String(date).substring(
      0,
      4
    );


  return year + "年";

}



/* =========================================================
   上映時間
========================================================= */

function formatRuntime(minutes){

  const value =
    Number(minutes || 0);

  if(!value){

    return "";

  }

  const hours =
    Math.floor(
      value / 60
    );

  const mins =
    value % 60;

  if(hours > 0){

    return (
      hours +
      "時間" +
      (
        mins > 0
          ? mins + "分"
          : ""
      )
    );

  }

  return (
    mins +
    "分"
  );

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

/* =========================================================
   人気作品 自動取得
========================================================= */

async function loadPopularMovies(){

  const popularMovies =
    document.getElementById(
      "popularMovies"
    );

  if(!popularMovies){
    return;
  }

  try{

    const response =
      await fetch(
        "/api/search?popular=1"
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !Array.isArray(data.results) ||
      !data.results.length
    ){

      throw new Error(
        "人気作品を取得できませんでした。"
      );

    }


    popularMovies.innerHTML =
      data.results
        .map(
          createPopularMovieCard
        )
        .join("");


  }catch(error){

    console.error(
      "Popular movies error:",
      error
    );

    popularMovies.innerHTML =
      `
      <div class="empty">
        人気作品を取得できませんでした。
      </div>
      `;

  }

}     

/* =========================================================
   人気作品カード
========================================================= */

function createPopularMovieCard(movie){

  const poster =
    movie.poster_path
      ? "https://image.tmdb.org/t/p/w500" +
        movie.poster_path
      : "";

  const movieId =
    String(
      movie.id || ""
    ).trim();

  const detailUrl =
    "./detail.html?id=" +
    encodeURIComponent(
      movieId
    );


  const title =
    movie.title ||
    movie.original_title ||
    "作品名不明";


  let statusText =
    "";

  let statusClass =
    "";


  /* -------------------------------------------------------
     公開日判定
  ------------------------------------------------------- */

  if(movie.release_date){

    const releaseDate =
      new Date(
        movie.release_date +
        "T00:00:00"
      );

    const today =
      new Date();

    today.setHours(
      0,0,0,0
    );


    if(
      releaseDate > today
    ){

      const year =
        releaseDate.getFullYear();

      const month =
        releaseDate.getMonth() + 1;

      const day =
        releaseDate.getDate();


      statusText =
        "🔵 " +
        year +
        "年" +
        month +
        "月" +
        day +
        "日 公開予定";

      statusClass =
        "status-coming";

    }else{

      statusText =
        "🔴 公開中";

      statusClass =
        "status-now";

    }

  }else{

    statusText =
      "🟡 公開日不明";

    statusClass =
      "status-planned";

  }


  return `

    <a
      class="popular-card"
      href="${detailUrl}"
    >

      ${
        poster

        ?

        `
        <img
          class="popular-poster"
          src="${poster}"
          alt="${escapeHtml(
            title
          )}のポスター"
          loading="lazy"
        >
        `

        :

        `
        <div
          class="popular-poster no-image"
        >
          NO IMAGE
        </div>
        `
      }


      <div class="popular-card-info">

        <div class="popular-card-title">

          ${escapeHtml(
            title
          )}

        </div>


        <div
          class="popular-card-status ${statusClass}"
        >

          ${escapeHtml(
            statusText
          )}

        </div>


        <div class="popular-card-link">

          作品詳細を見る →

        </div>

      </div>

    </a>

  `;

}
