<script>

/* ========================================================
   要素
======================================================== */

const queryInput =
  document.getElementById("query");

const searchButton =
  document.getElementById("searchButton");

const status =
  document.getElementById("status");

const results =
  document.getElementById("results");

const searchPage =
  document.getElementById("searchPage");

const detailPage =
  document.getElementById("detailPage");

const detailPageTitle =
  document.getElementById("detailPageTitle");

const detailContent =
  document.getElementById("detailContent");

const backButton =
  document.getElementById("backButton");


/* ========================================================
   現在の作品
======================================================== */

let currentMovieId = null;


/* ========================================================
   映画検索
======================================================== */

async function searchMovies(){

  const query =
    queryInput.value.trim();


  if(!query){

    status.innerHTML =
      '<div class="error">' +
      '映画名を入力してください。' +
      '</div>';

    results.innerHTML = "";

    return;
  }


  searchButton.disabled = true;


  status.innerHTML =
    '<div class="status">' +
    '🔍 検索しています...' +
    '</div>';


  results.innerHTML = "";


  try{

    const response =
      await fetch(
        "/api/search?query=" +
        encodeURIComponent(query)
      );


    const text =
      await response.text();


    let data;


    try{

      data =
        JSON.parse(text);

    }catch(error){

      console.error(
        "JSON parse error:",
        text
      );

      throw new Error(
        "サーバーから正しいデータを取得できませんでした。"
      );

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        "検索に失敗しました。"
      );

    }


    const movies =
      Array.isArray(data.results)
        ? data.results
        : [];


    status.innerHTML = "";


    if(!movies.length){

      results.innerHTML =
        '<div class="empty">' +
        '映画が見つかりませんでした。' +
        '</div>';

      return;
    }


    results.innerHTML =
      movies
        .map(createMovieCard)
        .join("");


  }catch(error){

    console.error(
      "Search error:",
      error
    );


    status.innerHTML =
      '<div class="error">' +
      '❌ ' +
      escapeHtml(
        error.message ||
        "サーバーエラーが発生しました。"
      ) +
      '</div>';


  }finally{

    searchButton.disabled = false;

  }

}


/* ========================================================
   映画カード
======================================================== */

function createMovieCard(movie){

  const poster =
    movie.poster_path
      ? "https://image.tmdb.org/t/p/w500" +
        movie.poster_path
      : "";


  const release =
    movie.release_date
      ? formatDate(movie.release_date)
      : "公開日不明";


  const rating =
    Number(movie.vote_average || 0)
      .toFixed(1);


  return `

    <article class="movie-card">

      ${
        poster
        ?
        `
        <img
          class="movie-poster"
          src="${poster}"
          alt="${escapeHtml(movie.title || "")}"
          loading="lazy"
        >
        `
        :
        `
        <div
          class="movie-poster"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            color:#6b7280;
          "
        >
          NO IMAGE
        </div>
        `
      }


      <div class="movie-info">

        <h2 class="movie-title">
          ${escapeHtml(movie.title || "")}
        </h2>


        ${
          movie.original_title
          ?
          `
          <div class="original-title">
            ${escapeHtml(movie.original_title)}
          </div>
          `
          :
          ""
        }


        <div class="meta">
          公開日：${escapeHtml(release)}
        </div>


        <div class="meta">
          ⭐ ${rating}
        </div>


        ${
          movie.overview
          ?
          `
          <div class="overview">
            ${escapeHtml(movie.overview)}
          </div>
          `
          :
          ""
        }


        <button
          class="detail-button"
          type="button"
          onclick="searchMovieById(${movie.id})"
        >
          作品詳細を見る →
        </button>

      </div>

    </article>

  `;

}


/* ========================================================
   作品IDから詳細情報を取得
   ★以前の方式
======================================================== */

async function searchMovieById(id){

  if(!id){
    return;
  }


  currentMovieId = id;


  /* 検索画面を隠す */

  searchPage.style.display =
    "none";


  /* 詳細画面を表示 */

  detailPage.classList.add("open");


  detailPageTitle.textContent =
    "作品詳細";


  detailContent.innerHTML =
    `
    <div class="detail-loading">
      🔍 作品情報を読み込んでいます...
    </div>
    `;


  /* ページ上部へ */

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });


  try{

    const response =
      await fetch(
        "/api/search?id=" +
        encodeURIComponent(id)
      );


    const text =
      await response.text();


    let data;


    try{

      data =
        JSON.parse(text);

    }catch(error){

      console.error(
        "Detail JSON error:",
        text
      );

      throw new Error(
        "作品情報を取得できませんでした。"
      );

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        "作品情報を取得できませんでした。"
      );

    }


    detailPageTitle.textContent =
      data.title ||
      data.original_title ||
      "作品詳細";


    document.title =
      (
        data.title ||
        data.original_title ||
        "作品詳細"
      ) +
      "｜ドコデミレル？";


    detailContent.innerHTML =
      createDetail(data);


  }catch(error){

    console.error(
      "Detail error:",
      error
    );


    detailContent.innerHTML =
      `
      <div class="error">
        ❌
        ${escapeHtml(
          error.message ||
          "作品情報を取得できませんでした。"
        )}
      </div>
      `;

  }

}


/* ========================================================
   詳細画面
======================================================== */

function createDetail(movie){

  let html = "";


  const poster =
    movie.poster_path
      ? "https://image.tmdb.org/t/p/w500" +
        movie.poster_path
      : "";


  const release =
    movie.release_date
      ? formatDate(movie.release_date)
      : "公開日不明";


  const rating =
    Number(movie.vote_average || 0)
      .toFixed(1);


  html +=
    '<div class="detail-card">';


  /* =========================
     基本情報
  ========================== */

  html +=
    '<div class="detail-main">';


  if(poster){

    html +=
      `
      <img
        class="detail-poster"
        src="${poster}"
        alt="${escapeHtml(movie.title || "")}"
      >
      `;

  }else{

    html +=
      `
      <div
        class="detail-poster"
        style="
          display:flex;
          align-items:center;
          justify-content:center;
          color:#6b7280;
        "
      >
        NO IMAGE
      </div>
      `;

  }


  html +=
    '<div class="detail-info">';


  html +=
    `
    <h2>
      ${escapeHtml(
        movie.title ||
        movie.original_title ||
        ""
      )}
    </h2>
    `;


  if(movie.original_title){

    html +=
      `
      <div class="detail-original">
        原題：
        ${escapeHtml(movie.original_title)}
      </div>
      `;

  }


  html +=
    `
    <div class="detail-meta">
      📅 公開日：${escapeHtml(release)}
    </div>

    <div class="detail-meta">
      ⭐ TMDB評価：${rating}
    </div>
    `;


  if(
    Array.isArray(movie.genres) &&
    movie.genres.length
  ){

    html +=
      `
      <div class="detail-meta">
        🎭 ジャンル：
        ${movie.genres
          .map(
            genre =>
              escapeHtml(
                genre.name || ""
              )
          )
          .join(" / ")}
      </div>
      `;

  }


  if(movie.overview){

    html +=
      `
      <div class="detail-overview">
        ${escapeHtml(movie.overview)}
      </div>
      `;

  }


  html +=
    '</div>';


  html +=
    '</div>';


  /* =========================
     配信サービス
  ========================== */

  html +=
    `
    <section class="detail-section">

      <h3>
        📺 この作品はどこで見られる？
      </h3>
    `;


  html += createProviderGroup(
    "🟢 見放題",
    movie.streaming || [],
    movie
  );


  html += createProviderGroup(
    "🎞️ レンタル",
    movie.rental || [],
    movie
  );


  html += createProviderGroup(
    "💰 購入",
    movie.purchase || [],
    movie
  );


  const hasProviders =
    (
      Array.isArray(movie.streaming) &&
      movie.streaming.length
    ) ||
    (
      Array.isArray(movie.rental) &&
      movie.rental.length
    ) ||
    (
      Array.isArray(movie.purchase) &&
      movie.purchase.length
    );


  if(!hasProviders){

    html +=
      `
      <div class="empty">
        現在、配信情報を取得できませんでした。
      </div>
      `;

  }


  html +=
    '</section>';


  /* =========================
     監督
  ========================== */

  if(movie.director){

    html +=
      `
      <section class="detail-section">

        <h3>
          🎬 監督
        </h3>

        <div class="people">

          <div class="person">
            ${escapeHtml(
              movie.director.name || ""
            )}
          </div>

        </div>

      </section>
      `;

  }


  /* =========================
     出演者
  ========================== */

  if(
    Array.isArray(movie.cast) &&
    movie.cast.length
  ){

    html +=
      `
      <section class="detail-section">

        <h3>
          👥 出演者
        </h3>

        <div class="people">
      `;


    movie.cast.forEach(
      function(person){

        html +=
          `
          <div class="person">
            ${escapeHtml(
              person.name || ""
            )}
          </div>
          `;

      }
    );


    html +=
      `
        </div>

      </section>
      `;

  }


  /* =========================
     シリーズ
  ========================== */

  if(
    movie.series &&
    Array.isArray(movie.series.movies) &&
    movie.series.movies.length
  ){

    html +=
      `
      <section class="detail-section">

        <h3>
          🎞️ シリーズ作品
        </h3>

        <div class="series-name">
          ${escapeHtml(
            movie.series.name || ""
          )}
        </div>

        <div class="series">
      `;


    movie.series.movies.forEach(
      function(item){

        const itemPoster =
          item.poster_path
            ? "https://image.tmdb.org/t/p/w300" +
              item.poster_path
            : "";


        html +=
          `
          <div
            class="series-item"
            onclick="searchMovieById(${item.id})"
            title="この作品の詳細を見る"
          >

            ${
              itemPoster
              ?
              `
              <img
                src="${itemPoster}"
                alt="${escapeHtml(
                  item.title || ""
                )}"
                loading="lazy"
              >
              `
              :
              `
              <div
                style="
                  aspect-ratio:2/3;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  color:#6b7280;
                  background:#e5e7eb;
                  border-radius:7px;
                  font-size:12px;
                "
              >
                NO IMAGE
              </div>
              `
            }

            <div class="series-item-title">
              ${escapeHtml(
                item.title || ""
              )}
            </div>

            ${
              item.release_date
              ?
              `
              <div class="series-item-date">
                ${escapeHtml(
                  formatDate(
                    item.release_date
                  )
                )}
              </div>
              `
              :
              ""
            }

          </div>
          `;

      }
    );


    html +=
      `
        </div>

      </section>
      `;

  }


  /* =========================
     TMDB
  ========================== */

  if(movie.link){

    html +=
      `
      <section class="detail-section">

        <a
          class="watch-button"
          href="${escapeHtml(movie.link)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          TMDBで作品情報を見る →
        </a>

      </section>
      `;

  }


  html +=
    '</div>';


  return html;

}


/* ========================================================
   配信サービス
======================================================== */

function createProviderGroup(
  title,
  providers,
  movie
){

  if(
    !Array.isArray(providers) ||
    !providers.length
  ){

    return "";

  }


  let html =
    '<div class="provider-group">';


  html +=
    `
    <div class="provider-group-title">
      ${escapeHtml(title)}
    </div>
    `;


  html +=
    '<div class="provider-list">';


  providers.forEach(
    function(provider){

      if(!provider){
        return;
      }


      const name =
        provider.provider_name ||
        provider.name ||
        "";


      const logo =
        provider.logo_path
          ? "https://image.tmdb.org/t/p/w92" +
            provider.logo_path
          : "";


      const link =
        getProviderLink(
          name,
          provider,
          movie
        );


      let buttonClass =
        "watch-button";


      const lowerName =
        name.toLowerCase();


      if(
        lowerName.includes("netflix")
      ){

        buttonClass +=
          " netflix";

      }


      if(
        lowerName.includes("amazon") ||
        lowerName.includes("prime")
      ){

        buttonClass +=
          " amazon";

      }


      html +=
        `
        <div class="provider">

          <div class="provider-top">

            ${
              logo
              ?
              `
              <img
                class="provider-logo"
                src="${logo}"
                alt=""
              >
              `
              :
              ""
            }

            <div class="provider-name">
              ${escapeHtml(name)}
            </div>

          </div>

          <div class="provider-type">
            ${escapeHtml(
              getProviderType(title)
            )}
          </div>

          ${
            link
            ?
            `
            <a
              class="${buttonClass}"
              href="${escapeHtml(link)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${escapeHtml(
                getButtonText(name)
              )}
            </a>
            `
            :
            ""
          }

        </div>
        `;

    }
  );


  html +=
    '</div>';


  html +=
    '</div>';


  return html;

}


/* ========================================================
   配信種別

function getProviderType(title){

  if(
    title.includes("見放題")
  ){

    return "見放題";

  }


  if(
    title.includes("レンタル")
  ){

    return "レンタル";

  }


  if(
    title.includes("購入")
  ){

    return "購入";

  }

}


/* ========================================================
   配信ボタン
======================================================== */

function getButtonText(name){

  const lower =
    String(name || "")
      .toLowerCase();


  if(
    lower.includes("netflix")
  ){

    return "Netflixで見る →";

  }


  if(
    lower.includes("amazon") ||
    lower.includes("prime")
  ){

    return "Prime Videoで見る →";

  }


  return name + "で見る →";

}


/* ========================================================
   配信リンク
======================================================== */

function getProviderLink(
  name,
  provider,
  movie
){

  const lower =
    String(name || "")
      .toLowerCase();


  /* =========================
     Netflix
  ========================== */

  if(
    lower.includes("netflix")
  ){

    const urls = [

      provider.provider_url,

      provider.watch_link,

      provider.netflix_url,

      provider.url,

      provider.link,

      movie.netflix_url

    ];


    for(
      let i=0;
      i<urls.length;
      i++
    ){

      const normalized =
        normalizeNetflixUrl(
          urls[i]
        );


      if(normalized){

        return normalized;

      }

    }


    return createNetflixSearchUrl(
      movie.title ||
      movie.original_title ||
      ""
    );

  }


  /* =========================
     Amazon
  ========================== */

  if(
    lower.includes("amazon") ||
    lower.includes("prime")
  ){

    const urls = [

      movie.amazon_url,

      provider.provider_url,

      provider.watch_link,

      provider.url,

      provider.link

    ];


    for(
      let i=0;
      i<urls.length;
      i++
    ){

      const url =
        urls[i];


      if(
        typeof url === "string" &&
        /^https?:\/\//i.test(url)
      ){

        return url;

      }

    }


    return createAmazonSearchUrl(
      movie.title ||
      movie.original_title ||
      ""
    );

  }


  /* =========================
     その他
  ========================== */

  const urls = [

    provider.provider_url,

    provider.watch_link,

    provider.url,

    provider.link

  ];


  for(
    let i=0;
    i<urls.length;
    i++
  ){

    if(
      typeof urls[i] === "string" &&
      /^https?:\/\//i.test(urls[i])
    ){

      return urls[i];

    }

  }


  return null;

}


/* ========================================================
   Netflix URL
======================================================== */

function normalizeNetflixUrl(url){

  if(
    typeof url !== "string" ||
    !url.trim()
  ){

    return null;

  }


  const clean =
    url.trim();


  const titleMatch =
    clean.match(
      /netflix\.com\/(?:[^/]+\/)?title\/(\d+)/i
    );


  if(titleMatch){

    return (
      "https://www.netflix.com/jp/title/" +
      encodeURIComponent(
        titleMatch[1]
      )
    );

  }


  const watchMatch =
    clean.match(
      /netflix\.com\/(?:[^/]+\/)?watch\/(\d+)/i
    );


  if(watchMatch){

    return (
      "https://www.netflix.com/jp/title/" +
      encodeURIComponent(
        watchMatch[1]
      )
    );

  }


  if(
    /^https?:\/\/(?:www\.)?netflix\.com\//i
      .test(clean)
  ){

    return clean;

  }


  return null;

}


/* ========================================================
   Netflix検索
======================================================== */

function createNetflixSearchUrl(title){

  const clean =
    String(title || "")
      .trim();


  if(!clean){

    return "https://www.netflix.com/jp/";

  }


  return (
    "https://www.netflix.com/jp/search?q=" +
    encodeURIComponent(clean)
  );

}


/* ========================================================
   Amazon検索
======================================================== */

function createAmazonSearchUrl(title){

  const clean =
    String(title || "")
      .trim();


  if(!clean){

    return (
      "https://www.amazon.co.jp/gp/video/storefront"
    );

  }


  return (
    "https://www.amazon.co.jp/s?k=" +
    encodeURIComponent(clean) +
    "&i=instant-video"
  );

}


/* ========================================================
   日付
======================================================== */

function formatDate(date){

  const parts =
    String(date).split("-");


  if(parts.length !== 3){

    return date;

  }


  return (
    Number(parts[0]) +
    "年" +
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}


/* ========================================================
   HTMLエスケープ
======================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
