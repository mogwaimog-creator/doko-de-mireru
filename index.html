<body>


<header>

  <h1>🎬 ドコデミレル？</h1>

  <p>
    映画がどこで見られるか検索できます
  </p>

</header>


<main class="container">

    href="index.html"
    class="back-button"
  >

  </a>

  >

    <div class="loading">

    </div>

  </div>


</main>


<footer>
  © ドコデミレル？
</footer>


<script>

/* ========================================================
   作品ID
======================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const movieId =
  params.get("id");


const content =
  document.getElementById("content");


/* ========================================================
   作品検索
======================================================== */

async function searchMovieById(id){

  if(!id){

    showError(
      "作品IDが指定されていません。"
    );

    return;

  }


  try{

    const response =
      await fetch(
        "/api/search?id=" +
        encodeURIComponent(id)
      );


    const text =
      await response.text();


    let data;


    try{

      data =
        JSON.parse(text);

    }catch(error){

      console.error(
        "JSON parse error:",
        text
      );

      throw new Error(
        "サーバーから正しいデータを取得できませんでした。"
      );

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        "作品情報を取得できませんでした。"
      );

    }


    document.title =
      (
        data.title ||
        data.original_title ||
        "作品詳細"
      ) +
      " | ドコデミレル？";


    content.innerHTML =
      createDetail(data);


  }catch(error){

    console.error(
      "Detail error:",
      error
    );


    showError(
      error.message ||
      "作品情報を取得できませんでした。"
    );

  }

}


/* ========================================================
   詳細画面
======================================================== */

function createDetail(movie){

  const poster =
    movie.poster_path
      ? "https://image.tmdb.org/t/p/w500" +
        movie.poster_path
      : "";


  const release =
    movie.release_date
      ? formatDate(movie.release_date)
      : "公開日不明";


  const rating =
    Number(movie.vote_average || 0)
      .toFixed(1);


  let html = "";


  /* =========================
     基本情報
  ========================== */

  html += `

    <div class="movie-main">

      ${
        poster
        ?
        `
        <img
          class="movie-poster"
          src="${poster}"
          alt="${escapeHtml(movie.title || "")}"
        >
        `
        :
        `
        <div
          class="movie-poster"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            color:#6b7280;
          "
        >
          NO IMAGE
        </div>
        `
      }


      <div class="movie-info">

        <h2 class="movie-title">
          ${escapeHtml(movie.title || "")}
        </h2>


        ${
          movie.original_title
          ?
          `
          <div class="original-title">
            ${escapeHtml(movie.original_title)}
          </div>
          `
          :
          ""
        }


        <div class="meta">
          📅 公開日：${escapeHtml(release)}
        </div>


        <div class="meta">
          ⭐ TMDB評価：${rating}
        </div>


        ${
          movie.overview
          ?
          `
          <div class="overview">
            ${escapeHtml(movie.overview)}
          </div>
          `
          :
          ""
        }

      </div>

    </div>

  `;


  /* =========================
     配信
  ========================== */

  html +=
    '<div class="section">';

  html +=
    '<h2>📺 この作品はどこで見られる？</h2>';


  html += createProviderGroup(
    "🟢 見放題",
    movie.streaming || [],
    movie
  );


  html += createProviderGroup(
    "🎞️ レンタル",
    movie.rental || [],
    movie
  );


  html += createProviderGroup(
    "💰 購入",
    movie.purchase || [],
    movie
  );


  const hasProviders =
    (
      Array.isArray(movie.streaming) &&
      movie.streaming.length
    ) ||
    (
      Array.isArray(movie.rental) &&
      movie.rental.length
    ) ||
    (
      Array.isArray(movie.purchase) &&
      movie.purchase.length
    );


  if(!hasProviders){

    html +=
      '<div class="error">' +
      '現在、日本の配信情報を取得できませんでした。' +
      '</div>';

  }


  html +=
    '</div>';


  /* =========================
     Netflix
  ========================== */

  if(movie.netflix_url){

    html +=
      '<div class="section">';

    html +=
      '<h2>🔴 Netflix</h2>';

    html +=
      '<a ' +
      'class="watch-button netflix" ' +
      'href="' +
      escapeHtml(movie.netflix_url) +
      '" ' +
      'target="_blank" ' +
      'rel="noopener noreferrer">' +
      'Netflixで見る →' +
      '</a>';

    html +=
      '</div>';

  }


  /* =========================
     Amazon
  ========================== */

  if(movie.amazon_url){

    html +=
      '<div class="section">';

    html +=
      '<h2>🟠 Amazon Prime Video</h2>';

    html +=
      '<a ' +
      'class="watch-button amazon" ' +
      'href="' +
      escapeHtml(movie.amazon_url) +
      '" ' +
      'target="_blank" ' +
      'rel="noopener noreferrer">' +
      'Prime Videoで見る →' +
      '</a>';

    html +=
      '</div>';

  }


  /* =========================
     監督
  ========================== */

  if(movie.director){

    html +=
      '<div class="section">';

    html +=
      '<h2>🎬 監督</h2>';

    html +=
      '<div class="people">';

    html +=
      '<div class="person">' +
      escapeHtml(
        movie.director.name || ""
      ) +
      '</div>';

    html +=
      '</div>';

    html +=
      '</div>';

  }


  /* =========================
     出演者
  ========================== */

  if(
    Array.isArray(movie.cast) &&
    movie.cast.length
  ){

    html +=
      '<div class="section">';

    html +=
      '<h2>👥 出演者</h2>';

    html +=
      '<div class="people">';


    movie.cast.forEach(
      function(person){

        html +=
          '<div class="person">' +
          escapeHtml(
            person.name || ""
          ) +
          '</div>';

      }
    );


    html +=
      '</div>';

    html +=
      '</div>';

  }


  /* =========================
     シリーズ
  ========================== */

  if(
    movie.series &&
    Array.isArray(movie.series.movies) &&
    movie.series.movies.length
  ){

    html +=
      '<div class="section">';

    html +=
      '<h2>🎞️ シリーズ作品</h2>';


    html +=
      '<div class="series-name">' +
      escapeHtml(
        movie.series.name || ""
      ) +
      '</div>';


    html +=
      '<div class="series">';


    movie.series.movies.forEach(
      function(item){

        const itemPoster =
          item.poster_path
            ? "https://image.tmdb.org/t/p/w300" +
              item.poster_path
            : "";


        const itemUrl =
          "detail.html?id=" +
          encodeURIComponent(
            item.id
          );


        html += `

          <a
            class="series-item"
            href="${itemUrl}"
          >

            ${
              itemPoster
              ?
              `
              <img
                src="${itemPoster}"
                alt="${escapeHtml(item.title || "")}"
                loading="lazy"
              >
              `
              :
              `
              <div
                style="
                  width:100%;
                  aspect-ratio:2/3;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  color:#6b7280;
                  background:#e5e7eb;
                  border-radius:7px;
                "
              >
                NO IMAGE
              </div>
              `
            }


            <div class="series-item-title">
              ${escapeHtml(item.title || "")}
            </div>


            ${
              item.release_date
              ?
              `
              <div class="series-item-date">
                ${escapeHtml(
                  formatDate(item.release_date)
                )}
              </div>
              `
              :
              ""
            }

          </a>

        `;

      }
    );


    html +=
      '</div>';

    html +=
      '</div>';

  }


  return html;

}


/* ========================================================
   配信サービス
======================================================== */

function createProviderGroup(
  title,
  providers,
  movie
){

  if(
    !Array.isArray(providers) ||
    !providers.length
  ){

    return "";

  }


  let html =
    '<div class="provider-group">';


  html +=
    '<div class="provider-group-title">' +
    title +
    '</div>';


  html +=
    '<div class="provider-list">';


  providers.forEach(
    function(provider){

      if(!provider){

        return;

      }


      const name =
        provider.provider_name ||
        provider.name ||
        "";


      const logo =
        provider.logo_path
          ? "https://image.tmdb.org/t/p/w92" +
            provider.logo_path
          : "";


      const link =
        getProviderLink(
          name,
          provider,
          movie
        );


      let buttonClass =
        "watch-button";


      const lowerName =
        String(name)
          .toLowerCase();


      if(
        lowerName.includes("netflix")
      ){

        buttonClass +=
          " netflix";

      }


      if(
        lowerName.includes("amazon") ||
        lowerName.includes("prime")
      ){

        buttonClass +=
          " amazon";

      }


      html += `

        <div class="provider">

          <div class="provider-top">

            ${
              logo
              ?
              `
              <img
                class="provider-logo"
                src="${logo}"
                alt=""
              >
              `
              :
              ""
            }


            <div class="provider-name">
              ${escapeHtml(name)}
            </div>

          </div>


          <div class="provider-type">
            ${escapeHtml(
              getProviderType(title)
            )}
          </div>


          ${
            link
            ?
            `
            <a
              class="${buttonClass}"
              href="${escapeHtml(link)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${escapeHtml(
                getButtonText(name)
              )}
            </a>
            `
            :
            ""
          }

        </div>

      `;

    }
  );


  html +=
    '</div></div>';


  return html;

}


/* ========================================================
   配信種別
======================================================== */

function getProviderType(title){

  if(
    title.includes("見放題")
  ){

    return "見放題";

  }


  if(
    title.includes("レンタル")
  ){

    return "レンタル";

  }


  if(
    title.includes("購入")
  ){

    return "購入";

  }


  return "";

}


/* ========================================================
   ボタン文字
======================================================== */

function getButtonText(name){

  const lower =
    String(name || "")
      .toLowerCase();


  if(
    lower.includes("netflix")
  ){

    return "Netflixで見る →";

  }


  if(
    lower.includes("amazon") ||
    lower.includes("prime")
  ){

    return "Prime Videoで見る →";

  }


  return name + "で見る →";

}


/* ========================================================
   配信リンク
======================================================== */

function getProviderLink(
  name,
  provider,
  movie
){

  const lower =
    String(name || "")
      .toLowerCase();


  /* =========================
     Netflix
  ========================== */

  if(
    lower.includes("netflix")
  ){

    const urls = [

      provider.provider_url,

      provider.watch_link,

      provider.netflix_url,

      provider.url,

      provider.link,

      movie.netflix_url

    ];


    for(
      let i = 0;
      i < urls.length;
      i++
    ){

      const url =
        normalizeNetflixUrl(
          urls[i]
        );


      if(url){

        return url;

      }

    }


    return createNetflixSearchUrl(
      movie.title ||
      movie.original_title ||
      ""
    );

  }


  /* =========================
     Amazon
  ========================== */

  if(
    lower.includes("amazon") ||
    lower.includes("prime")
  ){

    const urls = [

      movie.amazon_url,

      provider.provider_url,

      provider.watch_link,

      provider.url,

      provider.link

    ];


    for(
      let i = 0;
      i < urls.length;
      i++
    ){

      if(
        typeof urls[i] === "string" &&
        /^https?:\/\//i.test(
          urls[i]
        )
      ){

        return urls[i];

      }

    }


    return createAmazonSearchUrl(
      movie.title ||
      movie.original_title ||
      ""
    );

  }


  /* =========================
     その他
  ========================== */

  const urls = [

    provider.provider_url,

    provider.watch_link,

    provider.url,

    provider.link

  ];


  for(
    let i = 0;
    i < urls.length;
    i++
  ){

    if(
      typeof urls[i] === "string" &&
      /^https?:\/\//i.test(
        urls[i]
      )
    ){

      return urls[i];

    }

  }


  return null;

}


/* ========================================================
   Netflix URL
======================================================== */

function normalizeNetflixUrl(url){

  if(
    typeof url !== "string" ||
    !url.trim()
  ){

    return null;

  }


  const clean =
    url.trim();


  const titleMatch =
    clean.match(
      /netflix\.com\/(?:[^/]+\/)?title\/(\d+)/i
    );


  if(titleMatch){

    return (
      "https://www.netflix.com/jp/title/" +
      titleMatch[1]
    );

  }


  const watchMatch =
    clean.match(
      /netflix\.com\/(?:[^/]+\/)?watch\/(\d+)/i
    );


  if(watchMatch){

    return (
      "https://www.netflix.com/jp/title/" +
      watchMatch[1]
    );

  }


  if(
    /^https?:\/\/(?:www\.)?netflix\.com\//i
      .test(clean)
  ){

    return clean;

  }


  return null;

}


/* ========================================================
   Netflix検索
======================================================== */

function createNetflixSearchUrl(title){

  const clean =
    String(title || "")
      .trim();


  if(!clean){

    return "https://www.netflix.com/jp/";

  }


  return (
    "https://www.netflix.com/jp/search?q=" +
    encodeURIComponent(clean)
  );

}


/* ========================================================
   Amazon検索
======================================================== */

function createAmazonSearchUrl(title){

  const clean =
    String(title || "")
      .trim();


  return (
    "https://www.amazon.co.jp/s?k=" +
    encodeURIComponent(clean) +
    "&i=instant-video"
  );

}


/* ========================================================
   日付
======================================================== */

function formatDate(date){

  const parts =
    String(date).split("-");


  if(parts.length !== 3){

    return date;

  }


  return (
    Number(parts[0]) +
    "年" +
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}


/* ========================================================
   エラー
======================================================== */

function showError(message){

  content.innerHTML =
    '<div class="error">' +
    '❌ ' +
    escapeHtml(message) +
    '</div>';

}


/* ========================================================
   HTMLエスケープ
======================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ========================================================
   開始
======================================================== */

searchMovieById(
  movieId
);

</script>


</body>

</html>
