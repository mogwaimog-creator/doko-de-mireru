<body>

<header>

<h1>ドコデミレル？</h1>

<p>映画がどの動画配信サービスで見られるか検索</p>

</header>


<div class="container">

  <div class="search-box">

    <input
      id="searchInput"
      type="text"
      placeholder="映画名を入力してください"
      autocomplete="off"
    >

    <button
      id="searchButton"
      type="button"
    >
      検索
    </button>

  </div>


  <div
    id="message"
    class="message"
  >
    映画名を入力して検索してください。
  </div>


  <div
    id="results"
    class="results"
  ></div>

</div>


<script>

/* ========================================================
   API
======================================================== */

const API_URL = "/api/search";


/* ========================================================
   DOM
======================================================== */

const searchInput =
  document.getElementById("searchInput");

const searchButton =
  document.getElementById("searchButton");

const resultsElement =
  document.getElementById("results");

const messageElement =
  document.getElementById("message");


/* ========================================================
   検索
======================================================== */

searchButton.addEventListener(
  "click",
  searchMovies
);


searchInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){
      searchMovies();
    }

  }
);


/* ========================================================
   映画検索
======================================================== */

async function searchMovies(){

  const query =
    searchInput.value.trim();


  if(!query){

    messageElement.textContent =
      "映画名を入力してください。";

    resultsElement.innerHTML = "";

    return;

  }


  resultsElement.innerHTML = "";

  messageElement.innerHTML =
    '<div class="loading">検索しています…</div>';


  try{

    const url =
      API_URL +
      "?query=" +
      encodeURIComponent(query);


    const response =
      await fetch(url);


    if(!response.ok){

      throw new Error(
        "検索に失敗しました。"
      );

    }


    const data =
      await response.json();


    const movies =
      Array.isArray(data.results)
        ? data.results
        : [];


    if(!movies.length){

      messageElement.textContent =
        "作品が見つかりませんでした。";

      return;

    }


    messageElement.textContent =
      movies.length +
      "作品が見つかりました。";


    /*
     * 検索結果を表示
     */

    for(
      let i = 0;
      i < movies.length;
      i++
    ){

      const movie =
        movies[i];

      await displayMovie(movie);

    }

  }catch(error){

    console.error(error);

    messageElement.innerHTML =
      '<div class="error">' +
      '検索中にエラーが発生しました。' +
      '</div>';

  }

}


/* ========================================================
   映画カード表示
======================================================== */

async function displayMovie(movie){

  /*
   * 検索結果だけでは配信情報がないため、
   * APIのID検索で詳細情報を取得する。
   */

  let detail = null;


  try{

    const response =
      await fetch(
        API_URL +
        "?id=" +
        encodeURIComponent(movie.id)
      );


    if(response.ok){

      detail =
        await response.json();

    }

  }catch(error){

    console.error(
      "detail error:",
      error
    );

  }


  /*
   * 詳細取得に失敗した場合も
   * 検索結果は表示する。
   */

  if(!detail){

    detail = movie;

  }


  const card =
    document.createElement("div");

  card.className =
    "movie-card";


  const poster =
    detail.poster_path
      ? "https://image.tmdb.org/t/p/w500" +
        detail.poster_path
      : "";


  const movieMain =
    document.createElement("div");

  movieMain.className =
    "movie-main";


  /*
   * ポスター
   */

  if(poster){

    const img =
      document.createElement("img");

    img.className =
      "poster";

    img.src =
      poster;

    img.alt =
      detail.title || "";

    img.loading =
      "lazy";

    movieMain.appendChild(img);

  }else{

    const noPoster =
      document.createElement("div");

    noPoster.className =
      "poster";

    noPoster.style.display =
      "flex";

    noPoster.style.alignItems =
      "center";

    noPoster.style.justifyContent =
      "center";

    noPoster.textContent =
      "No Image";

    movieMain.appendChild(
      noPoster
    );

  }


  /*
   * 映画情報
   */

  const info =
    document.createElement("div");

  info.className =
    "movie-info";


  const title =
    document.createElement("h2");

  title.className =
    "movie-title";

  title.textContent =
    detail.title || "作品名不明";

  info.appendChild(title);


  if(detail.original_title){

    const original =
      document.createElement("div");

    original.className =
      "original-title";

    original.textContent =
      detail.original_title;

    info.appendChild(original);

  }


  if(detail.release_date){

    const release =
      document.createElement("div");

    release.className =
      "release";

    release.textContent =
      "公開日：" +
      detail.release_date;

    info.appendChild(release);

  }


  if(
    detail.vote_average !== undefined &&
    detail.vote_average !== null
  ){

    const rating =
      document.createElement("div");

    rating.className =
      "rating";

    rating.textContent =
      "★ " +
      Number(detail.vote_average)
        .toFixed(1);

    info.appendChild(rating);

  }


  if(detail.overview){

    const overview =
      document.createElement("div");

    overview.className =
      "overview";

    overview.textContent =
      detail.overview;

    info.appendChild(overview);

  }


  movieMain.appendChild(info);

  card.appendChild(movieMain);


  /*
   * 配信情報
   */

  const detailArea =
    document.createElement("div");

  detailArea.className =
    "detail";


  const detailTitle =
    document.createElement("div");

  detailTitle.className =
    "detail-title";

  detailTitle.textContent =
    "配信サービス";

  detailArea.appendChild(
    detailTitle
  );


  const providers =
    document.createElement("div");

  providers.className =
    "providers";


  /*
   * 見放題
   */

  addProviders(
    providers,
    detail.streaming
  );


  /*
   * レンタル
   */

  addProviders(
    providers,
    detail.rental
  );


  /*
   * 購入
   */

  addProviders(
    providers,
    detail.purchase
  );


  if(!providers.children.length){

    const none =
      document.createElement("div");

    none.style.color =
      "#6b7280";

    none.style.fontSize =
      "13px";

    none.textContent =
      "日本で利用できる配信情報が見つかりませんでした。";

    detailArea.appendChild(none);

  }else{

    detailArea.appendChild(
      providers
    );

  }


  /*
   * Netflixボタン
   */

  if(
    detail.netflix ||
    detail.netflix_url ||
    detail.netflix_title_id ||
    detail.netflix_id
  ){

    createNetflixButton(
      detailArea,
      detail
    );

  }


  /*
   * TMDB / 配信情報ページ
   */

  if(detail.link){

    const more =
      document.createElement("div");

    more.className =
      "more-info";


    const link =
      document.createElement("a");

    link.href =
      detail.link;

    link.target =
      "_blank";

    link.rel =
      "noopener noreferrer";

    link.textContent =
      "配信情報を詳しく見る";

    more.appendChild(link);

    detailArea.appendChild(more);

  }


  card.appendChild(
    detailArea
  );


  resultsElement.appendChild(
    card
  );

}


/* ========================================================
   配信サービス表示
======================================================== */

function addProviders(
  container,
  providerList
){

  if(
    !Array.isArray(providerList)
  ){

    return;

  }


  for(
    let i = 0;
    i < providerList.length;
    i++
  ){

    const provider =
      providerList[i];


    if(!provider){

      continue;

    }


    const item =
      document.createElement("div");

    item.className =
      "provider";


    if(provider.logo_path){

      const img =
        document.createElement("img");

      img.src =
        "https://image.tmdb.org/t/p/w92" +
        provider.logo_path;

      img.alt =
        provider.provider_name || "";

      img.loading =
        "lazy";

      item.appendChild(img);

    }


    const name =
      document.createElement("span");

    name.className =
      "provider-name";

    name.textContent =
      provider.provider_name ||
      "配信サービス";

    item.appendChild(name);


    container.appendChild(item);

  }

}


/* ========================================================
   Netflixボタン
======================================================== */

function createNetflixButton(
  container,
  detail
){

  const area =
    document.createElement("div");

  area.className =
    "netflix-area";


  /*
   * 重要
   *
   * APIがNetflix作品IDを取得できた場合：
   *
   * https://www.netflix.com/title/作品ID
   *
   * に直接移動する。
   *
   * IDが取得できなかった場合：
   *
   * https://www.netflix.com/search?q=作品名
   *
   * に移動する。
   */


  let netflixUrl = null;

  let hasTitleId = false;


  /*
   * ① netflix.title_id
   */

  if(
    detail.netflix &&
    detail.netflix.title_id &&
    /^\d+$/.test(
      String(
        detail.netflix.title_id
      )
    )
  ){

    netflixUrl =
      "https://www.netflix.com/title/" +
      String(
        detail.netflix.title_id
      );

    hasTitleId = true;

  }


  /*
   * ② netflix_title_id
   */

  if(
    !netflixUrl &&
    detail.netflix_title_id &&
    /^\d+$/.test(
      String(
        detail.netflix_title_id
      )
    )
  ){

    netflixUrl =
      "https://www.netflix.com/title/" +
      String(
        detail.netflix_title_id
      );

    hasTitleId = true;

  }


  /*
   * ③ netflix_id
   */

  if(
    !netflixUrl &&
    detail.netflix_id &&
    /^\d+$/.test(
      String(
        detail.netflix_id
      )
    )
  ){

    netflixUrl =
      "https://www.netflix.com/title/" +
      String(
        detail.netflix_id
      );

    hasTitleId = true;

  }


  /*
   * ④ APIから返ってきたURL
   *
   * ただし、検索URLではなく
   * title/数字/ の場合だけ作品ページとして扱う。
   */

  if(
    !netflixUrl &&
    detail.netflix_url
  ){

    const id =
      extractNetflixId(
        detail.netflix_url
      );


    if(id){

      netflixUrl =
        "https://www.netflix.com/title/" +
        id;

      hasTitleId = true;

    }

  }


  /*
   * ⑤ netflix.url
   */

  if(
    !netflixUrl &&
    detail.netflix &&
    detail.netflix.url
  ){

    const id =
      extractNetflixId(
        detail.netflix.url
      );


    if(id){

      netflixUrl =
        "https://www.netflix.com/title/" +
        id;

      hasTitleId = true;

    }

  }


  /*
   * ⑥ IDがない場合
   *
   * Netflix検索画面へ。
   */

  if(!netflixUrl){

    const title =
      detail.title ||
      detail.original_title ||
      "";


    netflixUrl =
      "https://www.netflix.com/search?q=" +
      encodeURIComponent(title);

  }


  /*
   * ボタン
   */

  const button =
    document.createElement("a");

  button.className =
    "netflix-button";

  button.href =
    netflixUrl;

  button.target =
    "_blank";

  button.rel =
    "noopener noreferrer";


  if(hasTitleId){

    button.textContent =
      "Netflixで本編を見る";

  }else{

    button.textContent =
      "Netflixで作品を検索";

  }


  area.appendChild(
    button
  );


  /*
   * 説明
   */

  const note =
    document.createElement("div");

  note.className =
    "netflix-note";


  if(hasTitleId){

    note.textContent =
      "Netflixの作品ページを直接開きます。";

  }else{

    note.textContent =
      "Netflix作品IDを取得できないため、作品名で検索します。";

  }


  area.appendChild(
    note
  );


  container.appendChild(
    area
  );

}


/* ========================================================
   Netflix URLから作品IDを取得
======================================================== */

function extractNetflixId(
  url
){

  if(
    typeof url !== "string" ||
    !url
  ){

    return null;

  }


  const patterns = [

    /netflix\.com\/(?:jp\/)?title\/(\d+)/i,

    /netflix\.com\/(?:[^/]+\/)?title\/(\d+)/i,

    /netflix\.com\/(?:jp\/)?watch\/(\d+)/i,

    /netflix\.com\/(?:[^/]+\/)?watch\/(\d+)/i

  ];


  for(
    let i = 0;
    i < patterns.length;
    i++
  ){

    const match =
      url.match(
        patterns[i]
      );


    if(match){

      return match[1];

    }

  }


  return null;

}

</script>
