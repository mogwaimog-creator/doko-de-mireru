name: SEO pilot offline tests
on:
  push:
    branches:
      - seo/initial-html-metadata-pilot
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline SEO and ledger tests
        run: node --test tests/seo-static-build.test.js tests/seo-detail-response-contract.test.js tests/work-ledger-foundation.test.js tests/detail-provider-failure-contract.test.js tests/export-seo-ledger-readonly.test.js
