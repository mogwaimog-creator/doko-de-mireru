name: SEO pilot offline tests
on:
  push:
    branches:
      - seo/initial-html-metadata-pilot
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline SEO and ledger tests
        run: node --test tests/*.test.js
