name: Temporary Redis migration (local only)
on:
  pull_request:
    paths:
      - 'api/_valkey.js'
      - 'api/_redis.js'
      - 'api/_release-connection.js'
      - 'api/_release-application.js'
      - 'api/_release-source.js'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/temporary-redis-migration.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 16379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-tools
      - run: npm run test:migration
        env:
          REDIS_TEST_CLI: /usr/bin/redis-cli
          REDIS_TEST_TRANSPORT: valkey
