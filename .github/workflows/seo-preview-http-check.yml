name: SEO preview HTTP verification
on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Dedicated Vercel preview origin (https://...vercel.app)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preview routing and fallback (read only)
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: node scripts/check-seo-preview-http.js "$PREVIEW_URL"
