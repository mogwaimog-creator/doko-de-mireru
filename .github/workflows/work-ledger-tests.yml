name: Work ledger tests

on:
  push:
    branches:
      - feature/shared-work-ledger-20261031
  pull_request:
    paths:
      - 'api/_work-ledger.js'
      - 'api/_work-error-policy.js'
      - 'api/_work-issues.js'
      - 'api/_provider-fallback.js'
      - 'api/_shared-providers.js'
      - 'tests/shared-providers.test.js'
      - 'tests/scheduled-streaming.test.js'
      - 'api/update-streaming.js'
      - 'api/admin-status.js'
      - 'tests/admin-status.test.js'
      - 'vercel.json'
      - 'tests/provider-fallback.test.js'
      - 'tests/work-issues.test.js'
      - 'tests/work-error-policy.test.js'
      - 'api/_work-from-tmdb.js'
      - 'api/work-detail.js'
      - 'api/_detail-with-ledger.js'
      - 'api/search.js'
      - 'tests/detail-with-ledger.test.js'
      - 'tests/work-ledger-roundtrip.test.js'
      - 'tests/work-detail.test.js'
      - '.github/workflows/work-ledger-tests.yml'
  workflow_dispatch:

jobs:
  work-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          for file in api/_work-ledger.js api/_work-error-policy.js api/_work-issues.js api/_provider-fallback.js api/_shared-providers.js api/_work-from-tmdb.js api/work-detail.js api/_detail-with-ledger.js api/search.js api/update-streaming.js tests/*.test.js; do
            node --check "$file"
          done
      - name: Run all work ledger and provider safety tests
        run: node --test tests/work-detail.test.js tests/work-ledger-roundtrip.test.js tests/detail-with-ledger.test.js tests/work-error-policy.test.js tests/work-issues.test.js tests/provider-fallback.test.js tests/shared-providers.test.js tests/scheduled-streaming.test.js tests/admin-status.test.js
