name: Work ledger tests

on:
  push:
    branches:
      - feature/shared-work-ledger-20261031
  pull_request:
    paths:
      - 'api/admin-import-series-works.js'
      - 'tests/import-series-works.test.js'
      - 'api/_work-ledger.js'
      - 'api/_work-error-policy.js'
      - 'api/_work-issues.js'
      - 'api/_provider-fallback.js'
      - 'api/_shared-providers.js'
      - 'tests/shared-providers.test.js'
      - 'tests/scheduled-streaming.test.js'
      - 'api/update-streaming.js'
      - 'api/admin-status.js'
      - 'tests/admin-status.test.js'
      - 'admin-review.html'
      - 'admin-review.js'
      - 'admin-review.css'
      - 'api/admin-confirm-review.js'
      - 'tests/admin-confirm-review.test.js'
      - 'api/admin-review-queue.js'
      - 'tests/admin-review-queue.test.js'
      - 'api/_work-review.js'
      - 'tests/work-review.test.js'
      - 'vercel.json'
      - 'tests/provider-fallback.test.js'
      - 'tests/work-issues.test.js'
      - 'tests/work-error-policy.test.js'
      - 'api/_work-from-tmdb.js'
      - 'api/work-detail.js'
      - 'api/_detail-with-ledger.js'
      - 'api/search.js'
      - 'tests/detail-with-ledger.test.js'
      - 'tests/work-ledger-roundtrip.test.js'
      - 'tests/work-detail.test.js'
      - '.github/workflows/work-ledger-tests.yml'
  workflow_dispatch:

jobs:
  work-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          for file in admin-review.js api/admin-import-series-works.js api/admin-confirm-review.js api/admin-review-queue.js api/_work-review.js api/_work-ledger.js api/_work-error-policy.js api/_work-issues.js api/_provider-fallback.js api/_shared-providers.js api/_work-from-tmdb.js api/work-detail.js api/_detail-with-ledger.js api/search.js api/update-streaming.js tests/*.test.js; do
            node --check "$file"
          done
      - name: Run all work ledger and provider safety tests
        run: node --test tests/*.test.js
      - name: Verify movie shelf import boundary without writes
        run: node scripts/preview-movie-shelf-ledger.js --check
      - name: Build local-only ledger shelf comparison HTML
        run: |
          node scripts/build-shelf-ledger-preview.js /tmp/shelf-ledger-comparison.html
          node -e "const fs=require('fs'); const h=fs.readFileSync('/tmp/shelf-ledger-comparison.html','utf8'); if(!h.includes('開発用・台帳復元表示確認') || !h.includes('function renderMemories()') || !h.includes('function setTab(tab)')) process.exit(1); console.log('Local HTML comparison fixture verified')"
      - name: Verify researched movie IDs against TMDB (read-only, branch push only)
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo 'TMDB verification not run: secret unavailable in this event.'
            exit 0
          fi
          node scripts/verify-movie-shelf-tmdb.js
