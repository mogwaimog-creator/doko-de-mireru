name: Work ledger tests

on:
  push:
    branches:
      - feature/shared-work-ledger-20261031
  pull_request:
    paths:
      - 'api/_work-ledger.js'
      - 'api/_work-error-policy.js'
      - 'api/_work-issues.js'
      - 'api/_provider-fallback.js'
      - 'tests/provider-fallback.test.js'
      - 'tests/work-issues.test.js'
      - 'tests/work-error-policy.test.js'
      - 'api/_work-from-tmdb.js'
      - 'api/work-detail.js'
      - 'api/_detail-with-ledger.js'
      - 'api/search.js'
      - 'tests/detail-with-ledger.test.js'
      - 'tests/work-ledger-roundtrip.test.js'
      - 'tests/work-detail.test.js'
      - '.github/workflows/work-ledger-tests.yml'
  workflow_dispatch:

jobs:
  work-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check api/_work-ledger.js
          node --check api/_work-error-policy.js
          node --check api/_work-issues.js
          node --check api/_provider-fallback.js
          node --check tests/provider-fallback.test.js
          node --check tests/work-issues.test.js tests/provider-fallback.test.js
          node --check tests/work-error-policy.test.js tests/work-issues.test.js
          node --check api/_work-from-tmdb.js
          node --check api/work-detail.js
          node --check api/_detail-with-ledger.js
          node --check api/search.js
          node --check tests/work-detail.test.js
          node --check tests/work-ledger-roundtrip.test.js
          node --check tests/detail-with-ledger.test.js tests/work-error-policy.test.js
      - name: Test cache hit, miss and error handling
        run: node --test tests/work-detail.test.js tests/work-ledger-roundtrip.test.js tests/detail-with-ledger.test.js
