name: Recovery guard regression
on:
  push:
    branches:
      - integration/recover-latest-ledgers-20261112
    paths:
      - 'api/_release-application.js'
      - 'api/_new-work-ingest.js'
      - 'tests/integration-operations-preservation.test.js'
      - '.github/workflows/recovery-guard.yml'
  pull_request:
    paths:
      - 'api/_acquisition-guard.js'
      - 'api/_new-work-ingest.js'
      - 'api/_release-application.js'
      - 'tests/integration-operations-preservation.test.js'
      - 'api/_release-transport-candidate.js'
      - 'tests/acquisition-recovery.test.js'
      - 'tests/acquisition-redis.test.js'
      - 'tests/acquisition-source-integration.test.js'
      - '.github/workflows/recovery-guard.yml'
  workflow_dispatch:
jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check api/_acquisition-guard.js
          node --check api/_new-work-ingest.js
          node --check api/_release-application.js
          node --check tests/integration-operations-preservation.test.js
          node --check api/_release-transport-candidate.js
          node --check tests/acquisition-recovery.test.js
      - name: Run isolated regression tests
        run: node --test tests/acquisition-recovery.test.js tests/acquisition-source-integration.test.js tests/integration-operations-preservation.test.js
      - name: Install Redis CLI
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-tools
      - name: Run real Redis Lua tests (isolated CI only)
        run: node --test tests/acquisition-redis.test.js
