<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<title>作品台帳の確認｜ドコデミレル？ 管理用</title>
<link rel="stylesheet" href="/admin-review.css">
<script src="/admin-review.js" defer></script>
</head>
<body>
<main>
<h1>作品台帳の確認 <small>管理用</small></h1>
<p>作品名・公開年・TMDB IDを確認し、問題がなければ「確認済み」にしてください。確認済みの作品は再確認が必要になるまで保持されます。</p>
<section class="login" aria-label="管理者認証">
<label for="secret">管理者用の認証キー</label>
<input id="secret" type="password" autocomplete="off" spellcheck="false">
<button id="connect" type="button">一覧を表示</button>
<button id="disconnect" type="button" disabled>認証情報を消去</button>
<p class="hint">認証キーはこの画面を開いている間だけメモリに保持し、ブラウザへの保存やURLへの付与は行いません。共有PCでは利用後に消去してください。</p>
</section>
<p id="message" role="status" aria-live="polite">認証キーを入力して一覧を表示してください。</p>
<section id="queue" hidden>
<div class="toolbar"><strong id="summary"></strong><label><input id="pending" type="checkbox" checked> 未確認・再確認のみ表示</label></div>
<div class="table-scroll"><table><thead><tr><th>作品名</th><th>公開年</th><th>種別 / TMDB ID</th><th>確認状況</th><th>確認日時</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="pager"><button id="previous" type="button">前の50件</button><span id="position"></span><button id="next" type="button">次の50件</button></div>
</section>
</main>
</body>
</html>
