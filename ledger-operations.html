<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>開発用・取得上限の操作</title><style>body{font:16px/1.7 sans-serif;max-width:720px;margin:32px auto;padding:16px}label{display:block;margin:12px 0}input{font:inherit}button{padding:8px 16px;margin:8px 8px 8px 0}#status{white-space:pre-wrap}input[type=password],input[type=text]{width:95%}</style><script src="ledger-operations.js" defer></script></head><body><h1>開発用・新規作品の取得上限</h1><p>登録済み作品の表示を続けながら、新しい作品の取得を制限します。配信更新の頻度は変更しません。本番環境では操作できません。</p><label>管理用の認証文字列<input id="token" type="password" autocomplete="off"></label><button id="inspect" type="button">現在の状態を確認</button><p id="status" role="status">未確認</p><form id="policy"><label>1日に新しく取得できる作品数（0で新規取得を停止）<input id="limit" type="number" min="0" max="10000" required></label><label><input id="paused" type="checkbox">新しい作品の取得だけを停止</label><label>変更の理由<input id="reason" type="text" maxlength="300" required></label><button type="submit">確認した状態に対して保存</button></form><p>取得だけの停止では、すでに始まった処理は完了する場合があります。共通停止中にこの設定を変更しても再開しません。認証文字列はこの画面のメモリだけで扱い、ブラウザに保存しません。</p></body></html>
