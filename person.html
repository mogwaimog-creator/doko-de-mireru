<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
人物情報｜ドコデミレル？
</title>

<meta
  name="description"
  content="俳優・声優・監督の出演作品や監督作品を探せます。"
>

<meta
  name="robots"
  content="index,follow,max-image-preview:large"
>

<link
  id="canonicalLink"
  rel="canonical"
  href="https://doko-de-mireru.vercel.app/person.html"
>


<style>

/* =========================================================
   基本
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#f5f7fb;
  color:#111827;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

img{
  max-width:100%;
}


/* =========================================================
   ヘッダー
========================================================= */

.site-header{
  background:#263b5c;
  color:#fff;
  padding:18px 20px;
}

.site-header-inner{
  width:min(1000px,100%);
  margin:0 auto;
  text-align:center;
}

.site-title{
  margin:0;
  font-size:23px;
  font-weight:800;
  line-height:1.35;
}

.site-description{
  margin:4px 0 0;
  font-size:13px;
  line-height:1.5;
  opacity:.9;
}


/* =========================================================
   メイン
========================================================= */

.container{
  width:min(1000px,calc(100% - 32px));
  margin:24px auto 40px;
}

.breadcrumb{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:18px;
  color:#6b7280;
  font-size:13px;
}

.breadcrumb a:hover{
  color:#2563eb;
}


/* =========================================================
   読み込み
========================================================= */

.loading{
  background:#fff;
  border-radius:16px;
  padding:40px 20px;
  text-align:center;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
  color:#6b7280;
}


/* =========================================================
   人物情報
========================================================= */

.person-section{
  display:grid;
  grid-template-columns:220px minmax(0,1fr);
  gap:26px;
  background:
    linear-gradient(
      100deg,
      #dfe8f5 0%,
      #edf2fb 18%,
      #f7f5ff 48%,
      #ffffff 82%
    );
  border:1px solid #e3e8f0;
  border-radius:16px;
  padding:24px;
  margin-bottom:25px;
  box-shadow:
    inset 7px 0 20px rgba(38,59,92,.055),
    0 3px 15px rgba(0,0,0,.07);
}

.person-photo{
  width:100%;
  aspect-ratio:2 / 3;
  object-fit:cover;
  border-radius:12px;
  background:#e5e7eb;
  display:block;
}

.person-photo-placeholder{
  width:100%;
  aspect-ratio:2 / 3;
  border-radius:12px;
  background:#e5e7eb;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#6b7280;
  font-size:14px;
}

.person-name{
  margin:0;
  color:#111827;
  font-size:30px;
  line-height:1.35;
}

.person-original-name{
  margin:6px 0 18px;
  color:#6b7280;
  font-size:14px;
}

.person-meta{
  display:grid;
  gap:8px;
  margin-bottom:18px;
  padding:13px 15px;
  background:rgba(255,255,255,.82);
  border:1px solid #e6eaf0;
  border-radius:11px;
  font-size:14px;
  line-height:1.6;
}

.person-meta-row{
  display:flex;
  align-items:flex-start;
  gap:10px;
}

.person-meta-label{
  flex:0 0 90px;
  color:#6b7280;
  font-weight:600;
}

.person-meta-value{
  min-width:0;
  color:#111827;
}

.person-biography-title{
  margin:18px 0 7px;
  padding-top:14px;
  border-top:1px solid #e5e7eb;
  font-size:17px;
}

.person-biography{
  margin:0;
  color:#374151;
  font-size:14px;
  line-height:1.8;
  white-space:pre-line;
}

.person-biography.is-collapsed{
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:4;
  overflow:hidden;
}

.biography-toggle{
  display:inline-block;
  margin-top:8px;
  padding:0;
  border:0;
  background:transparent;
  color:#2563eb;
  font:inherit;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.biography-toggle:hover{
  text-decoration:underline;
}


/* =========================================================
   戻るボタン
========================================================= */

.person-back-actions{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  margin:0 0 15px;
}

.person-back-button{
  display:inline-block;
  padding:10px 15px;
  background:#fff;
  color:#111827;
  border-radius:8px;
  font-weight:bold;
  font-size:16px;
  text-decoration:none;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.person-back-button:hover{
  background:#f3f4f6;
}

.person-back-button.main-return{
  background:#2563eb;
  color:#fff;
  box-shadow:0 5px 14px rgba(37,99,235,.22);
}

.person-back-button.main-return:hover{
  background:#1d4ed8;
  color:#fff;
}

.person-back-button[hidden]{
  display:none !important;
}

/* =========================================================
   TOPへ戻るボタン
   PC：メイン枠の右横に表示
========================================================= */

.page-top-button{
  position:fixed;
  left:calc(50% + 520px);
  bottom:28px;
  z-index:1000;

  min-width:88px;
  height:56px;
  padding:0 20px;

  border:0;
  border-radius:999px;

  background:#263b5c;
  color:#fff;

  font:inherit;
  font-size:15px;
  font-weight:800;

  cursor:pointer;

  box-shadow:
    0 7px 20px
    rgba(38,59,92,.30);

  transition:
    transform .15s ease,
    background .15s ease,
    opacity .15s ease;
}

.page-top-button:hover{
  background:#1f314e;
  transform:translateY(-2px);
}

.page-top-button[hidden]{
  display:none !important;
}

/* 枠の横に置く余白がない画面では右下へ */
@media(max-width:1200px){

  .page-top-button{
    left:auto;
    right:18px;
  }

}

@media(max-width:700px){

  .page-top-button{
    left:auto;
    right:14px;
    bottom:14px;
    min-width:78px;
    height:50px;
    padding:0 16px;
    font-size:14px;
  }

}

/* =========================================================
   セクション移動タブ
========================================================= */

.section-nav{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  margin:0 0 20px;
  padding:10px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  box-shadow:0 3px 15px rgba(0,0,0,.07);
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:thin;
  -webkit-overflow-scrolling:touch;
}

.section-nav[hidden]{
  display:none !important;
}

.section-nav-button{
  flex:1 0 auto;
  min-width:0;
  padding:9px 12px;
  border:1px solid #dbe3ef;
  border-radius:999px;
  background:#f8fafc;
  color:#334155;
  font:inherit;
  font-size:13px;
  font-weight:700;
  line-height:1.3;
  white-space:nowrap;
  cursor:pointer;
  transition:
    background .15s ease,
    color .15s ease,
    border-color .15s ease,
    transform .15s ease,
    box-shadow .15s ease;
}

.section-nav-button:hover{
  background:#eff6ff;
  color:#2563eb;
  border-color:#93c5fd;
  transform:translateY(-1px);
  box-shadow:0 3px 10px rgba(37,99,235,.09);
}

.section-nav-button[hidden]{
  display:none !important;
}

/* スクロール先が画面上端にぴったり付きすぎないようにする */
.works-section{
  scroll-margin-top:18px;
}

/* =========================================================
   作品セクション
========================================================= */

.works-section{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin-bottom:20px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.works-title{
  margin:0;
  font-size:23px;
  color:#111827;
}

.works-description{
  margin:5px 0 14px;
  color:#6b7280;
  font-size:13px;
}

.works-grid{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:12px;
}


/* =========================================================
   作品カード
========================================================= */

.work-card{
  min-width:0;
  display:block;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:12px;
  overflow:hidden;
  transition:
    transform .15s ease,
    border-color .15s ease,
    box-shadow .15s ease;
}

.work-card:hover{
  transform:translateY(-2px);
  border-color:#93c5fd;
  box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.work-poster{
  display:block;
  width:100%;
  aspect-ratio:2 / 3;
  object-fit:cover;
  background:#e5e7eb;
}

.work-poster-placeholder{
  width:100%;
  aspect-ratio:2 / 3;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e5e7eb;
  color:#6b7280;
  font-size:13px;
}

.work-info{
  padding:6px 8px 7px;
}

.work-title{
  color:#111827;
  font-size:14px;
  font-weight:700;
  line-height:1.35;

  overflow:hidden;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
}

/* =========================================================
   作品カード 配信状況
========================================================= */

.work-provider-status{
  min-height:30px;
  padding:0 8px 8px;
  display:flex;
  align-items:center;
  gap:5px;
  overflow:hidden;
}

.work-provider-status.is-loading{
  color:#9ca3af;
  font-size:10px;
}

.work-provider-logos{
  display:flex;
  align-items:center;
  gap:5px;
  min-width:0;
  flex-wrap:nowrap;
}

.work-provider-logo{
  width:25px;
  height:25px;
  flex:0 0 25px;
  object-fit:contain;
  border-radius:6px;
  background:#fff;
  border:1px solid #e5e7eb;
}

.work-provider-none{
  width:100%;
  padding:5px 6px;
  border-radius:6px;
  background:#f3f4f6;
  color:#6b7280;
  font-size:10px;
  font-weight:700;
  text-align:center;
  white-space:nowrap;
}

.work-provider-more{
  color:#6b7280;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}

.work-character{
  margin-top:5px;
  color:#6b7280;
  font-size:11px;
  line-height:1.4;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.work-meta{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
  margin-top:7px;
  font-size:12px;
}

.work-year{
  margin-top:3px;
  color:#6b7280;
  font-size:11px;
  font-weight:600;
}

.work-type{
  display:inline-flex;
  align-items:center;
  padding:3px 7px;
  border-radius:999px;
  font-weight:700;
}

.type-movie{
  background:#fee2e2;
  color:#dc2626;
}

.type-drama{
  background:#dbeafe;
  color:#2563eb;
}

.type-anime{
  background:#dcfce7;
  color:#16a34a;
}

.work-rating{
  color:#111827;
  font-weight:600;
}


/* =========================================================
   もっと見る
========================================================= */

.load-more-wrapper{
  display:flex;
  justify-content:center;
  margin-top:20px;
}

.load-more-wrapper[hidden]{
  display:none !important;
}

.load-more-button{
  min-width:160px;
  padding:11px 24px;
  border:1px solid #2563eb;
  border-radius:10px;
  background:#fff;
  color:#2563eb;
  font:inherit;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:
    background .15s ease,
    transform .15s ease,
    box-shadow .15s ease;
}

.load-more-button:hover{
  background:#eff6ff;
  transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(37,99,235,.10);
}

.empty-message{
  color:#6b7280;
  font-size:14px;
}


/* =========================================================
   フッター
========================================================= */

.footer{
  padding:30px 20px;
  text-align:center;
  color:#6b7280;
  font-size:12px;
}


/* =========================================================
   タブレット
========================================================= */

@media(max-width:900px){

  .works-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

}


/* =========================================================
   スマホ
========================================================= */

@media(max-width:700px){

  .container{
    width:min(100% - 20px,1000px);
    margin-top:14px;
  }

  .site-header{
    padding:15px;
  }

  .site-title{
    font-size:21px;
  }

  .site-description{
    font-size:12px;
  }

  .person-section{
    grid-template-columns:105px minmax(0,1fr);
    gap:15px;
    padding:15px;
  }

  .person-name{
    font-size:22px;
  }

  .person-original-name{
    margin-bottom:12px;
    font-size:12px;
  }

  .person-meta{
    font-size:12px;
  }

  .person-meta-row{
    display:block;
  }

  .person-meta-label{
    display:block;
    margin-bottom:1px;
  }

  .person-biography-title,
  .person-biography{
    grid-column:1 / -1;
  }

  .person-biography-title{
    margin-top:10px;
  }

  .person-biography{
    font-size:13px;
  }

  .section-nav{
    gap:7px;
    padding:8px;
    margin-bottom:17px;
  }

  .section-nav-button{
    flex:0 0 auto;
    padding:8px 11px;
    font-size:12px;
  }

  .works-section{
    padding:15px;
  }

  .works-title{
    font-size:20px;
  }

  .works-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .work-info{
    padding:7px 8px 8px;
  }

  .work-title{
    font-size:13px;
  }

}


/* =========================================================
   パンくず：メインサイトと同じ見やすさに調整
========================================================= */
.breadcrumb,
.breadcrumb a{
  font-size:14px;
}

.breadcrumb a{
  color:#2563eb;
  font-weight:600;
  text-decoration:none;
}

.breadcrumb a:hover{
  text-decoration:underline;
}

.breadcrumb,
.breadcrumb span{
  color:#4b5563;
}

.breadcrumb{
  opacity:1;
}

</style>

</head>


<body>


<header class="site-header">

  <div class="site-header-inner">

    <a href="index.html">

      <h1 class="site-title">
        🎬 ドコデミレル？
      </h1>

    </a>

    <p class="site-description">
      映画・ドラマ・アニメがどこで見られるか検索できます
    </p>

  </div>

</header>


<main class="container">


  <nav class="breadcrumb">

    <a href="index.html">
      ドコデミレル？
    </a>

    <span>›</span>

    <span>
      人物情報
    </span>

  </nav>


  <!-- =====================================================
       戻るボタン
  ====================================================== -->

  <div class="person-back-actions">

    <a
      id="previousWorkLink"
      class="person-back-button"
      href="#"
      hidden
    >
      ← 元の作品に戻る
    </a>

    <a
      id="searchReturnLink"
      class="person-back-button main-return"
      href="./index.html"
    >
      ← 検索画面に戻る
    </a>

  </div>


  <div
    id="loading"
    class="loading"
  >
    人物情報を読み込んでいます…
  </div>


  <div
    id="content"
    hidden
  >


    <!-- =====================================================
         人物情報
    ====================================================== -->

    <section
      id="personSection"
      class="person-section"
    >

      <div id="personPhoto"></div>


      <div>

        <h2
          id="personName"
          class="person-name"
        ></h2>

        <div
          id="personOriginalName"
          class="person-original-name"
        ></div>


        <div
          id="personMeta"
          class="person-meta"
        ></div>


        <h3
          id="biographyTitle"
          class="person-biography-title"
        >
          プロフィール
        </h3>

        <p
          id="personBiography"
          class="person-biography is-collapsed"
        ></p>

        <button
          id="biographyToggle"
          class="biography-toggle"
          type="button"
          hidden
        >
          続きを読む
        </button>

      </div>

    </section>


    <!-- =====================================================
         セクション移動タブ
    ====================================================== -->

    <nav
      id="sectionNav"
      class="section-nav"
      aria-label="人物作品セクションへ移動"
      hidden
    >

      <button
        id="castNavButton"
        class="section-nav-button"
        type="button"
        data-target="castSection"
        hidden
      >
        🎭 出演作品
      </button>

      <button
        id="voiceNavButton"
        class="section-nav-button"
        type="button"
        data-target="voiceSection"
        hidden
      >
        🎙️ 声の出演
      </button>

      <button
        id="directorNavButton"
        class="section-nav-button"
        type="button"
        data-target="directorSection"
        hidden
      >
        🎬 監督作品
      </button>

      <button
        id="documentaryTalkNavButton"
        class="section-nav-button"
        type="button"
        data-target="documentaryTalkSection"
        hidden
      >
        🎥 ドキュメンタリー
      </button>

      <button
        id="otherNavButton"
        class="section-nav-button"
        type="button"
        data-target="otherSection"
        hidden
      >
        ⭐ その他
      </button>

    </nav>


    <!-- =====================================================
         出演作品
    ====================================================== -->

    <section
      id="castSection"
      class="works-section"
      hidden
    >

      <h2 id="castTitle" class="works-title">
        🎭 出演作品
      </h2>

      <p class="works-description">
        俳優として出演している作品
      </p>

      <div
        id="castWorks"
        class="works-grid"
      ></div>

      <div
        id="castMoreWrapper"
        class="load-more-wrapper"
        hidden
      >
        <button
          id="castMoreButton"
          class="load-more-button"
          type="button"
        >
          もっと見る
        </button>
      </div>

    </section>


    <!-- =====================================================
         声の出演
    ====================================================== -->

    <section
      id="voiceSection"
      class="works-section"
      hidden
    >

      <h2 id="voiceTitle" class="works-title">
        🎙️ 声の出演
      </h2>

      <p class="works-description">
        声で出演している作品
      </p>

      <div
        id="voiceWorks"
        class="works-grid"
      ></div>

      <div
        id="voiceMoreWrapper"
        class="load-more-wrapper"
        hidden
      >
        <button
          id="voiceMoreButton"
          class="load-more-button"
          type="button"
        >
          もっと見る
        </button>
      </div>

    </section>


    <!-- =====================================================
         監督作品
    ====================================================== -->

    <section
      id="directorSection"
      class="works-section"
      hidden
    >

      <h2 id="directorTitle" class="works-title">
        🎬 監督作品
      </h2>

      <p class="works-description">
        監督を担当した作品
      </p>

      <div
        id="directorWorks"
        class="works-grid"
      ></div>

      <div
        id="directorMoreWrapper"
        class="load-more-wrapper"
        hidden
      >
        <button
          id="directorMoreButton"
          class="load-more-button"
          type="button"
        >
          もっと見る
        </button>
      </div>

    </section>


    <!-- =====================================================
         ドキュメンタリー・トーク
    ====================================================== -->

    <section
      id="documentaryTalkSection"
      class="works-section"
      hidden
    >

      <h2 id="documentaryTalkTitle" class="works-title">
        🎥 ドキュメンタリー・トーク
      </h2>

      <p class="works-description">
        本人出演のドキュメンタリーやトーク番組
      </p>

      <div
        id="documentaryTalkWorks"
        class="works-grid"
      ></div>

      <div
        id="documentaryTalkMoreWrapper"
        class="load-more-wrapper"
        hidden
      >
        <button
          id="documentaryTalkMoreButton"
          class="load-more-button"
          type="button"
        >
          もっと見る
        </button>
      </div>

    </section>


    <!-- =====================================================
         その他の出演
    ====================================================== -->

    <section
      id="otherSection"
      class="works-section"
      hidden
    >

      <h2 id="otherTitle" class="works-title">
        ⭐ その他の出演
      </h2>

      <p class="works-description">
        本人出演・ゲスト出演・カメオ・特別出演など
      </p>

      <div
        id="otherWorks"
        class="works-grid"
      ></div>

      <div
        id="otherMoreWrapper"
        class="load-more-wrapper"
        hidden

// =========================================================

function escapeHtml(value){

  return String(
    value ?? ""
  )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


// =========================================================
// 日付
// =========================================================

function formatDate(value){

  if (!value) {
    return "";
  }

  const parts =
    String(value).split("-");

  if (parts.length !== 3) {
    return value;
  }

  return (
    Number(parts[0]) +
    "年" +
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}

function departmentName(value){

  if (value === "Directing") {

  }

  if (value === "Writing") {
    return "脚本";
  }

  if (value === "Production") {
    return "製作";
  }

  return value || "";
}

function createWorkCard(work){

  let detailUrl =
    "detail.html?id=" +
    encodeURIComponent(
      work.id
    );

  if (
    work.content_type === "tv"
  ) {
    detailUrl +=
      "&type=tv";
  }

  detailUrl +=
    "&from=person" +
    "&personId=" +
    encodeURIComponent(
      personId || ""
    ) +
    "&personName=" +
    encodeURIComponent(
      personName.textContent || ""

  const posterHtml =
    work.poster_path
      ? (

          'src="https://image.tmdb.org/t/p/w500' +
          escapeHtml(work.poster_path) +
          '" ' +
          'alt="' +

          'loading="lazy">'
        )

    '<a class="work-card" href="' +

      '<div class="work-info">' +

        '<div class="work-title">' +
          escapeHtml(title) +

        '<div class="work-year">' +
          escapeHtml(yearLabel) +
        "</div>" +

      "</div>" +

      '<div class="work-provider-status is-loading" ' +
        'data-provider-id="' + escapeHtml(String(work.id)) + '" ' +
        'data-provider-type="' +
          (work.content_type === "tv" ? "tv" : "movie") +
        '">配信情報</div>' +

    "</a>"
  );

}


// =========================================================
// 作品カード 配信情報
// 画面に近づいた作品だけ取得してページを軽くする
// =========================================================

const providerCache = new Map();

function renderProviderStatus(element, detail){

  if(!element){
    return;
  }

  const streaming =
    detail && Array.isArray(detail.streaming)
      ? detail.streaming
      : [];

  element.classList.remove("is-loading");

  if(streaming.length === 0){
    element.innerHTML =
      '<div class="work-provider-none">現在配信なし</div>';
    return;
  }

  const visible = streaming.slice(0,4);
  const rest = streaming.length - visible.length;

  element.innerHTML =
    '<div class="work-provider-logos">' +
      visible.map(function(provider){
        if(!provider || !provider.logo_path){
          return "";
        }
        return (
          '<img class="work-provider-logo" ' +
          'src="https://image.tmdb.org/t/p/w92' +
          escapeHtml(provider.logo_path) +
          '" alt="' +
          escapeHtml(provider.provider_name || "配信サービス") +
          '" title="' +
          escapeHtml(provider.provider_name || "") +
          '" loading="lazy">'
        );
      }).join("") +
      (rest > 0
        ? '<span class="work-provider-more">+' + rest + '</span>'
        : '') +
    '</div>';
}

async function loadProviderStatus(element){

  if(!element || element.dataset.loaded === "1"){
    return;
  }

  element.dataset.loaded = "1";

  const id = element.dataset.providerId;
  const type = element.dataset.providerType || "movie";
  const cacheKey = type + ":" + id;

  try{

    let detail = providerCache.get(cacheKey);

    if(!detail){
      const url =
        "/api/search?id=" + encodeURIComponent(id) +
        (type === "tv" ? "&type=tv" : "");

      const response = await fetch(url);

      if(!response.ok){
        throw new Error("配信情報を取得できませんでした。");
      }

      detail = await response.json();
      providerCache.set(cacheKey, detail);
    }

    renderProviderStatus(element, detail);

  }catch(error){
    console.warn("PROVIDER STATUS ERROR:", error);
    element.classList.remove("is-loading");
    element.innerHTML =
      '<div class="work-provider-none">配信情報なし</div>';
  }
}

let providerObserver = null;

function observeProviderStatuses(){

  const targets =
    document.querySelectorAll(
      '.work-provider-status:not([data-observed="1"])'
    );

  if(!("IntersectionObserver" in window)){
    targets.forEach(loadProviderStatus);
    return;
  }

  if(!providerObserver){
    providerObserver = new IntersectionObserver(
      function(entries){
        entries.forEach(function(entry){
          if(entry.isIntersecting){
            providerObserver.unobserve(entry.target);
            loadProviderStatus(entry.target);
          }
        });
      },
      { rootMargin:"250px 0px" }
    );
  }

  targets.forEach(function(target){
    target.dataset.observed = "1";
    providerObserver.observe(target);
  });
}

async function loadPerson(){

  if (!personId) {

    loading.textContent =
      "人物情報が指定されていません。";

    return;

  }


  try {

    const response =
      await fetch(
        "/api/search?personId=" +
        encodeURIComponent(
          personId
        )
      );


    if (!response.ok) {

      throw new Error(
        "人物情報の取得に失敗しました。"
      );

    }


    const person =
      await response.json();


    if (
      !person ||
      person.error
    ) {

      throw new Error(
        person &&
        person.error
          ? person.error
          : "人物情報がありません。"
      );

    }


    // =====================================================
    // SEO
    // =====================================================

    document.title =
      person.name +
      "の出演作品・監督作品｜ドコデミレル？";


    const canonicalUrl =
      "https://doko-de-mireru.vercel.app/person.html?id=" +
      encodeURIComponent(
        person.id
      );


    document
      .getElementById(
        "canonicalLink"
      )
      .setAttribute(
        "href",
        canonicalUrl
      );


    // =====================================================
    // 写真

        escapeHtml(

        'alt="' +
        escapeHtml(

        "写真なし" +
        "</div>";

    }


    // =====================================================
    // 名前

    personName.textContent =
      person.name || "";


    personOriginalName.textContent =
      (
        person.original_name &&
        person.original_name !==
        person.name
      )
        ? person.original_name
        : "";


    // =====================================================
    // 基本情報
    // =====================================================

    const meta = [];

          '<span class="person-meta-label">' +

  catch(error){

    );


    loading.textContent =
      "人物情報を読み込めませんでした。";

  }

}


// =========================================================
// TOPへ戻るボタン
// =========================================================

const pageTopButton =
  document.getElementById(
    "pageTopButton"
  );

function updatePageTopButton(){

  if(!pageTopButton){
    return;
  }

  pageTopButton.hidden =
    window.scrollY < 450;
}

if(pageTopButton){

  window.addEventListener(
    "scroll",
    updatePageTopButton,
    { passive:true }
  );

  pageTopButton.addEventListener(
    "click",
    function(){

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    }
  );

  updatePageTopButton();
}


// =========================================================
// 開始
// =========================================================

loadPerson();

</script>
