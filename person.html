<style>

/* =========================================================
   基本
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#f5f7fb;
  color:#111827;

}

a{

}

img{

/* =========================================================
   ヘッダー
========================================================= */

.site-header{
  background:#263b5c;
  color:#fff;
  padding:18px 20px;
}

.site-header-inner{
  width:min(1000px,100%);
  margin:0 auto;

}

.site-title{
  margin:0;

/* =========================================================

========================================================= */

}

.breadcrumb{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:18px;

  font-size:13px;
}

.breadcrumb a:hover{
  color:#2563eb;
}


/* =========================================================
   読み込み
========================================================= */

.loading{
  background:#fff;
  border-radius:16px;
  padding:40px 20px;
  text-align:center;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
  color:#6b7280;
}


/* =========================================================
   人物情報
========================================================= */

.person-section{
  display:grid;
  grid-template-columns:220px minmax(0,1fr);
  gap:26px;
  background:
    linear-gradient(
      100deg,
      #dfe8f5 0%,
      #edf2fb 18%,
      #f7f5ff 48%,
      #ffffff 82%

  padding:24px;
  margin-bottom:25px;

    0 3px 15px rgba(0,0,0,.07);
}

.person-photo{
  width:100%;
  aspect-ratio:2 / 3;
  object-fit:cover;
  border-radius:12px;
  background:#e5e7eb;
  display:block;
}

.person-photo-placeholder{
  width:100%;
  aspect-ratio:2 / 3;
  border-radius:12px;
  background:#e5e7eb;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#6b7280;
  font-size:14px;
}

.person-name{
  margin:0;
  color:#111827;
  font-size:30px;
  line-height:1.35;
}

.person-original-name{
  margin:6px 0 18px;
  color:#6b7280;
  font-size:14px;
}

.person-meta{
  display:grid;
  gap:8px;
  margin-bottom:18px;
  padding:13px 15px;
  background:rgba(255,255,255,.82);
  border:1px solid #e6eaf0;
  border-radius:11px;
  font-size:14px;
  line-height:1.6;
}

.person-meta-row{
  display:flex;
  align-items:flex-start;
  gap:10px;
}

.person-meta-label{
  flex:0 0 90px;
  color:#6b7280;
  font-weight:600;
}

.person-meta-value{
  min-width:0;
  color:#111827;
}

.person-biography-title{
  margin:18px 0 7px;
  padding-top:14px;
  border-top:1px solid #e5e7eb;
  font-size:17px;
}

.person-biography{
  margin:0;
  color:#374151;
  font-size:14px;
  line-height:1.8;
  white-space:pre-line;
}

.person-biography.is-collapsed{
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:4;
  overflow:hidden;
}

.biography-toggle{
  display:inline-block;
  margin-top:8px;
  padding:0;
  border:0;
  background:transparent;
  color:#2563eb;
  font:inherit;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.biography-toggle:hover{
  text-decoration:underline;
}


/* =========================================================
   作品セクション
========================================================= */

.works-section{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin-bottom:20px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.works-title{
  margin:0;
  font-size:23px;
  color:#111827;
}

.works-description{
  margin:5px 0 14px;
  color:#6b7280;
  font-size:13px;
}

.works-grid{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:12px;
}


/* =========================================================
   作品カード
========================================================= */

.work-card{
  min-width:0;
  display:block;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:12px;
  overflow:hidden;

}

.work-card:hover{

  box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.work-poster{

  object-fit:cover;
  background:#e5e7eb;
}

.work-poster-placeholder{
  width:100%;

  display:flex;
  align-items:center;
  justify-content:center;
  background:#e5e7eb;
  color:#6b7280;
  font-size:13px;
}

.work-info{
  padding:6px 8px 7px;
}

.work-title{
  color:#111827;
  font-size:14px;
  font-weight:700;
  line-height:1.35;

  overflow:hidden;
  display:-webkit-box;
  -webkit-box-orient:vertical;

}

.work-character{
  margin-top:5px;

  font-size:11px;
  line-height:1.4;

  overflow:hidden;
  text-overflow:ellipsis;

}

.work-meta{
  display:flex;
  align-items:center;

  gap:6px;
  margin-top:7px;
  font-size:12px;
}

.work-year{
  margin-top:3px;
  color:#6b7280;
  font-size:11px;
  font-weight:600;
}

.work-type{
  display:inline-flex;
  align-items:center;
  padding:3px 7px;
  border-radius:999px;
  font-weight:700;
}

.type-movie{
  background:#fee2e2;
  color:#dc2626;
}

.type-drama{
  background:#dbeafe;
  color:#2563eb;
}

.type-anime{
  background:#dcfce7;
  color:#16a34a;
}

.work-rating{
  color:#111827;
  font-weight:600;
}


/* =========================================================
   もっと見る
========================================================= */

.load-more-wrapper{
  display:flex;
  justify-content:center;
  margin-top:20px;
}

.load-more-button{

  padding:11px 24px;

  font-size:14px;

}

.load-more-button:hover{

  transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(37,99,235,.10);
}

.empty-message{

  font-size:14px;
}


/* =========================================================
   フッター
========================================================= */

.footer{

/* =========================================================

@media(max-width:900px){

  .person-biography-title{

  .person-biography{

    padding:7px 8px 8px;

    font-size:13px;
  }

}


/* =========================================================

}

</style>

<script>

// =========================================================
// URL
// =========================================================

const params =
  new URLSearchParams(
    window.location.search
  );

const personId =
  params.get("id");


// =========================================================
// 要素
// =========================================================

const loading =
  document.getElementById("loading");

const content =
  document.getElementById("content");

const personPhoto =
  document.getElementById("personPhoto");

const personName =
  document.getElementById("personName");

const personOriginalName =
  document.getElementById(
    "personOriginalName"
  );

const personMeta =
  document.getElementById("personMeta");

const personBiography =
  document.getElementById(
    "personBiography"
  );

const biographyTitle =
  document.getElementById(
    "biographyTitle"
  );

const biographyToggle =
  document.getElementById(
    "biographyToggle"
  );

const castTitle =
  document.getElementById("castTitle");

const voiceTitle =
  document.getElementById("voiceTitle");

const directorTitle =
  document.getElementById("directorTitle");

const documentaryTalkTitle =
  document.getElementById(
    "documentaryTalkTitle"
  );

const otherTitle =
  document.getElementById("otherTitle");


const castSection =
  document.getElementById("castSection");

const castWorks =
  document.getElementById("castWorks");

const castMoreWrapper =
  document.getElementById(
    "castMoreWrapper"
  );

const castMoreButton =
  document.getElementById(
    "castMoreButton"
  );


const voiceSection =
  document.getElementById("voiceSection");

const voiceWorks =
  document.getElementById("voiceWorks");

const voiceMoreWrapper =
  document.getElementById(
    "voiceMoreWrapper"
  );

const voiceMoreButton =
  document.getElementById(
    "voiceMoreButton"
  );


const directorSection =
  document.getElementById(
    "directorSection"
  );

const directorWorks =
  document.getElementById(
    "directorWorks"
  );

const directorMoreWrapper =
  document.getElementById(
    "directorMoreWrapper"
  );

const directorMoreButton =
  document.getElementById(
    "directorMoreButton"
  );


const documentaryTalkSection =
  document.getElementById(
    "documentaryTalkSection"
  );

const documentaryTalkWorks =
  document.getElementById(
    "documentaryTalkWorks"
  );

const documentaryTalkMoreWrapper =
  document.getElementById(
    "documentaryTalkMoreWrapper"
  );

const documentaryTalkMoreButton =
  document.getElementById(
    "documentaryTalkMoreButton"
  );


const otherSection =
  document.getElementById("otherSection");

const otherWorks =
  document.getElementById("otherWorks");

const otherMoreWrapper =
  document.getElementById(
    "otherMoreWrapper"
  );

const otherMoreButton =
  document.getElementById(
    "otherMoreButton"
  );


// =========================================================
// 表示件数
// =========================================================

let castData = [];
let voiceData = [];
let directorData = [];
let documentaryTalkData = [];
let otherData = [];

let castDisplayCount = 12;
let voiceDisplayCount = 12;
let directorDisplayCount = 12;
let documentaryTalkDisplayCount = 12;
let otherDisplayCount = 12;


// =========================================================
// HTMLエスケープ
// =========================================================

function escapeHtml(value){

  return String(
    value ?? ""
  )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


// =========================================================
// 日付
// =========================================================

function formatDate(value){

  if (!value) {
    return "";
  }

  const parts =
    String(value).split("-");

  if (parts.length !== 3) {
    return value;
  }

  return (
    Number(parts[0]) +
    "年" +
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}


// =========================================================
// 担当
// =========================================================

function departmentName(value){

  if (value === "Acting") {
    return "俳優・声優";
  }

  if (value === "Directing") {
    return "監督";
  }

  if (value === "Writing") {
    return "脚本";
  }

  if (value === "Production") {
    return "製作";
  }

  return value || "";
}


// =========================================================
// 作品カード
// =========================================================

function createWorkCard(work){

  if (
    !work ||
    !work.id
  ) {
    return "";
  }

  const title =
    work.title || "タイトル不明";

  const year =
    work.release_date
      ? String(
          work.release_date
        ).slice(0,4)
      : "";

  let yearLabel =
    year
      ? year + "年"
      : "公開年不明";

  if (
    work.release_status === "upcoming"
  ) {
    yearLabel += "・公開予定";
  }

  let detailUrl =
    "detail.html?id=" +
    encodeURIComponent(
      work.id
    );

  if (
    work.content_type === "tv"
  ) {
    detailUrl +=
      "&type=tv";
  }

  detailUrl +=
    "&from=person" +
    "&personId=" +
    encodeURIComponent(
      personId || ""
    ) +
    "&personName=" +
    encodeURIComponent(
      personName.textContent || ""
    );

  const posterHtml =
    work.poster_path
      ? (
          '<img ' +
          'class="work-poster" ' +
          'src="https://image.tmdb.org/t/p/w500' +
          escapeHtml(work.poster_path) +
          '" ' +
          'alt="' +
          escapeHtml(title) +
          'のポスター" ' +
          'loading="lazy">'
        )
      : (
          '<div class="work-poster-placeholder">' +
          "画像なし" +
          "</div>"
        );

  return (
    '<a class="work-card" href="' +
    detailUrl +
    '">' +

      posterHtml +

      '<div class="work-info">' +

        '<div class="work-title">' +
          escapeHtml(title) +
        "</div>" +

        '<div class="work-year">' +
          escapeHtml(yearLabel) +
        "</div>" +

      "</div>" +

    "</a>"
  );

}


// =========================================================
// 出演作品表示
// =========================================================

function renderWorks(
  data,
  displayCount,
  worksElement,
  moreWrapper
){

  // 実際に表示できる作品だけに絞る
  const validData =
    data.filter(
      work =>
        work &&
        work.id
    );

  const visible =
    validData.slice(
      0,
      displayCount
    );

  worksElement.innerHTML =
    visible
      .map(createWorkCard)
      .join("");

  // まだ表示していない作品がある時だけ
  // 「もっと見る」を表示する
  moreWrapper.hidden =
    displayCount >= validData.length;
}


function renderCast(){
  renderWorks(
    castData,
    castDisplayCount,
    castWorks,
    castMoreWrapper
  );
}


function renderVoice(){
  renderWorks(
    voiceData,
    voiceDisplayCount,
    voiceWorks,
    voiceMoreWrapper
  );
}


function renderDirector(){
  renderWorks(
    directorData,
    directorDisplayCount,
    directorWorks,
    directorMoreWrapper
  );
}


function renderDocumentaryTalk(){
  renderWorks(
    documentaryTalkData,
    documentaryTalkDisplayCount,
    documentaryTalkWorks,
    documentaryTalkMoreWrapper
  );
}


function renderOther(){
  renderWorks(
    otherData,
    otherDisplayCount,
    otherWorks,
    otherMoreWrapper
  );
}

castMoreButton.addEventListener(
  "click",
  function(){
    castDisplayCount += 12;
    renderCast();
  }
);

voiceMoreButton.addEventListener(
  "click",
  function(){
    voiceDisplayCount += 12;
    renderVoice();
  }
);

directorMoreButton.addEventListener(

    renderDirector();
  }
);

documentaryTalkMoreButton.addEventListener(
  "click",
  function(){
    documentaryTalkDisplayCount += 12;
    renderDocumentaryTalk();
  }
);

otherMoreButton.addEventListener(
  "click",
  function(){
    otherDisplayCount += 12;
    renderOther();
  }
);


// =========================================================
// プロフィール 続きを読む
// =========================================================

biographyToggle.addEventListener(
  "click",
  function(){

    const collapsed =
      personBiography.classList.contains(
        "is-collapsed"
      );

    if (collapsed) {

      personBiography.classList.remove(
        "is-collapsed"
      );

      biographyToggle.textContent =
        "閉じる";

    }
    else {

      personBiography.classList.add(
        "is-collapsed"
      );

      biographyToggle.textContent =
        "続きを読む";

    }

  }
);


// =========================================================
// 人物情報取得
// =========================================================

async function loadPerson(){

  if (!personId) {

    loading.textContent =
      "人物情報が指定されていません。";

    return;

  }


  try {

    const response =
      await fetch(
        "/api/search?personId=" +
        encodeURIComponent(
          personId
        )
      );


    if (!response.ok) {

      throw new Error(
        "人物情報の取得に失敗しました。"
      );

    }


    const person =
      await response.json();


    if (
      !person ||
      person.error
    ) {

      throw new Error(
        person &&
        person.error
          ? person.error
          : "人物情報がありません。"
      );

    }


    // =====================================================
    // SEO
    // =====================================================

    document.title =
      person.name +
      "の出演作品・監督作品｜ドコデミレル？";


    const canonicalUrl =
      "https://doko-de-mireru.vercel.app/person.html?id=" +
      encodeURIComponent(
        person.id
      );


    document
      .getElementById(
        "canonicalLink"
      )
      .setAttribute(
        "href",
        canonicalUrl
      );


    // =====================================================
    // 写真
    // =====================================================

    if (person.profile_path) {

      personPhoto.innerHTML =
        '<img ' +
        'class="person-photo" ' +
        'src="https://image.tmdb.org/t/p/w500' +
        escapeHtml(
          person.profile_path
        ) +
        '" ' +
        'alt="' +
        escapeHtml(
          person.name
        ) +
        '">';

    }
    else {

      personPhoto.innerHTML =
        '<div class="person-photo-placeholder">' +
        "写真なし" +
        "</div>";

    }


    // =====================================================
    // 名前
    // =====================================================

    personName.textContent =
      person.name || "";


    personOriginalName.textContent =
      (
        person.original_name &&
        person.original_name !==
        person.name
      )
        ? person.original_name
        : "";


    // =====================================================
    // 基本情報
    // =====================================================

    const meta = [];


    if (
      person.known_for_department
    ) {

      meta.push(
        '<div class="person-meta-row">' +
          '<span class="person-meta-label">' +
            "主な分野" +
          "</span>" +
          '<span class="person-meta-value">' +
            escapeHtml(
              departmentName(
                person.known_for_department
              )
            ) +
          "</span>" +
        "</div>"
      );

    }


    if (person.birthday) {

      meta.push(
        '<div class="person-meta-row">' +
          '<span class="person-meta-label">' +
            "生年月日" +
          "</span>" +
          '<span class="person-meta-value">' +
            escapeHtml(
              formatDate(
                person.birthday
              )
            ) +
          "</span>" +
        "</div>"
      );

    }


    if (person.deathday) {

      meta.push(
        '<div class="person-meta-row">' +
          '<span class="person-meta-label">' +
            "没年月日" +
          "</span>" +
          '<span class="person-meta-value">' +
            escapeHtml(
              formatDate(
                person.deathday
              )
            ) +
          "</span>" +
        "</div>"
      );

    }


    if (person.place_of_birth) {

      meta.push(
        '<div class="person-meta-row">' +
          '<span class="person-meta-label">' +
            "出生地" +
          "</span>" +
          '<span class="person-meta-value">' +
            escapeHtml(
              person.place_of_birth
            ) +
          "</span>" +
        "</div>"
      );

    }


    personMeta.innerHTML =
      meta.join("");


    // =====================================================
    // 略歴
    // =====================================================

    if (person.biography) {

      personBiography.textContent =
        person.biography;

      personBiography.classList.add(
        "is-collapsed"
      );

      biographyToggle.hidden =
        person.biography.length < 180;

    }
    else {

      biographyTitle.hidden =
        true;

      personBiography.hidden =
        true;

      biographyToggle.hidden =
        true;

    }


    // =====================================================
    // 出演作品
    // =====================================================

    castData =
      Array.isArray(person.cast)
        ? person.cast
        : [];

    if (
      castData.length > 0
    ) {
      castSection.hidden =
        false;

      castTitle.textContent =
        "🎭 出演作品（" +
        castData.length +
        "件）";

      renderCast();
    }


    // =====================================================
    // 声の出演
    // =====================================================

    voiceData =
      Array.isArray(person.voice)
        ? person.voice
        : [];

    if (
      voiceData.length > 0
    ) {
      voiceSection.hidden =
        false;

      voiceTitle.textContent =
        "🎙️ 声の出演（" +
        voiceData.length +
        "件）";

      renderVoice();
    }


    // =====================================================
    // 監督作品
    // =====================================================

    directorData =
      Array.isArray(person.directed)
        ? person.directed
        : [];

    if (
      directorData.length > 0
    ) {
      directorSection.hidden =
        false;

      directorTitle.textContent =
        "🎬 監督作品（" +
        directorData.length +
        "件）";

      renderDirector();
    }


    // =====================================================
    // ドキュメンタリー・トーク
    // =====================================================

    documentaryTalkData =
      Array.isArray(
        person.documentary_talk
      )
        ? person.documentary_talk
        : [];

    if (
      documentaryTalkData.length > 0
    ) {
      documentaryTalkSection.hidden =
        false;

      documentaryTalkTitle.textContent =
        "🎥 ドキュメンタリー・トーク（" +
        documentaryTalkData.length +
        "件）";

      renderDocumentaryTalk();
    }


    // =====================================================
    // その他の出演
    // =====================================================

    otherData =
      Array.isArray(person.other)
        ? person.other
        : [];

    if (
      otherData.length > 0
    ) {
      otherSection.hidden =
        false;

      otherTitle.textContent =
        "⭐ その他の出演（" +
        otherData.length +
        "件）";

      renderOther();
    }


    // =====================================================
    // 完了
    // =====================================================

    loading.hidden =
      true;

    content.hidden =
      false;


  }
  catch(error){

    console.error(
      "PERSON PAGE ERROR:",
      error
    );


    loading.textContent =
      "人物情報を読み込めませんでした。";

  }

}


// =========================================================
// 開始
// =========================================================

loadPerson();

</script>
