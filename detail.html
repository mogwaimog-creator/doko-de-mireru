<head>

<title>作品情報 | ドコデミレル？</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    Arial,
    "Noto Sans JP",
    sans-serif;
  background:#f5f7fb;
  color:#222;
}

a{
  color:inherit;
  text-decoration:none;
}


/* =====================================================
   ヘッダー
===================================================== */

  background:#111827;
  color:#fff;
  padding:20px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:8px 0 0;

}


/* =====================================================
   コンテナ
===================================================== */

.container{
  max-width:1000px;
  margin:0 auto;

}


/* =====================================================
   戻るボタン
===================================================== */

.back{
  display:inline-block;

  color:#111827;

  font-weight:bold;

  display:flex;

  background:#fff;

  padding:25px;

  box-shadow:

.info-line{

   共通セクション
===================================================== */

.section{

  background:#fff;

  padding:25px;

  border-radius:14px;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.08);
}

.section h3{
  margin-top:0;
  font-size:22px;
}


/* =====================================================
   出演者
===================================================== */

.cast-list{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.cast-item{
  background:#f3f4f6;

  border-radius:20px;
}

   配信サービス

.provider-group{

  border-radius:12px;

}

  margin-top:0;

/* =====================================================
   配信見出し
===================================================== */

.provider-title{
  display:flex;

  align-items:center;

  gap:8px;

  font-size:19px;

  font-weight:bold;

  margin-bottom:12px;

  padding:10px 12px;

  border-radius:9px;

  color:#111827;

/* =====================================================
   配信カード
===================================================== */

.provider-card{
  display:flex;

  align-items:center;

  gap:12px;

  padding:10px 12px;

  margin-bottom:8px;

  background:#fff;

  border-radius:10px;

  border:1px solid #e5e7eb;

  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.provider-card:last-child{
  margin-bottom:0;
}

.provider-card:hover{

  transform:translateY(-1px);

  box-shadow:
    0 3px 10px
    rgba(0,0,0,.08);
}


/* =====================================================
   ロゴ
===================================================== */

.provider-logo{
  width:48px;
  height:48px;

  object-fit:contain;

  border-radius:8px;

  background:#fff;

  border:1px solid #eee;

  flex-shrink:0;
}


/* =====================================================
   サービス情報
===================================================== */

.provider-info{
  flex:1;

  min-width:0;
}

.provider-name{
  font-size:16px;

  font-weight:bold;

  color:#111827;
}


/* =====================================================
   配信ボタン
===================================================== */

.provider-button{
  display:inline-block;

  padding:9px 13px;

  color:#fff;

  text-decoration:none;

  border-radius:7px;

  font-weight:bold;

  font-size:12px;

  white-space:nowrap;

  flex-shrink:0;

  transition:
    opacity .15s ease,
    transform .15s ease;
}

.provider-button:hover{

  opacity:.85;

  transform:translateY(-1px);
}


/* =====================================================
   サービスカラー
===================================================== */

.netflix-button{
  background:#e50914;
}

.amazon-button{
  background:#ff9900;
  color:#111;
}

.unext-button{
  background:#00a3e0;
}

.hulu-button{
  background:#1ce783;
  color:#111;
}

.disney-button{
  background:#113ccf;
}

.apple-button{
  background:#111;
}


/* =====================================================
   シリーズ
===================================================== */

.series-list{
  display:flex;

  gap:15px;

  overflow-x:auto;

  padding:5px 2px 12px;
}

.series-item{
  flex:0 0 150px;

  padding:0;

  border:none;

  display:block;
}

.series-poster{
  width:150px;
  height:215px;

  object-fit:cover;

  border-radius:8px;

  display:block;

  background:#e5e7eb;
}

.series-item a{
  display:block;

  color:#2563eb;

  text-decoration:none;

}

.series-year{

  font-size:12px;

}


/* =====================================================
   TMDB
===================================================== */

.tmdb-link{
  display:inline-block;

  margin-top:0;

  padding:12px 18px;

  background:#01b4e4;

  text-decoration:none;

  border-radius:8px;

}


/* =====================================================
   ローディング
===================================================== */

.loading{
  text-align:center;

  padding:60px 20px;

}


/* =====================================================
   エラー
===================================================== */

.error{
  text-align:center;

  padding:50px 20px;

/* =====================================================

===================================================== */

@media(max-width:700px){

  }


  .series-list{

  }


  .series-item{

<body>


<header>

<h1>🎬 ドコデミレル？</h1>

<p>
映画がどこで見られるか検索できます
</p>

</header>


<div class="container">


<a
  class="back"
  href="index.html"
>
← 検索結果に戻る
</a>


<div
  id="loading"
  class="loading"
>
作品情報を読み込んでいます…
</div>


<div
  id="error"
  class="error"
  style="display:none;"
>
作品情報を取得できませんでした。
</div>


<div
  id="content"
  style="display:none;"
>


<!-- =====================================================
     作品情報
===================================================== -->

<div class="movie-header">

<img
  id="poster"
  class="poster"
  alt=""
>

<div class="movie-info">

<h2 id="title"></h2>

<div
  id="originalTitle"
  class="original-title"
></div>

<div
  id="releaseDate"
  class="info-line"
></div>

<div
  id="language"
  class="info-line"
></div>

<div
  id="rating"
  class="info-line"
></div>

<div
  id="director"
  class="info-line"
></div>

</div>

</div>


<!-- =====================================================
     出演者
===================================================== -->

<div class="section">

<h3>👥 出演者</h3>

<div
  id="cast"
  class="cast-list"
></div>

</div>


<!-- =====================================================
     あらすじ
===================================================== -->

<div class="section">

<h3>📖 あらすじ</h3>

<p id="overview"></p>

</div>


<!-- =====================================================
     配信サービス
===================================================== -->

<div
  id="providersSection"
  class="section"
>

<h3>
📺 この作品はどこで見られる？
</h3>

<div id="providers"></div>

</div>


<!-- =====================================================
     シリーズ
===================================================== -->

<div
  id="seriesSection"
  class="section"
  style="display:none;"
>

<h3>🎞️ シリーズ作品</h3>

<h4 id="seriesName"></h4>

<div
  id="seriesMovies"
  class="series-list"
></div>

</div>


<!-- =====================================================
     TMDB
===================================================== -->

<div class="section">

<a
  id="tmdbLink"
  class="tmdb-link"
  href="#"
  target="_blank"
  rel="noopener noreferrer"
>
TMDBで作品情報を見る →
</a>

</div>


</div>

</div>


<script>

(function(){

"use strict";


/* =====================================================
   API
===================================================== */

const API_URL =
  "/api/search";


/* =====================================================
   DOM
===================================================== */

const loading =
  document.getElementById(
    "loading"
  );

const errorBox =
  document.getElementById(
    "error"
  );

const content =
  document.getElementById(
    "content"
  );


/* =====================================================
   ID取得
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const movieId =
  params.get("id");


if(!movieId){

  showError(
    "作品IDが指定されていません。"
  );

  return;

}


/* =====================================================
   作品読み込み
===================================================== */

loadMovie();


async function loadMovie(){

  try{

    const url =
      API_URL +
      "?id=" +
      encodeURIComponent(
        movieId
      );


    console.log(
      "DETAIL API:",
      url
    );


    const response =
      await fetch(
        url,
        {
          method:"GET",
          headers:{
            "Accept":
              "application/json"
          },
          cache:"no-store"
        }
      );


    if(!response.ok){

      const errorText =
        await response.text();


      console.error(
        "API ERROR:",
        response.status,
        errorText
      );


      throw new Error(
        "API ERROR " +
        response.status
      );

    }


    const movie =
      await response.json();


    console.log(
      "MOVIE DATA:",
      movie
    );


    if(
      !movie ||
      !movie.id
    ){

      throw new Error(
        "作品データがありません。"
      );

    }


    renderMovie(
      movie
    );


  }catch(error){

    console.error(
      "DETAIL PAGE ERROR:",
      error
    );


    showError(
      "作品情報を取得できませんでした。"
    );

  }

}


/* =====================================================
   作品表示
===================================================== */

function renderMovie(movie){

  loading.style.display =
    "none";

  errorBox.style.display =
    "none";

  content.style.display =
    "block";


  setText(
    "title",
    movie.title || ""
  );


  setText(
    "originalTitle",
    movie.original_title || ""
  );


  setText(
    "releaseDate",

    movie.release_date

      ? "公開日： " +
        formatDate(
          movie.release_date
        )

      : ""
  );


  const language =
    movie.original_language || "";


  let languageText =
    "";


  if(language === "en"){

    languageText =
      "🌎 英語";

  }else if(language){

    languageText =
      "🌎 原語：" +
      language;

  }


  setText(
    "language",
    languageText
  );


  const rating =
    Number(
      movie.vote_average || 0
    );


  setText(
    "rating",

    rating > 0

      ? "⭐ TMDB評価 " +
        rating.toFixed(1)

      : ""
  );


  const poster =
    document.getElementById(
      "poster"
    );


  if(movie.poster_path){

    poster.src =
      "https://image.tmdb.org/t/p/w500" +
      movie.poster_path;


    poster.alt =
      movie.title || "";


    poster.style.display =
      "block";

  }else{

    poster.style.display =
      "none";

  }


  const director =
    movie.director;


  if(
    director &&
    director.name
  ){

    setText(
      "director",
      "🎬 監督： " +
      director.name
    );

  }else{

    setText(
      "director",
      ""
    );

  }


  renderCast(
    movie.cast
  );


  setText(
    "overview",
    movie.overview ||
      "あらすじ情報はありません。"
  );


  renderProviders(
    movie
  );


  renderSeries(
    movie.series
  );


  const tmdbLink =
    document.getElementById(
      "tmdbLink"
    );


  tmdbLink.href =
    movie.link ||
    (
      "https://www.themoviedb.org/movie/" +
      movie.id
    );


  document.title =
    (
      movie.title ||
      "作品情報"
    ) +
    " | ドコデミレル？";

}


/* =====================================================
   出演者
===================================================== */

function renderCast(cast){

  const container =
    document.getElementById(
      "cast"
    );


  container.innerHTML =
    "";


  if(
    !Array.isArray(cast) ||
    cast.length === 0
  ){

    container.textContent =
      "出演者情報はありません。";

    return;

  }


  cast.forEach(
    function(person){

      if(
        !person ||
        !person.name
      ){

        return;

      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "cast-item";


      item.textContent =
        person.name;


      container.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   配信サービス
===================================================== */

function renderProviders(movie){

  const container =
    document.getElementById(
      "providers"
    );


  container.innerHTML =
    "";


  const streaming =
    normalizeProviders(
      Array.isArray(movie.streaming)
        ? movie.streaming
        : []
    );


  const rental =
    normalizeProviders(
      Array.isArray(movie.rental)
        ? movie.rental
        : []
    );


  const purchase =
    normalizeProviders(
      Array.isArray(movie.purchase)
        ? movie.purchase
        : []
    );


  /*
   * 同じサービスを重複表示しない
   */

  const allProviders = [];


  streaming
    .concat(rental)
    .concat(purchase)
    .forEach(function(provider){

      if(!provider){

        return;

      }


      const name =
        normalizeProviderName(
          provider.provider_name
        );


      if(!name){

        return;

      }


      const exists =
        allProviders.some(function(item){

          return (
            normalizeProviderName(
              item.provider_name
            ).toLowerCase() ===
            name.toLowerCase()
          );

        });


      if(!exists){

        allProviders.push({
          ...provider,
          provider_name:name
        });

      }

    });


  if(!allProviders.length){

    const empty =
      document.createElement(
        "p"
      );


    empty.textContent =
      "現在、配信情報を確認できません。";


    container.appendChild(
      empty
    );


    return;

  }


  /*
   * Netflixを最初に表示
   */

  allProviders.sort(function(a,b){

    const aNetflix =
      a.provider_name === "Netflix"
        ? 0
        : 1;


    const bNetflix =
      b.provider_name === "Netflix"
        ? 0
        : 1;


    return aNetflix - bNetflix;

  });


  allProviders.forEach(function(provider){

    createProviderCard(
      container,
      provider,
      movie
    );

  });

}


/* =====================================================
   サービス名整理
===================================================== */

function normalizeProviderName(name){

  const value =
    String(
      name || ""
    ).trim();


  const lower =
    value.toLowerCase();


  if(
    lower.includes("netflix")
  ){

    return "Netflix";

  }


  if(
    lower.includes("amazon") ||
    lower.includes("prime video")
  ){

    return "Prime Video";

  }


  if(
    lower.includes("u-next") ||
    lower.includes("unext")
  ){

    return "U-NEXT";

  }


  if(
    lower.includes("hulu")
  ){

    return "Hulu";

  }


  if(
    lower.includes("disney")
  ){

    return "Disney+";

  }


  if(
    lower.includes("apple")
  ){

    return "Apple TV";

  }


  if(
    lower.includes("google play")
  ){

    return "Google Play";

  }


  if(
    lower.includes("fandango")
  ){

    return "Fandango";

  }


  if(
    lower.includes("fod")
  ){

    return "FOD";

  }


  return value;

}


/* =====================================================
   配信カード
===================================================== */

function createProviderCard(
  container,
  provider,
  movie
){

  if(!provider){

    return;

  }


  const card =
    document.createElement(
      "div"
    );


  card.className =
    "provider-card";


  /* ---------------------------------------------------
     ロゴ
  --------------------------------------------------- */

  if(provider.logo_path){

    const logo =
      document.createElement(
        "img"
      );


    logo.className =
      "provider-logo";


    logo.src =
      "https://image.tmdb.org/t/p/w92" +
      provider.logo_path;


    logo.alt =
      provider.provider_name ||
      "";


    card.appendChild(
      logo
    );

  }


  /* ---------------------------------------------------
     サービス名
  --------------------------------------------------- */

  const info =
    document.createElement(
      "div"
    );


  info.className =
    "provider-info";


  const name =
    document.createElement(
      "div"
    );


  name.className =
    "provider-name";


  name.textContent =
    provider.provider_name ||
    "配信サービス";


  info.appendChild(
    name
  );


  card.appendChild(
    info
  );


  /* ---------------------------------------------------
     リンク
  --------------------------------------------------- */

  const url =
    getProviderLink(
      provider,
      movie
    );


  if(url){

    const button =
      document.createElement(
        "a"
      );


    button.className =
      "provider-button " +
      getButtonClass(
        provider.provider_name
      );


    button.href =
      url;


    button.target =
      "_blank";


    button.rel =
      "noopener noreferrer";


    button.textContent =
      getButtonText(
        provider.provider_name
      );


    card.appendChild(
      button
    );

  }


  container.appendChild(
    card
  );

}


/* =====================================================
   配信リンク
===================================================== */

function getProviderLink(
  provider,
  movie
){

  const name =
    String(
      provider.provider_name ||
      ""
    ).toLowerCase();


  /* ---------------------------------------------------
     Netflix
     ※作品IDは使用しない
     ※Netflix日本公式ホームページへ
  --------------------------------------------------- */

  if(
    name.includes("netflix")
  ){

    return (
      "https://www.netflix.com/jp/"
    );

  }


  /* ---------------------------------------------------
     Prime Video
  --------------------------------------------------- */

  if(
    name.includes("amazon") ||
    name.includes("prime video")
  ){

    return (
      movie.amazon_url ||
      (
        "https://www.amazon.co.jp/s?k=" +
        encodeURIComponent(
          movie.title || ""
        ) +
        "&i=instant-video"
      )
    );

  }


  /* ---------------------------------------------------
     U-NEXT
  --------------------------------------------------- */

  if(
    name.includes("u-next") ||
    name.includes("unext")
  ){

    return (
      movie.unext_url ||
      "https://video.unext.jp/"
    );

  }


  /* ---------------------------------------------------
     Hulu
  --------------------------------------------------- */

  if(
    name.includes("hulu")
  ){

    return (
      movie.hulu_url ||
      (
        "https://www.hulu.jp/search?q=" +
        encodeURIComponent(
          movie.title || ""
        )
      )
    );

  }


  /* ---------------------------------------------------
     Disney+
  --------------------------------------------------- */

  if(
    name.includes("disney")
  ){

    return (
      movie.disney_url ||
      (
        "https://www.disneyplus.com/ja-jp/search/" +
        encodeURIComponent(
          movie.title || ""
        )
      )
    );

  }


  /* ---------------------------------------------------
     Apple TV
  --------------------------------------------------- */

  if(
    name.includes("apple")
  ){

    return (
      movie.apple_tv_url ||
      (
        "https://tv.apple.com/jp/search?term=" +
        encodeURIComponent(
          movie.title || ""
        )
      )
    );

  }


  /* ---------------------------------------------------
     その他
  --------------------------------------------------- */

  return getGenericProviderUrl(
    provider
  );

}


/* =====================================================
   一般URL
===================================================== */

function getGenericProviderUrl(
  provider
){

  const urls = [

    provider.url,

    provider.link,

    provider.watch_link,

    provider.provider_url

  ];


  for(
    let i = 0;
    i < urls.length;
    i++
  ){

    if(
      typeof urls[i] === "string" &&
      /^https?:\/\//i.test(
        urls[i]
      )
    ){

      return urls[i];

    }

  }


  return null;

}


/* =====================================================
   ボタン色
===================================================== */

function getButtonClass(name){

  const value =
    String(
      name || ""
    ).toLowerCase();


  if(
    value.includes("netflix")
  ){

    return "netflix-button";

  }


  if(
    value.includes("amazon") ||
    value.includes("prime video")
  ){

    return "amazon-button";

  }


  if(
    value.includes("u-next") ||
    value.includes("unext")
  ){

    return "unext-button";

  }


  if(
    value.includes("hulu")
  ){

    return "hulu-button";

  }


  if(
    value.includes("disney")
  ){

    return "disney-button";

  }


  if(
    value.includes("apple")
  ){

    return "apple-button";

  }


  return "";

}


/* =====================================================
   ボタン文字
===================================================== */

function getButtonText(name){

  const value =
    String(
      name || ""
    ).toLowerCase();


  if(
    value.includes("netflix")
  ){

    return "Netflixを見る →";

  }


  if(
    value.includes("amazon") ||
    value.includes("prime video")
  ){

    return "Prime Videoを見る →";

  }


  if(
    value.includes("u-next") ||
    value.includes("unext")
  ){

    return "U-NEXTを見る →";

  }


  if(
    value.includes("hulu")
  ){

    return "Huluを見る →";

  }


  if(
    value.includes("disney")
  ){

    return "Disney+を見る →";

  }


  if(
    value.includes("apple")
  ){

    return "Apple TVを見る →";

  }


  return "サービスを見る →";

}


/* =====================================================
   配信サービス正規化
===================================================== */

function normalizeProviders(
  providers
){

  if(
    !Array.isArray(
      providers
    )
  ){

    return [];

  }


  return providers
    .filter(function(provider){

      return (
        provider &&
        provider.provider_name
      );

    })
    .map(function(provider){

      return {

        provider_id:
          provider.provider_id || null,

        provider_name:
          provider.provider_name || "",

        logo_path:
          provider.logo_path || null,

        provider_url:
          provider.provider_url || null

      };

    });

}


/* =====================================================
   シリーズ
===================================================== */

function renderSeries(series){

  const section =
    document.getElementById(
      "seriesSection"
    );


  const container =
    document.getElementById(
      "seriesMovies"
    );


  if(
    !series ||
    !Array.isArray(
      series.movies
    ) ||
    series.movies.length === 0
  ){

    section.style.display =
      "none";

    return;

  }


  section.style.display =
    "block";


  setText(
    "seriesName",
    series.name ||
      "シリーズ作品"
  );


  container.innerHTML =
    "";


  series.movies.forEach(
    function(movie){

      if(
        !movie ||
        !movie.id
      ){

        return;

      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "series-item";


      if(movie.poster_path){

        const image =
          document.createElement(
            "img"
          );


        image.className =
          "series-poster";


        image.src =
          "https://image.tmdb.org/t/p/w300" +
          movie.poster_path;


        image.alt =
          movie.title || "";


        item.appendChild(
          image
        );

      }


      const link =
        document.createElement(
          "a"
        );


      link.href =
        "detail.html?id=" +
        encodeURIComponent(
          movie.id
        );


      link.textContent =
        movie.title || "";


      item.appendChild(
        link
      );


      const year =
        document.createElement(
          "div"
        );


      year.className =
        "series-year";


      year.textContent =
        movie.release_date
          ? formatYear(
              movie.release_date
            )
          : "";


      item.appendChild(
        year
      );


      container.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   日付
===================================================== */

function formatDate(date){

  if(!date){

    return "";

  }


  const parts =
    String(date).split("-");


  if(parts.length !== 3){

    return date;

  }


  return (
    Number(parts[0]) +
    "年" +
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}


/* =====================================================
   年
===================================================== */

function formatYear(date){

  if(!date){

    return "";

  }


  return (
    Number(
      String(date).substring(
        0,
        4
      )
    ) +
    "年"
  );

}


/* =====================================================
   テキスト
===================================================== */

function setText(
  id,
  text
){

  const element =
    document.getElementById(
      id
    );


  if(!element){

    return;

  }


  element.textContent =
    text || "";

}


/* =====================================================
   エラー
===================================================== */

function showError(message){

  loading.style.display =
    "none";

  content.style.display =
    "none";

  errorBox.style.display =
    "block";

  errorBox.textContent =
    message;

}
