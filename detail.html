<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>作品情報 | ドコデミレル？</title>

<style>

/* =========================================================
   基本
========================================================= */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    Arial,
    "Noto Sans JP",
    sans-serif;
  background:#f5f7fb;
  color:#222;
}

a{
  color:inherit;
  text-decoration:none;
}


/* =========================================================
   ヘッダー
========================================================= */

header{
  background:#111827;
  color:#fff;
  padding:18px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:27px;
}

header p{
  margin:6px 0 0;
  color:#d1d5db;
  font-size:13px;
}


/* =========================================================
   全体
========================================================= */

.container{
  width:min(1000px,94%);
  margin:20px auto 40px;
}


/* =========================================================
   戻るボタン
========================================================= */

.back{
  display:inline-block;
  margin-bottom:15px;
  padding:9px 14px;
  background:#fff;
  color:#111827;
  border-radius:8px;
  font-weight:bold;
  font-size:14px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}


/* =========================================================
   作品メイン
========================================================= */

.movie-header{
  display:flex;
  align-items:flex-start;
  gap:20px;

  background:#fff;

  padding:18px;

  border-radius:14px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.08);
}


/* =========================================================
   ポスター
========================================================= */

.poster{
  width:190px;
  height:285px;

  object-fit:cover;

  border-radius:9px;

  background:#e5e7eb;

  flex-shrink:0;
}


/* =========================================================
   右側情報
========================================================= */

.movie-info{
  flex:1;
  min-width:0;
}

.movie-info h2{
  margin:0 0 4px;
  font-size:27px;
  line-height:1.35;
  color:#111827;
}

.original-title{
  color:#6b7280;
  font-size:13px;
  margin-bottom:10px;
}

.info-line{
  margin:4px 0;
  font-size:14px;
  color:#4b5563;
}


/* =========================================================
   あらすじ
========================================================= */

.overview-box{
  margin-top:12px;
  padding-top:11px;
  border-top:1px solid #e5e7eb;
}

.overview-title{
  font-weight:bold;
  font-size:15px;
  margin-bottom:4px;
}

.overview-text{
  margin:0;
  font-size:13px;
  line-height:1.65;
  color:#374151;
}


/* =========================================================
   監督
========================================================= */

.director-box{
  margin-top:10px;
  font-size:14px;
}

.director-label{
  font-weight:bold;
}


/* =========================================================
   出演者
========================================================= */

.cast-box{
  margin-top:9px;
  font-size:14px;
}

.cast-label{
  font-weight:bold;
  margin-bottom:5px;
}

.cast-list{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.cast-item{
  background:#f3f4f6;
  padding:5px 9px;
  border-radius:15px;
  font-size:12px;
}


/* =========================================================
   セクション
========================================================= */

.section{
  margin-top:18px;

  background:#fff;

  padding:18px;

  border-radius:14px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.07);
}

.section h3{
  margin:0 0 13px;
  font-size:19px;
}


/* =========================================================
   配信サービス
========================================================= */

.provider-group{
  margin-top:12px;
}

.provider-group:first-child{
  margin-top:0;
}

.provider-title{
  font-size:16px;
  font-weight:bold;
  margin-bottom:8px;
}


/* =========================================================
   配信カード
========================================================= */

.provider-card{
  display:flex;
  align-items:center;
  gap:10px;

  padding:10px;

  margin-bottom:7px;

  background:#f9fafb;

  border-radius:9px;

  border:1px solid #e5e7eb;
}

.provider-logo{
  width:42px;
  height:42px;

  object-fit:contain;

  border-radius:7px;

  background:#fff;

  flex-shrink:0;
}

.provider-info{
  flex:1;
  min-width:0;
}

.provider-name{
  font-size:15px;
  font-weight:bold;
}

.provider-type{
  color:#666;
  margin-top:2px;
  font-size:12px;
}

.provider-button{
  display:inline-block;

  padding:8px 12px;

  background:#2563eb;
  color:#fff;

  border-radius:7px;

  font-weight:bold;

  white-space:nowrap;

  font-size:13px;
}

.provider-button:hover{
  opacity:.85;
}


/* =========================================================
   サービスカラー
========================================================= */

.netflix-button{
  background:#e50914;
}

.amazon-button{
  background:#ff9900;
  color:#111;
}

.unext-button{
  background:#00a3e0;
}

.hulu-button{
  background:#1ce783;
  color:#111;
}

.disney-button{
  background:#113ccf;
}

.apple-button{
  background:#111;
}


/* =========================================================
   シリーズ
========================================================= */

.series-item{
  display:flex;
  align-items:center;
  gap:10px;

  padding:9px 0;

  border-bottom:1px solid #eee;
}

.series-item:last-child{
  border-bottom:none;
}

.series-poster{
  width:55px;
  height:78px;

  object-fit:cover;

  border-radius:5px;

  flex-shrink:0;
}

.series-item a{
  color:#2563eb;
  font-weight:bold;
  font-size:14px;
}


/* =========================================================
   TMDB
========================================================= */

.tmdb-link{
  display:inline-block;

  padding:10px 15px;

  background:#01b4e4;
  color:#fff;

  border-radius:8px;

  font-weight:bold;

  font-size:13px;
}


/* =========================================================
   読み込み・エラー
========================================================= */

.loading{
  text-align:center;
  padding:60px 20px;
  font-size:18px;
  color:#6b7280;
}

.error{
  text-align:center;
  padding:40px 20px;

  color:#b91c1c;

  background:#fff;

  border-radius:12px;
}


/* =========================================================
   スマホ
========================================================= */

@media(max-width:700px){

  header h1{
    font-size:24px;
  }

  .container{
    width:94%;
    margin-top:15px;
  }

  .movie-header{
    gap:14px;
    padding:14px;
  }

  .poster{
    width:125px;
    height:188px;
  }

  .movie-info h2{
    font-size:20px;
  }

  .original-title{
    font-size:12px;
    margin-bottom:7px;
  }

  .info-line{
    font-size:12px;
    margin:3px 0;
  }

  .overview-box{
    margin-top:8px;
    padding-top:8px;
  }

  .overview-title{
    font-size:13px;
  }

  .overview-text{
    font-size:12px;
    line-height:1.55;
  }

  .director-box,
  .cast-box{
    font-size:12px;
  }

  .cast-item{
    font-size:11px;
    padding:4px 7px;
  }

  .section{
    margin-top:13px;
    padding:14px;
  }

  .section h3{
    font-size:17px;
    margin-bottom:10px;
  }

  .provider-card{
    padding:8px;
  }

  .provider-logo{
    width:38px;
    height:38px;
  }

  .provider-name{
    font-size:13px;
  }

  .provider-button{
    padding:7px 9px;
    font-size:11px;
  }

}


/* =========================================================
   とても小さいスマホ
========================================================= */

@media(max-width:480px){

  .movie-header{
    flex-direction:column;
  }

  .poster{
    width:145px;
    height:218px;
    margin:0 auto;
  }

  .movie-info{
    width:100%;
  }

  .movie-info h2{
    font-size:21px;
  }

  .provider-card{
    flex-wrap:wrap;
  }

  .provider-info{
    min-width:calc(100% - 55px);
  }

  .provider-button{
    width:100%;
    text-align:center;
    margin-top:3px;
  }

}


/* =========================================================
   フッター
========================================================= */

footer{
  text-align:center;
  padding:25px 15px;
  color:#9ca3af;
  font-size:12px;
}

</style>

<body>


<header>

<h1>🎬 ドコデミレル？</h1>

<p>
映画がどこで見られるか検索できます

<main class="container">


<a
  class="back"
  href="index.html"
>
← 検索結果に戻る
</a>


<div
  id="loading"
  class="loading"
>
作品情報を読み込んでいます…
</div>


<div
  id="error"
  class="error"
  style="display:none;"
>
作品情報を取得できませんでした。
</div>


<div
  id="content"
  style="display:none;"
>


<!-- =====================================================
     作品情報
===================================================== -->

<div class="movie-header">


<img
  id="poster"
  class="poster"
  alt=""
>


<div class="movie-info">


<h2 id="title"></h2>


<div
  id="originalTitle"
  class="original-title"
></div>


<div
  id="releaseDate"
  class="info-line"
></div>


<div
  id="language"
  class="info-line"
></div>


<div
  id="rating"
  class="info-line"
></div>


<!-- あらすじ -->

<div class="overview-box">

<div class="overview-title">
📖 あらすじ
</div>

<p
  id="overview"
  class="overview-text"
></p>

</div>

<div
  id="directorBox"
  class="director-box"
>

<span class="director-label">
🎬 監督：
</span>

👥 出演：
</div>

  id="cast"
  class="cast-list"
></div>

</div>


</div>

</div>

     配信サービス
===================================================== -->

<div
  id="providersSection"
  class="section"
>

<h3>
📺 この作品はどこで見られる？
</h3>

<div id="providers"></div>

</div>


<!-- =====================================================
     シリーズ
===================================================== -->

<div
  id="seriesSection"
  class="section"
  style="display:none;"
>

<h3>
🎞️ シリーズ作品
</h3>

<h4 id="seriesName"></h4>

<div id="seriesMovies"></div>

</div>


<!-- =====================================================

<div class="section">

<a
  id="tmdbLink"
  class="tmdb-link"

  target="_blank"

>
TMDBで作品情報を見る →

</div>

</main>


<footer>

</footer>


<script>

(function(){

"use strict";


/* =====================================================
   API
===================================================== */

const API_URL =
  "/api/search";


/* =====================================================
   DOM
===================================================== */

const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error");

const content =
  document.getElementById("content");


/* =====================================================
   ID取得
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const movieId =
  params.get("id");


/* =====================================================
   ID確認
===================================================== */

if(!movieId){

  showError(
    "作品IDが指定されていません。"
  );

  return;

}


/* =====================================================
   読み込み
===================================================== */

loadMovie();


async function loadMovie(){

  try{

    const url =
      API_URL +
      "?id=" +
      encodeURIComponent(movieId);


    console.log(
      "DETAIL API:",
      url
    );


    const response =
      await fetch(
        url,
        {
          method:"GET",

          headers:{
            "Accept":
              "application/json"
          },

          cache:"no-store"
        }
      );


    if(!response.ok){

      const errorText =
        await response.text();


      console.error(
        "API ERROR:",
        response.status,
        errorText
      );


      throw new Error(
        "API ERROR " +
        response.status
      );

    }


    const movie =
      await response.json();


    console.log(
      "MOVIE DATA:",
      movie
    );


    if(
      !movie ||
      !movie.id
    ){

      throw new Error(
        "作品データがありません。"
      );

    }


    renderMovie(
      movie
    );


  }catch(error){

    console.error(
      "DETAIL PAGE ERROR:",
      error
    );


    showError(
      "作品情報を取得できませんでした。"
    );

  }

}


/* =====================================================
   作品表示
===================================================== */

function renderMovie(movie){

  loading.style.display =
    "none";


  errorBox.style.display =
    "none";


  content.style.display =
    "block";


  /* タイトル */

  setText(
    "title",
    movie.title || ""
  );


  /* 原題 */

  setText(
    "originalTitle",
    movie.original_title || ""
  );


  /* 公開日 */

  setText(
    "releaseDate",

    movie.release_date
      ? "公開日： " +
        formatDate(
          movie.release_date
        )
      : ""
  );


  /* 言語 */

  const language =
    movie.original_language ||
    "";


  let languageText =
    "";


  if(
    language === "en"
  ){

    languageText =
      "🌎 英語";

  }else if(language){

    languageText =
      "🌎 原語：" +
      language;

  }


  setText(
    "language",
    languageText
  );


  /* 評価 */

  const rating =
    Number(
      movie.vote_average || 0
    );


  setText(
    "rating",

    rating > 0
      ? "⭐ TMDB評価 " +
        rating.toFixed(1)
      : ""
  );


  /* ポスター */

  const poster =
    document.getElementById(
      "poster"
    );


  if(movie.poster_path){

    poster.src =
      "https://image.tmdb.org/t/p/w500" +
      movie.poster_path;


    poster.alt =
      movie.title || "";


    poster.style.display =
      "block";

  }else{

    poster.style.display =
      "none";

  }


  /* 監督 */

  const director =
    movie.director;


  if(
    director &&
    director.name
  ){

    setText(
      "director",
      director.name
    );

  }else{

    setText(
      "director",
      "情報なし"
    );

  }


  /* 出演者 */

  renderCast(
    movie.cast
  );


  /* あらすじ */

  setText(
    "overview",

    movie.overview ||
    "あらすじ情報はありません。"
  );


  /* 配信サービス */

  renderProviders(
    movie
  );


  /* シリーズ */

  renderSeries(
    movie.series
  );


  /* TMDB */

  const tmdbLink =
    document.getElementById(
      "tmdbLink"
    );


  tmdbLink.href =
    movie.link ||
    (
      "https://www.themoviedb.org/movie/" +
      movie.id
    );


  /* タイトル変更 */

  document.title =
    (
      movie.title ||
      "作品情報"
    ) +
    " | ドコデミレル？";

}


/* =====================================================
   出演者
===================================================== */

function renderCast(cast){

  const container =
    document.getElementById(
      "cast"
    );


  container.innerHTML =
    "";


  if(
    !Array.isArray(cast) ||
    cast.length === 0
  ){

    container.textContent =
      "情報なし";

    return;

  }


  cast.forEach(
    function(person){

      if(
        !person ||
        !person.name
      ){

        return;

      }


      const item =
        document.createElement(
          "span"
        );


      item.className =
        "cast-item";


      item.textContent =
        person.name;


      container.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   配信サービス
===================================================== */

function renderProviders(movie){

  const container =
    document.getElementById(
      "providers"
    );


  container.innerHTML =
    "";


  const streaming =
    Array.isArray(
      movie.streaming
    )
      ? movie.streaming
      : [];


  const rental =
    Array.isArray(
      movie.rental
    )
      ? movie.rental
      : [];


  const purchase =
    Array.isArray(
      movie.purchase
    )
      ? movie.purchase
      : [];


  renderProviderGroup(
    container,
    "🟢 見放題",
    streaming,
    "streaming",
    movie
  );


  renderProviderGroup(
    container,
    "🎞️ レンタル",
    rental,
    "rental",
    movie
  );


  renderProviderGroup(
    container,
    "💰 購入",
    purchase,
    "purchase",
    movie
  );


  if(
    !streaming.length &&
    !rental.length &&
    !purchase.length
  ){

    const empty =
      document.createElement(
        "p"
      );


    empty.textContent =
      "現在、配信情報を確認できません。";


    container.appendChild(
      empty
    );

  }

}


/* =====================================================
   配信グループ
===================================================== */

function renderProviderGroup(
  container,
  title,
  providers,
  type,
  movie
){

  if(
    !Array.isArray(providers) ||
    providers.length === 0
  ){

    return;

  }


  const group =
    document.createElement(
      "div"
    );


  group.className =
    "provider-group";


  const heading =
    document.createElement(
      "div"
    );


  heading.className =
    "provider-title";


  heading.textContent =
    title;


  group.appendChild(
    heading
  );


  providers.forEach(
    function(provider){

      createProviderCard(
        group,
        provider,
        type,
        movie
      );

    }
  );


  container.appendChild(
    group
  );

}


/* =====================================================
   配信カード
===================================================== */

function createProviderCard(
  container,
  provider,
  type,
  movie
){

  if(!provider){

    return;

  }


  const card =
    document.createElement(
      "div"
    );


  card.className =
    "provider-card";


  /* ロゴ */

  if(provider.logo_path){

    const logo =
      document.createElement(
        "img"
      );


    logo.className =
      "provider-logo";


    logo.src =
      "https://image.tmdb.org/t/p/w92" +
      provider.logo_path;


    logo.alt =
      provider.provider_name ||
      "";


    card.appendChild(
      logo
    );

  }


  /* 情報 */

  const info =
    document.createElement(
      "div"
    );


  info.className =
    "provider-info";


  const name =
    document.createElement(
      "div"
    );


  name.className =
    "provider-name";


  name.textContent =
    provider.provider_name ||
    "配信サービス";


  info.appendChild(
    name
  );


  const typeText =
    document.createElement(
      "div"
    );


  typeText.className =
    "provider-type";


  if(
    type === "streaming"
  ){

    typeText.textContent =
      "見放題";

  }else if(
    type === "rental"
  ){

    typeText.textContent =
      "レンタル";

  }else{

    typeText.textContent =
      "購入";

  }


  info.appendChild(
    typeText
  );


  /* 字幕・吹き替え */

  const subtitle =
    document.createElement(
      "div"
    );


  subtitle.textContent =
    "🎧 字幕：未確認";


  subtitle.style.fontSize =
    "11px";


  subtitle.style.color =
    "#777";


  info.appendChild(
    subtitle
  );


  const dub =
    document.createElement(
      "div"
    );


  dub.textContent =
    "🎙️ 吹き替え：未確認";


  dub.style.fontSize =
    "11px";


  dub.style.color =
    "#777";


  info.appendChild(
    dub
  );


  card.appendChild(
    info
  );


  /* リンク */

  const url =
    getProviderLink(
      provider,
      movie
    );


  if(url){

    const button =
      document.createElement(
        "a"
      );


    button.className =
      "provider-button " +
      getButtonClass(
        provider.provider_name
      );


    button.href =
      url;


    button.target =
      "_blank";


    button.rel =
      "noopener noreferrer";


    button.textContent =
      getButtonText(
        provider.provider_name
      );


    card.appendChild(
      button
    );

  }


  container.appendChild(
    card
  );

}


/* =====================================================
   配信リンク
===================================================== */

function getProviderLink(
  provider,
  movie
){

  const name =
    String(
      provider.provider_name ||
      ""
    ).toLowerCase();


  /* Netflix */

  if(
    name.includes("netflix")
  ){

    return (
      movie.netflix_url ||

      (
        movie.netflix &&
        movie.netflix.url
      ) ||

      (
        "https://www.netflix.com/jp/search?q=" +
        encodeURIComponent(
          movie.title || ""
        )
      )
    );

  }


  /* Amazon */

  if(
    name.includes("amazon")
  ){

    return (
      movie.amazon_url ||

      (
        movie.amazon &&
        movie.amazon.url
      ) ||

      (
        "https://www.amazon.co.jp/s?k=" +
        encodeURIComponent(
          movie.title || ""
        ) +
        "&i=instant-video"
      )
    );

  }


  /* U-NEXT */

  if(
    name.includes("u-next") ||
    name.includes("unext")
  ){

    return (
      movie.unext_url ||
      getGenericProviderUrl(
        provider
      )
    );

  }


  /* Hulu */

  if(
    name.includes("hulu")
  ){

    return (
      movie.hulu_url ||
      getGenericProviderUrl(
        provider
      )
    );

  }


  /* Disney+ */

  if(
    name.includes("disney")
  ){

    return (
      movie.disney_url ||
      getGenericProviderUrl(
        provider
      )
    );

  }


  /* Apple TV */

  if(
    name.includes("apple")
  ){

    return (
      movie.apple_tv_url ||
      getGenericProviderUrl(
        provider
      )
    );

  }


  return getGenericProviderUrl(
    provider
  );

}


/* =====================================================
   一般URL
===================================================== */

function getGenericProviderUrl(
  provider
){

  const urls = [

    provider.url,

    provider.link,

    provider.watch_link,

    provider.provider_url

  ];


  for(
    let i = 0;
    i < urls.length;
    i++
  ){

    if(
      typeof urls[i] === "string" &&
      /^https?:\/\//i.test(
        urls[i]
      )
    ){

      return urls[i];

    }

  }


  return null;

}

/* =====================================================
   シリーズ
===================================================== */

function renderSeries(series){

  const section =
    document.getElementById(
      "seriesSection"
    );


  const container =
    document.getElementById(
      "seriesMovies"
    );


  if(
    !series ||
    !Array.isArray(
      series.movies
    ) ||
    series.movies.length === 0
  ){

    section.style.display =
      "none";

    return;

  }


  section.style.display =
    "block";


  setText(
    "seriesName",
    series.name ||
      "シリーズ作品"
  );


  container.innerHTML =
    "";


  series.movies.forEach(
    function(movie){

      if(
        !movie ||
        !movie.id
      ){

        return;

      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "series-item";


      if(movie.poster_path){

        const image =
          document.createElement(
            "img"
          );


        image.className =
          "series-poster";


        image.src =
          "https://image.tmdb.org/t/p/w300" +
          movie.poster_path;


        image.alt =
          movie.title || "";


        item.appendChild(
          image
        );

      }


      const info =
        document.createElement(
          "div"
        );


      const link =
        document.createElement(
          "a"
        );


      link.href =
        "detail.html?id=" +
        encodeURIComponent(
          movie.id
        );


      link.textContent =
        movie.title || "";


      info.appendChild(
        link
      );


      const year =
        document.createElement(
          "div"
        );


      year.textContent =
        movie.release_date
          ? formatYear(
              movie.release_date
            )
          : "";


      year.style.fontSize =
        "12px";


      year.style.color =
        "#777";


      info.appendChild(
        year
      );


      item.appendChild(
        info
      );


      container.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   日付
===================================================== */

function formatDate(date){

  if(!date){

    return "";

  }


  const parts =
    String(date).split("-");


  if(
    parts.length !== 3
  ){

    return date;

  }


  return (
    Number(parts[0]) +
    "年" +
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}


/* =====================================================
   年
===================================================== */

function formatYear(date){

  if(!date){

    return "";

  }


  return (
    Number(
      String(date).substring(0,4)
    ) +
    "年"
  );

}


/* =====================================================
   テキスト設定
===================================================== */

function setText(
  id,
  text
){

  const element =
    document.getElementById(
      id
    );


  if(!element){

    return;

  }


  element.textContent =
    text || "";

}


/* =====================================================
   エラー
===================================================== */

function showError(message){

  loading.style.display =
    "none";


  content.style.display =
    "none";


  errorBox.style.display =
    "block";


  errorBox.textContent =
    message;

}
