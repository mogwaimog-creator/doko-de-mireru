<title>作品情報 | ドコデミレル？</title>

<style>

/* =====================================================
   基本
===================================================== */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    Arial,
    "Noto Sans JP",
    sans-serif;
  background:#f5f7fb;
  color:#222;
  font-size:16px;
}

a{
  color:inherit;
  text-decoration:none;

/* =====================================================
   ヘッダー
===================================================== */

header{
  background:#111827;
  color:#fff;

}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:7px 0 0;
  color:#d1d5db;
  font-size:15px;
}


/* =====================================================
   コンテナ
===================================================== */

.container{
  max-width:1000px;
  margin:0 auto;
  padding:18px;
}


/* =====================================================
   戻る
===================================================== */

.back{
  display:inline-block;
  margin-bottom:15px;
  padding:10px 15px;
  background:#fff;
  color:#111827;
  border-radius:8px;
  font-weight:bold;
  font-size:16px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}


/* =====================================================
   ローディング
===================================================== */

.loading{
  text-align:center;
  padding:60px 20px;
  font-size:20px;
}


/* =====================================================
   エラー
===================================================== */

.error{
  display:none;
  padding:25px;
  background:#fff;
  border-radius:12px;
  color:#b91c1c;

}

.error-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}


/* =====================================================
   作品上部
===================================================== */

.movie-header{
  display:flex;
  align-items:flex-start;
  gap:24px;
  background:#fff;
  padding:24px;
  border-radius:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}


/* =====================================================
   ポスター
===================================================== */

.poster{
  width:230px;
  max-width:30%;
  height:auto;
  object-fit:cover;
  border-radius:9px;
  align-self:flex-start;
  flex-shrink:0;
}


/* =====================================================
   情報
===================================================== */

.movie-info{
  flex:1;
  min-width:0;
}


/* =====================================================
   タイトル
===================================================== */

.movie-info h2{
  margin:0 0 10px;
  font-size:36px;
  line-height:1.4;

}


/* =====================================================
   原題
===================================================== */

.original-title{
  color:#666;
  font-size:17px;
  margin-bottom:15px;

}


/* =====================================================
   基本情報
===================================================== */

.basic-info{
  display:flex;
  flex-wrap:wrap;
  gap:8px 22px;
  margin-bottom:15px;
}

.info-line{
  margin:0;
  font-size:18px;

}


/* =====================================================
   ジャンル
===================================================== */

.genre-info{
  display:flex;
  flex-wrap:wrap;
  gap:6px 8px;
  margin-bottom:15px;
}

.genre-item{
  display:inline-block;
  padding:4px 9px;
  background:#f3f4f6;
  color:#555;
  border-radius:12px;
  font-size:14px;
}


/* =====================================================
   詳細
===================================================== */

.movie-side-info{

}

.side-section{
  margin-top:15px;

.side-section:first-child{

}

.side-title{

/* =====================================================

===================================================== */

.cast-list{

  flex-wrap:wrap;

}

.cast-item{

/* =====================================================
   あらすじ
===================================================== */

.overview-text{
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:5;
  overflow:hidden;
}


/* =====================================================

===================================================== */

.section{

  background:#fff;

  border-radius:14px;

}

.section h3{

}


/* =====================================================
   配信グループ
===================================================== */

.provider-group{
  margin-top:20px;
  padding:12px;
  border-radius:12px;
  border:1px solid #e5e7eb;
}

.provider-group:first-child{

}

.provider-group.streaming{

}

.provider-group.rental{

}

.provider-group.purchase{

}


/* =====================================================
   配信見出し
===================================================== */

.provider-title{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:19px;
  font-weight:bold;
  margin-bottom:10px;
  padding:9px 11px;
  border-radius:9px;

  background:#f3f4f6;
}

.provider-group.streaming .provider-title{
  border-left-color:#16a34a;
  background:#dcfce7;
  color:#166534;
}

.provider-group.rental .provider-title{

  background:#ffedd5;
  color:#9a3412;
}

.provider-group.purchase .provider-title{
  border-left-color:#2563eb;
  background:#dbeafe;
  color:#1e40af;
}


/* =====================================================
   配信カード
===================================================== */

.provider-card{
  display:flex;
  align-items:center;
  gap:13px;
  padding:12px 14px;
  margin-bottom:8px;
  background:#fff;
  border-radius:11px;
  border:1px solid #e5e7eb;
}

.provider-card:last-child{

}


/* =====================================================

.provider-logo{

  object-fit:contain;

/* =====================================================

.provider-info{

}

.provider-name{

.provider-type{

  color:#555;
  border-radius:5px;

  margin-bottom:4px;
}

.provider-subinfo{
  color:#777;
  font-size:13px;
}


/* =====================================================
   配信ボタン
===================================================== */

.provider-button{
  display:inline-block;
  padding:11px 15px;
  color:#fff;
  border-radius:8px;
  font-weight:bold;
  font-size:14px;
  white-space:nowrap;
  flex-shrink:0;
}

.provider-button:hover{
  opacity:.85;
}


/* =====================================================
   サービスカラー
===================================================== */

.netflix-button{
  background:#e50914;
}

.amazon-button{
  background:#ff9900;

}

.unext-button{

.hulu-button{

/* =====================================================
   シリーズ

/* =====================================================

===================================================== */

/* =====================================================

<script>

(function(){

"use strict";


/* =====================================================
   API
===================================================== */

const API_URL = "/api/search";


/* =====================================================
   DOM
===================================================== */

const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error");

const errorMessage =
  document.getElementById("errorMessage");

const content =
  document.getElementById("content");


/* =====================================================
   ID取得
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const movieId =
  params.get("id");


if(!movieId){

  showError(
    "作品IDが指定されていません。"
  );

  return;

}


/* =====================================================
   開始
===================================================== */

loadMovie();


/* =====================================================
   作品取得
===================================================== */

async function loadMovie(){

  try{

    const url =
      API_URL +
      "?id=" +
      encodeURIComponent(movieId);


    console.log(
      "DETAIL API URL:",
      url
    );


    const response =
      await fetch(
        url,
        {
          method:"GET",
          headers:{
            "Accept":"application/json"
          },
          cache:"no-store"
        }
      );


    const text =
      await response.text();


    console.log(
      "DETAIL API STATUS:",
      response.status
    );

    console.log(
      "DETAIL API RESPONSE:",
      text
    );


    if(!response.ok){

      throw new Error(
        "APIエラー: HTTP " +
        response.status +
        "\n" +
        text
      );

    }


    let movie;


    try{

      movie =
        JSON.parse(text);

    }catch(parseError){

      throw new Error(
        "APIからJSONデータを取得できませんでした。"
      );

    }


    if(
      !movie ||
      typeof movie !== "object"
    ){

      throw new Error(
        "作品データが正しくありません。"
      );

    }


    if(movie.error){

      throw new Error(
        movie.error
      );

    }


    if(!movie.id){

      throw new Error(
        "作品IDが取得できませんでした。"
      );

    }


    renderMovie(movie);


  }catch(error){

    console.error(
      "DETAIL PAGE ERROR:",
      error
    );


    showError(
      error &&
      error.message
        ? error.message
        : "作品情報を取得できませんでした。"
    );

  }

}


/* =====================================================
   作品表示
===================================================== */

function renderMovie(movie){

  loading.style.display =
    "none";

  errorBox.style.display =
    "none";

  content.style.display =
    "block";


  /* タイトル */

  setText(
    "title",
    movie.title ||
    movie.original_title ||
    "作品情報"
  );


  /* 原題 */

  setText(
    "originalTitle",
    movie.original_title || ""
  );


  /* 公開日 */

  if(movie.release_date){

    setText(
      "releaseDate",
      "公開日：" +
      formatDate(
        movie.release_date
      )
    );

  }else{

    setText(
      "releaseDate",
      ""
    );

  }


  /* 評価 */

  const rating =
    Number(
      movie.vote_average || 0
    );


  if(rating > 0){

    setText(
      "rating",
      "⭐ TMDB評価 " +
      rating.toFixed(1)
    );

  }else{

    setText(
      "rating",
      ""
    );

  }


  /* ジャンル */

  renderGenres(
    movie.genres
  );


  /* ポスター */

  const poster =
    document.getElementById(
      "poster"
    );


  if(movie.poster_path){

    poster.src =
      "https://image.tmdb.org/t/p/w500" +
      movie.poster_path;

    poster.alt =
      movie.title || "";

    poster.style.display =
      "block";

  }else{

    poster.style.display =
      "none";

  }


  /* 監督 */

  if(
    movie.director &&
    movie.director.name
  ){

    setText(
      "director",
      movie.director.name
    );

  }else{

    setText(
      "director",
      "監督情報はありません。"
    );

  }


  /* 出演者 */

  renderCast(
    movie.cast
  );


  /* あらすじ */

  setText(
    "overview",
    movie.overview ||
    "あらすじ情報はありません。"
  );


  /* 配信 */

  renderProviders(
    movie
  );


  /* シリーズ */

  renderSeries(
    movie.series
  );


  /* TMDB */

  const tmdbLink =
    document.getElementById(
      "tmdbLink"
    );


  tmdbLink.href =
    movie.link ||
    (
      "https://www.themoviedb.org/movie/" +
      movie.id +
      "/watch?locale=JP"
    );


  /* タイトル */

  document.title =
    (
      movie.title ||
      "作品情報"
    ) +
    " | ドコデミレル？";

}


/* =====================================================
   ジャンル
===================================================== */

function renderGenres(genres){

  const container =
    document.getElementById(
      "genres"
    );


  container.innerHTML =
    "";


  if(
    !Array.isArray(genres) ||
    genres.length === 0
  ){

    return;

  }


  genres.forEach(
    function(genre){

      if(
        !genre ||
        !genre.name
      ){

        return;

      }


      const item =
        document.createElement(
          "span"
        );


      item.className =
        "genre-item";


      item.textContent =
        genre.name;


      container.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   出演者
===================================================== */

function renderCast(cast){

  const container =
    document.getElementById(
      "cast"
    );


  container.innerHTML =
    "";


  if(
    !Array.isArray(cast) ||
    cast.length === 0
  ){

    container.textContent =
      "出演者情報はありません。";

    return;

  }


  cast.forEach(
    function(person){

      if(
        !person ||
        !person.name
      ){

        return;

      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "cast-item";


      item.textContent =
        person.name;


      container.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   配信サービス
===================================================== */

function renderProviders(movie){

  const container =
    document.getElementById(
      "providers"
    );


  container.innerHTML =
    "";


  const streaming =
    normalizeProviders(
      movie.streaming
    );


  const rental =
    normalizeProviders(
      movie.rental
    );


  const purchase =
    normalizeProviders(
      movie.purchase
    );


  renderProviderGroup(
    container,
    "🟢 見放題",
    streaming,
    "streaming",
    movie
  );


  renderProviderGroup(
    container,
    "🟠 レンタル",
    rental,
    "rental",
    movie
  );


  renderProviderGroup(
    container,
    "🔵 購入",
    purchase,
    "purchase",
    movie
  );


  if(
    streaming.length === 0 &&
    rental.length === 0 &&
    purchase.length === 0
  ){

    const empty =
      document.createElement(
        "p"
      );


    empty.textContent =
      "現在、日本で利用できる配信情報を確認できません。";


    container.appendChild(
      empty
    );

  }

}


/* =====================================================
   サービス名
===================================================== */

function normalizeProviderName(name){

  const value =
    String(
      name || ""
    ).trim();


  const lower =
    value.toLowerCase();


  if(
    lower.includes("netflix")
  ){

    return "Netflix";

  }


  if(
    lower.includes("amazon") ||
    lower.includes("prime video")
  ){

    return "Prime Video";

  }


  if(
    lower.includes("u-next") ||
    lower.includes("unext")
  ){

    return "U-NEXT";

  }


  if(
    lower.includes("hulu")
  ){

    return "Hulu";

  }


  if(
    lower.includes("disney")
  ){

    return "Disney+";

  }


  if(
    lower.includes("apple")
  ){

    return "Apple TV";

  }


  if(
    lower.includes("google play")
  ){

    return "Google Play";

  }


  if(
    lower.includes("fod")
  ){

    return "FOD";

  }


  return value;

}


/* =====================================================
   重複削除
===================================================== */

function normalizeProviders(providers){

  if(
    !Array.isArray(providers)
  ){

    return [];

  }


  const result = [];

  const map = {};


  providers.forEach(
    function(provider){

      if(
        !provider ||
        !provider.provider_name
      ){

        return;

      }


      const normalizedName =
        normalizeProviderName(
          provider.provider_name
        );


      if(!normalizedName){

        return;

      }


      const key =
        normalizedName.toLowerCase();


      if(!map[key]){

        map[key] = {

          provider_id:
            provider.provider_id || null,

          provider_name:
            normalizedName,

          logo_path:
            provider.logo_path || null,

          provider_url:
            provider.provider_url || null,

          url:
            provider.url || null,

          link:
            provider.link || null

        };


        result.push(
          map[key]
        );

      }

    }
  );


  return result;

}


/* =====================================================
   配信グループ
===================================================== */

function renderProviderGroup(
  container,
  title,
  providers,
  type,
  movie
){

  if(
    !providers.length
  ){

    return;

  }


  const group =
    document.createElement(
      "div"
    );


  group.className =
    "provider-group " +
    type;


  const heading =
    document.createElement(
      "div"
    );


  heading.className =
    "provider-title";


  heading.textContent =
    title;


  group.appendChild(
    heading
  );


  providers.forEach(
    function(provider){

      createProviderCard(
        group,
        provider,
        type,
        movie
      );

    }
  );


  container.appendChild(
    group
  );

}


/* =====================================================
   配信カード
===================================================== */

function createProviderCard(
  container,
  provider,
  type,
  movie
){

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "provider-card";


  /* ロゴ */

  if(provider.logo_path){

    const logo =
      document.createElement(
        "img"
      );


    logo.className =
      "provider-logo";


    logo.src =
      "https://image.tmdb.org/t/p/w92" +
      provider.logo_path;


    logo.alt =
      provider.provider_name;


    logo.onerror =
      function(){

        logo.style.display =
          "none";

      };


    card.appendChild(
      logo
    );

  }


  /* 情報 */

  const info =
    document.createElement(
      "div"
    );


  info.className =
    "provider-info";


  const name =
    document.createElement(
      "div"
    );


  name.className =
    "provider-name";


  name.textContent =
    provider.provider_name;


  info.appendChild(
    name
  );


  const typeText =
    document.createElement(
      "div"
    );


  typeText.className =
    "provider-type";


  if(type === "streaming"){

    typeText.textContent =
      "見放題";

  }else if(type === "rental"){

    typeText.textContent =
      "レンタル";

  }else{

    typeText.textContent =
      "購入";

  }


  info.appendChild(
    typeText
  );


  const subInfo =
    document.createElement(
      "div"
    );


  subInfo.className =
    "provider-subinfo";


  subInfo.textContent =
    "配信情報はTMDBをもとに表示しています";


  info.appendChild(
    subInfo
  );


  card.appendChild(
    info
  );


  /* ボタン */

  const url =
    getProviderLink(
      provider,
      movie
    );


  if(url){

    const button =
      document.createElement(
        "a"
      );


    button.className =
      "provider-button " +
      getButtonClass(
        provider.provider_name
      );


    button.href =
      url;


    button.target =
      "_blank";


    button.rel =
      "noopener noreferrer";


    button.textContent =
      getButtonText(
        provider.provider_name
      );


    card.appendChild(
      button
    );

  }


  container.appendChild(
    card
  );

}


/* =====================================================
   配信リンク
===================================================== */

function getProviderLink(
  provider,
  movie
){

  const name =
    String(
      provider.provider_name ||
      ""
    ).toLowerCase();


  /* Netflix */

  if(
    name.includes("netflix")
  ){

    return (
      movie.netflix_url ||
      "https://www.netflix.com/jp/"
    );

  }


  /* Amazon */

  if(
    name.includes("amazon") ||
    name.includes("prime video")
  ){

    return (
      movie.amazon_url ||
      (
        "https://www.amazon.co.jp/s?k=" +
        encodeURIComponent(
          movie.title || ""
        ) +
        "&i=instant-video"
      )
    );

  }


  /* U-NEXT */

  if(
    name.includes("u-next") ||
    name.includes("unext")
  ){

    return (
      movie.unext_url ||
      "https://video.unext.jp/"
    );

  }


  /* Hulu */

  if(
    name.includes("hulu")
  ){

    return (
      movie.hulu_url ||
      (
        "https://www.hulu.jp/search?q=" +
        encodeURIComponent(
          movie.title || ""
        )
      )
    );

  }


  /* Disney+ */

  if(
    name.includes("disney")
  ){

    return (
      movie.disney_url ||
      (
        "https://www.disneyplus.com/ja-jp/search/" +
        encodeURIComponent(
          movie.title || ""
        )
      )
    );

  }


  /* Apple TV */

  if(
    name.includes("apple")
  ){

    return (
      movie.apple_tv_url ||
      (
        "https://tv.apple.com/jp/search?term=" +
        encodeURIComponent(
          movie.title || ""
        )
      )
    );

  }


  /* その他 */

  if(
    provider.provider_url &&
    /^https?:\/\//i.test(
      provider.provider_url
    )
  ){

    return provider.provider_url;

  }


  return null;

}


/* =====================================================
   ボタン色
===================================================== */

function getButtonClass(name){

  const value =
    String(
      name || ""
    ).toLowerCase();


  if(value.includes("netflix"))
    return "netflix-button";

  if(
    value.includes("amazon") ||
    value.includes("prime video")
  )
    return "amazon-button";

  if(
    value.includes("u-next") ||
    value.includes("unext")
  )
    return "unext-button";

  if(value.includes("hulu"))
    return "hulu-button";

  if(value.includes("disney"))
    return "disney-button";

  if(value.includes("apple"))
    return "apple-button";

  return "";

}


/* =====================================================
   ボタン文字
===================================================== */

function getButtonText(name){

  const value =
    String(
      name || ""
    ).toLowerCase();


  if(value.includes("netflix"))
    return "Netflixで作品を見る →";

  if(
    value.includes("amazon") ||
    value.includes("prime video")
  )
    return "Prime Videoで作品を見る →";

  if(
    value.includes("u-next") ||
    value.includes("unext")
  )
    return "U-NEXTで作品を見る →";

  if(value.includes("hulu"))
    return "Huluで作品を見る →";

  if(value.includes("disney"))
    return "Disney+で作品を見る →";

  if(value.includes("apple"))
    return "Apple TVで作品を見る →";

  return "サービスで作品を見る →";

}


/* =====================================================
   シリーズ
===================================================== */

function renderSeries(series){

  const section =
    document.getElementById(
      "seriesSection"
    );

  const container =
    document.getElementById(
      "seriesMovies"
    );


  if(
    !series ||
    !Array.isArray(series.movies) ||
    series.movies.length === 0
  ){

    section.style.display =
      "none";

    return;

  }


  section.style.display =
    "block";


  setText(
    "seriesName",
    series.name ||
    "シリーズ作品"
  );


  container.innerHTML =
    "";


  series.movies.forEach(
    function(item){

      if(
        !item ||
        !item.id
      ){

        return;

      }


      const movieItem =
        document.createElement(
          "div"
        );


      movieItem.className =
        "series-item";


      if(item.poster_path){

        const imageLink =
          document.createElement(
            "a"
          );


        imageLink.className =
          "series-poster-link";


        imageLink.href =
          "detail.html?id=" +
          encodeURIComponent(
            item.id
          );


        const image =
          document.createElement(
            "img"
          );


        image.className =
          "series-poster";


        image.src =
          "https://image.tmdb.org/t/p/w300" +
          item.poster_path;


        image.alt =
          item.title || "";


        image.loading =
          "lazy";


        imageLink.appendChild(
          image
        );


        movieItem.appendChild(
          imageLink
        );

      }


      const titleLink =
        document.createElement(
          "a"
        );


      titleLink.className =
        "series-title";


      titleLink.href =
        "detail.html?id=" +
        encodeURIComponent(
          item.id
        );


      titleLink.textContent =
        item.title || "";


      movieItem.appendChild(
        titleLink
      );


      const year =
        document.createElement(
          "div"
        );


      year.className =
        "series-year";


      year.textContent =
        item.release_date
          ? formatYear(
              item.release_date
            )
          : "";


      movieItem.appendChild(
        year
      );


      container.appendChild(
        movieItem
      );

    }
  );

}


/* =====================================================
   日付
===================================================== */

function formatDate(date){

  const parts =
    String(date || "").split("-");


  if(parts.length !== 3){

    return date || "";

  }


  return (
    Number(parts[0]) +
    "年" +
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}


/* =====================================================
   年
===================================================== */

function formatYear(date){

  if(!date){

    return "";

  }


  return (
    Number(
      String(date).substring(0,4)
    ) +
    "年"
  );

}


/* =====================================================
   テキスト
===================================================== */

function setText(id,text){

  const element =
    document.getElementById(id);


  if(!element){

    return;

  }


  element.textContent =
    text || "";

}


/* =====================================================
   エラー
===================================================== */

function showError(message){

  loading.style.display =
    "none";

  content.style.display =
    "none";

  errorBox.style.display =
    "block";


  errorMessage.textContent =
    message || "不明なエラーです。";

}

})();
