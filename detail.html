<script>

(function(){

"use strict";


/* =====================================================
   API
===================================================== */

const API_URL =
  "/api/search";


/* =====================================================
   DOM
===================================================== */

const loading =
  document.getElementById(
    "loading"
  );

const errorBox =
  document.getElementById(
    "error"
  );

const content =
  document.getElementById(
    "content"
  );


/* =====================================================
   ID取得
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const movieId =
  params.get("id");


if(!movieId){

  showError(
    "作品IDが指定されていません。"
  );

  return;

}


/* =====================================================
   作品読み込み
===================================================== */

loadMovie();


async function loadMovie(){

  try{

    const url =
      API_URL +
      "?id=" +
      encodeURIComponent(
        movieId
      );


    console.log(
      "DETAIL API:",
      url
    );


    const response =
      await fetch(
        url,
        {
          method:"GET",

          headers:{
            "Accept":
              "application/json"
          },

          cache:"no-store"
        }
      );


    if(!response.ok){

      const errorText =
        await response.text();


      console.error(
        "API ERROR:",
        response.status,
        errorText
      );


      throw new Error(
        "API ERROR " +
        response.status
      );

    }


    const movie =
      await response.json();


    console.log(
      "MOVIE DATA:",
      movie
    );


    if(
      !movie ||
      !movie.id
    ){

      throw new Error(
        "作品データがありません。"
      );

    }


    renderMovie(
      movie
    );


  }catch(error){

    console.error(
      "DETAIL PAGE ERROR:",
      error
    );


    showError(
      "作品情報を取得できませんでした。"
    );

  }

}


/* =====================================================
   作品表示
===================================================== */

function renderMovie(movie){

  loading.style.display =
    "none";

  errorBox.style.display =
    "none";

  content.style.display =
    "block";


  /* タイトル */

  setText(
    "title",
    movie.title || ""
  );


  /* 原題 */

  setText(
    "originalTitle",
    movie.original_title || ""
  );


  /* 公開日 */

  setText(
    "releaseDate",

    movie.release_date

      ? "公開日：" +
        formatDate(
          movie.release_date
        )

      : ""
  );


  /* 評価 */

  const rating =
    Number(
      movie.vote_average || 0
    );


  setText(
    "rating",

    rating > 0

      ? "⭐ TMDB評価 " +
        rating.toFixed(1)

      : ""
  );


  /* ポスター */

  const poster =
    document.getElementById(
      "poster"
    );


  if(movie.poster_path){

    poster.src =
      "https://image.tmdb.org/t/p/w500" +
      movie.poster_path;


    poster.alt =
      movie.title || "";


    poster.style.display =
      "block";

  }else{

    poster.style.display =
      "none";

  }


  /* 監督 */

  const director =
    movie.director;


  if(
    director &&
    director.name
  ){

    setText(
      "director",
      director.name
    );

  }else{

    setText(
      "director",
      "監督情報はありません。"
    );

  }


  /* 出演者 */

  renderCast(
    movie.cast
  );


  /* あらすじ */

  setText(
    "overview",
    movie.overview ||
      "あらすじ情報はありません。"
  );


  /* 配信 */

  renderProviders(
    movie
  );


  /* シリーズ */

  renderSeries(
    movie.series
  );


  /* TMDB */

  const tmdbLink =
    document.getElementById(
      "tmdbLink"
    );


  tmdbLink.href =
    movie.link ||

    (
      "https://www.themoviedb.org/movie/" +
      movie.id
    );


  /* =================================================
     SEO
  ================================================= */

  updateSEO(
    movie
  );

}


/* =====================================================
   SEO更新
===================================================== */

function updateSEO(movie){

  const title =
    movie.title ||
    movie.original_title ||
    "作品情報";


  const description =
    createDescription(
      movie
    );


  /* ページタイトル */

  document.title =
    title +
    " | ドコデミレル？";


  /* description */

  const metaDescription =
    document.getElementById(
      "metaDescription"
    );


  if(metaDescription){

    metaDescription.setAttribute(
      "content",
      description
    );

  }


  /* canonical */

  const canonical =
    document.getElementById(
      "canonical"
    );


  const canonicalUrl =
    window.location.origin +
    window.location.pathname +
    "?id=" +
    encodeURIComponent(
      movie.id
    );


  if(canonical){

    canonical.href =
      canonicalUrl;

  }


  /* OGP title */

  const ogTitle =
    document.getElementById(
      "ogTitle"
    );


  if(ogTitle){

    ogTitle.setAttribute(
      "content",
      title +
      " | ドコデミレル？"
    );

  }


  /* OGP description */

  const ogDescription =
    document.getElementById(
      "ogDescription"
    );


  if(ogDescription){

    ogDescription.setAttribute(
      "content",
      description
    );

  }


  /* OGP画像 */

  const ogImage =
    document.getElementById(
      "ogImage"
    );


  if(
    ogImage &&
    movie.poster_path
  ){

    ogImage.setAttribute(
      "content",

      "https://image.tmdb.org/t/p/w500" +
      movie.poster_path
    );

  }


  /* OGP URL */

  const ogUrl =
    document.getElementById(
      "ogUrl"
    );


  if(ogUrl){

    ogUrl.setAttribute(
      "content",
      canonicalUrl
    );

  }


  /* JSON-LD */

  createStructuredData(
    movie,
    canonicalUrl
  );

}


/* =====================================================
   SEO description
===================================================== */

function createDescription(movie){

  const title =
    movie.title ||
    movie.original_title ||
    "この作品";


  let text =
    title +
    "がどこで見られるか検索できます。";


  const providers = [];


  [
    movie.streaming,
    movie.rental,
    movie.purchase
  ].forEach(
    function(list){

      if(
        !Array.isArray(list)
      ){

        return;

      }


      list.forEach(
        function(provider){

          if(
            provider &&
            provider.provider_name
          ){

            const name =
              normalizeProviderName(
                provider.provider_name
              );


            if(
              name &&
              !providers.includes(
                name
              )
            ){

              providers.push(
                name
              );

            }

          }

        }
      );

    }
  );


  if(providers.length){

    text +=
      providers
        .slice(0,6)
        .join("、") +
      "などの配信情報を確認できます。";

  }


  if(movie.overview){

    text +=
      " " +
      String(
        movie.overview
      )
      .replace(
        /\s+/g,
        " "
      )
      .substring(
        0,
        100
      );

  }


  return text.substring(
    0,
    160
  );

}


/* =====================================================
   JSON-LD
===================================================== */

function createStructuredData(
  movie,
  canonicalUrl
){

  const old =
    document.getElementById(
      "movieStructuredData"
    );


  if(old){

    old.remove();

  }


  const data = {

    "@context":
      "https://schema.org",

    "@type":
      "Movie",

    "name":
      movie.title ||
      movie.original_title ||
      "",

    "url":
      canonicalUrl,

    "dateCreated":
      movie.release_date ||
      undefined,

    "description":
      movie.overview ||
      "",

    "image":
      movie.poster_path

        ? (
            "https://image.tmdb.org/t/p/w500" +
            movie.poster_path
          )

        : undefined,

    "inLanguage":
      "ja"

  };


  if(
    movie.original_title &&
    movie.original_title !== movie.title
  ){

    data.alternateName =
      movie.original_title;

  }


  if(
    movie.vote_average
  ){

    data.aggregateRating = {

      "@type":
        "AggregateRating",

      "ratingValue":
        Number(
          movie.vote_average
        ).toFixed(1),

      "bestRating":
        "10",

      "worstRating":
        "0"

    };

  }


  if(
    movie.director &&
    movie.director.name
  ){

    data.director = {

      "@type":
        "Person",

      "name":
        movie.director.name

    };

  }


  if(
    Array.isArray(movie.cast) &&
    movie.cast.length
  ){

    data.actor =
      movie.cast
        .filter(
          function(person){

            return (
              person &&
              person.name
            );

          }
        )
        .slice(
          0,
          8
        )
        .map(
          function(person){

            return {

              "@type":
                "Person",

              "name":
                person.name

            };

          }
        );

  }


  Object.keys(data).forEach(
    function(key){

      if(
        data[key] === undefined
      ){

        delete data[key];

      }

    }
  );


  const script =
    document.createElement(
      "script"
    );


  script.id =
    "movieStructuredData";


  script.type =
    "application/ld+json";


  script.textContent =
    JSON.stringify(
      data
    );


  document.head.appendChild(
    script
  );

}

function renderProviders(movie){

/* =====================================================
   サービス名
===================================================== */

function normalizeProviderName(name){

  const value =
    String(
      name || ""
    ).trim();


  const lower =
    value.toLowerCase();


  if(
    lower.includes("netflix")
  ){

    return "Netflix";

  }


  if(
    lower.includes("amazon") ||
    lower.includes("prime video")
  ){

    return "Prime Video";

  }


  if(
    lower.includes("u-next") ||
    lower.includes("unext")
  ){

    return "U-NEXT";

  }


  if(
    lower.includes("hulu")
  ){

    return "Hulu";

  }


  if(
    lower.includes("disney")
  ){

    return "Disney+";

  }


  if(
    lower.includes("apple")
  ){

    return "Apple TV";

  }


  if(
    lower.includes("google play")
  ){

    return "Google Play";

  }


  if(
    lower.includes("fandango")
  ){

    return "Fandango";

  }


  if(
    lower.includes("fod")
  ){

    return "FOD";

  }


  return value;

}


/* =====================================================
   同じサービスをまとめる
===================================================== */

function normalizeProviders(providers){

  const result = [];

  const map = {};


  providers.forEach(
    function(provider){

      if(!provider){

        return;

      }


      const normalizedName =
        normalizeProviderName(
          provider.provider_name
        );


      if(!normalizedName){

        return;

      }


      const key =
        normalizedName.toLowerCase();


      if(!map[key]){

        map[key] = {

          ...provider,

          provider_name:
            normalizedName

        };


        result.push(
          map[key]
        );

      }

    }
  );


  return result;

}


/* =====================================================

  container,

/* =====================================================

function createProviderCard(
  container,

  movie
){

  if(!provider){

  }


  const card =
    document.createElement(
      "div"
    );


  card.className =
    "provider-card";


  /* ロゴ */

  if(provider.logo_path){

      );

      "provider-logo";


    logo.src =

      provider.logo_path;


    logo.alt =
      provider.provider_name ||
      "";


    card.appendChild(
      logo
    );

  }


  /* 情報 */

  const info =
    document.createElement(
      "div"
    );


  info.className =
    "provider-info";


  const name =
    document.createElement(
      "div"
    );


  name.className =
    "provider-name";


  name.textContent =
    provider.provider_name ||
    "配信サービス";


  info.appendChild(
    name
  );


  const typeText =
    document.createElement(
      "div"
    );


  typeText.className =
    "provider-type";


  if(type === "streaming"){

    typeText.textContent =
      "見放題";

  }else if(type === "rental"){

    typeText.textContent =
      "レンタル";

  }else{

    typeText.textContent =
      "購入";

  }


  info.appendChild(
    typeText
  );


  /* 字幕・吹き替え */

  const subInfo =
    document.createElement(
      "div"
    );


  subInfo.className =
    "provider-subinfo";


  const subtitle =
    document.createElement(
      "div"
    );


  subtitle.textContent =
    "🎧 字幕：未確認";


  subInfo.appendChild(
    subtitle
  );


  const dub =
    document.createElement(
      "div"
    );


  dub.textContent =
    "🎙️ 吹き替え：未確認";


  subInfo.appendChild(
    dub
  );


  info.appendChild(
    subInfo
  );


  card.appendChild(
    info
  );


  /* 配信リンク */

  const url =
    getProviderLink(
      provider,
      movie
    );


  if(url){

    const button =
      document.createElement(
        "a"
      );


    button.className =
      "provider-button " +
      getButtonClass(
        provider.provider_name
      );


    button.href =
      url;


    button.target =
      "_blank";


    button.rel =
      "noopener noreferrer";


    button.textContent =
      getButtonText(
        provider.provider_name
      );


    card.appendChild(
      button
    );

  }


  container.appendChild(
    card
  );

}


/* =====================================================
   配信リンク
===================================================== */

function getProviderLink(
  provider,
  movie
){

  const name =
    String(
      provider.provider_name ||
      ""
    ).toLowerCase();


  /* Netflix */

  if(
    name.includes("netflix")
  ){

    return (
      movie.netflix_url ||

      (
        movie.netflix &&
        movie.netflix.url
      ) ||

      "https://www.netflix.com/jp/"
    );

  }


  /* Amazon */

  if(
    name.includes("amazon") ||
    name.includes("prime video")
  ){

    return (
      movie.amazon_url ||

      (
        movie.amazon &&
        movie.amazon.url
      ) ||

      (
        "https://www.amazon.co.jp/s?k=" +
        encodeURIComponent(
          movie.title || ""
        ) +
        "&i=instant-video"
      )
    );

  }


  /* U-NEXT */

  if(
    name.includes("u-next") ||
    name.includes("unext")
  ){

    return (
      movie.unext_url ||
      getGenericProviderUrl(
        provider
      )
    );

  }


  /* Hulu */

  if(
    name.includes("hulu")
  ){

    return (
      movie.hulu_url ||
      getGenericProviderUrl(
        provider
      )
    );

  }


  /* Disney+ */

  if(
    name.includes("disney")
  ){

    return (
      movie.disney_url ||
      getGenericProviderUrl(
        provider
      )
    );

  }


  /* Apple TV */

  if(
    name.includes("apple")
  ){

    return (
      movie.apple_tv_url ||
      getGenericProviderUrl(
        provider
      )
    );

  }


  return getGenericProviderUrl(
    provider
  );

}


/* =====================================================
   一般URL
===================================================== */

function getGenericProviderUrl(
  provider
){

  const urls = [

    provider.url,

    provider.link,

    provider.watch_link,

    provider.provider_url

  ];


  for(
    let i = 0;
    i < urls.length;
    i++
  ){

    if(
      typeof urls[i] === "string" &&
      /^https?:\/\//i.test(
        urls[i]
      )
    ){

      return urls[i];

    }

  }


  return null;

}

/* =====================================================
   日付
===================================================== */

function formatDate(date){

  if(!date){

    return "";

  }


  const parts =
    String(date).split("-");


  if(parts.length !== 3){

    return date;

  }


  return (

    Number(parts[0]) +
    "年" +

    Number(parts[1]) +
    "月" +

    Number(parts[2]) +
    "日"

  );

}


/* =====================================================
   年
===================================================== */

function formatYear(date){

  if(!date){

    return "";

  }


  return (

    Number(
      String(date).substring(
        0,
        4
      )
    ) +
    "年"

  );

}
