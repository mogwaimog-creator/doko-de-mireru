<body>

<header>

  <h1>🎬 ドコデミレル？</h1>

  <p>
    映画がどこで見られるか検索できます
  </p>

</header>

<main class="container">

    href="index.html"

  </a>

    id="content"

  >

    <div class="status">

    </div>

  </div>

</main>

<footer>
  © ドコデミレル？
</footer>

<script>

/* =========================================================
   APIから作品詳細を取得
========================================================= */

async function searchMovieById(id){

  const response =
    await fetch(
      "/api/search?id=" +
      encodeURIComponent(id)
    );

  const text =
    await response.text();

  let data;

  try{

    data = JSON.parse(text);

  }catch(error){

    console.error(
      "JSON parse error:",
      text
    );

    throw new Error(
      "サーバーから正しいデータを取得できませんでした。"
    );

  }

  if(!response.ok){

    throw new Error(
      data.error ||
      "作品情報を取得できませんでした。"
    );

  }

  return data;

}


/* =========================================================
   ページ読み込み
========================================================= */

async function loadDetail(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get("id");

  const content =
    document.getElementById(
      "content"
    );

  if(!id){

    content.innerHTML =
      `
      <div class="error">
        ❌ 作品IDが指定されていません。
      </div>
      `;

    return;
  }

  try{

    const movie =
      await searchMovieById(id);

    const title =
      movie.title ||
      movie.original_title ||
      "作品詳細";

    document.title =
      title +
      " | ドコデミレル？";

    const description =
      movie.overview
        ? movie.overview.substring(0,150)
        : title +
          "の作品詳細、配信サービス情報を確認できます。";

    document
      .getElementById("metaDescription")
      .setAttribute(
        "content",
        description
      );

    content.innerHTML =
      createDetail(movie);

  }catch(error){

    console.error(
      "Detail error:",
      error
    );

    content.innerHTML =
      `
      <div class="error">
        ❌
        ${escapeHtml(
          error.message ||
          "作品情報を取得できませんでした。"
        )}
      </div>
      `;

  }

}


/* =========================================================
   詳細画面
========================================================= */

function createDetail(movie){

  let html = "";

  const poster =
    movie.poster_path
      ? "https://image.tmdb.org/t/p/w500" +
        movie.poster_path
      : "";

  const release =
    movie.release_date
      ? formatDate(movie.release_date)
      : "公開日不明";

  const rating =
    Number(movie.vote_average || 0)
      .toFixed(1);

  const country =
    getCountryInfo(movie);

  html +=
    `
    <div class="movie-main">

      ${
        poster
        ?
        `
        <img
          class="movie-poster"
          src="${poster}"
          alt="${escapeHtml(movie.title || "")}"
        >
        `
        :
        `
        <div
          class="movie-poster"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            color:#6b7280;
          "
        >
          NO IMAGE
        </div>
        `
      }

      <div class="movie-main-info">

        <h1 class="movie-title">
          ${escapeHtml(movie.title || "")}
        </h1>

        ${
          movie.original_title
          ?
          `
          <div class="original-title">
            ${escapeHtml(movie.original_title)}
          </div>
          `
          :
          ""
        }

        <div class="meta">
          公開日：
          ${escapeHtml(release)}
        </div>

        ${
          country
          ?
          `
          <div class="country">
            🌎 ${escapeHtml(country)}
          </div>
          `
          :
          ""
        }

        <div>
          <div class="rating">
            ⭐ TMDB評価 ${rating}
          </div>
        </div>

        ${
          movie.director
          ?
          `
          <div class="people-section">

            <div class="people-title">
              🎬 監督
            </div>

            <div class="people">

              <div class="person">
                ${escapeHtml(
                  movie.director.name || ""
                )}
              </div>

            </div>

          </div>
          `
          :
          ""
        }

        ${
          Array.isArray(movie.cast) &&
          movie.cast.length
          ?
          `
          <div class="people-section">

            <div class="people-title">
              👥 出演者
            </div>

            <div class="people">

              ${
                movie.cast
                  .map(
                    function(person){

                      return `
                        <div class="person">
                          ${escapeHtml(
                            person.name || ""
                          )}
                        </div>
                      `;

                    }
                  )
                  .join("")
              }

            </div>

          </div>
          `
          :
          ""
        }

        ${
          movie.overview
          ?
          `
          <div class="overview">

            <div class="overview-title">
              📖 あらすじ
            </div>

            ${escapeHtml(
              movie.overview
            )}

          </div>
          `
          :
          ""
        }

      </div>

    </div>
    `;


  /* =======================================================
     配信情報
  ======================================================= */

  html +=
    `
    <section class="section">

      <h2>
        📺 この作品はどこで見られる？
      </h2>
    `;


  html += createProviderGroup(
    "🟢 見放題",
    movie.streaming || [],
    movie
  );


  html += createProviderGroup(
    "🎞️ レンタル",
    movie.rental || [],
    movie
  );


  html += createProviderGroup(
    "💰 購入",
    movie.purchase || [],
    movie
  );


  const hasProviders =
    (
      Array.isArray(movie.streaming) &&
      movie.streaming.length
    ) ||
    (
      Array.isArray(movie.rental) &&
      movie.rental.length
    ) ||
    (
      Array.isArray(movie.purchase) &&
      movie.purchase.length
    );


  if(!hasProviders){

    html +=
      `
      <div class="status">
        現在、配信情報を取得できませんでした。
      </div>
      `;

  }


  html +=
    `</section>`;


  /* =======================================================
     シリーズ
  ======================================================= */

  if(
    movie.series &&
    Array.isArray(movie.series.movies) &&
    movie.series.movies.length
  ){

    html +=
      `
      <section class="section">

        <h2>
          🎞️ シリーズ作品
        </h2>

        <div class="series-name">
          ${escapeHtml(
            movie.series.name || ""
          )}
        </div>

        <div class="series">
      `;


    movie.series.movies.forEach(
      function(item){

        const itemPoster =
          item.poster_path
            ? "https://image.tmdb.org/t/p/w300" +
              item.poster_path
            : "";

        const detailUrl =
          "detail.html?id=" +
          encodeURIComponent(
            item.id
          );

        html +=
          `
          <a
            class="series-item"
            href="${detailUrl}"
          >

            ${
              itemPoster
              ?
              `
              <img
                src="${itemPoster}"
                alt="${escapeHtml(item.title || "")}"
                loading="lazy"
              >
              `
              :
              `
              <div
                style="
                  width:100%;
                  aspect-ratio:2/3;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  background:#e5e7eb;
                  border-radius:8px;
                  color:#6b7280;
                  font-size:12px;
                "
              >
                NO IMAGE
              </div>
              `
            }

            <div class="series-item-title">
              ${escapeHtml(
                item.title || ""
              )}
            </div>

            ${
              item.release_date
              ?
              `
              <div class="series-item-date">
                ${escapeHtml(
                  getYear(item.release_date)
                )}
              </div>
              `
              :
              ""
            }

          </a>
          `;

      }
    );


    html +=
      `
        </div>

      </section>
      `;

  }


  /* =======================================================
     TMDB
  ======================================================= */

  if(movie.link){

    html +=
      `
      <section class="section">

        <a
          class="tmdb-link"
          href="${escapeHtml(movie.link)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          TMDBで作品情報を見る →
        </a>

      </section>
      `;

  }


  return html;

}


/* =========================================================
   配信サービス
========================================================= */

function createProviderGroup(
  title,
  providers,
  movie
){

  if(
    !Array.isArray(providers) ||
    !providers.length
  ){

    return "";

  }


  let html =
    `
    <div class="provider-group">

      <div class="provider-group-title">
        ${escapeHtml(title)}
      </div>

      <div class="provider-list">
    `;


  providers.forEach(
    function(provider){

      if(!provider){
        return;
      }


      const name =
        provider.provider_name ||
        provider.name ||
        "";


      const logo =
        provider.logo_path
          ? "https://image.tmdb.org/t/p/w92" +
            provider.logo_path
          : "";


      /*
       * ここが今回の重要部分です。
       *
       * Netflix / Amazonは
       * TMDBの中間ページよりも
       * 作品名検索を優先します。
       */

      const link =
        getProviderLink(
          name,
          provider,
          movie
        );


      let buttonClass =
        "watch-button";


      const lowerName =
        name.toLowerCase();


      if(
        lowerName.includes("netflix")
      ){

        buttonClass +=
          " netflix";

      }


      if(
        lowerName.includes("amazon") ||
        lowerName.includes("prime")
      ){

        buttonClass +=
          " amazon";

      }


      if(
        lowerName.includes("unext")
      ){

        buttonClass +=
          " unext";

      }


      if(
        lowerName.includes("hulu")
      ){

        buttonClass +=
          " hulu";

      }


      if(
        lowerName.includes("disney")
      ){

        buttonClass +=
          " disney";

      }


      html +=
        `
        <div class="provider">

          <div class="provider-top">

            ${
              logo
              ?
              `
              <img
                class="provider-logo"
                src="${logo}"
                alt=""
              >
              `
              :
              ""
            }

            <div class="provider-name">
              ${escapeHtml(name)}
            </div>

          </div>


          <div class="provider-type">
            ${escapeHtml(
              getProviderType(title)
            )}
          </div>


          <div class="language-info">

            <strong>🎧 字幕：</strong>

            <span class="language-unknown">
              ${escapeHtml(
                getSubtitleInfo(movie)
              )}
            </span>

            <br>

            <strong>🎙 吹き替え：</strong>

            <span class="language-unknown">
              ${escapeHtml(
                getDubbingInfo(movie)
              )}
            </span>

          </div>


          ${
            link
            ?
            `
            <a
              class="${buttonClass}"
              href="${escapeHtml(link)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${escapeHtml(
                getButtonText(name)
              )}
            </a>
            `
            :
            ""
          }


          ${
            lowerName.includes("netflix") &&
            movie.netflix_title_id
            ?
            `
            <div class="netflix-id">
              Netflix作品ID：
              ${escapeHtml(
                movie.netflix_title_id
              )}
            </div>
            `
            :
            ""
          }

        </div>
        `;

    }
  );


  html +=
    `
      </div>

    </div>
    `;


  return html;

}


/* =========================================================
   配信種別
========================================================= */

function getProviderType(title){

  if(title.includes("見放題")){
    return "見放題";
  }

  if(title.includes("レンタル")){
    return "レンタル";
  }

  if(title.includes("購入")){
    return "購入";
  }

  return "";

}


/* =========================================================
   ボタン文字
========================================================= */

function getButtonText(name){

  const lower =
    String(name || "")
      .toLowerCase();


  if(lower.includes("netflix")){
    return "Netflixで作品を見る →";
  }


  if(
    lower.includes("amazon") ||
    lower.includes("prime")
  ){
    return "Prime Videoで作品を探す →";
  }


  if(lower.includes("unext")){
    return "U-NEXTで見る →";
  }


  if(lower.includes("hulu")){
    return "Huluで見る →";
  }


  if(lower.includes("disney")){
    return "Disney+で見る →";
  }


  if(lower.includes("apple")){
    return "Apple TVで見る →";
  }


  return name +
    "で見る →";

}


/* =========================================================
   配信リンク
========================================================= */

function getProviderLink(
  name,
  provider,
  movie
){

  const lower =
    String(name || "")
      .toLowerCase();


  const title =
    movie.title ||
    movie.original_title ||
    "";


  /* =======================================================
     Netflix
  ======================================================= */

  if(
    lower.includes("netflix")
  ){

    /*
     * まず本物のNetflix作品URLを探す
     */

    const urls = [

      movie.netflix_url,

      movie.netflix &&
      movie.netflix.url,

      provider.watch_link,

      provider.url,

      provider.link,

      provider.provider_url

    ];


    for(
      let i = 0;
      i < urls.length;
      i++
    ){

      const normalized =
        normalizeNetflixTitleUrl(
          urls[i]
        );


      if(normalized){

        return normalized;

      }

    }


    /*
     * Netflix作品URLがない場合
     * Netflix検索画面へ
     */

    return createNetflixSearchUrl(
      title
    );

  }


  /* =======================================================
     Amazon Prime Video
  ======================================================= */

  if(
    lower.includes("amazon") ||
    lower.includes("prime")
  ){

    /*
     * AmazonはTMDBの
     * 「本編と他多数」ページを
     * 優先しない。
     *
     * まず作品名検索へ送る。
     */

    return createAmazonSearchUrl(
      title
    );

  }


  /* =======================================================
     U-NEXT
  ======================================================= */

  if(
    lower.includes("unext")
  ){

    const urls = [

      movie.unext_url,

      provider.url,

      provider.link,

      provider.provider_url

    ];


    for(
      let i = 0;
      i < urls.length;
      i++
    ){

      if(
        isValidHttpUrl(
          urls[i]
        )
      ){

        return urls[i];

      }

    }


    return createUNEXTSearchUrl(
      title
    );

  }


  /* =======================================================
     Hulu
  ======================================================= */

  if(
    lower.includes("hulu")
  ){

    const urls = [

      movie.hulu_url,

      provider.url,

      provider.link,

      provider.provider_url

    ];


    for(
      let i = 0;
      i < urls.length;
      i++
    ){

      if(
        isValidHttpUrl(
          urls[i]
        )
      ){

        return urls[i];

      }

    }


    return createHuluSearchUrl(
      title
    );

  }


  /* =======================================================
     Disney+
  ======================================================= */

  if(
    lower.includes("disney")
  ){

    const urls = [

      movie.disney_url,

      provider.url,

      provider.link,

      provider.provider_url

    ];


    for(
      let i = 0;
      i < urls.length;
      i++
    ){

      if(
        isValidHttpUrl(
          urls[i]
        )
      ){

        return urls[i];

      }

    }


    return createDisneySearchUrl(
      title
    );

  }


  /* =======================================================
     その他
  ======================================================= */

  const urls = [

    provider.watch_link,

    provider.url,

    provider.link,

    provider.provider_url

  ];


  for(
    let i = 0;
    i < urls.length;
    i++
  ){

    if(
      isValidHttpUrl(
        urls[i]
      )
    ){

      return urls[i];

    }

  }


  return null;

}


/* =========================================================
   Netflix作品URL
========================================================= */

function normalizeNetflixTitleUrl(url){

  if(
    typeof url !== "string" ||
    !url.trim()
  ){

    return null;

  }


  const clean =
    url.trim();


  /*
   * Netflix作品IDが含まれている場合
   */

  const id =
    extractNetflixTitleId(
      clean
    );


  if(id){

    return (
      "https://www.netflix.com/jp/title/" +
      encodeURIComponent(id)
    );

  }


  /*
   * Netflixの検索URLならOK
   */

  if(
    /^https?:\/\/(?:www\.)?netflix\.com\/jp\/search/i
      .test(clean)
  ){

    return clean;

  }


  /*
   * Netflixトップページは
   * 作品URLとして使用しない
   */

  return null;

}


/* =========================================================
   Netflix作品ID
========================================================= */

function extractNetflixTitleId(url){

  if(
    typeof url !== "string" ||
    !url
  ){

    return null;

  }


  const patterns = [

    /netflix\.com\/(?:[^/]+\/)?title\/(\d+)/i,

    /netflix\.com\/(?:[^/]+\/)?watch\/(\d+)/i,

    /netflix\.com\/title\/(\d+)/i,

    /netflix\.com\/watch\/(\d+)/i

  ];


  for(
    let i = 0;
    i < patterns.length;
    i++
  ){

    const match =
      url.match(
        patterns[i]
      );


    if(match){

      return match[1];

    }

  }


  return null;

}

  return (
    "https://www.netflix.com/jp/search?q=" +
    encodeURIComponent(clean)
  );

}

/* =========================================================
   URLチェック
========================================================= */

function isValidHttpUrl(url){

  return (
    typeof url === "string" &&
    /^https?:\/\//i.test(
      url.trim()
    )
  );

}

/* =========================================================
   国
========================================================= */

function getCountryInfo(movie){

  if(
    movie &&
    Array.isArray(movie.production_countries) &&
    movie.production_countries.length
  ){

    return movie.production_countries
      .map(
        function(country){

          return country.name || "";

        }
      )
      .filter(Boolean)
      .join(" / ");

  }


  if(
    movie &&
    movie.country
  ){

    return String(
      movie.country
    );

  }


  const language =
    movie &&
    movie.original_language
      ? movie.original_language
      : (
          movie &&
          movie.language &&
          movie.language.original_language
            ? movie.language.original_language
            : null
        );


  const map = {

    ja:"日本 🇯🇵",

    en:"英語圏",

    ko:"韓国 🇰🇷",

    zh:"中国 🇨🇳",

    fr:"フランス 🇫🇷",

    de:"ドイツ 🇩🇪",

    es:"スペイン語圏",

    it:"イタリア 🇮🇹",

    hi:"インド 🇮🇳",

    pt:"ポルトガル語圏",

    ru:"ロシア 🇷🇺"

  };


  if(
    language &&
    map[language]
  ){

    return map[language];

  }


  return "";

}


/* =========================================================
   日付
========================================================= */

function formatDate(date){

  const parts =
    String(date).split("-");


  if(parts.length !== 3){

    return date;

  }


  return (
    Number(parts[0]) +
    "年" +
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}


/* =========================================================
   年
========================================================= */

function getYear(date){

  const parts =
    String(date).split("-");


  if(
    parts.length >= 1 &&
    /^\d{4}$/.test(parts[0])
  ){

    return parts[0] + "年";

  }


  return "";

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
