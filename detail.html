/* ========================================================
   APIから取得
======================================================== */

async function searchMovieById(id){

  const response =
    await fetch(
      "/api/search?id=" +
      encodeURIComponent(id)
    );


  const text =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(text);

  }catch(error){

    throw new Error(
      "サーバーから正しいデータを取得できませんでした。"
    );

  }


  if(!response.ok){

    throw new Error(
      data.error ||
      "作品情報を取得できませんでした。"
    );

  }


  return data;

}


/* ========================================================
   ページ読み込み
======================================================== */

async function loadDetail(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    params.get("id");


  const content =
    document.getElementById(
      "content"
    );


  if(!id){

    content.innerHTML =
      `
      <div class="error">
        ❌ 作品IDが指定されていません。
      </div>
      `;

    return;

  }


  try{

    const movie =
      await searchMovieById(id);


    /* =====================
       SEO
    ====================== */

    const title =
      movie.title ||
      movie.original_title ||
      "作品詳細";


    document.title =
      title +
      " | ドコデミレル？";


    const description =
      movie.overview
        ? movie.overview.substring(0,150)
        : title +
          "の作品詳細、配信サービス情報を確認できます。";


    document
      .getElementById("metaDescription")
      .setAttribute(
        "content",
        description
      );


    content.innerHTML =
      createDetail(movie);


  }catch(error){

    console.error(
      "Detail error:",
      error
    );


    content.innerHTML =
      `
      <div class="error">
        ❌
        ${escapeHtml(
          error.message ||
          "作品情報を取得できませんでした。"
        )}
      </div>
      `;

  }

}


/* ========================================================
   詳細HTML
======================================================== */

function createDetail(movie){

  let html = "";


  /* =========================
     基本情報
  ========================== */

  const poster =
    movie.poster_path
      ? "https://image.tmdb.org/t/p/w500" +
        movie.poster_path
      : "";


  const release =
    movie.release_date
      ? formatDate(movie.release_date)
      : "公開日不明";


  const rating =
    Number(movie.vote_average || 0)
      .toFixed(1);


  html +=
    `
    <div class="movie-main">

      ${
        poster
        ?
        `
        <img
          class="movie-poster"
          src="${poster}"
          alt="${escapeHtml(movie.title || "")}"
        >
        `
        :
        `
        <div
          class="movie-poster"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            color:#6b7280;
          "
        >
          NO IMAGE
        </div>
        `
      }


      <div class="movie-main-info">

        <h1 class="movie-title">
          ${escapeHtml(movie.title || "")}
        </h1>


        ${
          movie.original_title
          ?
          `
          <div class="original-title">
            ${escapeHtml(movie.original_title)}
          </div>
          `
          :
          ""
        }


        <div class="meta">
          公開日：
          ${escapeHtml(release)}
        </div>


        <div class="rating">
          ⭐ TMDB評価 ${rating}
        </div>


        ${

          `
          <div class="overview">
            ${escapeHtml(movie.overview)}
          </div>
          `

          ""
        }

      </div>

     配信サービス

      <h2>
        📺 この作品はどこで見られる？
      </h2>
    `;


  html += createProviderGroup(
    "🟢 見放題",
    movie.streaming || [],
    movie
  );


  html += createProviderGroup(
    "🎞️ レンタル",
    movie.rental || [],
    movie
  );


  html += createProviderGroup(
    "💰 購入",
    movie.purchase || [],
    movie
  );


  const hasProviders =
    (
      Array.isArray(movie.streaming) &&
      movie.streaming.length > 0
    ) ||
    (
      Array.isArray(movie.rental) &&
      movie.rental.length > 0
    ) ||
    (
      Array.isArray(movie.purchase) &&
      movie.purchase.length > 0
    );


  if(!hasProviders){

    html +=
      `
      <div class="status">
        現在、配信情報を取得できませんでした。
      </div>
      `;

  }


  html +=
    `</section>`;


  /* =========================
     監督
  ========================== */

  if(movie.director){

    html +=
      `
      <section class="section">

        <h2>
          🎬 監督
        </h2>

        <div class="people">

          <div class="person">
            ${escapeHtml(
              movie.director.name || ""
            )}
          </div>

        </div>

      </section>
      `;

  }


  /* =========================
     出演者
  ========================== */

  if(
    Array.isArray(movie.cast) &&
    movie.cast.length
  ){

    html +=
      `
      <section class="section">

        <h2>
          👥 出演者
        </h2>

        <div class="people">
      `;


    movie.cast.forEach(
      function(person){

        html +=
          `
          <div class="person">
            ${escapeHtml(
              person.name || ""
            )}
          </div>
          `;

      }
    );


    html +=
      `
        </div>

      </section>
      `;

  }


  /* =========================
     シリーズ
  ========================== */

  if(
    movie.series &&
    Array.isArray(movie.series.movies) &&
    movie.series.movies.length
  ){

    html +=
      `
      <section class="section">

        <h2>
          🎞️ シリーズ作品
        </h2>

        <div class="series-name">
          ${escapeHtml(
            movie.series.name || ""
          )}
        </div>

        <div class="series">
      `;


    movie.series.movies.forEach(
      function(item){

        const itemPoster =
          item.poster_path
            ? "https://image.tmdb.org/t/p/w300" +
              item.poster_path
            : "";


        const detailUrl =
          "detail.html?id=" +
          encodeURIComponent(
            item.id
          );


        html +=
          `
          <a
            class="series-item"
            href="${detailUrl}"
          >

            ${
              itemPoster
              ?
              `
              <img
                src="${itemPoster}"
                alt="${escapeHtml(item.title || "")}"
                loading="lazy"
              >
              `
              :
              `
              <div
                style="
                  width:100%;
                  aspect-ratio:2/3;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  background:#e5e7eb;
                  border-radius:8px;
                  color:#6b7280;
                  font-size:12px;
                "
              >
                NO IMAGE
              </div>
              `
            }


            <div class="series-item-title">
              ${escapeHtml(
                item.title || ""
              )}
            </div>


            ${
              item.release_date
              ?
              `
              <div class="series-item-date">
                ${escapeHtml(
                  formatDate(item.release_date)
                )}
              </div>
              `
              :
              ""
            }

          </a>
          `;

      }
    );


    html +=
      `
        </div>

      </section>
      `;

  }


  /* =========================
     TMDB
  ========================== */

  if(movie.link){

    html +=
      `
      <section class="section">

        <a
          class="tmdb-link"
          href="${escapeHtml(movie.link)}"
          target="_blank"

/* ========================================================
   配信サービス
======================================================== */

function createProviderGroup(
  title,
  providers,
  movie
){

  if(
    !Array.isArray(providers) ||
    !providers.length
  ){

    return "";

  }


  let html =
    `
    <div class="provider-group">

      <div class="provider-group-title">
        ${escapeHtml(title)}
      </div>

      <div class="provider-list">
    `;


  providers.forEach(
    function(provider){

      if(!provider){
        return;
      }


      const name =
        provider.provider_name ||
        provider.name ||
        "";


      const logo =
        provider.logo_path
          ? "https://image.tmdb.org/t/p/w92" +
            provider.logo_path
          : "";


      const link =
        getProviderLink(
          name,
          provider,
          movie
        );


      let buttonClass =
        "watch-button";


      const lowerName =
        name.toLowerCase();


      if(
        lowerName.includes("netflix")
      ){

        buttonClass +=
          " netflix";

      }


      if(
        lowerName.includes("amazon") ||
        lowerName.includes("prime")
      ){

        buttonClass +=
          " amazon";

      }


      html +=
        `
        <div class="provider">

          <div class="provider-top">

            ${
              logo
              ?
              `
              <img
                class="provider-logo"
                src="${logo}"
                alt=""
              >
              `
              :
              ""
            }

            <div class="provider-name">
              ${escapeHtml(name)}
            </div>

          </div>


          <div class="provider-type">
            ${escapeHtml(
              getProviderType(title)
            )}
          </div>


          ${
            link
            ?
            `
            <a
              class="${buttonClass}"
              href="${escapeHtml(link)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${escapeHtml(
                getButtonText(name)
              )}
            </a>
            `
            :
            ""
          }


          ${
            lowerName.includes("netflix") &&
            movie.netflix_title_id
            ?
            `
            <div class="netflix-id">
              Netflix作品ID：
              ${escapeHtml(
                movie.netflix_title_id
              )}
            </div>
            `
            :
            ""
          }

        </div>
        `;

    }
  );


  html +=
    `
      </div>

    </div>
    `;


  return html;

}


/* ========================================================
   配信種別
======================================================== */

function getProviderType(title){

  if(
    title.includes("見放題")
  ){

    return "見放題";

  }


  if(
    title.includes("レンタル")
  ){

    return "レンタル";

  }


  if(
    title.includes("購入")
  ){

    return "購入";

  }


  return "";

}


/* ========================================================
   ボタン文字
======================================================== */

function getButtonText(name){

  const lower =
    String(name || "")
      .toLowerCase();


  if(
    lower.includes("netflix")
  ){

    return "Netflixで見る →";

  }


  if(
    lower.includes("amazon") ||
    lower.includes("prime")
  ){

    return "Prime Videoで見る →";

  }


  if(
    lower.includes("unext")
  ){

    return "U-NEXTで見る →";

  }


  if(
    lower.includes("hulu")
  ){

    return "Huluで見る →";

  }


  if(
    lower.includes("disney")
  ){

    return "Disney+で見る →";

  }


  if(
    lower.includes("apple")
  ){

    return "Apple TVで見る →";

  }


  return name +
    "で見る →";

}


/* ========================================================
   配信リンク
======================================================== */

function getProviderLink(
  name,
  provider,
  movie
){

  const lower =
    String(name || "")
      .toLowerCase();


  /* =========================
     Netflix
  ========================== */

  if(
    lower.includes("netflix")
  ){

    const urls = [

      movie.netflix_url,

      movie.netflix &&
      movie.netflix.url,

      provider.provider_url,

      provider.watch_link,

      provider.netflix_url,

      provider.url,

      provider.link

    ];


    for(
      let i = 0;
      i < urls.length;
      i++
    ){

      const normalized =
        normalizeNetflixUrl(
          urls[i]
        );


      if(normalized){

        return normalized;

      }

    }


    return createNetflixSearchUrl(
      movie.title ||
      movie.original_title ||
      ""
    );

  }


  /* =========================
     Amazon
  ========================== */

  if(
    lower.includes("amazon") ||
    lower.includes("prime")
  ){

    const urls = [

      movie.amazon_url,

      movie.amazon &&
      movie.amazon.url,

      provider.provider_url,

      provider.watch_link,

      provider.url,

      provider.link

    ];


    for(
      let i = 0;
      i < urls.length;
      i++
    ){

      const url =
        urls[i];


      if(
        typeof url === "string" &&
        /^https?:\/\//i.test(url)
      ){

        return url;

      }

    }


    return createAmazonSearchUrl(
      movie.title ||
      movie.original_title ||
      ""
    );

  }


  /* =========================
     その他
  ========================== */

  const urls = [

    provider.provider_url,

    provider.watch_link,

    provider.url,

    provider.link

  ];


  for(
    let i = 0;
    i < urls.length;
    i++
  ){

    if(
      typeof urls[i] === "string" &&
      /^https?:\/\//i.test(urls[i])
    ){

      return urls[i];

    }

  }


  return null;

}


/* ========================================================
   Netflix URL
======================================================== */

function normalizeNetflixUrl(url){

  if(
    typeof url !== "string" ||
    !url.trim()
  ){

    return null;

  }


  const clean =
    url.trim();


  const id =
    extractNetflixTitleId(
      clean
    );


  if(id){

    return (
      "https://www.netflix.com/jp/title/" +
      encodeURIComponent(id)
    );

  }


  if(
    /^https?:\/\/(?:www\.)?netflix\.com\//i
      .test(clean)
  ){

    return clean;

  }


  return null;

}


/* ========================================================
   Netflix ID
======================================================== */

function extractNetflixTitleId(url){

  if(
    typeof url !== "string" ||
    !url
  ){

    return null;

  }


  const patterns = [

    /netflix\.com\/(?:[^/]+\/)?title\/(\d+)/i,

    /netflix\.com\/(?:[^/]+\/)?watch\/(\d+)/i,

    /netflix\.com\/title\/(\d+)/i,

    /netflix\.com\/watch\/(\d+)/i

  ];


  for(
    let i = 0;
    i < patterns.length;
    i++
  ){

    const match =
      url.match(
        patterns[i]
      );


    if(match){

      return match[1];

    }

  }


  return null;

}


/* ========================================================
   Netflix検索
======================================================== */

function createNetflixSearchUrl(title){

  const clean =
    String(title || "")
      .trim();


  if(!clean){

    return "https://www.netflix.com/jp/";

  }


  return (
    "https://www.netflix.com/jp/search?q=" +
    encodeURIComponent(clean)
  );

}


/* ========================================================
   Amazon検索
======================================================== */

function createAmazonSearchUrl(title){

  const clean =
    String(title || "")
      .trim();


  if(!clean){

    return (
      "https://www.amazon.co.jp/gp/video/storefront"
    );

  }


  return (
    "https://www.amazon.co.jp/s?k=" +
    encodeURIComponent(clean) +
    "&i=instant-video"
  );

}


/* ========================================================
   日付
======================================================== */

function formatDate(date){

  const parts =
    String(date).split("-");


  if(parts.length !== 3){

    return date;

  }


  return (
    Number(parts[0]) +
    "年" +
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}


/* ========================================================
   HTMLエスケープ
======================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
