<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>作品情報 | ドコデミレル？</title>

<style>

/* =====================================================
   基本
===================================================== */

*{
  box-sizing:border-box;
}

body{
  margin:0;

  font-family:
    Arial,
    "Noto Sans JP",
    sans-serif;

  background:#f5f7fb;

  color:#222;

  font-size:16px;
}

a{
  color:inherit;
  text-decoration:none;
}


/* =====================================================
   ヘッダー
===================================================== */

header{
  background:#111827;

  color:#fff;

  padding:18px 20px;

  text-align:center;
}

header h1{
  margin:0;

  font-size:28px;
}

header p{
  margin:7px 0 0;

  color:#d1d5db;

  font-size:15px;
}


/* =====================================================
   コンテナ
===================================================== */

.container{
  max-width:1000px;

  margin:0 auto;

  padding:18px;
}


/* =====================================================
   戻るボタン
===================================================== */

.back{
  display:inline-block;

  margin-bottom:15px;

  padding:10px 15px;

  background:#fff;

  color:#111827;

  border-radius:8px;

  font-weight:bold;

  font-size:16px;

  box-shadow:
    0 1px 4px
    rgba(0,0,0,.08);
}


/* =====================================================
   作品上部
===================================================== */

.movie-header{

  display:flex;

  align-items:flex-start;

  gap:22px;

  background:#fff;

  padding:22px;

  border-radius:14px;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.08);
}


/* =====================================================
   ポスター
===================================================== */

.poster{

  width:230px;

  max-width:30%;

  height:auto;

  object-fit:cover;

  border-radius:9px;

  align-self:flex-start;

  flex-shrink:0;
}


/* =====================================================
   右側情報
===================================================== */

.movie-info{

  flex:1;

  min-width:0;
}


/* =====================================================
   タイトル
===================================================== */

.movie-info h2{

  margin:0 0 9px;

  font-size:34px;

  line-height:1.4;

  color:#111827;
}


/* =====================================================
   原題
===================================================== */

.original-title{

  color:#666;

  font-size:16px;

  margin-bottom:13px;

  line-height:1.5;
}


/* =====================================================
   基本情報
===================================================== */

.basic-info{

  display:flex;

  flex-wrap:wrap;

  gap:8px 20px;

  margin-bottom:15px;
}

.info-line{

  margin:0;

  font-size:17px;

  color:#444;
}


/* =====================================================
   ジャンル
===================================================== */

.genre-info{

  display:flex;

  flex-wrap:wrap;

  gap:5px 7px;

  margin-top:-5px;

  margin-bottom:13px;
}

.genre-item{

  display:inline-block;

  padding:3px 8px;

  background:#f3f4f6;

  color:#555;

  border-radius:12px;

  /* 少し小さめ */
  font-size:13px;

  line-height:1.4;
}


/* =====================================================
   監督・出演者・あらすじ
===================================================== */

.movie-side-info{

  margin-top:12px;
}


/* =====================================================
   各項目
===================================================== */

.side-section{

  margin-top:13px;
}

.side-section:first-child{

  margin-top:0;
}


/* =====================================================
   見出し
===================================================== */

.side-title{

  font-size:18px;

  font-weight:bold;

  margin-bottom:5px;

  color:#333;
}


/* =====================================================
   本文
===================================================== */

.side-text{

  line-height:1.65;

  color:#444;

  font-size:17px;
}


/* =====================================================
   出演者
===================================================== */

.cast-list{

  display:flex;

  flex-wrap:wrap;

  gap:6px;
}

.cast-item{

  background:#f3f4f6;

  padding:6px 10px;

  border-radius:15px;

  font-size:15px;

  color:#444;
}


/* =====================================================
   あらすじ
===================================================== */

.overview-text{

  display:-webkit-box;

  -webkit-box-orient:vertical;

  -webkit-line-clamp:4;

  overflow:hidden;

  line-height:1.65;
}


/* =====================================================
   共通セクション
===================================================== */

.section{

  margin-top:20px;

  background:#fff;

  padding:20px;

  border-radius:14px;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.08);
}

.section h3{

  margin:0 0 15px;

  font-size:22px;
}


/* =====================================================
   配信サービス
===================================================== */

.provider-group{

  margin-top:20px;

  padding:12px;

  border-radius:12px;

  border:1px solid #e5e7eb;
}

.provider-group:first-child{

  margin-top:0;
}


/* =====================================================
   見放題
===================================================== */

.provider-group.streaming{

  background:#f0fdf4;

  border-color:#bbf7d0;
}

.provider-group.streaming
.provider-title{

  border-left-color:#16a34a;

  background:#dcfce7;

  color:#166534;
}


/* =====================================================
   レンタル
===================================================== */

.provider-group.rental{

  background:#fff7ed;

  border-color:#fed7aa;
}

.provider-group.rental
.provider-title{

  border-left-color:#f59e0b;

  background:#ffedd5;

  color:#9a3412;
}


/* =====================================================
   購入
===================================================== */

.provider-group.purchase{

  background:#eff6ff;

  border-color:#bfdbfe;
}

.provider-group.purchase
.provider-title{

  border-left-color:#2563eb;

  background:#dbeafe;

  color:#1e40af;
}


/* =====================================================
   配信見出し
===================================================== */

.provider-title{

  display:flex;

  align-items:center;

  gap:8px;

  font-size:19px;

  font-weight:bold;

  margin-bottom:10px;

  padding:9px 11px;

  border-radius:9px;

  border-left:5px solid #2563eb;
}


/* =====================================================
   配信カード
===================================================== */

.provider-card{

  display:flex;

  align-items:center;

  gap:13px;

  padding:12px 14px;

  margin-bottom:8px;

  background:#fff;

  border-radius:11px;

  border:1px solid #e5e7eb;

  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.provider-card:last-child{

  margin-bottom:0;
}

.provider-card:hover{

  transform:translateY(-1px);

  box-shadow:
    0 3px 10px
    rgba(0,0,0,.08);
}


/* =====================================================
   ロゴ
===================================================== */

.provider-logo{

  width:52px;

  height:52px;

  object-fit:contain;

  border-radius:8px;

  background:#fff;

  border:1px solid #eee;

  flex-shrink:0;
}


/* =====================================================
   サービス情報
===================================================== */

.provider-info{

  flex:1;

  min-width:0;
}

.provider-name{

  font-size:18px;

  font-weight:bold;

  color:#111827;

  margin-bottom:4px;
}

.provider-type{

  display:inline-block;

  padding:3px 7px;

  background:#f3f4f6;

  color:#555;

  border-radius:5px;

  font-size:13px;

  margin-bottom:4px;
}

.provider-subinfo{

  display:flex;

  flex-wrap:wrap;

  gap:10px;

  color:#777;

  font-size:13px;
}


/* =====================================================
   配信ボタン
===================================================== */

.provider-button{

  display:inline-block;

  padding:11px 15px;

  color:#fff;

  text-decoration:none;

  border-radius:8px;

  font-weight:bold;

  font-size:14px;

  white-space:nowrap;

  flex-shrink:0;

  transition:
    opacity .15s ease,
    transform .15s ease;
}

.provider-button:hover{

  opacity:.85;

  transform:translateY(-1px);
}


/* =====================================================
   サービスカラー
===================================================== */

.netflix-button{
  background:#e50914;
}

.amazon-button{
  background:#ff9900;
  color:#111;
}

.unext-button{
  background:#00a3e0;
}

.hulu-button{
  background:#1ce783;
  color:#111;
}

.disney-button{
  background:#113ccf;
}

.apple-button{
  background:#111;
}


/* =====================================================
   シリーズ
===================================================== */

.series-list{

  display:flex;

  gap:13px;

  overflow-x:auto;

  padding:3px
