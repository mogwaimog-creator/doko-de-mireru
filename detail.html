<script>

(function(){

"use strict";


/* =====================================================
   API
===================================================== */

const API_URL =
  "/api/search";


/* =====================================================
   DOM
===================================================== */

const loading =
  document.getElementById(
    "loading"
  );

const errorBox =
  document.getElementById(
    "error"
  );

const content =
  document.getElementById(
    "content"
  );


/* =====================================================
   ID取得
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const movieId =
  params.get("id");


if(!movieId){

  showError(
    "作品IDが指定されていません。"
  );

  return;

}


/* =====================================================
   作品読み込み
===================================================== */

loadMovie();


async function loadMovie(){

  try{

    const url =
      API_URL +
      "?id=" +
      encodeURIComponent(
        movieId
      );


    console.log(
      "DETAIL API:",
      url
    );


    const response =
      await fetch(
        url,
        {
          method:"GET",
          headers:{
            "Accept":
              "application/json"
          },
          cache:"no-store"
        }
      );


    if(!response.ok){

      const errorText =
        await response.text();


      console.error(
        "API ERROR:",
        response.status,
        errorText
      );


      throw new Error(
        "API ERROR " +
        response.status
      );

    }


    const movie =
      await response.json();


    console.log(
      "MOVIE DATA:",
      movie
    );


    if(
      !movie ||
      !movie.id
    ){

      throw new Error(
        "作品データがありません。"
      );

    }


    renderMovie(
      movie
    );


  }catch(error){

    console.error(
      "DETAIL PAGE ERROR:",
      error
    );


    showError(
      "作品情報を取得できませんでした。"
    );

  }

}


/* =====================================================
   作品表示
===================================================== */

function renderMovie(movie){

  loading.style.display =
    "none";

  errorBox.style.display =
    "none";

  content.style.display =
    "block";


  setText(
    "title",
    movie.title || ""
  );


  setText(
    "originalTitle",
    movie.original_title || ""
  );


  setText(
    "releaseDate",

    movie.release_date

      ? "公開日： " +
        formatDate(
          movie.release_date
        )

      : ""
  );


  const language =
    movie.original_language || "";


  let languageText =
    "";


  if(language === "en"){

    languageText =
      "🌎 英語";

  }else if(language){

    languageText =
      "🌎 原語：" +
      language;

  }


  setText(
    "language",
    languageText
  );


  const rating =
    Number(
      movie.vote_average || 0
    );


  setText(
    "rating",

    rating > 0

      ? "⭐ TMDB評価 " +
        rating.toFixed(1)

      : ""
  );


  const poster =
    document.getElementById(
      "poster"
    );


  if(movie.poster_path){

    poster.src =
      "https://image.tmdb.org/t/p/w500" +
      movie.poster_path;


    poster.alt =
      movie.title || "";


    poster.style.display =
      "block";

  }else{

    poster.style.display =
      "none";

  }


  const director =
    movie.director;


  if(
    director &&
    director.name
  ){

    setText(
      "director",
      "🎬 監督： " +
      director.name
    );

  }else{

    setText(
      "director",
      ""
    );

  }


  renderCast(
    movie.cast
  );


  setText(
    "overview",
    movie.overview ||
      "あらすじ情報はありません。"
  );


  renderProviders(
    movie
  );


  renderSeries(
    movie.series
  );


  const tmdbLink =
    document.getElementById(
      "tmdbLink"
    );


  tmdbLink.href =
    movie.link ||
    (
      "https://www.themoviedb.org/movie/" +
      movie.id
    );


  document.title =
    (
      movie.title ||
      "作品情報"
    ) +
    " | ドコデミレル？";

}


/* =====================================================
   出演者
===================================================== */

function renderCast(cast){

  const container =
    document.getElementById(
      "cast"
    );


  container.innerHTML =
    "";


  if(
    !Array.isArray(cast) ||
    cast.length === 0
  ){

    container.textContent =
      "出演者情報はありません。";

    return;

  }


  cast.forEach(
    function(person){

      if(
        !person ||
        !person.name
      ){

        return;

      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "cast-item";


      item.textContent =
        person.name;


      container.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   配信サービス
===================================================== */

function renderProviders(movie){

  const container =
    document.getElementById(
      "providers"
    );


  container.innerHTML =
    "";


  const streaming =
    normalizeProviders(
      Array.isArray(movie.streaming)
        ? movie.streaming
        : []
    );


  const rental =
    normalizeProviders(
      Array.isArray(movie.rental)
        ? movie.rental
        : []
    );


  const purchase =
    normalizeProviders(
      Array.isArray(movie.purchase)
        ? movie.purchase
        : []
    );


  renderProviderGroup(
    container,
    "🟢 見放題",
    streaming,
    "streaming",
    movie
  );


  renderProviderGroup(
    container,
    "🟠 レンタル",
    rental,
    "rental",
    movie
  );


  renderProviderGroup(
    container,
    "🔵 購入",
    purchase,
    "purchase",
    movie
  );


  if(
    !streaming.length &&
    !rental.length &&
    !purchase.length
  ){

    const empty =
      document.createElement(
        "p"
      );


    empty.textContent =
      "現在、配信情報を確認できません。";


    container.appendChild(
      empty
    );

  }

}


/* =====================================================
   サービス名を整理
===================================================== */

function normalizeProviderName(name){

  const value =
    String(
      name || ""
    ).trim();


  const lower =
    value.toLowerCase();


  if(
    lower.includes("netflix")
  ){

    return "Netflix";

  }


  if(
    lower.includes("amazon") ||
    lower.includes("prime video")
  ){

    return "Prime Video";

  }


  if(
    lower.includes("u-next") ||
    lower.includes("unext")
  ){

    return "U-NEXT";

  }


  if(
    lower.includes("hulu")
  ){

    return "Hulu";

  }


  if(
    lower.includes("disney")
  ){

    return "Disney+";

  }


  if(
    lower.includes("apple")
  ){

    return "Apple TV";

  }


  if(
    lower.includes("google play")
  ){

    return "Google Play";

  }


  if(
    lower.includes("fandango")
  ){

    return "Fandango";

  }


  if(
    lower.includes("fod")
  ){

    return "FOD";

  }


  return value;

}


/* =====================================================
   同じサービスをまとめる
===================================================== */

function normalizeProviders(providers){

  const result = [];

  const map = {};


  providers.forEach(
    function(provider){

      if(!provider){

        return;

      }


      const normalizedName =
        normalizeProviderName(
          provider.provider_name
        );


      if(!normalizedName){

        return;

      }


      const key =
        normalizedName.toLowerCase();


      if(!map[key]){

        map[key] = {
          ...provider,
          provider_name:
            normalizedName
        };

        result.push(
          map[key]
        );

      }

    }
  );


  return result;

}


/* =====================================================
   配信グループ
===================================================== */

function renderProviderGroup(
  container,
  title,
  providers,
  type,
  movie
){

  if(
    !Array.isArray(providers) ||
    providers.length === 0
  ){

    return;

  }


  const group =
    document.createElement(
      "div"
    );


  group.className =
    "provider-group " +
    type;


  const heading =
    document.createElement(
      "div"
    );


  heading.className =
    "provider-title";


  heading.textContent =
    title;


  group.appendChild(
    heading
  );


  providers.forEach(
    function(provider){

      createProviderCard(
        group,
        provider,
        type,
        movie
      );

    }
  );


  container.appendChild(
    group
  );

}


/* =====================================================
   配信カード
===================================================== */

function createProviderCard(
  container,
  provider,
  type,
  movie
){

  if(!provider){

    return;

  }


  const card =
    document.createElement(
      "div"
    );


  card.className =
    "provider-card";


  /* ---------------------------------------------------
     ロゴ
  --------------------------------------------------- */

  if(provider.logo_path){

    const logo =
      document.createElement(
        "img"
      );


    logo.className =
      "provider-logo";


    logo.src =
      "https://image.tmdb.org/t/p/w92" +
      provider.logo_path;


    logo.alt =
      provider.provider_name ||
      "";


    card.appendChild(
      logo
    );

  }


  /* ---------------------------------------------------
     情報
  --------------------------------------------------- */

  const info =
    document.createElement(
      "div"
    );


  info.className =
    "provider-info";


  const name =
    document.createElement(
      "div"
    );


  name.className =
    "provider-name";


  name.textContent =
    provider.provider_name ||
    "配信サービス";


  info.appendChild(
    name
  );


  const typeText =
    document.createElement(
      "div"
    );


  typeText.className =
    "provider-type";


  if(type === "streaming"){

    typeText.textContent =
      "見放題";

  }else if(type === "rental"){

    typeText.textContent =
      "レンタル";

  }else{

    typeText.textContent =
      "購入";

  }


  info.appendChild(
    typeText
  );


  /* ---------------------------------------------------
     字幕・吹き替え
  --------------------------------------------------- */

  const subInfo =
    document.createElement(
      "div"
    );


  subInfo.className =
    "provider-subinfo";


  const subtitle =
    document.createElement(
      "div"
    );


  subtitle.textContent =
    "🎧 字幕：未確認";


  subInfo.appendChild(
    subtitle
  );


  const dub =
    document.createElement(
      "div"
    );


  dub.textContent =
    "🎙️ 吹き替え：未確認";


  subInfo.appendChild(
    dub
  );


  info.appendChild(
    subInfo
  );


  card.appendChild(
    info
  );


  /* ---------------------------------------------------
     配信リンク
  --------------------------------------------------- */

  const url =
    getProviderLink(
      provider,
      movie
    );


  if(url){

    const button =
      document.createElement(
        "a"
      );


    button.className =
      "provider-button " +
      getButtonClass(
        provider.provider_name
      );


    button.href =
      url;


    button.target =
      "_blank";


    button.rel =
      "noopener noreferrer";


    button.textContent =
      getButtonText(
        provider.provider_name
      );


    card.appendChild(
      button
    );

  }


  container.appendChild(
    card
  );

}


/* =====================================================
   配信リンク
===================================================== */

function getProviderLink(
  provider,
  movie
){

  const name =
    String(
      provider.provider_name ||
      ""
    ).toLowerCase();


  if(
    name.includes("netflix")
  ){

    return (
      movie.netflix_url ||
      (
        movie.netflix &&
        movie.netflix.url
      ) ||
      (
        "https://www.netflix.com/jp/search?q=" +
        encodeURIComponent(
          movie.title || ""
        )
      )
    );

  }


  if(
    name.includes("amazon") ||
    name.includes("prime video")
  ){

    return (
      movie.amazon_url ||
      (
        movie.amazon &&
        movie.amazon.url
      ) ||
      (
        "https://www.amazon.co.jp/s?k=" +
        encodeURIComponent(
          movie.title || ""
        ) +
        "&i=instant-video"
      )
    );

  }


  if(
    name.includes("u-next") ||
    name.includes("unext")
  ){

    return (
      movie.unext_url ||
      getGenericProviderUrl(
        provider
      )
    );

  }


  if(
    name.includes("hulu")
  ){

    return (
      movie.hulu_url ||
      getGenericProviderUrl(
        provider
      )
    );

  }


  if(
    name.includes("disney")
  ){

    return (
      movie.disney_url ||
      getGenericProviderUrl(
        provider
      )
    );

  }


  if(
    name.includes("apple")
  ){

    return (
      movie.apple_tv_url ||
      getGenericProviderUrl(
        provider
      )
    );

  }


  return getGenericProviderUrl(
    provider
  );

}


/* =====================================================
   一般URL
===================================================== */

function getGenericProviderUrl(
  provider
){

  const urls = [

    provider.url,

    provider.link,

    provider.watch_link,

    provider.provider_url

  ];


  for(
    let i = 0;
    i < urls.length;
    i++
  ){

    if(
      typeof urls[i] === "string" &&
      /^https?:\/\//i.test(
        urls[i]
      )
    ){

      return urls[i];

    }

  }


  return null;

}


/* =====================================================
   ボタン色
===================================================== */

function getButtonClass(name){

  const value =
    String(
      name || ""
    ).toLowerCase();


  if(
    value.includes("netflix")
  ){

    return "netflix-button";

  }


  if(
    value.includes("amazon") ||
    value.includes("prime video")
  ){

    return "amazon-button";

  }


  if(
    value.includes("u-next") ||
    value.includes("unext")
  ){

    return "unext-button";

  }


  if(
    value.includes("hulu")
  ){

    return "hulu-button";

  }


  if(
    value.includes("disney")
  ){

    return "disney-button";

  }


  if(
    value.includes("apple")
  ){

    return "apple-button";

  }


  return "";

}


/* =====================================================

function getButtonText(name){

  if(

    return "Netflixで作品を見る →";

  ){

  }

  ){

  }


  if(

  }

/* =====================================================
   シリーズ
===================================================== */

function renderSeries(series){

  const section =
    document.getElementById(
      "seriesSection"
    );


  const container =
    document.getElementById(
      "seriesMovies"
    );


  if(
    !series ||
    !Array.isArray(
      series.movies
    ) ||
    series.movies.length === 0
  ){

    section.style.display =
      "none";

    return;

  }


  section.style.display =
    "block";


  setText(
    "seriesName",
    series.name ||
      "シリーズ作品"
  );


  container.innerHTML =
    "";


  series.movies.forEach(
    function(movie){

      if(
        !movie ||
        !movie.id
      ){

        return;

      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "series-item";


      if(movie.poster_path){

        const image =
          document.createElement(
            "img"
          );


        image.className =
          "series-poster";


        image.src =
          "https://image.tmdb.org/t/p/w300" +
          movie.poster_path;


        image.alt =
          movie.title || "";


        item.appendChild(
          image
        );

      }


      const link =
        document.createElement(
          "a"
        );


      link.href =
        "detail.html?id=" +
        encodeURIComponent(
          movie.id
        );


      link.textContent =
        movie.title || "";


      item.appendChild(
        link
      );


      const year =
        document.createElement(
          "div"
        );


      year.className =
        "series-year";


      year.textContent =
        movie.release_date
          ? formatYear(
              movie.release_date
            )
          : "";


      item.appendChild(
        year
      );


      container.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   日付
===================================================== */

function formatDate(date){

  if(!date){

    return "";

  }


  const parts =
    String(date).split("-");


  if(parts.length !== 3){

    return date;

  }


  return (
    Number(parts[0]) +
    "年" +
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}


/* =====================================================
   年
===================================================== */

function formatYear(date){

  if(!date){

    return "";

  }


  return (
    Number(
      String(date).substring(
        0,
        4
      )
    ) +
    "年"
  );

}

function setText(
  id,
  text
){

  const element =

      id
    );


  if(!element){

    return;

  }


  element.textContent =
    text || "";

}
