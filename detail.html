<script>

(function(){

"use strict";


/* =========================================================
   基本設定
========================================================= */

const SITE_URL =
  "https://doko-de-mireru.vercel.app/";

const DETAIL_URL =
  SITE_URL +
  "detail.html";

const API_URL =
  "/api/search";


/* =========================================================
   DOM
========================================================= */

const loading =
  document.getElementById(
    "loading"
  );

const errorBox =
  document.getElementById(
    "error"
  );

const content =
  document.getElementById(
    "content"
  );


/* =========================================================
   URL
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const movieId =
  params.get("id");


/* =========================================================
   作品ID確認
========================================================= */

if(!movieId){

  showError(
    "作品IDが指定されていません。"
  );

  return;

}


/* =========================================================
   初期canonical
========================================================= */

const initialCanonicalUrl =
  DETAIL_URL +
  "?id=" +
  encodeURIComponent(
    movieId
  );


const canonical =
  document.getElementById(
    "canonical"
  );


if(canonical){

  canonical.href =
    initialCanonicalUrl;

}


/* =========================================================
   初期OGP URL
========================================================= */

setMetaProperty(
  "ogUrl",
  "content",
  initialCanonicalUrl
);


/* =========================================================
   作品読み込み
========================================================= */

loadMovie();


/* =========================================================
   APIから作品情報取得
========================================================= */

async function loadMovie(){

  try{

    const url =
      API_URL +
      "?id=" +
      encodeURIComponent(
        movieId
      );


    const response =
      await fetch(
        url,
        {
          method:"GET",

          headers:{
            "Accept":
              "application/json"
          },

          cache:"no-store"
        }
      );


    const text =
      await response.text();


    if(!response.ok){

      console.error(
        "API ERROR:",
        response.status,
        text
      );

      throw new Error(
        "API ERROR " +
        response.status
      );

    }


    let movie;


    try{

      movie =
        JSON.parse(
          text
        );

    }catch(parseError){

      console.error(
        "JSON ERROR:",
        text
      );

      throw new Error(
        "JSONデータを解析できませんでした。"
      );

    }


    if(
      !movie ||
      !movie.id
    ){

      throw new Error(
        "作品データがありません。"
      );

    }


    /* =====================================================
       表示
    ===================================================== */

    renderMovie(
      movie
    );


    /* =====================================================
       SEO
    ===================================================== */

    updateSeo(
      movie
    );


    /* =====================================================
       構造化データ
    ===================================================== */

    updateStructuredData(
      movie
    );


  }catch(error){

    console.error(
      "DETAIL PAGE ERROR:",
      error
    );


    showError(
      "作品情報を取得できませんでした。"
    );

  }

}

/* =========================================================
   meta更新
========================================================= */

function setMeta(
  name,
  contentValue
){

  let meta =
    document.querySelector(
      'meta[name="' +
      name +
      '"]'
    );


  if(!meta){

    meta =
      document.createElement(
        "meta"
      );

    meta.name =
      name;

    document.head.appendChild(
      meta
    );

  }


  meta.content =
    contentValue;

}


/* =========================================================
   OGP / X meta更新
========================================================= */

function setMetaProperty(
  id,
  attribute,
  value
){

  const element =
    document.getElementById(
      id
    );


  if(!element){

    return;

  }


  element.setAttribute(
    attribute,
    value
  );

}


/* =========================================================
   構造化データ
========================================================= */

function updateStructuredData(movie){

  /*
     古い構造化データ削除
  */

  const oldMovie =
    document.getElementById(
      "movieStructuredData"
    );

  const oldPage =
    document.getElementById(
      "pageStructuredData"
    );

  const oldBreadcrumb =
    document.getElementById(
      "breadcrumbStructuredData"
    );

  const oldWebsite =
    document.getElementById(
      "websiteStructuredData"
    );


  if(oldMovie){
    oldMovie.remove();
  }

  if(oldPage){
    oldPage.remove();
  }

  if(oldBreadcrumb){
    oldBreadcrumb.remove();
  }

  if(oldWebsite){
    oldWebsite.remove();
  }


  const canonicalUrl =
    DETAIL_URL +
    "?id=" +
    encodeURIComponent(
      movie.id
    );


  /* =======================================================
     Movie
  ======================================================= */

  const movieData = {

    "@context":
      "https://schema.org",

    "@type":
      "Movie",

    "@id":
      canonicalUrl +
      "#movie",

    name:
      movie.title ||
      "",

    url:
      canonicalUrl,

    mainEntityOfPage:{
      "@type":
        "WebPage",

      "@id":
        canonicalUrl +
        "#webpage"
    }

  };


  /*
     原題
  */

  if(movie.original_title){

    movieData.alternateName =
      movie.original_title;

  }


  /*
     公開日
  */

  if(movie.release_date){

    movieData.datePublished =
      movie.release_date;

  }


  /*
     ポスター
  */

  if(movie.poster_path){

    movieData.image =
      "https://image.tmdb.org/t/p/w780" +
      movie.poster_path;

  }


  /*
     あらすじ
  */

  if(movie.overview){

    movieData.description =
      movie.overview;

  }


  /*
     TMDB
  */

  if(movie.link){

    movieData.sameAs =
      movie.link;

  }else{

    movieData.sameAs =
      "https://www.themoviedb.org/movie/" +
      movie.id;

  }


  /*
     ジャンル
  */

  if(
    Array.isArray(
      movie.genres
    ) &&
    movie.genres.length
  ){

    const genres =
      movie.genres
        .filter(function(genre){

          return (
            genre &&
            genre.name
          );

        })
        .map(function(genre){

          return genre.name;

        });


    if(genres.length){

      movieData.genre =
        genres;

    }

  }


  /*
     TMDB評価
  */

  const rating =
    Number(
      movie.vote_average || 0
    );


  const ratingCount =
    Number(
      movie.vote_count || 0
    );


  if(
    rating > 0 &&
    ratingCount > 0
  ){

    movieData.aggregateRating = {

      "@type":
        "AggregateRating",

      ratingValue:
        rating.toFixed(1),

      bestRating:
        "10",

      worstRating:
        "0",

      ratingCount:
        ratingCount

    };

  }


  /*
     監督
  */

  if(
    movie.director &&
    movie.director.name
  ){

    movieData.director = {

      "@type":
        "Person",

      name:
        movie.director.name

    };

  }


  /*
     出演者
  */

  if(
    Array.isArray(
      movie.cast
    ) &&
    movie.cast.length
  ){

    const actors =
      movie.cast
        .filter(function(person){

          return (
            person &&
            person.name
          );

        })
        .slice(0,10)
        .map(function(person){

          return {

            "@type":
              "Person",

            name:
              person.name

          };

        });


    if(actors.length){

      movieData.actor =
        actors;

    }

  }


  appendStructuredData(
    "movieStructuredData",
    movieData
  );


  /* =======================================================
     WebPage
  ======================================================= */

  const pageData = {

    "@context":
      "https://schema.org",

    "@type":
      "WebPage",

    "@id":
      canonicalUrl +
      "#webpage",

    name:
      (
        movie.title ||
        "作品情報"
      ) +
      "｜配信サービス・作品情報 | ドコデミレル？",

    url:
      canonicalUrl,

    description:
      movie.overview ||
      (
        movie.title ||
        "作品情報"
      ) +
      "の配信サービス・作品情報を確認できます。",

    isPartOf:{
      "@id":
        SITE_URL +
        "#website"
    },

    mainEntity:{
      "@id":
        canonicalUrl +
        "#movie"
    }

  };


  appendStructuredData(
    "pageStructuredData",
    pageData
  );


  /* =======================================================
     WebSite
  ======================================================= */

  const websiteData = {

    "@context":
      "https://schema.org",

    "@type":
      "WebSite",

    "@id":
      SITE_URL +
      "#website",

    name:
      "ドコデミレル？",

    url:
      SITE_URL,

    description:
      "映画がNetflix、Amazon Prime Video、U-NEXT、Hulu、Disney+など、どこで見られるか検索できるサイト。"

  };


  appendStructuredData(
    "websiteStructuredData",
    websiteData
  );


  /* =======================================================
     BreadcrumbList
  ======================================================= */

  const breadcrumbData = {

    "@context":
      "https://schema.org",

    "@type":
      "BreadcrumbList",

    itemListElement:[

      {

        "@type":
          "ListItem",

        position:
          1,

        name:
          "ドコデミレル？",

        item:
          SITE_URL

      },

      {

        "@type":
          "ListItem",

        position:
          2,

        name:
          movie.title ||
          "作品情報",

        item:
          canonicalUrl

      }

    ]

  };


  appendStructuredData(
    "breadcrumbStructuredData",
    breadcrumbData
  );

}

/* =========================================================
   サービス名正規化
========================================================= */

function normalizeProviderName(name){

  const value =
    String(
      name || ""
    ).trim();


  const lower =
    value.toLowerCase();


  if(
    lower.includes("netflix")
  ){

    return "Netflix";

  }


  if(
    lower.includes("amazon") ||
    lower.includes("prime video")
  ){

    return "Prime Video";

  }


  if(
    lower.includes("u-next") ||
    lower.includes("unext")
  ){

    return "U-NEXT";

  }


  if(
    lower.includes("hulu")
  ){

    return "Hulu";

  }


  if(
    lower.includes("disney")
  ){

    return "Disney+";

  }


  if(
    lower.includes("apple")
  ){

    return "Apple TV";

  }


  if(
    lower.includes("google play") ||
    lower.includes("googleplay")
  ){

    return "Google Play";

  }


  if(
    lower.includes("youtube")
  ){

    return "YouTube";

  }


  if(
    lower.includes("fandango")
  ){

    return "Fandango";

  }


  if(
    lower.includes("fod")
  ){

    return "FOD";

  }


  return value;

}


/* =========================================================
   配信情報重複削除
========================================================= */

function normalizeProviders(providers){

  if(
    !Array.isArray(providers)
  ){

    return [];

  }


  const result = [];

  const map = {};


  providers.forEach(function(provider){

    if(
      !provider ||
      !provider.provider_name
    ){

      return;

    }


    const name =
      normalizeProviderName(
        provider.provider_name
      );


    if(!name){

      return;

    }


    const key =
      name.toLowerCase();


    if(!map[key]){

      map[key] = {

        provider_id:
          provider.provider_id ||
          null,

        provider_name:
          name,

        logo_path:
          provider.logo_path ||
          null,

        provider_url:
          provider.provider_url ||
          null

      };


      result.push(
        map[key]
      );

    }

  });


  return result;

}


/* =========================================================
   配信カード
========================================================= */

function createProviderCard(
  container,
  provider,
  type,
  movie
){

  if(!provider){

    return;

  }


  const card =
    document.createElement(
      "div"
    );


  card.className =
    "provider-card";

  */

      );


    logo.className =

      provider.provider_name ||
      "";


    logo.loading =
      "lazy";


    card.appendChild(
      logo
    );

  }


  /*
     サービス名
  */

  const name =
    document.createElement(
      "div"
    );


  name.className =
    "provider-name";


  name.textContent =
    provider.provider_name ||
    "配信サービス";


  card.appendChild(

  );


  /*
     配信タイプ
  */

  const typeText =
    document.createElement(
      "div"
    );


  typeText.className =
    "provider-type";


  if(type === "streaming"){

    typeText.textContent =
      "見放題";

  }else if(type === "rental"){

    typeText.textContent =
      "レンタル";

  }else if(type === "purchase"){

    typeText.textContent =
      "購入";

  }else if(type === "free"){

    typeText.textContent =
      "無料視聴";

  }


  card.appendChild(
    typeText
  );


  /*
     料金
  */

  const price =
    getPriceText(
      provider.provider_name,
      type
    );


  if(price){

    const priceElement =
      document.createElement(
        "div"
      );


    priceElement.className =
      "provider-price";


    priceElement.textContent =
      price;


    card.appendChild(
      priceElement
    );

  }


  /*
     リンク
  */

  const url =
    getProviderLink(
      provider,
      movie,
      type
    );


  if(url){

    const button =
      document.createElement(
        "a"
      );


    button.className =
      "provider-button " +
      getButtonClass(
        provider.provider_name,
        type
      );


    button.href =
      url;


    button.target =
      "_blank";


    button.rel =
      "noopener noreferrer";


    button.textContent =
      provider.provider_name;


    card.appendChild(
      button
    );

  }


  container.appendChild(
    card
  );

}


/* =========================================================
   料金
========================================================= */

function getPriceText(
  name,
  type
){

  const value =
    String(
      name || ""
    ).toLowerCase();


  if(type === "free"){

    return "";

  }


  if(type === "streaming"){

    if(
      value.includes("netflix")
    ){

      return "月額 約890円～";

    }


    if(
      value.includes("amazon") ||
      value.includes("prime video")
    ){

      return "月額 約600円～";

    }


    if(
      value.includes("u-next") ||
      value.includes("unext")
    ){

      return "月額 約2,189円～";

    }


    if(
      value.includes("hulu")
    ){

      return "月額 約1,026円～";

    }


    if(
      value.includes("disney")
    ){

      return "月額 約1,140円～";

    }


    if(
      value.includes("apple")
    ){

      return "月額 約1,080円～";

    }


    if(
      value.includes("fod")
    ){

      return "月額 約1,000円～";

    }


    return "月額 約600円～";

  }


  if(type === "rental"){

    return "約100円～";

  }


  if(type === "purchase"){

    return "約500円～";

  }


  return "";

}


/* =========================================================
   配信リンク
========================================================= */

function getProviderLink(
  provider,
  movie,
  type
){

  const name =
    String(
      provider.provider_name ||
      ""
    ).toLowerCase();


  /*
     Netflix
  */

  if(
    name.includes("netflix")
  ){

    return (
      movie.netflix_url ||
      (
        movie.netflix &&
        movie.netflix.url
      ) ||
      "https://www.netflix.com/jp/"
    );

  }


  /*
     Prime Video
  */

  if(
    name.includes("amazon") ||
    name.includes("prime video")
  ){

    return (
      movie.amazon_url ||
      (
        movie.amazon &&
        movie.amazon.url
      ) ||
      (
        "https://www.amazon.co.jp/s?k=" +
        encodeURIComponent(
          movie.title || ""
        ) +
        "&i=instant-video"
      )
    );

  }


  /*
     U-NEXT
  */

  if(
    name.includes("u-next") ||
    name.includes("unext")
  ){

    return (
      movie.unext_url ||
      "https://video.unext.jp/"
    );

  }


  /*
     Hulu
  */

  if(
    name.includes("hulu")
  ){

    return (
      movie.hulu_url ||
      (
        "https://www.hulu.jp/search?q=" +
        encodeURIComponent(
          movie.title || ""
        )
      )
    );

  }


  /*
     Disney+
  */

  if(
    name.includes("disney")
  ){

    return (
      movie.disney_url ||
      (
        "https://www.disneyplus.com/ja-jp/search/" +
        encodeURIComponent(
          movie.title || ""
        )
      )
    );

  }


  /*
     Apple TV
  */

  if(
    name.includes("apple")
  ){

    return (
      movie.apple_tv_url ||
      (
        "https://tv.apple.com/jp/search?term=" +
        encodeURIComponent(
          movie.title || ""
        )
      )
    );

  }


  /*
     FOD
  */

  if(
    name.includes("fod")
  ){

    return (
      movie.fod_url ||
      provider.provider_url ||
      provider.url ||
      provider.link ||
      "https://fod.fujitv.co.jp/"
    );

  }


  /*
     Google Play
  */

  if(
    name.includes("google play") ||
    name.includes("googleplay")
  ){

    return (
      movie.google_play_url ||
      provider.provider_url ||
      provider.url ||
      provider.link ||
      (
        "https://play.google.com/store/search?q=" +
        encodeURIComponent(
          movie.title || ""
        ) +
        "&c=movies"
      )
    );

  }


  /*
     その他
  */

  return getGenericProviderUrl(
    provider
  );

}


/* =========================================================
   汎用配信URL
========================================================= */

function getGenericProviderUrl(
  provider
){

  const urls = [

    provider.provider_url,

    provider.url,

    provider.link,

    provider.watch_link

  ];


  for(
    let i = 0;
    i < urls.length;
    i++
  ){

    if(
      typeof urls[i] === "string" &&
      /^https?:\/\//i.test(
        urls[i]
      )
    ){

      return urls[i];

    }

  }


  return null;

}


/* =========================================================

========================================================= */

function getButtonClass(
  name,
  type
){

  const value =
    String(
      name || ""
    ).toLowerCase();


  if(
    value.includes("netflix")
  ){

    return "netflix-button";

  }


  if(
    value.includes("amazon") ||
    value.includes("prime video")
  ){

    return "amazon-button";

  }


  if(
    value.includes("u-next") ||
    value.includes("unext")
  ){

    return "unext-button";

  }


  if(
    value.includes("hulu")
  ){

    return "hulu-button";

  }


  if(
    value.includes("disney")
  ){

    return "disney-button";

  }


  if(
    value.includes("apple")
  ){

    return "apple-button";

  }


  if(
    value.includes("fod")
  ){

    return "fod-button";

  }


  if(
    value.includes("google play") ||
    value.includes("googleplay")
  ){

    return "googleplay-button";

  }


  if(
    type === "free" ||
    value.includes("youtube")
  ){

    return "free-button";

  }


  return "";

}

/* =========================================================
   日付
========================================================= */

function formatDate(date){

  if(!date){

    return "";

  }


  const parts =
    String(date).split("-");


  if(parts.length !== 3){

    return date;

  }


  return (
    Number(parts[0]) +
    "年" +
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}


/* =========================================================
   年
========================================================= */

function formatYear(date){

  if(!date){

    return "";

  }


  return (
    Number(
      String(date).substring(0,4)
    ) +
    "年"
  );

}
