<script>

/* ========================================================
   要素
======================================================== */

const status =
  document.getElementById("status");

const detail =
  document.getElementById("detail");

const metaDescription =
  document.getElementById("metaDescription");


/* ========================================================
   URLから作品ID取得
======================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const movieId =
  params.get("id");


/* ========================================================
   初期処理
======================================================== */

if(!movieId){

  showError(
    "作品IDが指定されていません。"
  );

}else{

  searchMovieById(movieId);

}


/* ========================================================
   IDで作品詳細取得
======================================================== */

async function searchMovieById(id){

  try{

    const response =
      await fetch(
        "/api/search?id=" +
        encodeURIComponent(id)
      );


    const text =
      await response.text();


    let data;


    try{

      data =
        JSON.parse(text);

    }catch(error){

      console.error(
        "JSON parse error:",
        text
      );

      throw new Error(
        "サーバーから正しい作品情報を取得できませんでした。"
      );

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        "作品情報を取得できませんでした。"
      );

    }


    /* =========================
       SEO
    ========================== */

    const title =
      data.title ||
      data.original_title ||
      "作品詳細";


    document.title =
      title +
      " | ドコデミレル？";


    metaDescription.setAttribute(
      "content",
      title +
      "の配信情報を確認できます。Netflix、Amazon Prime Video、U-NEXT、Hulu、Disney+、Apple TVなどの配信情報、監督、出演者、シリーズ作品を掲載しています。"
    );


    /* =========================
       表示
    ========================== */

    status.style.display =
      "none";

    detail.style.display =
      "block";


    detail.innerHTML =
      createDetail(data);


  }catch(error){

    console.error(
      "Detail error:",
      error
    );


    showError(
      error.message ||
      "作品情報を取得できませんでした。"
    );

  }

}


/* ========================================================
   詳細HTML
======================================================== */

function createDetail(movie){

  const poster =
    movie.poster_path
      ? "https://image.tmdb.org/t/p/w500" +
        movie.poster_path
      : "";


  const release =
    movie.release_date
      ? formatDate(movie.release_date)
      : "公開日不明";


  const rating =
    Number(movie.vote_average || 0)
      .toFixed(1);


  let html = "";


  html +=
    '<article class="detail-card">';


  /* =========================
     基本情報
  ========================== */

  html +=
    '<div class="movie-main">';


  if(poster){

    html +=
      `
      <img
        class="movie-poster"
        src="${escapeHtml(poster)}"
        alt="${escapeHtml(movie.title || "")}"
      >
      `;

  }else{

    html +=
      `
      <div
        class="movie-poster"
        style="
          display:flex;
          align-items:center;
          justify-content:center;
          color:#6b7280;
        "
      >
        NO IMAGE
      </div>
      `;

  }


  html +=
    '<div class="movie-info">';


  html +=
    `
    <h1 class="movie-title">
      ${escapeHtml(movie.title || "")}
    </h1>
    `;


  if(movie.original_title){

    html +=
      `
      <div class="original-title">
        ${escapeHtml(movie.original_title)}
      </div>
      `;

  }


  html +=
    `
    <div class="meta">
      公開日：${escapeHtml(release)}
    </div>
    `;


  html +=
    `
    <div class="rating">
      ⭐ TMDB評価：${rating}
    </div>
    `;


  if(
    Array.isArray(movie.genres) &&
    movie.genres.length
  ){

    const genres =
      movie.genres
        .map(
          function(g){
            return g && g.name
              ? g.name
              : "";
          }
        )
        .filter(Boolean)
        .join(" / ");


    if(genres){

      html +=
        `
        <div class="meta">
          ジャンル：${escapeHtml(genres)}
        </div>
        `;

    }

  }


  if(movie.overview){

    html +=
      `
      <div class="overview">
        ${escapeHtml(movie.overview)}
      </div>
      `;

  }


  html +=
    '</div>';


  html +=
    '</div>';


  /* =========================
     配信情報
  ========================== */

  html +=
    `
    <section class="section">
      <h2>📺 この作品はどこで見られる？</h2>
    `;


  html += createProviderGroup(
    "🟢 見放題",
    movie.streaming || [],
    movie
  );


  html += createProviderGroup(
    "🎞️ レンタル",
    movie.rental || [],
    movie
  );


  html += createProviderGroup(
    "💰 購入",
    movie.purchase || [],
    movie
  );


  const hasProviders =
    (
      Array.isArray(movie.streaming) &&
      movie.streaming.length
    ) ||
    (
      Array.isArray(movie.rental) &&
      movie.rental.length
    ) ||
    (
      Array.isArray(movie.purchase) &&
      movie.purchase.length
    );


  if(!hasProviders){

    html +=
      `
      <div class="empty">
        現在、配信情報を取得できませんでした。
      </div>
      `;

  }


  html +=
    '</section>';


  /* =========================
     監督
  ========================== */

  if(movie.director){

    html +=
      `
      <section class="section">

        <h2>🎬 監督</h2>

        <div class="person">
          ${escapeHtml(
            movie.director.name || ""
          )}
        </div>

      </section>
      `;

  }


  /* =========================
     出演者
  ========================== */

  if(
    Array.isArray(movie.cast) &&
    movie.cast.length
  ){

    html +=
      `
      <section class="section">

        <h2>👥 出演者</h2>

        <div class="people">
      `;


    movie.cast.forEach(
      function(person){

        if(!person){
          return;
        }


        html +=
          `
          <div class="person">
            ${escapeHtml(
              person.name || ""
            )}
          </div>
          `;

      }
    );


    html +=
      `
        </div>

      </section>
      `;

  }


  /* =========================
     シリーズ
  ========================== */

  if(
    movie.series &&
    Array.isArray(movie.series.movies) &&
    movie.series.movies.length
  ){

    html +=
      `
      <section class="section">

        <h2>🎞️ シリーズ作品</h2>

        <div class="series-name">
          ${escapeHtml(
            movie.series.name || ""
          )}
        </div>

        <div class="series">
      `;


    movie.series.movies.forEach(
      function(item){

        if(!item || !item.id){
          return;
        }


        const itemPoster =
          item.poster_path
            ? "https://image.tmdb.org/t/p/w300" +
              item.poster_path
            : "";


        const itemUrl =
          "detail.html?id=" +
          encodeURIComponent(item.id);


        html +=
          `
          <a
            href="${itemUrl}"
            class="series-item"
          >
          `;


        if(itemPoster){

          html +=
            `
            <img
              src="${escapeHtml(itemPoster)}"
              alt="${escapeHtml(item.title || "")}"
              loading="lazy"
            >
            `;

        }else{

          html +=
            `
            <div
              style="
                width:100%;
                aspect-ratio:2/3;
                background:#e5e7eb;
                border-radius:8px;
                display:flex;
                align-items:center;
                justify-content:center;
                color:#6b7280;
                font-size:12px;
              "
            >
              NO IMAGE
            </div>
            `;

        }


        html +=
          `
          <div class="series-item-title">
            ${escapeHtml(
              item.title || ""
            )}
          </div>
          `;


        if(item.release_date){

          html +=
            `
            <div class="series-item-date">
              ${escapeHtml(
                formatDate(item.release_date)
              )}
            </div>
            `;

        }


        html +=
          '</a>';

      }
    );


    html +=
      `
        </div>

      </section>
      `;

  }


  html +=
    '</article>';


  return html;

}


/* ========================================================
   配信サービス
======================================================== */

function createProviderGroup(
  title,
  providers,
  movie
){

  if(
    !Array.isArray(providers) ||
    !providers.length
  ){

    return "";

  }


  let html =
    '<div class="provider-group">';


  html +=
    `
    <div class="provider-group-title">
      ${escapeHtml(title)}
    </div>
    `;


  html +=
    '<div class="provider-list">';


  providers.forEach(
    function(provider){

      if(!provider){
        return;
      }


      const name =
        provider.provider_name ||
        provider.name ||
        "";


      if(!name){
        return;
      }


      const logo =
        provider.logo_path
          ? "https://image.tmdb.org/t/p/w92" +
            provider.logo_path
          : "";


      const link =
        getProviderLink(
          name,
          provider,
          movie
        );


      let buttonClass =
        "watch-button";


      const lowerName =
        name.toLowerCase();


      if(
        lowerName.includes("netflix")
      ){

        buttonClass +=
          " netflix";

      }


      if(
        lowerName.includes("amazon") ||
        lowerName.includes("prime")
      ){

        buttonClass +=
          " amazon";

      }


      html +=
        `
        <div class="provider">

          <div class="provider-top">

            ${
              logo
              ?
              `
              <img
                class="provider-logo"
                src="${escapeHtml(logo)}"
                alt="${escapeHtml(name)}"
              >
              `
              :
              ""
            }

            <div class="provider-name">
              ${escapeHtml(name)}
            </div>

          </div>

          <div class="provider-type">
            ${escapeHtml(
              getProviderType(title)
            )}
          </div>

          ${
            link
            ?
            `
            <a
              class="${buttonClass}"
              href="${escapeHtml(link)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${escapeHtml(
                getButtonText(name)
              )}
            </a>
            `
            :
            ""
          }

        </div>
        `;

    }
  );


  html +=
    '</div>';


  html +=
    '</div>';


  return html;

}


/* ========================================================
   配信種別
======================================================== */

function getProviderType(title){

  if(
    title.includes("見放題")
  ){

    return "見放題";

  }


  if(
    title.includes("レンタル")
  ){

    return "レンタル";

  }


  if(
    title.includes("購入")
  ){

    return "購入";

  }


  return "";

}


/* ========================================================
   ボタン文字
======================================================== */

function getButtonText(name){

  const lower =
    String(name || "")
      .toLowerCase();


  if(
    lower.includes("netflix")
  ){

    return "Netflixで見る →";

  }


  if(
    lower.includes("amazon") ||
    lower.includes("prime")
  ){

    return "Prime Videoで見る →";

  }


  return name + "で見る →";

}


/* ========================================================
   配信リンク
======================================================== */

function getProviderLink(
  name,
  provider,
  movie
){

  const lower =
    String(name || "")
      .toLowerCase();


  /* =========================
     Netflix
  ========================== */

  if(
    lower.includes("netflix")
  ){

    const urls = [

      movie &&
      movie.netflix_url,

      movie &&
      movie.netflix &&
      movie.netflix.url,

      provider &&
      provider.provider_url,

      provider &&
      provider.watch_link,

      provider &&
      provider.netflix_url,

      provider &&
      provider.url,

      provider &&
      provider.link

    ];


    for(
      let i = 0;
      i < urls.length;
      i++
    ){

      const normalized =
        normalizeNetflixUrl(
          urls[i]
        );


      if(normalized){

        return normalized;

      }

    }


    return createNetflixSearchUrl(
      movie.title ||
      movie.original_title ||
      ""
    );

  }


  /* =========================
     Amazon
  ========================== */

  if(
    lower.includes("amazon") ||
    lower.includes("prime")
  ){

    const urls = [

      movie &&
      movie.amazon_url,

      movie &&
      movie.amazon &&
      movie.amazon.url,

      provider &&
      provider.provider_url,

      provider &&
      provider.watch_link,

      provider &&
      provider.url,

      provider &&
      provider.link

    ];


    for(
      let i = 0;
      i < urls.length;
      i++
    ){

      if(
        typeof urls[i] === "string" &&
        /^https?:\/\//i.test(
          urls[i]
        )
      ){

        return urls[i];

      }

    }


    return createAmazonSearchUrl(
      movie.title ||
      movie.original_title ||
      ""
    );

  }


  /* =========================
     その他
  ========================== */

  const urls = [

    provider &&
    provider.provider_url,

    provider &&
    provider.watch_link,

    provider &&
    provider.url,

    provider &&
    provider.link

  ];


  for(
    let i = 0;
    i < urls.length;
    i++
  ){

    if(
      typeof urls[i] === "string" &&
      /^https?:\/\//i.test(
        urls[i]
      )
    ){

      return urls[i];

    }

  }


  return null;

}


/* ========================================================
   Netflix URL
======================================================== */

function normalizeNetflixUrl(url){

  if(
    typeof url !== "string" ||
    !url.trim()
  ){

    return null;

  }


  const clean =
    url.trim();


  const match =
    clean.match(
      /netflix\.com\/(?:[^/]+\/)?(?:title|watch)\/(\d+)/i
    );


  if(match){

    return (
      "https://www.netflix.com/jp/title/" +
      encodeURIComponent(
        match[1]
      )
    );

  }


  if(
    /^https?:\/\/(?:www\.)?netflix\.com\//i
      .test(clean)
  ){

    return clean;

  }


  return null;

}


/* ========================================================
   Netflix検索
======================================================== */

function createNetflixSearchUrl(title){

  const clean =
    String(title || "")
      .trim();


  if(!clean){

    return "https://www.netflix.com/jp/";

  }


  return (
    "https://www.netflix.com/jp/search?q=" +
    encodeURIComponent(clean)
  );

}


/* ========================================================
   Amazon検索
======================================================== */

function createAmazonSearchUrl(title){

  const clean =
    String(title || "")
      .trim();


  if(!clean){

    return (
      "https://www.amazon.co.jp/gp/video/storefront"
    );

  }


  return (
    "https://www.amazon.co.jp/s?k=" +
    encodeURIComponent(clean) +
    "&i=instant-video"
  );

}


/* ========================================================
   日付
======================================================== */

function formatDate(date){

  const parts =
    String(date).split("-");


  if(parts.length !== 3){

    return date;

  }


  return (
    Number(parts[0]) +
    "年" +
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}


/* ========================================================
   エラー
======================================================== */

function showError(message){

  status.className =
    "error";

  status.innerHTML =
    "❌ " +
    escapeHtml(message);

}


/* ========================================================
   HTMLエスケープ
======================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>
