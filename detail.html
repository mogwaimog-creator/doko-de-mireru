<script>

(function(){

"use strict";

/* =========================================================
   Google検索向けSEO
========================================================= */

function updateSeo(movie){

  if(!movie){
    return;
  }

  const title =
    movie.title ||
    "作品情報";

  document.title =
    title +
    "｜どこで見られる？ | ドコデミレル？";

  const description =
    title +
    "がNetflix、Amazon Prime Video、U-NEXT、Hulu、Disney+など、どこで見られるか確認できます。公開日、評価、出演者、あらすじなどの作品情報も掲載しています。";

  let meta =
    document.querySelector(
      'meta[name="description"]'
    );

  if(!meta){

    meta =
      document.createElement("meta");

    meta.name =
      "description";

    document.head.appendChild(
      meta
    );

  }

  meta.content =
    description;

}

/* =========================================================
   API
========================================================= */

const API_URL =
  "/api/search";

/* =========================================================
   DOM
========================================================= */

const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error");

const content =
  document.getElementById("content");

/* =========================================================
   URL
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const movieId =
  params.get("id");

if(!movieId){

  showError(
    "作品IDが指定されていません。"
  );

  return;

}

/* =========================================================
   読み込み
========================================================= */

loadMovie();

async function loadMovie(){

  try{

    const url =
      API_URL +
      "?id=" +
      encodeURIComponent(
        movieId
      );

    const response =
      await fetch(
        url,
        {
          method:"GET",
          headers:{
            "Accept":"application/json"
          },
          cache:"no-store"
        }
      );

    const text =
      await response.text();

    if(!response.ok){

      console.error(
        "API ERROR:",
        response.status,
        text
      );

      throw new Error(
        "API ERROR " +
        response.status
      );

    }

    let movie;

    try{

      movie =
        JSON.parse(text);

    }catch(parseError){

      console.error(
        "JSON ERROR:",
        text
      );

      throw new Error(
        "JSONデータを解析できませんでした。"
      );

    }

    if(
      !movie ||
      !movie.id
    ){

      throw new Error(
        "作品データがありません。"
      );

    }

    renderMovie(movie);

    updateSeo(movie);

  }catch(error){

    console.error(
      "DETAIL PAGE ERROR:",
      error
    );

    showError(
      "作品情報を取得できませんでした。"
    );

  }

}

/* =========================================================
   作品表示
========================================================= */

function renderMovie(movie){

  loading.style.display =
    "none";

  errorBox.style.display =
    "none";

  content.style.display =
    "block";

  setText(
    "title",
    movie.title || ""
  );

  setText(
    "originalTitle",
    movie.original_title || ""
  );

  setText(
    "releaseDate",
    movie.release_date
      ? "公開日：" +
        formatDate(
          movie.release_date
        )
      : ""
  );

  const rating =
    Number(
      movie.vote_average || 0
    );

  setText(
    "rating",
    rating > 0
      ? "⭐ TMDB評価 " +
        rating.toFixed(1)
      : ""
  );

  renderGenres(
    movie.genres
  );

  const poster =
    document.getElementById(
      "poster"
    );

  if(movie.poster_path){

    poster.src =
      "https://image.tmdb.org/t/p/w500" +
      movie.poster_path;

    poster.alt =
      movie.title || "";

    poster.style.display =
      "block";

  }else{

    poster.style.display =
      "none";

  }

  if(
    movie.director &&
    movie.director.name
  ){

    setText(
      "director",
      movie.director.name
    );

  }else{

    setText(
      "director",
      "監督情報はありません。"
    );

  }

  renderCast(
    movie.cast
  );

  setText(
    "overview",
    movie.overview ||
    "あらすじ情報はありません。"
  );

  renderProviders(
    movie
  );

  renderSeries(
    movie.series
  );

  renderRecommendations(
    movie.recommendations
  );

  const tmdbLink =
    document.getElementById(
      "tmdbLink"
    );

  tmdbLink.href =
    movie.link ||
    (
      "https://www.themoviedb.org/movie/" +
      movie.id
    );

}

/* =========================================================
   ジャンル
========================================================= */

function renderGenres(genres){

  const container =
    document.getElementById(
      "genres"
    );

  container.innerHTML =
    "";

  if(
    !Array.isArray(genres) ||
    genres.length === 0
  ){

    return;

  }

  genres.forEach(function(genre){

    if(
      !genre ||
      !genre.name
    ){

      return;

    }

    const item =
      document.createElement(
        "span"
      );

    item.className =
      "genre-item";

    item.textContent =
      genre.name;

    container.appendChild(
      item
    );

  });

}

/* =========================================================
   出演者
========================================================= */

function renderCast(cast){

  const container =
    document.getElementById(
      "cast"
    );

  container.innerHTML =
    "";

  if(

/* =========================================================
   サービス名統一
========================================================= */

function normalizeProviderName(name){

  const value =
    String(
      name || ""
    ).trim();

  const lower =
    value.toLowerCase();

  if(
    lower.includes("netflix")
  ){

    return "Netflix";

  }

  if(
    lower.includes("amazon") ||
    lower.includes("prime video")
  ){

    return "Prime Video";

  }

  if(
    lower.includes("u-next") ||
    lower.includes("unext")
  ){

    return "U-NEXT";

  }

  if(
    lower.includes("hulu")
  ){

    return "Hulu";

  }

  if(
    lower.includes("disney")
  ){

    return "Disney+";

  }

  if(
    lower.includes("apple")
  ){

    return "Apple TV";

  }

  if(
    lower.includes("google play") ||
    lower.includes("googleplay")
  ){

    return "Google Play";

  }

  if(
    lower.includes("youtube")
  ){

    return "YouTube";

  }

  if(
    lower.includes("fandango")
  ){

    return "Fandango";

  }

  if(
    lower.includes("fod")
  ){

    return "FOD";

  }

  return value;

}

/* =========================================================
   配信サービス正規化
========================================================= */

function normalizeProviders(providers){

  if(
    !Array.isArray(
      providers
    )
  ){

    return [];

  }

  const result = [];
  const map = {};

  providers.forEach(
    function(provider){

      if(
        !provider ||
        !provider.provider_name
      ){

        return;

      }

      const name =
        normalizeProviderName(
          provider.provider_name
        );

      if(!name){

        return;

      }

      const key =
        name.toLowerCase();

      if(!map[key]){

        map[key] = {

          provider_id:
            provider.provider_id ||
            null,

          provider_name:
            name,

          logo_path:
            provider.logo_path ||
            null,

          provider_url:
            provider.provider_url ||
            null

        };

        result.push(
          map[key]
        );

      }

    }
  );

  return result;

}

/* =========================================================
   配信グループ
========================================================= */

function renderProviderGroup(
  container,

  movie
){

  if(

/* =========================================================

function createProviderCard(
  container,

){

  const card =
    document.createElement(
      "div"

  card.className =
    "provider-card";

  /* ロゴ */

  if(provider.logo_path){

    const logo =
      document.createElement(
        "img"
      );

    logo.className =
      "provider-logo";

    logo.src =
      "https://image.tmdb.org/t/p/w92" +
      provider.logo_path;

    logo.alt =
      provider.provider_name ||
      "";

    logo.loading =
      "lazy";

    card.appendChild(
      logo
    );

  }

  /* サービス情報 */

  const info =
    document.createElement(
      "div"
    );

  info.className =
    "provider-info";

  const name =
    document.createElement(
      "div"
    );

  name.className =
    "provider-name";

  name.textContent =
    provider.provider_name ||
    "配信サービス";

  info.appendChild(
    name
  );

  const typeText =
    document.createElement(
      "div"
    );

  typeText.className =
    "provider-type";

  if(
    type === "streaming"
  ){

    typeText.textContent =
      "見放題";

  }else if(
    type === "rental"
  ){

    typeText.textContent =
      "レンタル";

  }else if(
    type === "purchase"
  ){

    typeText.textContent =
      "購入";

  }else if(
    type === "free"
  ){

    typeText.textContent =
      "無料視聴";

  }

  info.appendChild(
    typeText
  );

  card.appendChild(
    info
  );

  /* ボタン */

  const url =
    getProviderLink(
      provider,
      movie,
      type
    );

  if(url){

    const button =
      document.createElement(
        "a"
      );

    button.className =
      "provider-button " +
      getButtonClass(
        provider.provider_name,
        type
      );

    button.href =
      url;

    button.target =
      "_blank";

    button.rel =
      "noopener noreferrer";

    button.textContent =
      getButtonText(
        provider.provider_name,
        type
      );

    card.appendChild(
      button
    );

  }

  container.appendChild(
    card
  );

}

/* =========================================================
   配信リンク
========================================================= */

function getProviderLink(
  provider,
  movie,
  type
){

  const name =
    String(
      provider.provider_name ||
      ""
    ).toLowerCase();

  if(
    name.includes("netflix")
  ){

    return (
      movie.netflix_url ||
      (
        movie.netflix &&
        movie.netflix.url
      ) ||
      "https://www.netflix.com/jp/"
    );

  }

  if(
    name.includes("amazon") ||
    name.includes("prime video")
  ){

    return (
      movie.amazon_url ||
      (
        movie.amazon &&
        movie.amazon.url
      ) ||
      (
        "https://www.amazon.co.jp/s?k=" +
        encodeURIComponent(
          movie.title || ""
        ) +
        "&i=instant-video"
      )
    );

  }

  if(
    name.includes("u-next") ||
    name.includes("unext")
  ){

    return (
      movie.unext_url ||
      "https://video.unext.jp/"
    );

  }

  if(
    name.includes("hulu")
  ){

    return (
      movie.hulu_url ||
      (
        "https://www.hulu.jp/search?q=" +
        encodeURIComponent(
          movie.title || ""
        )
      )
    );

  }

  if(
    name.includes("disney")
  ){

    return (
      movie.disney_url ||
      (
        "https://www.disneyplus.com/ja-jp/search/" +
        encodeURIComponent(
          movie.title || ""
        )
      )
    );

  }

  if(
    name.includes("apple")
  ){

    return (
      movie.apple_tv_url ||
      (
        "https://tv.apple.com/jp/search?term=" +
        encodeURIComponent(
          movie.title || ""
        )
      )
    );

  }

  if(
    name.includes("fod")
  ){

    return (
      movie.fod_url ||
      provider.provider_url ||
      provider.url ||
      provider.link ||
      "https://fod.fujitv.co.jp/"
    );

  }

  if(
    name.includes("google play") ||
    name.includes("googleplay")
  ){

    return (
      movie.google_play_url ||
      provider.provider_url ||
      provider.url ||
      provider.link ||
      (
        "https://play.google.com/store/search?q=" +
        encodeURIComponent(
          movie.title || ""
        ) +
        "&c=movies"
      )
    );

  }

  return getGenericProviderUrl(
    provider
  );

}

/* =========================================================
   汎用配信リンク
========================================================= */

function getGenericProviderUrl(
  provider
){

  const urls = [

    provider.provider_url,
    provider.url,
    provider.link,
    provider.watch_link

  ];

  for(
    let i = 0;
    i < urls.length;
    i++
  ){

    if(
      typeof urls[i] === "string" &&
      /^https?:\/\//i.test(
        urls[i]
      )
    ){

      return urls[i];

    }

  }

  return null;

}

/* =========================================================
   日付
========================================================= */

function formatDate(date){

  if(!date){

    return "";

  }

  const parts =
    String(date).split("-");

  if(
    parts.length !== 3
  ){

    return date;

  }

  return (
    Number(parts[0]) +
    "年" +
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}

function formatYear(date){

  if(!date){

    return "";

  }

  return (
    Number(
      String(date).substring(
        0,
        4
      )
    ) +
    "年"
  );

}
