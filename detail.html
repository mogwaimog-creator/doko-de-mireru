<script>

/* =========================================================
   API
========================================================= */

const API_URL = "/api/search";


/* =========================================================
   作品ID取得
========================================================= */

function getMovieId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get("id") ||
    params.get("movieId") ||
    ""
  );

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   URL安全確認
========================================================= */

function safeUrl(url){

  if(
    typeof url !== "string"
  ){

    return "";

  }

  if(
    !/^https?:\/\//i.test(url)
  ){

    return "";

  }

  return url;

}


/* =========================================================
   SEO
========================================================= */

function updateSEO(movie){

  const title =
    movie.title ||
    movie.original_title ||
    "作品情報";


  const releaseDate =
    movie.release_date ||
    "";


  const year =
    releaseDate
      ? releaseDate.substring(0,4)
      : "";


  let pageTitle =
    `${title}はどこで見れる？`;


  if(year){

    pageTitle +=
      ` ${year}年`;

  }


  pageTitle +=
    "｜配信サービス一覧｜ドコデミレル？";


  let description =
    `${title}がどこで見られるかをチェック。`;


  description +=
    "Netflix、Amazon Prime Video、U-NEXT、Huluなどの配信サービス情報を確認できます。";


  if(movie.overview){

    const overview =
      movie.overview
        .replace(/\s+/g," ")
        .trim();


    if(overview){

      description +=
        ` ${overview.substring(0,90)}`;

    }

  }


  document.title =
    pageTitle;


  const descriptionTag =
    document.querySelector(
      'meta[name="description"]'
    );


  if(descriptionTag){

    descriptionTag.setAttribute(
      "content",
      description
    );

  }


  const canonical =
    document.getElementById(
      "canonicalLink"
    );


  if(canonical){

    canonical.href =
      window.location.href;

  }


  const ogTitle =
    document.getElementById(
      "ogTitle"
    );


  if(ogTitle){

    ogTitle.content =
      pageTitle;

  }


  const ogDescription =
    document.getElementById(
      "ogDescription"
    );


  if(ogDescription){

    ogDescription.content =
      description;

  }


  const ogUrl =
    document.getElementById(
      "ogUrl"
    );


  if(ogUrl){

    ogUrl.content =
      window.location.href;

  }


  const twitterTitle =
    document.getElementById(
      "twitterTitle"
    );


  if(twitterTitle){

    twitterTitle.content =
      pageTitle;

  }


  const twitterDescription =
    document.getElementById(
      "twitterDescription"
    );


  if(twitterDescription){

    twitterDescription.content =
      description;

  }


  /* =========================
     ポスター
  ========================= */

  if(movie.poster_path){

    const image =
      movie.poster_path.startsWith("http")

        ? movie.poster_path

        : "https://image.tmdb.org/t/p/w780" +
          movie.poster_path;


    const ogImage =
      document.getElementById(
        "ogImage"
      );


    if(ogImage){

      ogImage.content =
        image;

    }


    const twitterImage =
      document.getElementById(
        "twitterImage"
      );


    if(twitterImage){

      twitterImage.content =
        image;

    }

  }


  /* =========================
     構造化データ
  ========================= */

  const structuredData = {

    "@context":
      "https://schema.org",

    "@type":
      "Movie",

    "name":
      title,

    "url":
      window.location.href,

    "description":
      movie.overview ||
      `${title}の配信情報を確認できます。`

  };


  if(year){

    structuredData.dateCreated =
      releaseDate;

  }


  if(movie.poster_path){

    structuredData.image =
      movie.poster_path.startsWith("http")

        ? movie.poster_path

        : "https://image.tmdb.org/t/p/w780" +
          movie.poster_path;

  }


  if(movie.original_language){

    structuredData.inLanguage =
      movie.original_language;

  }


  if(
    movie.genres &&
    movie.genres.length
  ){

    structuredData.genre =
      movie.genres.map(
        function(genre){

          return genre.name;

        }
      );

  }


  if(movie.vote_average){

    structuredData.aggregateRating = {

      "@type":
        "AggregateRating",

      "ratingValue":
        Number(
          movie.vote_average
        ).toFixed(1),

      "bestRating":
        "10",

      "worstRating":
        "0"

    };

  }


  if(movie.director){

    structuredData.director = {

      "@type":
        "Person",

      "name":
        movie.director.name

    };

  }


  if(
    Array.isArray(movie.cast) &&
    movie.cast.length
  ){

    structuredData.actor =
      movie.cast.map(
        function(person){

          return {

            "@type":
              "Person",

            "name":
              person.name

          };

        }
      );

  }


  document
    .getElementById(
      "movieStructuredData"
    )
    .textContent =
      JSON.stringify(
        structuredData
      );

}


/* =========================================================
   ポスター表示
========================================================= */

function renderPoster(movie){

  const poster =
    document.getElementById(
      "poster"
    );


  if(!movie.poster_path){

    poster.style.display =
      "none";

    return;

  }


  const image =
    movie.poster_path.startsWith("http")

      ? movie.poster_path

      : "https://image.tmdb.org/t/p/w780" +
        movie.poster_path;


  poster.src =
    image;


  poster.alt =
    `${movie.title || "作品"}のポスター`;

}


/* =========================================================
   基本作品情報
========================================================= */

function renderMovieInfo(movie){

  const title =
    movie.title ||
    movie.original_title ||
    "作品情報";


  document.getElementById(
    "movieTitle"
  ).textContent =
    title;


  const originalTitle =
    document.getElementById(
      "originalTitle"
    );


  if(movie.original_title){

    originalTitle.textContent =
      movie.original_title;

    originalTitle.style.display =
      "block";

  }else{

    originalTitle.style.display =
      "none";

  }


  const meta =
    document.getElementById(
      "movieMeta"
    );


  let html = "";


  if(movie.release_date){

    html += `
      <span class="meta-item">
        ${escapeHTML(
          movie.release_date.substring(0,4)
        )}年
      </span>
    `;

  }


  if(movie.runtime){

    html += `
      <span class="meta-item">
        ${escapeHTML(movie.runtime)}分
      </span>
    `;

  }


  if(movie.vote_average){

    html += `
      <span class="meta-item">
        評価 ${Number(movie.vote_average).toFixed(1)}
      </span>
    `;

  }


  meta.innerHTML =
    html;


  const overview =
    document.getElementById(
      "overview"
    );


  if(movie.overview){

    overview.textContent =
      movie.overview;

    overview.style.display =
      "block";

  }else{

    overview.style.display =
      "none";

  }


  renderPoster(movie);

}


/* =========================================================
   ジャンル
========================================================= */

function renderGenres(movie){

  const section =
    document.getElementById(
      "genreSection"
    );


  const container =
    document.getElementById(
      "genres"
    );


  if(
    !Array.isArray(movie.genres) ||
    !movie.genres.length
  ){

    section.style.display =
      "none";

    return;

  }


  container.innerHTML =
    movie.genres
      .map(
        function(genre){

          return `
            <span class="genre">
              ${escapeHTML(
                genre.name
              )}
            </span>
          `;

        }
      )
      .join("");


  section.style.display =
    "block";

}


/* =========================================================
   公式サービスボタン
========================================================= */

function createFeaturedButton(
  name,
  url
){

  const safe =
    safeUrl(url);


  if(!safe){

    return "";

  }


  return `
    <a
      class="provider-button"
      href="${escapeHTML(safe)}"
      target="_blank"
      rel="noopener noreferrer"
    >
      ${escapeHTML(name)}
    </a>
  `;

}


/* =========================================================
   配信サービス
========================================================= */

function renderProviders(movie){

  const featured =
    document.getElementById(
      "featuredProviders"
    );


  const providers =
    document.getElementById(
      "providers"
    );


  let featuredHTML = "";


  /*
   * APIが判定した主要サービス
   */

  featuredHTML +=
    createFeaturedButton(
      "Netflix",
      movie.netflix_url
    );


  featuredHTML +=
    createFeaturedButton(
      "Amazon Prime Video",
      movie.amazon_url
    );


  featuredHTML +=
    createFeaturedButton(
      "U-NEXT",
      movie.unext_url
    );


  featuredHTML +=
    createFeaturedButton(
      "Hulu",
      movie.hulu_url
    );


  featuredHTML +=
    createFeaturedButton(
      "Disney+",
      movie.disney_url
    );


  featuredHTML +=
    createFeaturedButton(
      "Apple TV",
      movie.apple_tv_url
    );


  if(featuredHTML){

    featured.innerHTML = `

      <div class="provider-group">

        <h3 class="provider-group-title">
          主な配信サービス
        </h3>

        <div class="provider-list">
          ${featuredHTML}
        </div>

      </div>

    `;

  }else{

    featured.innerHTML =
      "";

  }


  /*
   * TMDBから取得したその他の配信情報
   */

  let streamingHTML = "";


  if(
    Array.isArray(movie.streaming)
  ){

    movie.streaming.forEach(
      function(provider){

        const url =
          safeUrl(
            provider.provider_url
          );


        if(!url){

          return;

        }


        streamingHTML += `
          <a
            class="provider-button"
            href="${escapeHTML(url)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${escapeHTML(
              provider.provider_name
            )}
          </a>
        `;

      }
    );

  }


  let rentalHTML = "";


  if(
    Array.isArray(movie.rental)
  ){

    movie.rental.forEach(
      function(provider){

        const url =
          safeUrl(
            provider.provider_url
          );


        if(!url){

          return;

        }


        rentalHTML += `
          <a
            class="provider-button"
            href="${escapeHTML(url)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${escapeHTML(
              provider.provider_name
            )}
          </a>
        `;

      }
    );

  }


  let purchaseHTML = "";


  if(
    Array.isArray(movie.purchase)
  ){

    movie.purchase.forEach(
      function(provider){

        const url =
          safeUrl(
            provider.provider_url
          );


        if(!url){

          return;

        }


        purchaseHTML += `
          <a
            class="provider-button"
            href="${escapeHTML(url)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${escapeHTML(
              provider.provider_name
            )}
          </a>
        `;

      }
    );

  }


  let html = "";


  if(streamingHTML){

    html += `

      <div class="provider-group">

        <h3 class="provider-group-title">
          見放題
        </h3>

        <div class="provider-list">
          ${streamingHTML}
        </div>

      </div>

    `;

  }


  if(rentalHTML){

    html += `

      <div class="provider-group">

        <h3 class="provider-group-title">
          レンタル
        </h3>

        <div class="provider-list">
          ${rentalHTML}
        </div>

      </div>

    `;

  }


  if(purchaseHTML){

    html += `

      <div class="provider-group">

        <h3 class="provider-group-title">
          購入
        </h3>

        <div class="provider-list">
          ${purchaseHTML}
        </div>

      </div>

    `;

  }


  if(!featuredHTML && !html){

    html = `

      <div class="no-provider">
        現在、確認できる配信情報がありません。
      </div>

    `;

  }


  providers.innerHTML =
    html;

}


/* =========================================================
   監督
========================================================= */

function renderDirector(movie){

  const section =
    document.getElementById(
      "directorSection"
    );


  const container =
    document.getElementById(
      "director"
    );


  if(
    !movie.director ||
    !movie.director.name
  ){

    section.style.display =
      "none";

    return;

  }


  container.innerHTML = `

    <span class="person">
      ${escapeHTML(
        movie.director.name
      )}
    </span>

  `;


  section.style.display =
    "block";

}


/* =========================================================
   出演者
========================================================= */

function renderCast(movie){

  const section =
    document.getElementById(
      "castSection"
    );


  const container =
    document.getElementById(
      "cast"
    );


  if(
    !Array.isArray(movie.cast) ||
    !movie.cast.length
  ){

    section.style.display =
      "none";

    return;

  }


  container.innerHTML =
    movie.cast
      .map(
        function(person){

          return `
            <span class="person">
              ${escapeHTML(
                person.name
              )}
            </span>
          `;

        }
      )
      .join("");


  section.style.display =
    "block";

}


/* =========================================================
   シリーズ
========================================================= */

function renderSeries(movie){

  const section =
    document.getElementById(
      "seriesSection"
    );


  const container =
    document.getElementById(
      "series"
    );


  if(
    !movie.series ||
    !Array.isArray(
      movie.series.movies
    ) ||
    !movie.series.movies.length
  ){

    section.style.display =
      "none";

    return;

  }


  container.innerHTML =
    movie.series.movies
      .map(
        function(item){

          const image =
            item.poster_path

              ? (
                  item.poster_path.startsWith("http")

                    ? item.poster_path

                    : "https://image.tmdb.org/t/p/w300" +
                      item.poster_path
                )

              : "";


          return `

            <div class="series-item">

              ${
                image

                  ? `
                    <img
                      src="${escapeHTML(image)}"
                      alt="${escapeHTML(item.title)}のポスター"
                      loading="lazy"
                    >
                  `

                  : `
                    <div
                      style="
                        aspect-ratio:2/3;
                        background:#e5e7eb;
                        border-radius:7px;
                      "
                    ></div>
                  `
              }

              <div class="series-item-title">
                ${escapeHTML(item.title)}
              </div>

              ${
                item.release_date

                  ? `
                    <div class="series-item-date">
                      ${escapeHTML(
                        item.release_date.substring(0,4)
                      )}年
                    </div>
                  `

                  : ""
              }

            </div>

          `;

        }
      )
      .join("");


  section.style.display =
    "block";

}


/* =========================================================
   作品表示
========================================================= */

function renderMovie(movie){

  renderMovieInfo(movie);

  renderGenres(movie);

  renderProviders(movie);

  renderDirector(movie);

  renderCast(movie);

  renderSeries(movie);

  updateSEO(movie);


  document.getElementById(
    "loading"
  ).style.display =
    "none";


  document.getElementById(
    "movieDetail"
  ).style.display =
    "block";

}


/* =========================================================
   API取得
========================================================= */

async function loadMovie(movieId){

  try{

    const response =
      await fetch(
        `${API_URL}?id=${encodeURIComponent(movieId)}`,
        {
          method:"GET",
          headers:{
            "Accept":
              "application/json"
          }
        }
      );


    if(!response.ok){

      throw new Error(
        `API error: ${response.status}`
      );

    }


    const movie =
      await response.json();


    /*
     * api/search.js は
     * 作品詳細を直接返すため、
     * result.movie や result.data
     * ではなく、そのまま使用する。
     */


    if(
      !movie ||
      !movie.id ||
      !movie.title
    ){

      throw new Error(
        "作品情報がありません。"
      );

    }


    renderMovie(movie);


  }catch(error){

    console.error(
      "作品情報取得エラー:",
      error
    );


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    document.getElementById(
      "error"
    ).style.display =
      "block";

  }

}


/* =========================================================
   初期処理
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    const movieId =
      getMovieId();


    if(!movieId){

      document.getElementById(
        "loading"
      ).style.display =
        "none";


      document.getElementById(
        "error"
      ).style.display =
        "block";


      return;

    }


    loadMovie(movieId);

  }
);

</script>
