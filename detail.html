<style>

/* =====================================================
   基本
===================================================== */

*{
  box-sizing:border-box;

body{

  font-family:

/* =====================================================

/* =====================================================
   原題
===================================================== */

/* =====================================================

  gap:6px 14px;

/* =====================================================

/* =====================================================
   監督
===================================================== */

.side-section:first-child{

}


.side-text{

  font-size:13px;

}


/* =====================================================
   出演者
===================================================== */

.cast-list{

  display:flex;

}


.cast-item{

  padding:4px 8px;

/* =====================================================

.overview-text{

/* =====================================================

/* =====================================================

}

.amazon-button{

.hulu-button{

/* =====================================================

.loading{

/* =====================================================

<script>

(function(){

"use strict";


/* =====================================================
   API
===================================================== */

const API_URL =
  "/api/search";


/* =====================================================
   DOM
===================================================== */

const loading =
  document.getElementById(
    "loading"
  );

const errorBox =
  document.getElementById(
    "error"
  );

const content =
  document.getElementById(
    "content"
  );


/* =====================================================
   ID取得
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const movieId =
  params.get("id");


if(!movieId){

  showError(
    "作品IDが指定されていません。"
  );

  return;

}


/* =====================================================
   作品読み込み
===================================================== */

loadMovie();


async function loadMovie(){

  try{

    const url =
      API_URL +
      "?id=" +
      encodeURIComponent(
        movieId
      );


    console.log(
      "DETAIL API:",
      url
    );


    const response =
      await fetch(
        url,
        {
          method:"GET",

          headers:{
            "Accept":
              "application/json"
          },

          cache:"no-store"
        }
      );


    if(!response.ok){

      const errorText =
        await response.text();


      console.error(
        "API ERROR:",
        response.status,
        errorText
      );


      throw new Error(
        "API ERROR " +
        response.status
      );

    }


    const movie =
      await response.json();


    console.log(
      "MOVIE DATA:",
      movie
    );


    if(
      !movie ||
      !movie.id
    ){

      throw new Error(
        "作品データがありません。"
      );

    }


    renderMovie(
      movie
    );


  }catch(error){

    console.error(
      "DETAIL PAGE ERROR:",
      error
    );


    showError(
      "作品情報を取得できませんでした。"
    );

  }

}


/* =====================================================
   作品表示
===================================================== */

function renderMovie(movie){

  loading.style.display =
    "none";

  errorBox.style.display =
    "none";

  content.style.display =
    "block";


  /* ===================================================
     タイトル
  =================================================== */

  setText(
    "title",
    movie.title || ""
  );


  /* ===================================================
     国名
  =================================================== */

  renderCountry(
    movie
  );


  /* ===================================================
     原題
  =================================================== */

  setText(
    "originalTitle",
    movie.original_title || ""
  );


  /* ===================================================
     公開日
  =================================================== */

  setText(
    "releaseDate",

    movie.release_date

      ? "公開日：" +
        formatDate(
          movie.release_date
        )

      : ""
  );


  /* ===================================================
     評価
  =================================================== */

  const rating =
    Number(
      movie.vote_average || 0
    );


  setText(
    "rating",

    rating > 0

      ? "⭐ " +
        rating.toFixed(1)

      : ""
  );


  /* ===================================================
     ポスター
  =================================================== */

  const poster =
    document.getElementById(
      "poster"
    );


  if(movie.poster_path){

    poster.src =
      "https://image.tmdb.org/t/p/w500" +
      movie.poster_path;


    poster.alt =
      movie.title || "";


    poster.style.display =
      "block";

  }else{

    poster.style.display =
      "none";

  }


  /* ===================================================
     監督
  =================================================== */

  const director =
    movie.director;


  if(
    director &&
    director.name
  ){

    setText(
      "director",
      director.name
    );

  }else{

    setText(
      "director",
      "監督情報はありません。"
    );

  }


  /* ===================================================
     出演者
  =================================================== */

  renderCast(
    movie.cast
  );


  /* ===================================================
     あらすじ
  =================================================== */

  setText(
    "overview",

    movie.overview ||
    "あらすじ情報はありません。"
  );


  /* ===================================================
     配信
  =================================================== */

  renderProviders(
    movie
  );


  /* ===================================================
     シリーズ
  =================================================== */

  renderSeries(
    movie.series
  );


  /* ===================================================
     TMDB
  =================================================== */

  const tmdbLink =
    document.getElementById(
      "tmdbLink"
    );


  tmdbLink.href =
    movie.link ||
    (
      "https://www.themoviedb.org/movie/" +
      movie.id
    );


  document.title =
    (
      movie.title ||
      "作品情報"
    ) +
    " | ドコデミレル？";

}


/* =====================================================
   国名
===================================================== */

function renderCountry(movie){

  const element =
    document.getElementById(
      "country"
    );


  let countries = [];


  /* production_countries */

  if(
    Array.isArray(
      movie.production_countries
    )
  ){

    countries =
      movie.production_countries
        .map(
          function(country){

            return (
              country.name ||
              country.english_name ||
              ""
            );

          }
        )
        .filter(Boolean);

  }


  /* origin_country */

  if(
    countries.length === 0 &&
    Array.isArray(
      movie.origin_country
    )
  ){

    countries =
      movie.origin_country
        .map(
          function(code){

            return countryName(
              code
            );

          }
        )
        .filter(Boolean);

  }


  if(
    countries.length === 0
  ){

    element.textContent =
      "";

    return;

  }


  element.textContent =
    countries.join("・");

}


/* =====================================================
   国コード → 日本語
===================================================== */

function countryName(code){

  const map = {

    JP:"日本",

    US:"アメリカ",

    GB:"イギリス",

    FR:"フランス",

    DE:"ドイツ",

    IT:"イタリア",

    ES:"スペイン",

    KR:"韓国",

    CN:"中国",

    HK:"香港",

    TW:"台湾",

    CA:"カナダ",

    AU:"オーストラリア",

    IN:"インド",

    TH:"タイ",

    RU:"ロシア",

    MX:"メキシコ",

    BR:"ブラジル",

    NZ:"ニュージーランド",

    SE:"スウェーデン",

    DK:"デンマーク",

    NO:"ノルウェー",

    NL:"オランダ",

    BE:"ベルギー",

    CH:"スイス",

    IE:"アイルランド"

  };


  return (
    map[
      String(code)
        .toUpperCase()
    ] ||
    code
  );

}


/* =====================================================
   出演者
===================================================== */

function renderCast(cast){

  const container =
    document.getElementById(
      "cast"
    );


  container.innerHTML =
    "";


  if(
    !Array.isArray(cast) ||
    cast.length === 0
  ){

    container.textContent =
      "出演者情報はありません。";

    return;

  }


  cast
    .slice(0,8)
    .forEach(
      function(person){

        if(
          !person ||
          !person.name
        ){

          return;

        }


        const item =
          document.createElement(
            "div"
          );


        item.className =
          "cast-item";


        item.textContent =
          person.name;


        container.appendChild(
          item
        );

      }
    );

}


/* =====================================================
   配信サービス
===================================================== */

function renderProviders(movie){

  const container =
    document.getElementById(
      "providers"
    );


  container.innerHTML =
    "";


  const streaming =
    normalizeProviders(
      Array.isArray(
        movie.streaming
      )
        ? movie.streaming
        : []
    );


  const rental =
    normalizeProviders(
      Array.isArray(
        movie.rental
      )
        ? movie.rental
        : []
    );


  const purchase =
    normalizeProviders(
      Array.isArray(
        movie.purchase
      )
        ? movie.purchase
        : []
    );


  renderProviderGroup(
    container,
    "🟢 見放題",
    streaming,
    "streaming",
    movie
  );


  renderProviderGroup(
    container,
    "🟠 レンタル",
    rental,
    "rental",
    movie
  );


  renderProviderGroup(
    container,
    "🔵 購入",
    purchase,
    "purchase",
    movie
  );


  if(
    !streaming.length &&
    !rental.length &&
    !purchase.length
  ){

    const empty =
      document.createElement(
        "p"
      );


    empty.textContent =
      "現在、配信情報を確認できません。";


    container.appendChild(
      empty
    );

  }

}


/* =====================================================
   サービス名
===================================================== */

function normalizeProviderName(name){

  const value =
    String(
      name || ""
    ).trim();


  const lower =
    value.toLowerCase();


  if(
    lower.includes("netflix")
  ){

    return "Netflix";

  }


  if(
    lower.includes("amazon") ||
    lower.includes("prime video")
  ){

    return "Prime Video";

  }


  if(
    lower.includes("u-next") ||
    lower.includes("unext")
  ){

    return "U-NEXT";

  }


  if(
    lower.includes("hulu")
  ){

    return "Hulu";

  }


  if(
    lower.includes("disney")
  ){

    return "Disney+";

  }


  if(
    lower.includes("apple")
  ){

    return "Apple TV";

  }


  if(
    lower.includes("google play")
  ){

    return "Google Play";

  }


  if(
    lower.includes("fandango")
  ){

    return "Fandango";

  }


  if(
    lower.includes("fod")
  ){

    return "FOD";

  }


  return value;

}


/* =====================================================
   同じサービスをまとめる
===================================================== */

function normalizeProviders(providers){

  const result = [];

  const map = {};


  providers.forEach(
    function(provider){

      if(!provider){

        return;

      }


      const normalizedName =
        normalizeProviderName(
          provider.provider_name
        );


      if(!normalizedName){

        return;

      }


      const key =
        normalizedName.toLowerCase();


      if(!map[key]){

        map[key] = {

          ...provider,

          provider_name:
            normalizedName

        };


        result.push(
          map[key]
        );

      }

    }
  );


  return result;

}


/* =====================================================
   配信グループ
===================================================== */

function renderProviderGroup(
  container,

  providers,

){

  if(

/* =====================================================
   配信カード
===================================================== */

function createProviderCard(
  container,
  provider,
  type,
  movie
){

  if(!provider){

    return;

  }


  const card =
    document.createElement(
      "div"
    );


  card.className =
    "provider-card";


  /* ロゴ */

  if(provider.logo_path){

    const logo =
      document.createElement(
        "img"
      );


    logo.className =
      "provider-logo";


    logo.src =
      "https://image.tmdb.org/t/p/w92" +
      provider.logo_path;


    logo.alt =
      provider.provider_name ||
      "";


    card.appendChild(
      logo
    );

  }


  /* 情報 */

  const info =
    document.createElement(
      "div"
    );


  info.className =
    "provider-info";


  const name =
    document.createElement(
      "div"
    );


  name.className =
    "provider-name";


  name.textContent =
    provider.provider_name ||
    "配信サービス";


  info.appendChild(
    name
  );


  const typeText =
    document.createElement(
      "div"
    );


  typeText.className =
    "provider-type";


  if(
    type === "streaming"
  ){

    typeText.textContent =
      "見放題";

  }else if(
    type === "rental"
  ){

    typeText.textContent =
      "レンタル";

  }else{

    typeText.textContent =
      "購入";

  }


  info.appendChild(
    typeText
  );


  /* 字幕・吹き替え */

  const subInfo =
    document.createElement(
      "div"
    );


  subInfo.className =
    "provider-subinfo";


  const subtitle =
    document.createElement(
      "div"
    );


  subtitle.textContent =
    "🎧 字幕：未確認";


  subInfo.appendChild(
    subtitle
  );


  const dub =
    document.createElement(
      "div"
    );


  dub.textContent =
    "🎙️ 吹き替え：未確認";


  subInfo.appendChild(
    dub
  );


  info.appendChild(
    subInfo
  );


  card.appendChild(
    info
  );


  /* 配信ボタン */

  const url =
    getProviderLink(
      provider,
      movie
    );


  if(url){

    const button =
      document.createElement(
        "a"
      );


    button.className =
      "provider-button " +
      getButtonClass(
        provider.provider_name
      );


    button.href =
      url;


    button.target =
      "_blank";


    button.rel =
      "noopener noreferrer";


    button.textContent =
      getButtonText(
        provider.provider_name
      );


    card.appendChild(
      button
    );

  }


  container.appendChild(
    card
  );

}


/* =====================================================
   配信リンク
===================================================== */

function getProviderLink(
  provider,
  movie
){

  const name =
    String(
      provider.provider_name ||
      ""
    ).toLowerCase();


  /* Netflix
     → Netflixホームページ */

  if(
    name.includes("netflix")
  ){

    return "https://www.netflix.com/jp/";

  }


  /* Amazon */

  if(
    name.includes("amazon") ||
    name.includes("prime video")
  ){

    return (
      movie.amazon_url ||

      (
        movie.amazon &&
        movie.amazon.url
      ) ||

      (
        "https://www.amazon.co.jp/s?k=" +
        encodeURIComponent(
          movie.title || ""
        ) +
        "&i=instant-video"
      )
    );

  }


  /* U-NEXT */

  if(
    name.includes("u-next") ||
    name.includes("unext")
  ){

    return (
      movie.unext_url ||
      getGenericProviderUrl(
        provider
      )
    );

  }


  /* Hulu */

  if(
    name.includes("hulu")
  ){

    return (
      movie.hulu_url ||
      getGenericProviderUrl(
        provider
      )
    );

  }


  /* Disney+ */

  if(
    name.includes("disney")
  ){

    return (
      movie.disney_url ||
      getGenericProviderUrl(
        provider
      )
    );

  }


  /* Apple TV */

  if(
    name.includes("apple")
  ){

    return (
      movie.apple_tv_url ||
      getGenericProviderUrl(
        provider
      )
    );

  }


  return getGenericProviderUrl(
    provider
  );

}


/* =====================================================
   一般URL
===================================================== */

function getGenericProviderUrl(
  provider
){

  const urls = [

    provider.url,

    provider.link,

    provider.watch_link,

    provider.provider_url

  ];


  for(
    let i = 0;
    i < urls.length;
    i++
  ){

    if(
      typeof urls[i] === "string" &&
      /^https?:\/\//i.test(
        urls[i]
      )
    ){

      return urls[i];

    }

  }


  return null;

}

function renderSeries(series){

  const section =
    document.getElementById(
      "seriesSection"
    );


  const container =
    document.getElementById(
      "seriesMovies"
    );


  if(
    !series ||
    !Array.isArray(
      series.movies
    ) ||
    series.movies.length === 0
  ){

    section.style.display =
      "none";

    return;

  }


  section.style.display =
    "block";


  setText(
    "seriesName",

    series.name ||
    "シリーズ作品"
  );


  container.innerHTML =
    "";


  series.movies.forEach(
    function(movie){

      if(
        !movie ||
        !movie.id
      ){

        return;

      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "series-item";


      /* =================================================
         画像リンク
      ================================================= */

      const imageLink =
        document.createElement(
          "a"
        );


      imageLink.className =
        "series-link";


      imageLink.href =
        "detail.html?id=" +
        encodeURIComponent(
          movie.id
        );


      imageLink.setAttribute(
        "aria-label",
        movie.title || "作品詳細"
      );


      /* 画像 */

        const image =
          document.createElement(
            "img"
          );


        image.className =
          "series-poster";


        image.src =
          "https://image.tmdb.org/t/p/w300" +
          movie.poster_path;


        image.alt =
          movie.title || "";


        imageLink.appendChild(
          image
        );

      }


      /* 画像そのものをリンク */

      item.appendChild(
        imageLink
      );


      /* =================================================
         タイトルリンク
      ================================================= */

      const link =
        document.createElement(
          "a"
        );


      link.href =
        "detail.html?id=" +
        encodeURIComponent(
          movie.id
        );


      link.textContent =
        movie.title || "";


      item.appendChild(
        link
      );


      /* 年 */

      const year =
        document.createElement(
          "div"
        );


      year.className =
        "series-year";


      year.textContent =
        movie.release_date
          ? formatYear(
              movie.release_date
            )
          : "";


      item.appendChild(
        year
      );


      container.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   日付
===================================================== */

function formatDate(date){

  if(!date){

    return "";

  }


  const parts =
    String(date).split("-");


  if(
    parts.length !== 3
  ){

    return date;

  }


  return (

    Number(parts[0]) +
    "年" +

    Number(parts[1]) +
    "月" +

    Number(parts[2]) +
    "日"

  );

}


/* =====================================================
   年
===================================================== */

function formatYear(date){

  if(!date){

    return "";

  }


  return (

    Number(
      String(date).substring(
        0,
        4
      )
    ) +

    "年"

  );

}
