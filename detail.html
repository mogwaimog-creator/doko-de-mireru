<script>

/* =========================================================
   基本設定
========================================================= */

const API_URL = "/api/search";


/* =========================================================
   URLから作品IDを取得
========================================================= */

function getMovieId(){

  const path =
    window.location.pathname;

  const match =
    path.match(/\/movie\/(\d+)/);

  if(match){
    return match[1];
  }

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get("id") ||
    params.get("movieId")
  );

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   JSON-LD用
========================================================= */

function setStructuredData(data){

  const title =
    data.title ||
    data.name ||
    "作品情報";

  const overview =
    data.overview ||
    "";

  const releaseDate =
    data.release_date ||
    data.first_air_date ||
    "";

  const posterPath =
    data.poster_path ||
    "";

  const image =
    posterPath
      ? (
          posterPath.startsWith("http")
            ? posterPath
            : "https://image.tmdb.org/t/p/w780" + posterPath
        )
      : "";

  const structuredData = {

    "@context":"https://schema.org",

    "@type":"Movie",

    "name":title,

    "url":window.location.href,

    "description":
      overview ||
      `${title}の配信情報を確認できます。`

  };

  if(releaseDate){
    structuredData.dateCreated =
      releaseDate;
  }

  if(image){
    structuredData.image =
      image;
  }

  if(data.vote_average){
    structuredData.aggregateRating = {

      "@type":"AggregateRating",

      "ratingValue":
        Number(data.vote_average).toFixed(1),

      "bestRating":"10",

      "worstRating":"0",

      "ratingCount":
        data.vote_count || 1

    };
  }

  document
    .getElementById("movieStructuredData")
    .textContent =
      JSON.stringify(
        structuredData
      );

}


/* =========================================================
   SEO情報更新
========================================================= */

function updateMovieSEO(data){

  const title =
    data.title ||
    data.name ||
    "作品情報";

  const releaseDate =
    data.release_date ||
    data.first_air_date ||
    "";

  const year =
    releaseDate
      ? releaseDate.substring(0,4)
      : "";

  let pageTitle =
    `${title}はどこで見れる？`;

  if(year){
    pageTitle += ` ${year}年`;
  }

  pageTitle +=
    "｜配信サービス一覧｜ドコデミレル？";


  let description =
    `${title}がどこで見られるかをチェック。`;

  description +=
    "Netflix、Amazon Prime Video、U-NEXTなどの配信サービス情報を確認できます。";

  if(data.overview){
    description +=
      ` ${data.overview.substring(0,100)}`;
  }


  /* title */

  document.title =
    pageTitle;


  /* description */

  const descriptionTag =
    document.querySelector(
      'meta[name="description"]'
    );

  if(descriptionTag){
    descriptionTag.setAttribute(
      "content",
      description
    );
  }


  /* canonical */

  const canonical =
    document.getElementById(
      "canonicalLink"
    );

  if(canonical){
    canonical.href =
      window.location.href.split("#")[0];
  }


  /* OGP */

  const ogTitle =
    document.getElementById(
      "ogTitle"
    );

  if(ogTitle){
    ogTitle.content =
      pageTitle;
  }


  const ogDescription =
    document.getElementById(
      "ogDescription"
    );

  if(ogDescription){
    ogDescription.content =
      description;
  }


  const ogUrl =
    document.getElementById(
      "ogUrl"
    );

  if(ogUrl){
    ogUrl.content =
      window.location.href;
  }


  const twitterTitle =
    document.getElementById(
      "twitterTitle"
    );

  if(twitterTitle){
    twitterTitle.content =
      pageTitle;
  }


  const twitterDescription =
    document.getElementById(
      "twitterDescription"
    );

  if(twitterDescription){
    twitterDescription.content =
      description;
  }


  /* 画像 */

  const posterPath =
    data.poster_path ||
    "";

  if(posterPath){

    const image =
      posterPath.startsWith("http")
        ? posterPath
        : "https://image.tmdb.org/t/p/w780" +
          posterPath;


    const ogImage =
      document.getElementById(
        "ogImage"
      );

    if(ogImage){
      ogImage.content =
        image;
    }


    const twitterImage =
      document.getElementById(
        "twitterImage"
      );

    if(twitterImage){
      twitterImage.content =
        image;
    }

  }


  /* 構造化データ */

  setStructuredData(data);

}


/* =========================================================
   配信サービスボタン
========================================================= */

function createProviderButton(provider){

  const name =
    provider.provider_name ||
    provider.name ||
    "配信サービス";


  const link =
    provider.link ||
    provider.url ||
    "";


  if(!link){
    return "";
  }


  return `
    <a
      class="provider-button"
      href="${escapeHTML(link)}"
      target="_blank"
      rel="noopener noreferrer"
    >
      ${escapeHTML(name)}
    </a>
  `;

}


/* =========================================================
   配信情報表示
========================================================= */

function renderProviders(data){

  const container =
    document.getElementById(
      "providers"
    );


  if(!container){
    return;
  }


  /*
   * APIから返ってくる配信情報に対応
   */

  const streaming =
    data.streaming ||
    data.flatrate ||
    [];

  const rental =
    data.rental ||
    [];

  const purchase =
    data.purchase ||
    [];


  let html = "";


  /* 見放題 */

  if(
    Array.isArray(streaming) &&
    streaming.length
  ){

    html += `
      <div class="provider-group">

        <h3 class="provider-group-title">
          見放題
        </h3>

        <div class="provider-list">
          ${
            streaming
              .map(createProviderButton)
              .join("")
          }
        </div>

      </div>
    `;

  }


  /* レンタル */

  if(
    Array.isArray(rental) &&
    rental.length
  ){

    html += `
      <div class="provider-group">

        <h3 class="provider-group-title">
          レンタル
        </h3>

        <div class="provider-list">
          ${
            rental
              .map(createProviderButton)
              .join("")
          }
        </div>

      </div>
    `;

  }


  /* 購入 */

  if(
    Array.isArray(purchase) &&
    purchase.length
  ){

    html += `
      <div class="provider-group">

        <h3 class="provider-group-title">
          購入
        </h3>

        <div class="provider-list">
          ${
            purchase
              .map(createProviderButton)
              .join("")
          }
        </div>

      </div>
    `;

  }


  /*
   * 配信情報が別形式で返る場合
   */

  if(
    !html &&
    Array.isArray(data.providers)
  ){

    const providers =
      data.providers
        .map(createProviderButton)
        .join("");


    if(providers){

      html += `
        <div class="provider-list">
          ${providers}
        </div>
      `;

    }

  }


  if(!html){

    html = `
      <div class="no-provider">
        現在、確認できる配信情報がありません。
      </div>
    `;

  }


  container.innerHTML =
    html;

}


/* =========================================================
   作品情報表示
========================================================= */

function renderMovie(data){

  const title =
    data.title ||
    data.name ||
    "作品情報";


  const originalTitle =
    data.original_title ||
    data.original_name ||
    "";


  const releaseDate =
    data.release_date ||
    data.first_air_date ||
    "";


  const year =
    releaseDate
      ? releaseDate.substring(0,4)
      : "";


  const runtime =
    data.runtime ||
    data.runtime_minutes ||
    null;


  /* タイトル */

  document.getElementById(
    "movieTitle"
  ).textContent =
    title;


  /* 原題 */

  const originalTitleElement =
    document.getElementById(
      "originalTitle"
    );


  if(originalTitle){

    originalTitleElement.textContent =
      originalTitle;

    originalTitleElement.style.display =
      "block";

  }else{

    originalTitleElement.style.display =
      "none";

  }


  /* メタ情報 */

  const meta =
    document.getElementById(
      "movieMeta"
    );


  let metaHTML = "";


  if(year){

    metaHTML += `
      <span class="meta-item">
        ${escapeHTML(year)}年
      </span>
    `;

  }


  if(runtime){

    metaHTML += `
      <span class="meta-item">
        ${escapeHTML(runtime)}分
      </span>
    `;

  }


  if(data.vote_average){

    metaHTML += `
      <span class="meta-item">
        評価 ${Number(data.vote_average).toFixed(1)}
      </span>
    `;

  }


  meta.innerHTML =
    metaHTML;


  /* あらすじ */

  const overview =
    document.getElementById(
      "overview"
    );


  if(data.overview){

    overview.textContent =
      data.overview;

    overview.style.display =
      "block";

  }else{

    overview.style.display =
      "none";

  }


  /* ポスター */

  const poster =
    document.getElementById(
      "poster"
    );


  const posterPath =
    data.poster_path ||
    data.poster ||
    "";


  if(posterPath){

    const posterURL =
      posterPath.startsWith("http")
        ? posterPath
        : "https://image.tmdb.org/t/p/w780" +
          posterPath;


    poster.src =
      posterURL;


    poster.alt =
      `${title}のポスター`;

  }else{

    poster.style.display =
      "none";

  }


  /* ジャンル */

  const genres =
    data.genres ||
    [];


  const genreSection =
    document.getElementById(
      "genreSection"
    );


  const genreContainer =
    document.getElementById(
      "genres"
    );


  if(
    Array.isArray(genres) &&
    genres.length
  ){

    genreContainer.innerHTML =
      genres
        .map(genre => {

          const name =
            typeof genre === "string"
              ? genre
              : genre.name;

          return `
            <span class="genre">
              ${escapeHTML(name)}
            </span>
          `;

        })
        .join("");


    genreSection.style.display =
      "block";

  }else{

    genreSection.style.display =
      "none";

  }


  /* 配信サービス */

  renderProviders(data);


  /* SEO */

  updateMovieSEO(data);


  /* 表示 */

  document.getElementById(
    "loading"
  ).style.display =
    "none";


  document.getElementById(
    "movieDetail"
  ).style.display =
    "block";

}


/* =========================================================
   APIから作品情報取得
========================================================= */

async function loadMovie(movieId){

  try{

    /*
     * 現在のAPI構成に合わせて
     * 作品IDを送信
     */

    const response =
      await fetch(
        `${API_URL}?id=${encodeURIComponent(movieId)}`
      );


    if(!response.ok){
      throw new Error(
        "API error"
      );
    }


    const result =
      await response.json();


    /*
     * APIの返却形式に対応
     */

    let movie =
      result.movie ||
      result.data ||
      result;


    /*
     * resultsの中に入っている場合
     */

    if(
      (!movie.title && !movie.name) &&
      Array.isArray(result.results) &&
      result.results.length
    ){

      movie =
        result.results[0];

    }


    if(
      !movie ||
      (!movie.title && !movie.name)
    ){

      throw new Error(
        "Movie not found"
      );

    }


    renderMovie(movie);


  }catch(error){

    console.error(
      "作品情報取得エラー:",
      error
    );


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    document.getElementById(
      "error"
    ).style.display =
      "block";

  }

}

  function(){

    const movieId =

    if(!movieId){

      document.getElementById(
        "loading"
      ).style.display =
        "none";


      document.getElementById(
        "error"
      ).style.display =

      return;

    }


    loadMovie(movieId);

  }
);

</script>
