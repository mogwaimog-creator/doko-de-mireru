<script>

"use strict";

const API_URL = "/api/search";

const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error");

const content =
  document.getElementById("content");

const params =
  new URLSearchParams(
    window.location.search
  );

const movieId =
  params.get("id");


/* =====================================================
   ページ開始
===================================================== */

if(!movieId){

  showError(
    "作品IDが指定されていません。"
  );

}else{

  loadMovie();

}


/* =====================================================
   API取得
===================================================== */

async function loadMovie(){

  try{

    const url =
      API_URL +
      "?id=" +
      encodeURIComponent(movieId);

    console.log(
      "DETAIL API:",
      url
    );

    const response =
      await fetch(
        url,
        {
          method:"GET",
          headers:{
            "Accept":"application/json"
          },
          cache:"no-store"
        }
      );

    const text =
      await response.text();

    console.log(
      "API STATUS:",
      response.status
    );

    console.log(
      "API RESPONSE:",
      text
    );

    if(!response.ok){

      throw new Error(
        "APIエラー: HTTP " +
        response.status
      );

    }

    let movie;

    try{

      movie =
        JSON.parse(text);

    }catch(jsonError){

      throw new Error(
        "APIからJSONではないデータが返されました。"
      );

    }

    if(!movie){

      throw new Error(
        "作品データがありません。"
      );

    }

    /*
      APIによっては
      {movie:{...}}
      の形で返る場合にも対応
    */

    if(
      movie.movie &&
      typeof movie.movie === "object"
    ){

      movie =
        movie.movie;

    }

    if(
      !movie.id &&
      !movie.tmdb_id
    ){

      throw new Error(
        "作品IDを含む作品データがありません。"
      );

    }

    renderMovie(movie);

  }catch(error){

    console.error(
      "DETAIL PAGE ERROR:",
      error
    );

    showError(
      "作品情報を取得できませんでした。",
      error.message
    );

  }

}


/* =====================================================
   作品表示
===================================================== */

function renderMovie(movie){

  loading.style.display =
    "none";

  errorBox.style.display =
    "none";

  content.style.display =
    "block";


  setText(
    "title",
    movie.title || ""
  );


  setText(
    "originalTitle",
    movie.original_title || ""
  );


  setText(
    "releaseDate",
    movie.release_date
      ? "公開日：" +
        formatDate(movie.release_date)
      : ""
  );


  const rating =
    Number(
      movie.vote_average || 0
    );


  setText(
    "rating",
    rating > 0
      ? "⭐ TMDB評価 " +
        rating.toFixed(1)
      : ""
  );


  renderGenres(
    movie.genres
  );


  const poster =
    document.getElementById("poster");


  if(movie.poster_path){

    poster.src =
      "https://image.tmdb.org/t/p/w500" +
      movie.poster_path;

    poster.alt =
      movie.title || "";

    poster.style.display =
      "block";

  }else{

    poster.style.display =
      "none";

  }


  if(
    movie.director &&
    movie.director.name
  ){

    setText(
      "director",
      movie.director.name
    );

  }else if(
    typeof movie.director === "string"
  ){

    setText(
      "director",
      movie.director
    );

  }else{

    setText(
      "director",
      "監督情報はありません。"
    );

  }


  renderCast(
    movie.cast
  );


  setText(
    "overview",
    movie.overview ||
    "あらすじ情報はありません。"
  );


  renderProviders(
    movie
  );


  renderSeries(
    movie.series
  );


  const tmdbLink =
    document.getElementById(
      "tmdbLink"
    );

  const tmdbId =
    movie.id ||
    movie.tmdb_id;

  tmdbLink.href =
    movie.link ||
    (
      "https://www.themoviedb.org/movie/" +
      tmdbId
    );


  document.title =
    (
      movie.title ||
      "作品情報"
    ) +
    " | ドコデミレル？";

}


/* =====================================================
   ジャンル
===================================================== */

function renderGenres(genres){

  const container =
    document.getElementById(
      "genres"
    );

  container.innerHTML =
    "";

  if(
    !Array.isArray(genres)
  ){

    return;

  }

  genres.forEach(
    function(genre){

      if(
        !genre ||
        !genre.name
      ){

        return;

      }

      const item =
        document.createElement(
          "span"
        );

      item.className =
        "genre-item";

      item.textContent =
        genre.name;

      container.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   出演者
===================================================== */

function renderCast(cast){

  const container =
    document.getElementById(
      "cast"
    );

  container.innerHTML =
    "";

  if(
    !Array.isArray(cast) ||
    cast.length === 0
  ){

    container.textContent =
      "出演者情報はありません。";

    return;

  }

  cast.forEach(
    function(person){

      if(
        !person ||
        !person.name
      ){

        return;

      }

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "cast-item";

      item.textContent =
        person.name;

      container.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   配信サービス
===================================================== */

function renderProviders(movie){

  const container =
    document.getElementById(
      "providers"
    );

  container.innerHTML =
    "";

  const streaming =
    normalizeProviders(
      Array.isArray(movie.streaming)
        ? movie.streaming
        : []
    );

  const rental =
    normalizeProviders(
      Array.isArray(movie.rental)
        ? movie.rental
        : []
    );

  const purchase =
    normalizeProviders(
      Array.isArray(movie.purchase)
        ? movie.purchase
        : []
    );


  renderProviderGroup(
    container,
    "🟢 見放題",
    streaming,
    "streaming",
    movie
  );


  renderProviderGroup(
    container,
    "🟠 レンタル",
    rental,
    "rental",
    movie
  );


  renderProviderGroup(
    container,
    "🔵 購入",
    purchase,
    "purchase",
    movie
  );


  if(
    !streaming.length &&
    !rental.length &&
    !purchase.length
  ){

    const empty =
      document.createElement(
        "p"
      );

    empty.textContent =
      "現在、配信情報を確認できません。";

    container.appendChild(
      empty
    );

  }

}


/* =====================================================
   サービス名
===================================================== */

function normalizeProviderName(name){

  const value =
    String(
      name || ""
    ).trim();

  const lower =
    value.toLowerCase();


  if(
    lower.includes("netflix")
  ){

    return "Netflix";

  }


  if(
    lower.includes("amazon") ||
    lower.includes("prime video")
  ){

    return "Prime Video";

  }


  if(
    lower.includes("u-next") ||
    lower.includes("unext")
  ){

    return "U-NEXT";

  }


  if(
    lower.includes("hulu")
  ){

    return "Hulu";

  }


  if(
    lower.includes("disney")
  ){

    return "Disney+";

  }


  if(
    lower.includes("apple")
  ){

    return "Apple TV";

  }


  if(
    lower.includes("google play")
  ){

    return "Google Play";

  }


  if(
    lower.includes("fod")
  ){

    return "FOD";

  }


  return value;

}


/* =====================================================
   重複サービス除去
===================================================== */

function normalizeProviders(providers){

  const result = [];

  const map = {};


  providers.forEach(
    function(provider){

      if(!provider){

        return;

      }

      const normalizedName =
        normalizeProviderName(
          provider.provider_name
        );

      if(!normalizedName){

        return;

      }

      const key =
        normalizedName.toLowerCase();

      if(!map[key]){

        map[key] = {
          ...provider,
          provider_name:
            normalizedName
        };

        result.push(
          map[key]
        );

      }

    }
  );


  return result;

}


/* =====================================================
   配信グループ
===================================================== */

function renderProviderGroup(
  container,
  title,
  providers,
  type,
  movie
){

  if(
    !providers.length
  ){

    return;

  }


  const group =
    document.createElement(
      "div"
    );

  group.className =
    "provider-group " +
    type;


  const heading =
    document.createElement(
      "div"
    );

  heading.className =
    "provider-title";

  heading.textContent =
    title;

  group.appendChild(
    heading
  );


  providers.forEach(
    function(provider){

      createProviderCard(
        group,
        provider,
        type,
        movie
      );

    }
  );


  container.appendChild(
    group
  );

}


/* =====================================================
   配信カード
===================================================== */

function createProviderCard(
  container,
  provider,
  type,
  movie
){

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "provider-card";


  if(provider.logo_path){

    const logo =
      document.createElement(
        "img"
      );

    logo.className =
      "provider-logo";

    logo.src =
      "https://image.tmdb.org/t/p/w92" +
      provider.logo_path;

    logo.alt =
      provider.provider_name || "";

    card.appendChild(
      logo
    );

  }


  const info =
    document.createElement(
      "div"
    );

  info.className =
    "provider-info";


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "provider-name";

  name.textContent =
    provider.provider_name ||
    "配信サービス";

  info.appendChild(
    name
  );


  const typeText =
    document.createElement(
      "div"
    );

  typeText.className =
    "provider-type";

  if(type === "streaming"){

    typeText.textContent =
      "見放題";

  }else if(type === "rental"){

    typeText.textContent =
      "レンタル";

  }else{

    typeText.textContent =
      "購入";

  }

  info.appendChild(
    typeText
  );


  const subInfo =
    document.createElement(
      "div"
    );

  subInfo.className =
    "provider-subinfo";


  const subtitle =
    document.createElement(
      "div"
    );

  subtitle.textContent =
    "🎧 字幕：未確認";


  const dub =
    document.createElement(
      "div"
    );

  dub.textContent =
    "🎙️ 吹き替え：未確認";


  subInfo.appendChild(
    subtitle
  );

  subInfo.appendChild(
    dub
  );

  info.appendChild(
    subInfo
  );


  card.appendChild(
    info
  );


  const url =
    getProviderLink(
      provider,
      movie
    );


  if(url){

    const button =
      document.createElement(
        "a"
      );

    button.className =
      "provider-button " +
      getButtonClass(
        provider.provider_name
      );

    button.href =
      url;

    button.target =
      "_blank";

    button.rel =
      "noopener noreferrer";

    button.textContent =
      getButtonText(
        provider.provider_name
      );

    card.appendChild(
      button
    );

  }


  container.appendChild(
    card
  );

}


/* =====================================================
   配信URL
===================================================== */

function getProviderLink(
  provider,
  movie
){

  const name =
    String(
      provider.provider_name || ""
    ).toLowerCase();


  if(
    name.includes("netflix")
  ){

    return (
      movie.netflix_url ||
      (
        movie.netflix &&
        movie.netflix.url
      ) ||
      "https://www.netflix.com/jp/"
    );

  }


  if(
    name.includes("amazon") ||
    name.includes("prime video")
  ){

    return (
      movie.amazon_url ||
      (
        movie.amazon &&
        movie.amazon.url
      ) ||
      (
        "https://www.amazon.co.jp/s?k=" +
        encodeURIComponent(
          movie.title || ""
        ) +
        "&i=instant-video"
      )
    );

  }


  if(
    name.includes("u-next") ||
    name.includes("unext")
  ){

    return (
      movie.unext_url ||
      getGenericProviderUrl(provider)
    );

  }


  if(
    name.includes("hulu")
  ){

    return (
      movie.hulu_url ||
      getGenericProviderUrl(provider)
    );

  }


  if(
    name.includes("disney")
  ){

    return (
      movie.disney_url ||
      getGenericProviderUrl(provider)
    );

  }


  if(
    name.includes("apple")
  ){

    return (
      movie.apple_tv_url ||
      getGenericProviderUrl(provider)
    );

  }


  return getGenericProviderUrl(
    provider
  );

}


/* =====================================================
   一般URL
===================================================== */

function getGenericProviderUrl(provider){

  const urls = [

    provider.url,
    provider.link,
    provider.watch_link,
    provider.provider_url

  ];


  for(
    let i = 0;
    i < urls.length;
    i++
  ){

    if(
      typeof urls[i] === "string" &&
      /^https?:\/\//i.test(urls[i])
    ){

      return urls[i];

    }

  }


  return null;

}

/* =====================================================
   シリーズ

function renderSeries(series){

  const section =
    document.getElementById(
      "seriesSection"
    );

  const container =
    document.getElementById(
      "seriesMovies"
    );


  if(
    !series ||
    !Array.isArray(series.movies) ||
    !series.movies.length
  ){

    section.style.display =
      "none";

    return;

  }


  section.style.display =
    "block";


  setText(
    "seriesName",
    series.name ||
    "シリーズ作品"
  );


  container.innerHTML =
    "";


  series.movies.forEach(
    function(item){

      if(
        !item ||
        !item.id
      ){

        return;

      }


      const box =
        document.createElement(
          "div"
        );

      box.className =
        "series-item";


      if(item.poster_path){

        const imageLink =
          document.createElement(
            "a"
          );

        imageLink.className =
          "series-poster-link";

        imageLink.href =
          "detail.html?id=" +
          encodeURIComponent(
            item.id
          );


        const image =
          document.createElement(
            "img"
          );

        image.className =
          "series-poster";

        image.src =
          "https://image.tmdb.org/t/p/w300" +
          item.poster_path;

        image.alt =
          item.title || "";

        image.loading =
          "lazy";


        imageLink.appendChild(
          image
        );

        box.appendChild(
          imageLink
        );

      }


      const titleLink =
        document.createElement(
          "a"
        );

      titleLink.className =
        "series-title";

      titleLink.href =
        "detail.html?id=" +
        encodeURIComponent(
          item.id
        );

      titleLink.textContent =
        item.title || "";


      box.appendChild(
        titleLink
      );


      const year =
        document.createElement(
          "div"
        );

      year.className =
        "series-year";

      year.textContent =
        item.release_date
          ? formatYear(
              item.release_date
            )
          : "";


      box.appendChild(
        year
      );


      container.appendChild(
        box
      );

    }
  );

}


/* =====================================================
   日付
===================================================== */

function formatDate(date){

  const parts =
    String(date).split("-");


  if(parts.length !== 3){

    return date;

  }


  return (
    Number(parts[0]) +
    "年" +
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}


/* =====================================================
   年
===================================================== */

function formatYear(date){

  if(!date){

    return "";

  }


  return (
    Number(
      String(date).substring(0,4)
    ) +
    "年"
  );

}

function setText(id,text){

  const element =
    document.getElementById(id);


  if(!element){

    return;

  }


  element.textContent =
    text || "";

}
