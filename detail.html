<script>

(function(){

"use strict";


/* =========================================================
   Google検索向けSEO
========================================================= */

function updateSeo(movie){

  if(!movie){
    return;
  }

  const title =
    movie.title ||
    "作品情報";

  document.title =
    title +
    "｜どこで見られる？ | ドコデミレル？";


  const description =
    title +
    "がNetflix、Amazon Prime Video、U-NEXT、Hulu、Disney+など、どこで見られるか確認できます。公開日、評価、出演者、あらすじなどの作品情報も掲載しています。";


  let meta =
    document.querySelector(
      'meta[name="description"]'
    );


  if(!meta){

    meta =
      document.createElement("meta");

    meta.name =
      "description";

    document.head.appendChild(
      meta
    );

  }


  meta.content =
    description;

}


/* =========================================================
   API
========================================================= */

const API_URL =
  "/api/search";


const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error");

const content =
  document.getElementById("content");


const params =
  new URLSearchParams(
    window.location.search
  );


const movieId =
  params.get("id");


if(!movieId){

  showError(
    "作品IDが指定されていません。"
  );

  return;

}


loadMovie();


/* =========================================================
   作品取得
========================================================= */

async function loadMovie(){

  try{

    const url =
      API_URL +
      "?id=" +
      encodeURIComponent(movieId);


    const response =
      await fetch(
        url,
        {
          method:"GET",
          headers:{
            "Accept":"application/json"
          },
          cache:"no-store"
        }
      );


    const text =
      await response.text();


    if(!response.ok){

      console.error(
        "API ERROR:",
        response.status,
        text
      );

      throw new Error(
        "API ERROR " +
        response.status
      );

    }


    let movie;


    try{

      movie =
        JSON.parse(text);

    }catch(parseError){

      console.error(
        "JSON ERROR:",
        text
      );

      throw new Error(
        "JSONデータを解析できませんでした。"
      );

    }


    if(
      !movie ||
      !movie.id
    ){

      throw new Error(
        "作品データがありません。"
      );

    }


    renderMovie(movie);

    updateSeo(movie);


  }catch(error){

    console.error(
      "DETAIL PAGE ERROR:",
      error
    );

    showError(
      "作品情報を取得できませんでした。"
    );

  }

}


/* =========================================================
   作品表示
========================================================= */

function renderMovie(movie){

  loading.style.display =
    "none";

  errorBox.style.display =
    "none";

  content.style.display =
    "block";


  setText(
    "title",
    movie.title || ""
  );


  setText(
    "originalTitle",
    movie.original_title || ""
  );


  setText(
    "releaseDate",
    movie.release_date
      ? "公開日：" +
        formatDate(
          movie.release_date
        )
      : ""
  );


  const rating =
    Number(
      movie.vote_average || 0
    );


  setText(
    "rating",
    rating > 0
      ? "⭐ TMDB評価 " +
        rating.toFixed(1)
      : ""
  );


  renderGenres(
    movie.genres
  );


  const poster =
    document.getElementById(
      "poster"
    );


  if(movie.poster_path){

    poster.src =
      "https://image.tmdb.org/t/p/w500" +
      movie.poster_path;

    poster.alt =
      movie.title || "";

    poster.style.display =
      "block";

  }else{

    poster.style.display =
      "none";

  }


  if(
    movie.director &&
    movie.director.name
  ){

    setText(
      "director",
      movie.director.name
    );

  }else{

    setText(
      "director",
      "監督情報はありません。"
    );

  }


  renderCast(
    movie.cast
  );


  setText(
    "overview",
    movie.overview ||
    "あらすじ情報はありません。"
  );


  renderProviders(
    movie
  );


  renderRecommendations(
    movie.recommendations
  );


  renderSeries(
    movie.series
  );


  const tmdbLink =
    document.getElementById(
      "tmdbLink"
    );


  tmdbLink.href =
    movie.link ||
    (
      "https://www.themoviedb.org/movie/" +
      movie.id
    );


  document.title =
    (
      movie.title ||
      "作品情報"
    ) +
    " | ドコデミレル？";

}


/* =========================================================
   ジャンル
========================================================= */

function renderGenres(genres){

  const container =
    document.getElementById(
      "genres"
    );


  container.innerHTML =
    "";


  if(
    !Array.isArray(genres) ||
    genres.length === 0
  ){

    return;

  }


  genres.forEach(function(genre){

    if(
      !genre ||
      !genre.name
    ){

      return;

    }


    const item =
      document.createElement(
        "span"
      );


    item.className =
      "genre-item";


    item.textContent =
      genre.name;


    container.appendChild(
      item
    );

  });

}


/* =========================================================
   出演者
========================================================= */

function renderCast(cast){

  const container =
    document.getElementById(
      "cast"
    );


  container.innerHTML =
    "";


  if(
    !Array.isArray(cast) ||
    cast.length === 0
  ){

    container.textContent =
      "出演者情報はありません。";

    return;

  }


  cast.forEach(function(person){

    if(
      !person ||
      !person.name
    ){

      return;

    }


    const item =
      document.createElement(
        "div"
      );


    item.className =
      "cast-item";


    item.textContent =
      person.name;


    container.appendChild(
      item
    );

  });

}


/* =========================================================
   おすすめ作品
   ※ 3作品だけ表示
========================================================= */

function renderRecommendations(
  recommendations
){

  const section =
    document.getElementById(
      "recommendationSection"
    );


  const container =
    document.getElementById(
      "recommendations"
    );


  container.innerHTML =
    "";


  if(
    !Array.isArray(recommendations) ||
    recommendations.length === 0
  ){

    section.style.display =
      "none";

    return;

  }


  const unique = [];

  const seen = {};


  recommendations.forEach(function(movie){

    if(
      !movie ||
      !movie.id ||
      !movie.title
    ){

      return;

    }


    if(
      String(movie.id) ===
      String(movieId)
    ){

      return;

    }


    if(seen[movie.id]){

      return;

    }


    seen[movie.id] =
      true;


    unique.push(
      movie
    );

  });


  if(unique.length === 0){

    section.style.display =
      "none";

    return;

  }


  section.style.display =
    "block";


  unique
    .slice(0,3)
    .forEach(function(movie){

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "recommendation-item";


      if(movie.poster_path){

        const imageLink =
          document.createElement(
            "a"
          );


        imageLink.className =
          "recommendation-poster-link";


        imageLink.href =
          "detail.html?id=" +
          encodeURIComponent(
            movie.id
          );


        imageLink.setAttribute(
          "aria-label",
          movie.title +
          "の詳細を見る"
        );


        const image =
          document.createElement(
            "img"
          );


        image.className =
          "recommendation-poster";


        image.src =
          "https://image.tmdb.org/t/p/w300" +
          movie.poster_path;


        image.alt =
          movie.title || "";


        image.loading =
          "lazy";


        imageLink.appendChild(
          image
        );


        item.appendChild(
          imageLink
        );

      }


      const link =
        document.createElement(
          "a"
        );


      link.className =
        "recommendation-title";


      link.href =
        "detail.html?id=" +
        encodeURIComponent(
          movie.id
        );


      link.textContent =

      item.appendChild(
        link
      );


      const year =

          "div"
        );

      year.textContent =

          ? formatYear(
              movie.release_date
            )
          : "";


      item.appendChild(
        year
      );


      container.appendChild(
        item
      );

    });

}

/* =========================================================
   配信サービス名の統一
========================================================= */

function normalizeProviderName(name){

  const value =
    String(name || "").trim();


  const lower =
    value.toLowerCase();


  if(
    lower.includes("netflix")
  ){

    return "Netflix";

  }


  if(
    lower.includes("amazon") ||
    lower.includes("prime video")
  ){

    return "Prime Video";

  }


  if(
    lower.includes("u-next") ||
    lower.includes("unext")
  ){

    return "U-NEXT";

  }


  if(
    lower.includes("hulu")
  ){

    return "Hulu";

  }


  if(
    lower.includes("disney")
  ){

    return "Disney+";

  }


  if(
    lower.includes("apple")
  ){

    return "Apple TV";

  }


  if(
    lower.includes("google play") ||
    lower.includes("googleplay")
  ){

    return "Google Play";

  }


  if(
    lower.includes("youtube")
  ){

    return "YouTube";

  }


  if(
    lower.includes("fod")
  ){

    return "FOD";

  }


  return value;

}


/* =========================================================
   配信サービス重複削除
========================================================= */

function normalizeProviders(providers){

  if(
    !Array.isArray(providers)
  ){

    return [];

  }


  const result = [];

  const map = {};


  providers.forEach(function(provider){

    if(
      !provider ||
      !provider.provider_name
    ){

      return;

    }


    const name =
      normalizeProviderName(
        provider.provider_name
      );


    if(!name){

      return;

    }


    const key =
      name.toLowerCase();


    if(!map[key]){

      map[key] = {

        provider_id:
          provider.provider_id ||
          null,

        provider_name:
          name,

        logo_path:
          provider.logo_path ||
          null,

        provider_url:
          provider.provider_url ||
          null

      };


      result.push(
        map[key]
      );

    }

  });


  return result;

}


/* =========================================================
   配信グループ
========================================================= */

function renderProviderGroup(
  container,
  title,
  providers,
  type,
  movie
){

  if(
    !Array.isArray(providers) ||
    providers.length === 0
  ){

    return;

  }


  const group =
    document.createElement(
      "div"
    );


  group.className =
    "provider-group " +
    type;


  const heading =
    document.createElement(
      "div"
    );


  heading.className =
    "provider-title";


  heading.textContent =
    title;


  group.appendChild(
    heading
  );


  const grid =
    document.createElement(
      "div"
    );


  grid.className =
    "provider-grid";


  providers.forEach(function(provider){

    createProviderCard(
      grid,
      provider,
      type,
      movie
    );

  });


  group.appendChild(
    grid
  );


  container.appendChild(
    group
  );

}


/* =========================================================
   配信カード
========================================================= */

function createProviderCard(
  container,
  provider,
  type,
  movie
){

  if(!provider){

    return;

  }


  const card =
    document.createElement(
      "a"
    );


  card.className =
    "provider-card " +
    getProviderCardClass(
      provider.provider_name,
      type
    );


  const url =
    getProviderLink(
      provider,
      movie,
      type
    );


  if(!url){

    card.removeAttribute(
      "href"
    );

  }else{

    card.href =
      url;

    card.target =
      "_blank";

    card.rel =
      "noopener noreferrer";

  }


  if(provider.logo_path){

    const logo =
      document.createElement(
        "img"
      );


    logo.className =
      "provider-logo";


    logo.src =
      "https://image.tmdb.org/t/p/w92" +
      provider.logo_path;


    logo.alt =
      provider.provider_name ||
      "";


    logo.loading =
      "lazy";


    card.appendChild(
      logo
    );

  }


  const name =
    document.createElement(
      "div"
    );


  name.className =
    "provider-name";


  name.textContent =
    provider.provider_name ||
    "配信サービス";


  card.appendChild(
    name
  );


  const typeElement =
    document.createElement(
      "div"
    );


  typeElement.className =
    "provider-type";


  if(type === "streaming"){

    typeElement.textContent =
      "見放題";

  }else if(type === "rental"){

    typeElement.textContent =
      "レンタル";

  }else if(type === "purchase"){

    typeElement.textContent =
      "購入";

  }else if(type === "free"){

    typeElement.textContent =
      "無料視聴";

  }


  card.appendChild(
    typeElement
  );


  const price =
    getPriceText(
      provider.provider_name,
      type
    );


  if(price){

    const priceElement =
      document.createElement(
        "div"
      );


    priceElement.className =
      "provider-price";


    priceElement.textContent =
      price;


    card.appendChild(
      priceElement
    );

  }


  container.appendChild(
    card
  );

}


/* =========================================================
   配信カードカラー
========================================================= */

function getProviderCardClass(
  name,
  type
){

  const value =
    String(
      name || ""
    ).toLowerCase();


  if(
    value.includes("netflix")
  ){

    return "netflix-card";

  }


  if(
    value.includes("amazon") ||
    value.includes("prime video")
  ){

    return "amazon-card";

  }


  if(
    value.includes("u-next") ||
    value.includes("unext")
  ){

    return "unext-card";

  }


  if(
    value.includes("hulu")
  ){

    return "hulu-card";

  }


  if(
    value.includes("disney")
  ){

    return "disney-card";

  }


  if(
    value.includes("apple")
  ){

    return "apple-card";

  }


  if(
    value.includes("fod")
  ){

    return "fod-card";

  }


  if(
    value.includes("google play") ||
    value.includes("googleplay")
  ){

    return "googleplay-card";

  }


  if(type === "free"){

    return "free-card";

  }


  return "";

}

/* =========================================================
   配信先URL
========================================================= */

function getProviderLink(
  provider,
  movie,
  type
){

  const name =
    String(
      provider.provider_name || ""
    ).toLowerCase();


  if(
    name.includes("netflix")
  ){

    return (
      movie.netflix_url ||
      (
        movie.netflix &&
        movie.netflix.url
      ) ||
      "https://www.netflix.com/jp/"
    );

  }


  if(
    name.includes("amazon") ||
    name.includes("prime video")
  ){

    return (
      movie.amazon_url ||
      (
        movie.amazon &&
        movie.amazon.url
      ) ||
      (
        "https://www.amazon.co.jp/s?k=" +
        encodeURIComponent(
          movie.title || ""
        ) +
        "&i=instant-video"
      )
    );

  }


  if(
    name.includes("u-next") ||
    name.includes("unext")
  ){

    return (
      movie.unext_url ||
      "https://video.unext.jp/"
    );

  }


  if(
    name.includes("hulu")
  ){

    return (
      movie.hulu_url ||
      (
        "https://www.hulu.jp/search?q=" +
        encodeURIComponent(
          movie.title || ""
        )
      )
    );

  }


  if(
    name.includes("disney")
  ){

    return (
      movie.disney_url ||
      (
        "https://www.disneyplus.com/ja-jp/search/" +
        encodeURIComponent(
          movie.title || ""
        )
      )
    );

  }


  if(
    name.includes("apple")
  ){

    return (
      movie.apple_tv_url ||
      (
        "https://tv.apple.com/jp/search?term=" +
        encodeURIComponent(
          movie.title || ""
        )
      )
    );

  }


  if(
    name.includes("fod")
  ){

    return (
      movie.fod_url ||
      provider.provider_url ||
      provider.url ||
      provider.link ||
      "https://fod.fujitv.co.jp/"
    );

  }


  if(
    name.includes("google play") ||
    name.includes("googleplay")
  ){

    return (
      movie.google_play_url ||
      provider.provider_url ||
      provider.url ||
      provider.link ||
      (
        "https://play.google.com/store/search?q=" +
        encodeURIComponent(
          movie.title || ""
        ) +
        "&c=movies"
      )
    );

  }


  if(
    name.includes("youtube")
  ){

    return (
      movie.youtube_url ||
      provider.provider_url ||
      provider.url ||
      provider.link ||
      (
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(
          movie.title || ""
        )
      )
    );

  }


  return getGenericProviderUrl(
    provider
  );

}


/* =========================================================
   汎用URL
========================================================= */

function getGenericProviderUrl(
  provider
){

  const urls = [

    provider.provider_url,
    provider.url,
    provider.link,
    provider.watch_link

  ];


  for(
    let i = 0;
    i < urls.length;
    i++
  ){

    if(
      typeof urls[i] === "string" &&
      /^https?:\/\//i.test(
        urls[i]
      )
    ){

      return urls[i];

    }

  }


  return null;

}

/* =========================================================
   日付
========================================================= */

function formatDate(date){

  if(!date){

    return "";

  }


  const parts =
    String(date).split("-");


  if(parts.length !== 3){

    return date;

  }


  return (
    Number(parts[0]) +
    "年" +
    Number(parts[1]) +
    "月" +
    Number(parts[2]) +
    "日"
  );

}


function formatYear(date){

  if(!date){

    return "";

  }


  return (
    Number(
      String(date).substring(0,4)
    ) +
    "年"
  );

}
