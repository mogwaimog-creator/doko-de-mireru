    if(providers===null){box.textContent='配信状況は作品詳細でご確認ください';return}
    const unique=providers.filter((p,i,all)=>p&&p.logo_path&&all.findIndex(x=>x&&x.provider_id===p.provider_id)===i).slice(0,6);
    if(!unique.length){box.textContent='現在、見放題の配信情報はありません';return}
    box.innerHTML='<span class="providers-label">見放題</span>';
    unique.forEach(p=>{const img=document.createElement('img');img.src='https://image.tmdb.org/t/p/w92'+p.logo_path;img.alt=p.provider_name||'配信サービス';img.loading='lazy';box.appendChild(img)});
  }
  const providerObserver=new IntersectionObserver((entries,observer)=>entries.forEach(entry=>{if(entry.isIntersecting){observer.unobserve(entry.target);loadProviders(entry.target)}}),{rootMargin:'200px'});
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>render(b.dataset.tab)));
  render('beginner');
  </script>
</body>
</html>
